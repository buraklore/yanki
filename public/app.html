<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>YANKI — AI Visibility Platform</title>
<meta name="theme-color" content="#F7F4ED">
<link rel="icon" href="data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%22%20viewBox%3D%220%200%2064%2064%22%3E%3Cdefs%3E%3ClinearGradient%20id%3D%22g%22%20x1%3D%220%22%20y1%3D%220%22%20x2%3D%221%22%20y2%3D%221%22%3E%3Cstop%20offset%3D%220%22%20stop-color%3D%22%23B04628%22%2F%3E%3Cstop%20offset%3D%221%22%20stop-color%3D%22%238F3720%22%2F%3E%3C%2FlinearGradient%3E%3C%2Fdefs%3E%3Crect%20width%3D%2264%22%20height%3D%2264%22%20rx%3D%2216%22%20fill%3D%22url%28%23g%29%22%2F%3E%3Ctext%20x%3D%2232%22%20y%3D%2245%22%20font-family%3D%22Inter%2CArial%2Csans-serif%22%20font-size%3D%2238%22%20font-weight%3D%22700%22%20fill%3D%22%23fff%22%20text-anchor%3D%22middle%22%3EY%3C%2Ftext%3E%3C%2Fsvg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;450;500;600;700&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box}
:root{
  --bg:#12100E;--bg2:#171410;--card:#1B1815;--card2:#221E1A;--card3:#2A251F;
  --border:#2A251F;--border2:#3A342C;--fg:#EDE8E0;--fg2:#BDB4A8;--mute:#A69C8F;--mute2:#948B7E;
  --pri:var(--pri);--pri-btn:#B04628;--pri2:var(--pri2);--pri-ink:#8F3720;--vio:#B08A5A;
  --ok:var(--ok);--warn:var(--warn);--bad:var(--bad);
  --r:8px;--rl:10px;--rx:12px;--r2:16px;
  --sh:0 1px 2px rgba(0,0,0,.06);
  --shm:0 2px 10px -4px rgba(0,0,0,.10);
  --mono:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
}
body:not(.lt) .kchip.directory,body:not(.lt) .kchip.self_publish{color:#7EE2A8}
body:not(.lt) .kchip.publication,body:not(.lt) .kchip.authority{color:#C4B5FD}
body:not(.lt) .stbl .tagme{background:rgba(176,70,40,.24);color:#EDA47A}
body:not(.lt) .mst.in{color:#4ADE80}
body:not(.lt) .mst.in{color:#4ADE80}
body:not(.lt) .sent.ok{background:rgba(74,222,128,.12);color:#7EE2A8}
body:not(.lt) .sent.bad{background:rgba(248,113,113,.12);color:#FCA5A5}
body:not(.lt) .sent.mid{background:rgba(148,163,184,.12);color:#B4BECD}
body:not(.lt) .act .sv.mid{background:rgba(245,158,11,.13);color:#FCD34D}
body:not(.lt) .act .sv.high{background:rgba(239,68,68,.13);color:#FCA5A5}
body:not(.lt) .mfil button.on,body:not(.lt) .actfil button.on{color:#EDA47A}
body:not(.lt) .src.mine .dm i,body:not(.lt) .prc .nm i,body:not(.lt) .tagme{color:#EDA47A}
body:not(.lt) mark.riv{background:rgba(143,55,32,.24);color:#C4B5FD}
body.lt{
  --bg:#F7F4ED;--bg2:#F4F0E7;--card:#FFFDF8;--card2:#F7F4EC;--card3:#EFEADF;
  --border:#E4DDCE;--border2:#D4CBB8;--fg:#1A1713;--fg2:#4A423A;--mute:#6A6255;--mute2:#70695C;
  --pri:#9C3D22;--pri-btn:#B04628;--pri2:#8F3720;--pri-ink:#7A2E19;--vio:#8A6A3E;
  --ok:#15803D;--warn:#B45309;--bad:#B91C1C;
}
body{margin:0;background:var(--bg);color:var(--fg);font-family:Inter,-apple-system,"Segoe UI",Roboto,sans-serif;
  font-size:14px;line-height:1.6;-webkit-font-smoothing:antialiased}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
a{color:inherit;text-decoration:none}button{font:inherit;cursor:pointer}
h1,h2,h3,h4,h5{margin:0;font-weight:600;letter-spacing:-.03em;line-height:1.18}
p{margin:0}
input,select,textarea{font:inherit}
:focus-visible{outline:2px solid var(--pri);outline-offset:2px}
::-webkit-scrollbar{width:9px;height:9px}::-webkit-scrollbar-thumb{background:var(--border2);border-radius:8px}
.mono{font-family:var(--mono)}
.mut{color:var(--mute)}.ok{color:var(--ok)}.bad{color:var(--bad)}.warn{color:var(--warn)}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:10px 16px;border-radius:var(--r);
  font-size:14px;font-weight:500;border:1px solid transparent;transition:.16s;white-space:nowrap}
.btn:disabled{opacity:.45;cursor:not-allowed}
.b-pri{background:var(--pri-btn);color:#fff;box-shadow:0 6px 20px -8px rgba(176,70,40,.8)}
.b-pri:hover:not(:disabled){background:var(--pri2)}
.b-gh{background:rgba(26,23,19,.04);color:var(--fg);border-color:var(--border2)}
.b-gh:hover:not(:disabled){background:rgba(26,23,19,.07)}
.b-dg{background:rgba(239,68,68,.12);color:var(--bad);border-color:rgba(239,68,68,.3)}
.b-sm{padding:6px 12px;font-size:13px}
.b-lg{padding:12px 24px;font-size:14px}
.b-full{width:100%}
.fld{margin-bottom:16px}
.fld label{display:block;font-size:13px;font-weight:500;margin-bottom:6px}
.fld .hint{font-size:12px;color:var(--mute);margin-top:6px}
.in{width:100%;padding:10px 12px;border:1px solid var(--border2);border-radius:var(--r);background:var(--card);color:var(--fg);font-size:14px}
.in::placeholder{color:var(--mute2)}
.in:focus{outline:none;border-color:var(--pri);box-shadow:0 0 0 3px rgba(176,70,40,.16)}
textarea.in{min-height:92px;resize:vertical}
.chip{display:inline-flex;align-items:center;gap:4px;padding:2px 8px;border-radius:999px;font-size:11px;font-weight:500;
  background:rgba(255,255,255,.05);color:var(--mute);border:1px solid var(--border)}
.chip.ok{background:rgba(34,197,94,.1);color:var(--ok);border-color:rgba(34,197,94,.24)}
.chip.warn{background:rgba(245,158,11,.1);color:var(--warn);border-color:rgba(245,158,11,.24)}
.chip.bad{background:rgba(239,68,68,.1);color:var(--bad);border-color:rgba(239,68,68,.26)}
.chip.pri{background:rgba(176,70,40,.11);color:var(--pri);border-color:rgba(176,70,40,.26)}
.chip.vio{background:rgba(143,55,32,.11);color:var(--vio);border-color:rgba(143,55,32,.26)}
.card{background:var(--card);border:1px solid var(--border);border-radius:var(--rx)}
.ch{display:flex;align-items:flex-start;gap:12px;padding:20px 24px 0}
.ch h3{font-size:18px}
.ch .sub{font-size:12px;color:var(--mute);margin-top:4px;max-width:70ch;line-height:1.5}
.ch .rt{margin-left:auto;font-size:11px;color:var(--mute2);white-space:nowrap;display:flex;gap:8px;align-items:center}
.cb{padding:20px 24px 20px}
.bar{height:7px;border-radius:99px;background:var(--card3);overflow:hidden}
.bar i{display:block;height:100%;border-radius:99px;background:var(--pri)}
table{width:100%;border-collapse:collapse;font-size:13px}
th{font-size:10px;font-weight:500;color:var(--mute2);letter-spacing:.06em;text-transform:uppercase;
  text-align:left;padding:10px 12px;border-bottom:1px solid var(--border);white-space:nowrap}
td{padding:10px 12px;border-bottom:1px solid var(--border);vertical-align:middle}
tbody tr:last-child td{border-bottom:0}
tbody tr:hover{background:rgba(255,255,255,.018)}
td.n,th.n{text-align:right;font-family:var(--mono);font-size:12px}
.tw{overflow-x:auto}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:16px;align-items:start}
.g3{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}
.g4{display:grid;grid-template-columns:repeat(4,1fr);gap:16px}
@media(max-width:1180px){.g4{grid-template-columns:repeat(2,1fr)}}
@media(max-width:1000px){.g2,.g3{grid-template-columns:1fr}}
@media(max-width:640px){.g4{grid-template-columns:1fr}}
.kpi{background:var(--card);border:1px solid var(--border);border-radius:var(--rx);padding:20px 20px}
.kpi .t{font-size:10px;color:var(--mute);font-weight:500;display:flex;align-items:center;gap:6px;
  text-transform:uppercase;letter-spacing:.09em}
.kpi .t i{width:7px;height:7px;border-radius:99px;display:block}
.kpi .v{font-size:36px;font-weight:400;letter-spacing:-.045em;margin-top:8px;line-height:1.05}
.kpi .d{font-size:12px;color:var(--mute);margin-top:6px;line-height:1.55}
.empty{padding:48px 20px;text-align:center;color:var(--mute);font-size:13px}
.empty .ic{width:48px;height:48px;border-radius:16px;background:var(--card2);color:var(--pri);
  display:grid;place-items:center;font-size:20px;margin:0 auto 14px;border:1px solid var(--border)}
code{font-family:var(--mono);font-size:11px;background:var(--muted);border:1px solid var(--border);
  border-radius:4px;padding:1px 4px;color:var(--pri)}
pre{background:var(--bg);border:1px solid var(--border);color:var(--fg2);padding:14px 16px;border-radius:var(--r);
  font-family:var(--mono);font-size:12px;overflow-x:auto;margin:0;line-height:1.75;white-space:pre-wrap;word-break:break-word}

#ob{min-height:100vh;display:none;flex-direction:column}
#ob.on{display:flex}
.ob-top{height:64px;border-bottom:1px solid var(--border);display:flex;align-items:center;padding:0 24px;gap:14px;
  position:sticky;top:0;background:rgba(247,244,237,.85);backdrop-filter:blur(14px);z-index:20}
.ob-top .r{margin-left:auto;display:flex;align-items:center;gap:12px;font-size:13px;color:var(--mute)}
.ob-dots{display:flex;gap:4px}
.ob-dots i{width:7px;height:7px;border-radius:99px;background:var(--card3);display:block}
.ob-dots i.on{background:var(--pri)}
.ob-prog{height:3px;background:var(--card2)}
.ob-prog i{display:block;height:100%;background:linear-gradient(90deg,var(--pri),var(--vio));transition:width .4s}
.stepper{display:flex;justify-content:center;gap:0;padding:24px 20px 6px;flex-wrap:wrap}
.st{display:flex;align-items:center}
.st .n{width:30px;height:30px;border-radius:99px;display:grid;place-items:center;font-size:12px;font-weight:600;
  background:var(--card2);color:var(--mute);border:1px solid var(--border2)}
.st.on .n{background:var(--pri-btn);color:#fff;border-color:var(--pri-btn);box-shadow:0 0 0 5px rgba(176,70,40,.16)}
.st.dn .n{background:var(--pri-btn);color:#fff;border-color:var(--pri-btn)}
.st .lb{font-size:11px;color:var(--mute);position:absolute;margin-top:48px;transform:translateX(-50%);white-space:nowrap}
.st.on .lb,.st.dn .lb{color:var(--fg);font-weight:500}
.st .ln{width:clamp(24px,5vw,66px);height:1px;background:var(--border2);margin:0 4px}
.st.dn .ln{background:var(--pri-btn)}
.ob-body{flex:1;display:grid;place-items:start center;padding:56px 20px 56px}
.ob-card{width:100%;max-width:600px;text-align:center}
.ob-ic{width:62px;height:62px;border-radius:16px;background:rgba(176,70,40,.11);border:1px solid rgba(176,70,40,.24);
  display:grid;place-items:center;font-size:24px;margin:0 auto 16px}
.ob-card h2{font-size:30px;margin-bottom:8px}
.ob-card .lead{color:var(--mute);font-size:14px;max-width:52ch;margin:0 auto 32px}
.ob-form{text-align:left}
.info{border:1px solid rgba(176,70,40,.22);background:rgba(176,70,40,.05);border-radius:var(--rl);padding:16px 16px;
  font-size:13px;color:var(--fg2);text-align:left;margin-bottom:20px}
.info ul{margin:12px 0 0;padding-left:16px;color:var(--mute);font-size:13px}
.info li{margin-bottom:4px}
.sugg{border:1px dashed var(--border2);border-radius:var(--rl);padding:20px;text-align:center;margin-bottom:16px}
.taglist{display:flex;gap:8px;flex-wrap:wrap}
.tagx{display:inline-flex;align-items:center;gap:8px;padding:8px 12px;min-height:34px;border-radius:999px;background:var(--card2);
  border:1px solid var(--border2);font-size:13px}
.tagx button{background:none;border:0;color:var(--mute);font-size:14px;line-height:1;
  width:30px;height:30px;display:grid;place-items:center;border-radius:8px;margin:-7px -8px -7px 0}
.tagx button:hover{background:rgba(239,68,68,.14)}
.tagx button:hover{color:var(--bad)}
.tagx.pick{cursor:pointer}
.tagx.pick:hover{border-color:var(--pri);background:rgba(176,70,40,.09)}
.rivrow{margin-bottom:14px}
.rivrow .hd{display:flex;align-items:center;font-size:12px;color:var(--mute);margin-bottom:6px}
.rivrow .hd button{margin-left:auto;background:none;border:0;color:var(--mute);font-size:14px;
  width:30px;height:30px;display:grid;place-items:center;border-radius:8px;margin:-6px -6px -6px 0}
.rivrow .hd button:hover{background:rgba(239,68,68,.14);color:var(--bad)}
.rivrow .in2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
@media(max-width:560px){.rivrow .in2{grid-template-columns:1fr}}
.qitem{display:flex;align-items:flex-start;gap:12px;padding:12px 14px;border:1px solid var(--border);border-radius:var(--r);
  margin-bottom:8px;background:var(--card);cursor:pointer;transition:.14s}
.qitem:hover{border-color:var(--border2)}
.qitem.on{border-color:rgba(176,70,40,.45);background:rgba(176,70,40,.06)}
.qbox{width:19px;height:19px;border-radius:4px;border:1px solid var(--border2);flex:none;display:grid;place-items:center;
  font-size:11px;margin-top:1px;color:transparent}
.qitem.on .qbox{background:var(--pri-btn);border-color:var(--pri-btn);color:#fff}
.qitem span{font-size:13px;text-align:left}
.done-row{display:flex;align-items:center;gap:10px;padding:12px 16px;border:1px solid var(--border);border-radius:var(--r);
  margin-bottom:10px;background:var(--card);font-size:13px;text-align:left}
.done-row .d{width:22px;height:22px;border-radius:99px;display:grid;place-items:center;font-size:11px;flex:none}
.ob-nav{display:flex;gap:12px;margin-top:24px}
.ob-nav .btn{flex:1}

#app{display:none;min-height:100vh}
#app.on{display:grid;grid-template-columns:300px minmax(0,1fr)}
#sb{border-right:1px solid var(--border);background:var(--bg);padding:14px 12px;display:flex;flex-direction:column;gap:12px;
  height:100vh;position:sticky;top:0;overflow-y:auto}
.sb-logo{display:flex;align-items:center;gap:8px;font-weight:600;font-size:16px;padding:4px 8px 12px;border-bottom:1px solid var(--border)}
.mk{width:27px;height:27px;border-radius:8px;flex:none;background:var(--pri-btn);
  display:grid;place-items:center;color:#fff;font-size:12px;font-weight:700}
#sb{padding:0;gap:0;background:var(--bg2);border-right:1px solid var(--card3)}

.sb-id{padding:16px 16px 16px;border-bottom:1px solid var(--card3);background:var(--bg2)}
.sb-logo{display:flex;align-items:center;gap:8px;padding:0 2px 14px;border:0}
.mk{width:30px;height:30px;border-radius:6px;flex:none;background:var(--pri-btn);
  display:grid;place-items:center;color:#fff;font-size:14px;font-weight:700;letter-spacing:-.02em}
.sb-logo .wm{font-size:16px;font-weight:700;letter-spacing:.08em;color:var(--fg)}

.sb-ws{display:flex;align-items:center;gap:10px;width:100%;min-width:0;text-align:left;
  background:var(--card);border:1px solid var(--border);border-radius:8px;padding:10px 10px;color:var(--fg)}
.sb-ws:hover{border-color:var(--border2);background:var(--card2)}
.sb-ws .sq{width:36px;height:36px;border-radius:6px;flex:none;display:grid;place-items:center;
  font-size:14px;font-weight:700;color:var(--pri);background:var(--card3);border:1px solid var(--border2)}
.sb-ws .wt{min-width:0;display:grid;flex:1;gap:2px}
.sb-ws .wt b{font-size:16px;font-weight:600;letter-spacing:-.01em;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sb-ws .wt i{font-style:normal;font-size:12px;color:var(--mute);letter-spacing:.01em;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sb-ws .cv{flex:none;width:14px;height:14px;color:var(--mute2)}
.sb-ws .cv svg{width:100%;height:100%;display:block}

.sb-meter{margin-top:12px}
.sb-meter .mrow{display:flex;align-items:baseline;gap:8px;margin-bottom:6px}
.sb-meter .ml{font-size:11px;font-weight:700;letter-spacing:.13em;color:var(--mute2)}
.sb-meter .mu{font-family:var(--mono);font-size:10px;color:var(--mute2);margin-left:2px}
.sb-meter .mv{margin-left:auto;font-family:var(--mono);font-variant-numeric:tabular-nums;
  font-size:18px;font-weight:600;letter-spacing:-.025em;color:var(--fg)}
.sb-meter .mtrack{height:3px;border-radius:4px;background:var(--card2);overflow:hidden}
.sb-meter .mtrack i{display:block;height:100%;width:0;background:var(--pri-btn);transition:width .45s ease}
.sb-meter .mtrack i.mid{background:var(--warn)}
.sb-meter .mtrack i.bad{background:var(--bad)}
.sb-meter .pill{display:flex;align-items:center;gap:6px;margin-top:10px;
  font-size:12px;color:var(--mute);min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sb-meter .dot{width:5px;height:5px;border-radius:50%;flex:none;background:var(--mute2)}
.sb-meter .dot.ok{background:var(--ok)}
.sb-meter .dot.bad{background:var(--bad)}
.sb-meter .dot.run{background:var(--pri-btn);animation:pulse 1.4s ease-in-out infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.3}}

.sb-wswrap{position:relative}
.wsmenu{display:none}

.nav{display:grid;gap:1px;padding:14px 16px 10px;position:relative}
.nav::before{content:"";position:absolute;left:9px;top:18px;bottom:14px;width:1px;background:var(--border)}
.nav .sec{font-size:11px;font-weight:700;letter-spacing:.13em;color:var(--mute2);
  padding:16px 0 8px 24px;position:relative}
.nav .sec:first-child{padding-top:2px}
.nav a{position:relative;display:flex;align-items:center;gap:12px;padding:10px 10px 10px 24px;
  border-radius:6px;font-size:14px;color:var(--mute);width:100%;line-height:1.35;letter-spacing:-.005em}
.nav a:hover{color:var(--fg);background:var(--card)}
.nav a.on{background:var(--card3);color:var(--fg);font-weight:500}
.nav a.on::before{content:"";position:absolute;left:8px;top:6px;bottom:6px;width:3px;
  border-radius:4px;background:var(--pri-btn)}
.nav .g{width:20px;height:20px;flex:none;opacity:.62;stroke-width:1.7}
.nav a:hover .g{opacity:.85}
.nav a.on .g{opacity:1;color:var(--pri)}
.nav a span{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.nav .ct{flex:none;font-family:var(--mono);font-variant-numeric:tabular-nums;
  font-size:12px;color:var(--mute2)}
.nav a.on .ct,.nav a:hover .ct{color:var(--mute)}

.sb-foot{margin-top:auto;display:grid;gap:0;border-top:1px solid var(--card3);background:var(--bg2)}
.plan-row{display:flex;align-items:center;gap:8px;padding:12px 16px;font-size:13px;background:var(--bg2);
  color:var(--fg);border-bottom:1px solid var(--card3)}
.plan-row:hover{background:var(--card)}
.plan-row .pd{width:5px;height:5px;border-radius:50%;background:var(--ok);flex:none}
.plan-row b{font-weight:600;letter-spacing:.02em}
.plan-row .mn{margin-left:auto;font-size:11px;color:var(--mute2)}
.trial{padding:12px 14px;border-bottom:1px solid var(--card3);background:var(--card)}
.trial .tr-top{display:flex;align-items:baseline;gap:8px;margin-bottom:6px}
.trial .tr-top b{font-size:13px;font-weight:600}
.trial .tr-d{margin-left:auto;font-family:var(--mono);font-size:11px;color:var(--mute)}
.trial .tr-bar{height:3px;border-radius:4px;background:var(--card2);overflow:hidden}
.trial .tr-bar i{display:block;height:100%;background:var(--pri-btn);transition:width .4s ease}
.trial .btn{border-radius:4px;font-size:12px;padding:8px 12px;background:var(--pri-btn);border-color:var(--pri-btn)}
.trial .btn{margin-top:10px}
.sb-acct{display:flex;align-items:center;gap:10px;min-width:0;padding:10px 16px;background:var(--bg2)}
.sb-acct .av{width:34px;height:34px;border-radius:6px;flex:none;display:grid;place-items:center;
  font-size:11px;font-weight:700;color:var(--pri);background:var(--card3);border:1px solid var(--border2)}

<div id="ob" class="on">

<div id="app">
  <aside id="sb">
    <!-- Two zones, separated by a hard rule. The top zone is identity: the
         product, and the client whose numbers are on screen. The bottom zone
         is navigation. A single flat column reads as a list of links; the
         division is what makes it read as a structured application. -->
    <div class="sb-id">
      <div class="sb-logo"><span class="mk">Y</span><span class="wm">YANKI</span></div>

      <!-- The menu is absolutely positioned against this wrapper. Without it,
           the nearest positioned ancestor is the sidebar itself, so the panel
           opened at 100% of a full-height column — six pixels below the fold,
           which reads as "there is no menu". -->
      <div class="sb-wswrap">
        <button class="sb-ws" onclick="toggleWsMenu()" aria-haspopup="true">
          <span class="sq" id="wsInitial">A</span>
          <span class="wt"><b id="wsName">brand</b><i id="wsHost"></i></span>

        <div class="wsmenu" id="wsMenu"></div>

      <div class="sb-meter">

        <div class="pill" id="scanPill"></div>

    </div>

    <nav class="nav" id="nav"></nav>

    <div class="sb-foot">
      <div id="trialBox"></div>
      <!-- Status bar, not a card: plan and operator on one dense line, the way
           a workstation tool puts session state at the bottom edge. -->
      <div class="sb-acct">
        <span class="av" id="uAv">AC</span>
        <span class="who"><b id="uName">Demo</b><i id="uMail"></i></span>
        <span class="ics">
          <button title="Tema" data-i18n-title onclick="toggleTheme()" aria-label="Tema" id="thBtn">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"

const ORIGINALS = new WeakMap();

function delocalise(root){
  const walker=document.createTreeWalker(root||document.body,NodeFilter.SHOW_TEXT);
  let n; while(n=walker.nextNode()){
    if(ORIGINALS.has(n)) n.textContent=ORIGINALS.get(n);
  }
  (root||document).querySelectorAll('[data-origtitle],[data-origplaceholder],[data-origarialabel]').forEach(el=>{
    for(const attr of ['title','placeholder','aria-label']){
      const slot='orig'+attr.replace(/-(\w)/g,(_,c)=>c.toUpperCase());
      const saved=el.dataset[slot];
      if(saved){ el.setAttribute(attr,saved); delete el.dataset[slot]; }
    }
  });
}

function localise(root){
  if(S.lang!=='tr') return;

  if(!localise._index){
    localise._index = new Map();
    for(const k in I18N) localise._index.set(k.replace(/\s+/g,' ').trim(), I18N[k]);
  }
  const idx = localise._index;

  const patterns = [
    [/^All \((\d+)\)$/,            m=>`Tümü (${m[1]})`],
    [/^Active \((\d+)\)$/,         m=>`Aktif (${m[1]})`],
    [/^Paused \((\d+)\)$/,         m=>`Pasif (${m[1]})`],
    [/^(\d+(?:\.\d+)?)% coverage$/,m=>`%${m[1]} kapsama`],
    [/^(\d+) content pieces\/mo$/, m=>`ayda ${m[1]} içerik`],
    [/^(\d+) AI prompts$/,         m=>`${m[1]} AI sorgusu`],
    [/^(\d+) competitors$/,        m=>`${m[1]} rakip`],
    [/^(\d+) GEO audits\/mo$/,     m=>`ayda ${m[1]} GEO denetimi`],
    [/^· weight (\d[\d.]*)$/,      m=>`· ağırlık ${m[1]}`],
    [/^First scan queued — (\d+) checks across (\d+) platforms?$/,
                                   m=>`İlk tarama kuyruğa alındı — ${m[2]} platformda ${m[1]} kontrol`],
    [/^Showing 1–(\d+) of (\d+)$/, m=>`${m[2]} sorgudan ${m[1]} tanesi gösteriliyor`],
  ];

  const fragments = [
    [/· weight /g, '· ağırlık '],
    [/· official API/g, '· resmî API'],
    [/· licensed SERP provider/g, '· lisanslı SERP sağlayıcısı'],
    [/· model /g, '· model '],
  ];

  const swap = (text) => {
    const key = text.replace(/\s+/g,' ').trim();
    if(!key) return null;
    const hit = idx.get(key);
    if(hit) return hit;
    for(const [re,fn] of patterns){ const m = key.match(re); if(m) return fn(m); }
    let frag = text, changed = false;
    for(const [re,to] of fragments){ if(re.test(frag)){ frag = frag.replace(re,to); changed = true; } }
    return changed ? frag : null;
  };

  const walker=document.createTreeWalker(root||document.body,NodeFilter.SHOW_TEXT,{
    acceptNode(n){
      const p=n.parentElement;
      if(!p) return NodeFilter.FILTER_REJECT;
      if(p.closest('pre,code,textarea,input,#gc,#wmd,#fixc')) return NodeFilter.FILTER_REJECT;
      return n.textContent.trim() ? NodeFilter.FILTER_ACCEPT : NodeFilter.FILTER_REJECT;
    }
  });
  const jobs=[]; let n;
  while(n=walker.nextNode()) jobs.push(n);
  for(const node of jobs){
    const hit = swap(node.textContent);
    if(hit !== null){
      if(!ORIGINALS.has(node)) ORIGINALS.set(node, node.textContent);
      node.textContent = hit;
    }
  }

  (root||document).querySelectorAll('[placeholder],[title],[aria-label]').forEach(el=>{
    for(const attr of ['placeholder','title','aria-label']){
      const v=el.getAttribute(attr);
      if(!v) continue;
      const hit=swap(v);
      if(hit!==null){
        const slot='orig'+attr.replace(/-(\w)/g,(_,c)=>c.toUpperCase());
        if(!el.dataset[slot]) el.dataset[slot]=v;
        el.setAttribute(attr,hit);
      }
    }
  });
}

function toast(t, kind){
  const err = kind==='error' || /fail|error|could not|cannot|invalid|too many|not correct|required/i.test(t);
  const d=document.createElement('div');
  d.className='tst'+(err?' err':'');
  d.innerHTML=`<span class="ic">${err?'⚠':'✓'}</span><span>${esc(t)}</span>
    <button class="x" aria-label="Dismiss">×</button><span class="life"></span>`;
  const close=()=>{ d.style.opacity='0'; d.style.transform='translateY(6px)';
                    d.style.transition='.2s'; setTimeout(()=>d.remove(),220); };
  d.querySelector('.x').onclick=close;
  const timer=setTimeout(close,5000);
  d.onmouseenter=()=>{clearTimeout(timer); const l=d.querySelector('.life');
    if(l) l.style.animationPlayState='paused';};
  d.onmouseleave=()=>{ setTimeout(close,1800); const l=d.querySelector('.life');
    if(l) l.style.animationPlayState='running';};
  $('#toasts').append(d);
  localise(d);
}

function addPrompt(){
  const raw=$('#iq').value||'';
  const lines=raw.split('\n')
    .map(l=>l.trim().replace(/^[-•*\d.)\s]+/,'').replace(/^["']|["']$/g,''))
    .filter(l=>l.length>=6);
  if(!lines.length) return toast(T('Write at least one prompt (6 characters or more)'),'error');
  const existing=new Set(S.prompts.map(p=>p.text.toLocaleLowerCase('tr')));
  let added=0;
  for(const text of lines){
    const key=text.toLocaleLowerCase('tr');
    if(existing.has(key)) continue;
    existing.add(key);
    S.prompts.push({id:'c'+Date.now()+'_'+added,text,intent:guessIntent(text),on:true,
      vol:400,src:'custom',active:true});
    added++;
  }
  $('#iq').value='';
  renderOb();
  toast(added?`${added} prompt${added===1?'':'s'} added`:'Those prompts are already in the list');
}

function guessIntent(t){
  const s=t.toLocaleLowerCase('tr');
  const brand=(S.brand.name||'').toLocaleLowerCase('tr');
  if(brand && s.includes(brand) && /güvenilir|yorum|şikayet|dolandır|scam|review|trust/.test(s)) return 'brand_defence';
  if(/fiyat|ücret|satın al|sipariş|nereden al|ucuz|indirim|kampanya|price|buy|cheap/.test(s)) return 'transactional';
  if(/karşılaştır|farkı|hangisi daha|compare|versus|\bvs\b/.test(s)) return 'comparison';
  if(/nedir|nasıl|ne işe yarar|rehber|what is|how to/.test(s)) return 'informational';
  return 'evaluation';
}

const api = {
  async req(path, opts = {}) {
    const res = await fetch(path, {
      credentials: 'same-origin',
      headers: opts.body ? { 'content-type': 'application/json' } : undefined,
      ...opts,
    });
    let data = null;
    try { data = await res.json(); } catch { /* empty body */ }
    if (!res.ok) {
      const err = new Error((data && data.error) || `Request failed (${res.status})`);
      err.status = res.status;
      throw err;
    }
    return data;
  },
  get:  (p)    => api.req(p),
  post: (p, b) => api.req(p, { method: 'POST', body: JSON.stringify(b || {}) }),
  patch:(p, b) => api.req(p, { method: 'PATCH', body: JSON.stringify(b || {}) }),
  del:  (p)    => api.req(p, { method: 'DELETE' }),
};

function adopt(r) {
  S.workspaceId = r.workspace.id;
  S.plan = r.org.plan;
  S.planLimits = r.org.planLimits;
  S.brand = {
    name: r.workspace.brandName,
    site: r.workspace.domain,
    sector: r.workspace.sector,
    country: r.workspace.country,
    city: r.workspace.city || '',
    desc: r.workspace.description || '',
  };
  S.variants = r.workspace.aliases || [];
  S.rawCompetitors = r.competitors || [];
  S.rivals = (r.competitors || []).map(c => ({ id: c.id, n: c.name, d: c.domain || '' }));
  S.prompts = (r.prompts || []).map(p => ({
    id: p.id, text: p.text, intent: p.intent, vol: p.volume,
    src: p.source, active: true, score: p.score, ci: p.ci,
    coverage: p.coverage, opportunity: p.opportunity, engines: p.engines,
  }));
  S.enginesMeta = r.engines;
  S.scanState = r.scan;
  S.auditRaw = r.audit;
  S.quality = r.quality || null;

  const latest = r.latest;
  const allowed = r.engines.filter(e => !e.locked);
  const byEngine = (latest && latest.by_engine) || {};

  const plats = r.engines.map(e => {
    const stats = byEngine[e.key] || {};
    const own = (r.cells || []).filter(c => c.engineKey === e.key);
    const cellCount = own.length;
    const mentions  = own.filter(c => c.m > 0).length;
    const cites     = own.filter(c => c.c > 0).length;
    return {
      id: e.key, n: e.label, ab: ENGINE_GLYPH[e.key] || '◆', c: ENGINE_COLOR[e.key] || '#B04628',
      w: e.weight, locked: e.locked, configured: e.configured, active: e.active,
      measured: e.measured, failing: e.failing,
      score: Number(stats.score || 0),
      ci: Number(stats.ci || 0),
      mentions, cites, checks: cellCount,
      trend: 0,
    };
  });

  const cells = (r.cells || []).map(c => ({
    p: { id: c.promptId, text: c.text, intent: c.intent, vol: c.volume },
    pl: plats.find(x => x.id === c.engineKey) || plats[0],
    runId: c.runId,
    score: c.score, ci: c.ci, m: c.m, c: c.c, sg: c.sigma * 2 - 1,
    rank: c.meanRank,
  })).filter(c => c.pl);

  const totalMentions = (r.competitors || []).reduce((a, c) => a + Number(c.mentions || 0), 0) + Number(r.selfMentions || 0);
  const sov = [
    { n: r.workspace.brandName, v: Number(r.selfMentions || 0), you: true },
    ...(r.competitors || []).map(c => ({ n: c.name, v: Number(c.mentions || 0) })),
  ].map(x => ({ ...x, pct: totalMentions ? (x.v / totalMentions) * 100 : 0 }));

  const audit = r.audit ? groupAudit(r.audit.factors) : [];

  S.data = {
    ready: !!latest,
    cells,
    plats,
    total: latest ? Number(latest.score) : 0,
    ciAvg: latest ? Number(latest.ci) : 0,
    lowConfidence: latest ? latest.low_confidence : false,
    mentionRate: latest ? Number(latest.mention_rate) : 0,
    citationRate: latest ? Number(latest.citation_rate) : 0,
    sov,
    sources: (r.sources || []).map(s => ({
      d: s.domain, v: s.citations, mine: s.mine,
      kind: s.kind || 'unknown', kindNote: s.kindNote || null,
      first: s.first_seen, last: s.last_seen,
      delta: s.delta === undefined ? 0 : s.delta,
      plats: (s.engines || []).map(k => plats.find(p => p.id === k)).filter(Boolean),
    })),
    series: (r.series || []).map(x => Number(x.score)),
    seriesDates: (r.series || []).map(x => x.scan_date),

    auditUrl: r.audit ? r.audit.url : r.workspace.domain,
    auditRanAt: r.audit ? r.audit.ran_at : null,
    bots: [],
    opps: r.prompts.map(p => ({
      p: { id: p.id, text: p.text, intent: p.intent, vol: p.volume },
      cover: (p.coverage || 0) / 100,
      srcCount: (r.sources || []).length,
      fit: p.coverage > 50 ? 'High' : p.coverage > 0 ? 'Medium' : 'Low',
      opp: p.opportunity,
      act: ACTION_BY_INTENT[p.intent] || 'Product/service page',
    })).sort((a, b) => b.opp - a.opp),
    rivals: (r.competitors || []).map(c => c.name),
    host: r.workspace.host,
    recent: r.recentMentions || [],
  };
  S.data.actions = buildActions();
}

function groupAudit(factors) {
  const map = new Map();
  for (const f of factors || []) {
    if (!map.has(f.category)) map.set(f.category, []);
    map.get(f.category).push({ n: f.label, st: f.status, fix: f.fix, detail: f.detail });
  }
  return [...map.entries()].map(([n, facs]) => ({
    n, facs,
    score: facs.reduce((a, f) => a + (f.st === 'pass' ? 100 : f.st === 'partial' ? 55 : 0), 0) / facs.length,
  }));
}

function buildActions() {
  const d = S.data || {}, b = S.brand;
  const A = [];
  const push = (t, sub, im, ef, q, desc, steps, code) => A.push({ t, sub, im, ef, q, desc, steps, code });

  const fails = [];
  (d.audit || []).forEach(c => c.facs.forEach(f => { if (f.st === 'fail') fails.push({ ...f, cat: c.n }); }));

  fails.filter(f => f.fix).slice(0, 4).forEach((f, i) => push(
    T(f.n),
    `${T(f.cat)} · ${f.detail || T('Failing')}`,
    (4.6 - i * 0.5).toFixed(1),
    i === 0 ? `1 ${T('hour')}` : `1–3 ${T('days')}`,
    `+${4 - i} ${T('prompts')}`,
    f.detail || T('This factor is failing on the audited page.'),
    [T('Apply the snippet below'), T('Deploy the change'), T('Re-run the audit to confirm it passes')],
    f.fix));

  (d.opps || []).filter(o => o.cover < 0.4).slice(0, 3).forEach((o, i) => push(
    `${T('Publish content for')} "${o.p.text.replace(/"/g, '')}"`,
    `${T('Opportunity')} ${o.opp} · ${T('coverage')} ${Math.round(o.cover * 100)}% · ${T('volume')} ${o.p.vol}`,
    (4.2 - i * 0.6).toFixed(1), `1–3 ${T('weeks')}`, `+${3 - i} ${T('prompts')}`,
    T('Your visibility on this prompt is low. The content writer can analyse the answer structure and draft a page aimed at it.'),
    [T('Write a 40–60 word direct answer in the first paragraph'),
     T('Convert headings into question form'),
     T('Add at least one table and one numeric data point'),
     T('Mark it up with FAQPage schema')],
    null));

  const outside = (d.sources || []).filter(s => !s.mine);
  const reachable = outside
    .filter(s => srcKind(s.kind).reachable)
    .sort((a, b) => (srcKind(a.kind).rank - srcKind(b.kind).rank) || (b.v - a.v));
  const blocked = outside.filter(s => !srcKind(s.kind).reachable && s.kind !== 'unknown');

  if (reachable.length) {
    const toplamAtif = reachable.reduce((a, s) => a + s.v, 0);
    const turler = [...new Set(reachable.map(s => T(srcKind(s.kind).label)))];
    push(
      `${T('Kayda açık')} ${reachable.length} ${T('kaynağa girin')}`,
      `${toplamAtif} ${T('atıf')} · ${turler.slice(0, 3).join(' · ')}`,
      '4.4', T('koşula göre değişir'), `+3 ${T('sorgu')}`,
      `${T('Modeller sizi çoğunlukla üçüncü taraf kaynaklardan öğrenir. Bu kaynaklar dışarıya açık — hangisinin ne istediğini Kaynaklar ekranında görürsünüz.')}`,
      srcKind(reachable[0].kind).steps,
      null);
  }

  if (blocked.length) {
    const toplam = blocked.reduce((a, s) => a + s.v, 0);
    const rakip = blocked.filter(s => s.kindNote && /rakip/i.test(s.kindNote));
    push(
      T('Rakip ve satıcı içerikleri sizden çok alıntılanıyor'),
      `${blocked.length} ${T('kaynak')} · ${toplam} ${T('atıf')} · ${T('bu kaynaklara girilemez')}`,
      '4.2', `2–4 ${T('ay')}`, `+2 ${T('sorgu')}`,
      `${T('Bu kaynaklar toplam')} ${toplam} ${T('atıf alıyor.')} ${
        rakip.length ? `${rakip.length} ${T('tanesi doğrudan rakibinizin sitesi.')} ` : ''}` +
      T('Bu kaynaklara profil açamaz, editörüne yazamazsınız — içerik onların kendi pazarlaması. Ama aynı yarışa girebilirsiniz.'),
      [T('En çok atıf alan üç sayfayı inceleyin: hangi soruya, hangi yapıda cevap veriyorlar'),
       T('Aynı sorulara kendi sitenizde daha iyi cevap veren kaynaklar yayınlayın'),
       T('Site denetimindeki başarısız kriterleri kapatın — rakip siteler taranıyor, sizinki taranamıyor olabilir'),
       T('Ürettiğiniz içeriğin girilebilir dizin ve yayınlarda alıntılanmasını sağlayın')],
      null);
  }

  if (!A.length) push(
    T('Run a site audit to generate your plan'),
    T('No audit has been run for this workspace yet'),
    '—', `2 ${T('minutes')}`, '—',
    T('The action plan is built from real audit findings and prompt coverage. Run an audit and the tasks appear here.'),
    [T('Open the Audit screen'), T('Run the audit against your homepage'), T('Return here')],
    null);

  return A;
}

function lineChart(vals,o={}){
  const W=o.w||460,H=o.h||180,P={l:30,r:8,t:10,b:20};
  if(!vals.length) return `<div class="empty" style="padding:28px">${T("No history yet — the first scan writes today's point.")}</div>`;
  if(vals.length===1) vals=[vals[0],vals[0]];
  const N=vals.length;
  const mn=o.min??0,mx=o.max??100,uid='g'+Math.random().toString(36).slice(2,7);
  const x=i=>P.l+(i/(N-1||1))*(W-P.l-P.r),y=v=>H-P.b-((v-mn)/(mx-mn||1))*(H-P.t-P.b);
  let L='',G='';vals.forEach((v,i)=>L+=(i?'L':'M')+x(i).toFixed(1)+' '+y(v).toFixed(1));
  const A=L+`L${x(N-1).toFixed(1)} ${H-P.b}L${x(0).toFixed(1)} ${H-P.b}Z`;
  (o.ticks||[0,25,50,75,100]).forEach(v=>{G+=`<line x1="${P.l}" y1="${y(v)}" x2="${W-P.r}" y2="${y(v)}" stroke="var(--border)"/>
    <text x="${P.l-5}" y="${y(v)+3.5}" text-anchor="end" font-size="10" fill="var(--mute2)" font-family="ui-monospace">${v}</text>`});
  const col=o.color||'var(--pri)';
  return `<svg viewBox="0 0 ${W} ${H}" width="100%" style="display:block;overflow:hidden">
   <defs><linearGradient id="${uid}" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="${col}" stop-opacity=".4"/><stop offset="1" stop-color="${col}" stop-opacity="0"/></linearGradient></defs>
   ${G}<path d="${A}" fill="url(#${uid})"/><path d="${L}" fill="none" stroke="${col}" stroke-width="2" stroke-linejoin="round"/>
   <circle cx="${x(N-1)}" cy="${y(vals[N-1])}" r="3.4" fill="${col}" stroke="var(--card)" stroke-width="2"/>
   ${(o.xlab||[]).map((t,i,a)=>`<text x="${P.l+(i/(a.length-1))*(W-P.l-P.r)}" y="${H-4}" text-anchor="middle"
     font-size="10" fill="var(--mute2)" font-family="ui-monospace">${t}</text>`).join('')}</svg>`;
}
function donut(items,center,sub){
  const R=58,SW=21,cx=72,cy=72;let a=-Math.PI/2,arcs='';
  const tot=items.reduce((s,i)=>s+i.v,0);
  if(!tot)arcs=`<circle cx="${cx}" cy="${cy}" r="${R-SW/2}" fill="none" stroke="var(--border)" stroke-width="${SW}"/>`;
  items.forEach(d=>{if(!tot)return;const a2=a+(d.v/tot)*Math.PI*2,pt=(r,t)=>[cx+r*Math.cos(t),cy+r*Math.sin(t)];
    const[x1,y1]=pt(R,a),[x2,y2]=pt(R,a2),[x3,y3]=pt(R-SW,a2),[x4,y4]=pt(R-SW,a);
    const lg=(a2-a)>Math.PI?1:0;
    arcs+=`<path d="M${x1} ${y1}A${R} ${R} 0 ${lg} 1 ${x2} ${y2}L${x3} ${y3}A${R-SW} ${R-SW} 0 ${lg} 0 ${x4} ${y4}Z" fill="${d.c}"/>`;a=a2});
  return `<svg viewBox="0 0 144 144" width="146" style="flex:none">${arcs}
    <text x="72" y="70" text-anchor="middle" font-size="21" font-weight="600" fill="var(--fg)">${center}</text>
    <text x="72" y="86" text-anchor="middle" font-size="10" fill="var(--mute2)" font-family="ui-monospace">${sub}</text></svg>`;
}
function trendChart(ser){
  if(!ser || ser.length<2) return `<div class="empty" style="padding:34px 12px">
    <div class="ic">◜</div>${T('Ölçüm biriktikçe eğri oluşur')}</div>`;
  const W=680,H=190,PL=38,PR=14,PT=14,PB=26;
  const lo=Math.min(...ser), hi=Math.max(...ser);
  const span=Math.max(1,hi-lo);
  const step=span<8?2:span<25?5:10;
  const y0=Math.max(0,Math.floor((lo-span*0.3)/step)*step);
  const y1=Math.min(100,Math.ceil((hi+span*0.3)/step)*step);
  const sx=i=>PL+i/(ser.length-1)*(W-PL-PR);
  const sy=v=>PT+(1-(v-y0)/((y1-y0)||1))*(H-PT-PB);
  const line=ser.map((v,i)=>(i?'L':'M')+sx(i).toFixed(1)+' '+sy(v).toFixed(1)).join(' ');
  const up=ser[ser.length-1]>=ser[0];
  const col=up?'var(--ok)':'var(--bad)';
  return `<svg viewBox="0 0 ${W} ${H}" style="width:100%;height:200px;display:block" role="img"
    aria-label="${esc(T('Visibility Trend'))}">
    <defs><linearGradient id="tgr" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="${col}" stop-opacity=".20"/>
      <stop offset="1" stop-color="${col}" stop-opacity="0"/></linearGradient></defs>
    ${[y0,(y0+y1)/2,y1].map(t=>`
      <line x1="${PL}" x2="${W-PR}" y1="${sy(t).toFixed(1)}" y2="${sy(t).toFixed(1)}"
        stroke="currentColor" stroke-opacity=".12"/>
      <text x="${PL-8}" y="${(sy(t)+3.5).toFixed(1)}" text-anchor="end" font-size="10"
        fill="currentColor" fill-opacity=".45">${t.toFixed(0)}</text>`).join('')}
    <path d="${line} L ${sx(ser.length-1).toFixed(1)} ${H-PB} L ${PL} ${H-PB} Z" fill="url(#tgr)"/>
    <path d="${line}" fill="none" stroke="${col}" stroke-width="2"
      stroke-linejoin="round" stroke-linecap="round"/>
    <circle cx="${sx(ser.length-1).toFixed(1)}" cy="${sy(ser[ser.length-1]).toFixed(1)}" r="3.5" fill="${col}"/>
    <text x="${PL}" y="${H-7}" font-size="10" fill="currentColor" fill-opacity=".45">-${S.range} ${T('gün')}</text>
    <text x="${W-PR}" y="${H-7}" text-anchor="end" font-size="10"
      fill="currentColor" fill-opacity=".45">${T('bugün')}</text>
  </svg>`;
}

function gauge(v,col){
  const R=62,cx=84,cy=84,a0=Math.PI*.78,a1=Math.PI*2.22,ang=a0+(v/100)*(a1-a0);
  const pt=(r,a)=>[(cx+r*Math.cos(a)).toFixed(1),(cy+r*Math.sin(a)).toFixed(1)];
  const arc=(f,t,r,w,c)=>{const[x1,y1]=pt(r,f),[x2,y2]=pt(r,t);
    return `<path d="M${x1} ${y1}A${r} ${r} 0 ${(t-f)>Math.PI?1:0} 1 ${x2} ${y2}" fill="none" stroke="${c}" stroke-width="${w}" stroke-linecap="round"/>`};
  return `<svg viewBox="0 0 168 142" width="190" style="max-width:100%">${arc(a0,a1,R,14,'var(--border)')}${arc(a0,ang,R,14,col)}
    <text x="84" y="90" text-anchor="middle" font-size="34" font-weight="600" fill="var(--fg)">${v.toFixed(0)}</text>
    <text x="84" y="108" text-anchor="middle" font-size="10" fill="var(--mute2)" font-family="ui-monospace">${T("OUT OF 100")}</text></svg>`;
}

function navCount(route){
  const d=S.data;
  if(!d) return null;
  switch(route){
    case 'mentions':  return new Set(d.cells.filter(c=>c.m>0).map(c=>c.p.id)).size || null;
    case 'platforms': return d.plats.filter(p=>!p.locked&&p.measured!==false&&p.checks>0).length || null;
    case 'sources':   return (d.sources||[]).length || null;
    case 'rivals':    return (S.rivals||[]).length || null;
    case 'prompts':   return (d.opps||[]).length || null;
    case 'opps':      return (d.opps||[]).filter(o=>o.opp>0).length || null;
    case 'plan':      return (d.audit||[]).reduce((a,c)=>a+c.facs.filter(f=>f.st==='fail').length,0) || null;
    default: return null;
  }
}

function scanProgress(){
  const sc=S.scanState;
  if(!sc) return null;
  const pending=Number(sc.pending||0);
  const total=Number(sc.queued_jobs||0) || null;
  if(pending<=0) return null;
  const done=total ? Math.max(0,total-pending) : null;
  return { pending, total, done, pct: total ? Math.round(done/total*100) : null };
}

  const p=scanProgress()||{pending:null,total:null,done:null,pct:null};

  `<div class="card"><div class="cb" style="padding:34px 26px;text-align:center">

function insightText(){
  const d=S.data,b=S.brand;
  const measuredPlats=d.plats.filter(p=>p.active&&p.measured!==false);
  const worst=[...measuredPlats].sort((a,x)=>a.score-x.score)[0]||{n:'—',score:0};
  const cited=d.cells.filter(c=>c.c>0).length;
  const tr = S.lang==='tr';

  if(!d.ready || S.scanState && S.scanState.pending>0) return tr ? {
    lvl:'wait', tag:'ÖLÇÜM SÜRÜYOR',
    head:'Sonuçlar hazırlanıyor',
    body:'Veriler geldikçe skor yeniden hesaplanıyor. Ölçüm tamamlanmadan çıkarılacak sonuç '+
         'yanıltıcı olur; marka ilk sorgularda görünmeyip sonrakilerde öne çıkabilir.'
  } : {
    lvl:'wait', tag:'IN PROGRESS',
    head:'Results are being assembled',
    body:'The score is recalculated as data arrives. Any conclusion drawn before the run '+
         'completes will mislead: a brand can be absent from the first queries and prominent '+
         'in the ones that follow.'
  };

  if(d.total<10) return tr ? {
    lvl:'crit', tag:'KRİTİK',
    metric:d.total.toFixed(1), metricLabel:'/ 100 görünürlük',
    head:'Yapay zeka sizi önermiyor',
    body:`Takip ettiğiniz sorgular müşterilerinizin satın almadan hemen önce sorduğu sorular. `+
         `${b.name} bu cevapların neredeyse hiçbirinde geçmiyor; kullanıcı öneriyi okuyup tıklıyor ve `+
         `tıkladığı marka her seferinde bir rakibiniz oluyor. `+
         (d.auditRanAt
           ? `Sebep büyük ölçüde teknik: sitenizde ${d.audit.reduce((a,c)=>a+c.facs.filter(f=>f.st==='fail').length,0)} kriter başarısız. Etkiye göre sıralanmış hâli Aksiyon Planı'nda.`
           : 'Nereden başlanacağını görmek için site denetimini çalıştırın.')
  } : {
    lvl:'crit', tag:'CRITICAL',
    metric:d.total.toFixed(1), metricLabel:'/ 100 visibility',
    head:'AI is not recommending you',
    body:`The queries you track are the ones customers ask right before they buy. `+
         `${b.name} appears in almost none of those answers; the user reads the recommendation, `+
         `clicks, and the brand they click is a competitor every time. `+
         (d.auditRanAt
           ? `The cause is largely technical: ${d.audit.reduce((a,c)=>a+c.facs.filter(f=>f.st==='fail').length,0)} checks failed on your site. The Action Plan ranks them by impact.`
           : 'Run the site audit to see where to start.')
  };

  const promptsSeen = new Set(d.cells.map(c => c.p.id)).size;
  const named       = new Set(d.cells.filter(c => c.m > 0).map(c => c.p.id)).size;
  const citeGap = named >= Math.max(2, promptsSeen * 0.4) && cited < named * 0.5;

  if (d.total < 35) return tr ? {
    lvl:'warn', tag:'ZAYIF',
    metric:d.total.toFixed(1), metricLabel:'/ 100 görünürlük',
    head:'Görünürlüğünüz rakiplerin gerisinde',
    body:`${b.name} ${promptsSeen} sorgunun ${named} tanesinde anılıyor, ancak cevapların `+
         `çoğunda ya sona kalıyor ya da hiç geçmiyor. Yapay zeka cevaplarında ilk anılan `+
         `birkaç marka tıklanmanın neredeyse tamamını alır; alt sıralarda olmak, olmamaktan `+
         `çok az farklıdır. En zayıf platform ${worst.n} (${worst.score.toFixed(1)}/100).`
  } : {
    lvl:'warn', tag:'WEAK',
    metric:d.total.toFixed(1), metricLabel:'/ 100 visibility',
    head:'Your visibility trails your competitors',
    body:`${b.name} is named on ${named} of ${promptsSeen} queries, but in most answers it `+
         `arrives last or not at all. The first brands named in an AI answer take almost all `+
         `of the click; being far down the list is barely different from being absent. `+
         `Weakest platform is ${worst.n} (${worst.score.toFixed(1)}/100).`
  };

  if (citeGap) return tr ? {
    lvl:'opp', tag:'FIRSAT',
    metric:String(cited), metricLabel:`/ ${named} sorguda kaynak`,
    head:'Anılıyorsunuz, tıklanan siz değilsiniz',
    body:`${b.name} ${named} sorguda anılıyor ama siteniz yalnızca ${cited} tanesinde kaynak `+
         `olarak gösteriliyor. Marka bilinirliği çalışıyor, trafik başka siteye gidiyor — `+
         `aradaki fark doğrudan kaybedilen ziyaret demek. Organization ve FAQ şeması ile `+
         `kanonik URL düzeni, bu boşluğu kapatan en hızlı iki müdahale.`
  } : {
    lvl:'opp', tag:'OPPORTUNITY',
    metric:String(cited), metricLabel:`/ ${named} queries cite you`,
    head:'You get named, someone else gets the click',
    body:`${b.name} is named on ${named} queries but your site is cited as the source on only `+
         `${cited}. Awareness is working; the traffic is going elsewhere, and the gap between `+
         `those two numbers is lost visits. Organization and FAQ schema plus a clean canonical `+
         `URL structure are the two fastest ways to close it.`
  };

  if (d.total >= 60) return tr ? {
    lvl:'good', tag:'GÜÇLÜ',
    metric:d.total.toFixed(1), metricLabel:'/ 100 görünürlük',
    head:'Konumunuz güçlü — korumaya oynayın',
    body:`${b.name} takip edilen sorgularda düzenli olarak öneriliyor ve ${cited} sorguda `+
         `siteniz kaynak gösteriliyor. Bu konum kalıcı değil: yapay zeka cevapları üçüncü `+
         `taraf kaynaklardan besleniyor ve rakip içeriği tazelediğinde sıralama haftalar `+
         `içinde değişebilir. En zayıf halkanız ${worst.n} (${worst.score.toFixed(1)}/100) — `+
         `düşüş genelde en zayıf platformdan başlar.`
  } : {
    lvl:'good', tag:'STRONG',
    metric:d.total.toFixed(1), metricLabel:'/ 100 visibility',
    head:'Strong position — play to defend it',
    body:`${b.name} is recommended consistently on the tracked queries, with your site cited `+
         `on ${cited} of them. The position is not permanent: AI answers are fed by third-party `+
         `sources, and a competitor refreshing their content can move the ranking within weeks. `+
         `Your weakest link is ${worst.n} (${worst.score.toFixed(1)}/100) — decline usually `+
         `starts at the weakest platform.`
  };

  return tr ? {
    lvl:'opp', tag:'GELİŞTİRİLEBİLİR',
    metric:d.total.toFixed(1), metricLabel:'/ 100 görünürlük',
    head:'Zemin sağlam, üstüne inşa edilebilir',
    body:`${b.name} ${named}/${promptsSeen} sorguda anılıyor ve ${cited} sorguda kaynak `+
         `gösteriliyor — temel kurulmuş. Buradan sonraki kazanç sıralamadan gelir: cevabın `+
         `içinde kaçıncı anıldığınız, anılıp anılmadığınız kadar belirleyici. En zayıf `+
         `platform ${worst.n} (${worst.score.toFixed(1)}/100), en hızlı kazanç orada.`
  } : {
    lvl:'opp', tag:'ROOM TO GROW',
    metric:d.total.toFixed(1), metricLabel:'/ 100 visibility',
    head:'Solid base, room to build on it',
    body:`${b.name} is named on ${named}/${promptsSeen} queries and cited on ${cited} — the `+
         `foundation is there. The next gain comes from position: where you are named inside `+
         `the answer matters as much as whether you are named at all. Weakest platform is `+
         `${worst.n} (${worst.score.toFixed(1)}/100); that is where the fastest gain sits.`
  };
}

async function answerModal(runId){
  openModal(T('Raw answer'),
    `<div class="empty"><div class="ic">◎</div>${T('Loading the answer…')}</div>`);
  let d;
  try{ d = await api.get(`/api/answers?run=${runId}`); }
  catch(e){ $('#mBody').innerHTML = `<div class="empty">${esc(e.message)}</div>`; return; }

  let html='', cursor=0;
  for(const sp of d.spans||[]){
    if(sp.start<cursor) continue;
    html += esc(d.answer.slice(cursor, sp.start));
    html += `<mark class="${sp.self?'':'riv'}">${esc(d.answer.slice(sp.start, sp.end))}</mark>`;
    cursor = sp.end;
  }
  html += esc((d.answer||'').slice(cursor));

  const sent = d.sentiment===null ? '—' : (d.sentiment>=0?'+':'')+Number(d.sentiment).toFixed(2);
  $('#mBody').innerHTML = `
   <div style="font-size:12px;color:var(--mute);margin-bottom:6px">${T('Query')}</div>
   <div style="font-size:14px;font-weight:500;margin-bottom:16px">${esc(d.prompt)}</div>
   <div style="display:flex;gap:8px;flex-wrap:wrap;margin-bottom:16px">
     <span class="chip">${esc(d.engine)}</span>
     <span class="chip ${d.mentioned?'ok':'bad'}">${d.mentioned?T('Your brand is named'):T('Your brand is not named')}</span>
     ${d.rank?`<span class="chip">${d.rank}${T('.')} ${T('brand named')}</span>`:''}
     <span class="chip ${d.cited?'ok':''}">${d.cited?T('Your site is cited'):T('Your site is not cited')}</span>
     ${d.mentioned&&d.sentiment!==null
        ? `<span class="chip">${T('Tone')}: ${d.sentiment>0.15?T('positive'):d.sentiment<-0.15?T('negative'):T('neutral')}</span>`
        : ''}
     ${d.recommendation?`<span class="chip pri">${T('REC_'+d.recommendation)}</span>`:''}
     ${S.isAdmin?`<span class="chip">run ${d.runIndex+1} · sentiment ${sent}</span>`:''}
   </div>
   <div style="border:1px solid var(--border);border-radius:8px;padding:16px;background:var(--card2);
        font-size:14px;line-height:1.75;white-space:pre-wrap">${html}</div>
   ${d.citations&&d.citations.length?`<div style="margin-top:14px;display:flex;gap:7px;flex-wrap:wrap">
     ${d.citations.map(c=>`<span class="chip">${esc(c)}</span>`).join('')}</div>`:''}
   <p style="font-size:12px;color:var(--mute);margin-top:14px">
     ${T('Collected')} ${new Date(d.askedAt).toLocaleString('tr-TR')}
     ${S.isAdmin?`<br><span style="color:var(--mute2)">${T('Operator')} · ${esc(d.modelVersion||'unknown model')} ·
       ${d.method==='official_api'?'official API':'licensed SERP provider'}
       ${d.degraded?` · degraded=${esc(d.degraded)}`:''}</span>`:''}
   </p>`;
}

VIEWS.mentions=()=>{

    (!fp || c.pl.id===fp));

  const named=all.filter(c=>c.m>0);
  const cited=all.filter(c=>c.c>0);

    ? named.filter(c=>c.rank).reduce((a,c)=>a+c.rank,0)/named.filter(c=>c.rank).length : null;

      <div class="grp">

function exportMentions(){
  const rows=[['Sorgu','Platform','Niyet','Anılma %','Sıra','Kaynak','Ton','Skor','Ölçüm payı']];

VIEWS.platforms=()=>{
  const d=S.data;
  const ser=d.series.slice(-S.range);

  const state=p=> p.locked ? 'locked'
                : !p.configured ? 'nokey'
                : p.failing && !p.measured ? 'failing'
                : !p.measured || !p.checks ? 'nodata' : 'ok';
  const live=d.plats.filter(p=>state(p)==='ok');
  const wLive=live.reduce((a,p)=>a+p.w,0);

  const loss=p=>p.w*(100-p.score);
  const ranked=live.slice().sort((a,b)=>loss(b)-loss(a));
  const worst=ranked[0]||null;
  const totalLoss=live.reduce((a,p)=>a+loss(p),0);

  const covered=d.plats.filter(p=>!p.locked).length;
  const wCovered=d.plats.filter(p=>!p.locked).reduce((a,p)=>a+p.w,0);

  const badge=st=>({
    ok:      `<span class="pst ok"><i></i>${T('Ölçülüyor')}</span>`,
    nodata:  `<span class="pst idle"><i></i>${T('Veri yok')}</span>`,
    nokey:   `<span class="pst idle"><i></i>${S.isAdmin?T('No key'):T('Not measured')}</span>`,
    failing: `<span class="pst warn"><i></i>${S.isAdmin?T('Failing'):T('Not measured')}</span>`,
    locked:  `<span class="pst lock"><i></i>${T('Planınızın üstünde')}</span>`,
  }[st]);

  return head(T('Platforms'),
    T('Her platform toplam skorunuza farklı ağırlıkta katılır. Bu sayfa hangisinin ne kadar taşıdığını ve nerede kaybettiğinizi gösterir.'),
    rangeSel()+`<button class="btn b-gh b-sm" onclick="exportPlats()">${T('⭳ Download CSV')}</button>`)+

      <div class="v">${live.length}<span style="font-size:14px;color:var(--mute2)">/${d.plats.length}</span></div>
      <div class="d">${T('skorun')} %${Math.round(wLive*100)}${T('’i ölçülüyor')}</div></div>
    <div class="kpi"><div class="t">${T('Planınızda açık')}</div>
      <div class="v">${covered}<span style="font-size:14px;color:var(--mute2)">/${d.plats.length}</span></div>
      <div class="d">${T('skorun')} %${Math.round(wCovered*100)} ${T('bölümüne erişiminiz var')}</div></div>
    <div class="kpi"><div class="t">${T('En çok kaybettiren')}</div>
      <div class="v" style="font-size:20px">${worst?esc(worst.n):'—'}</div>

    <div class="kpi"><div class="t">${T('Toplam kayıp')}</div>
      <div class="v">${totalLoss.toFixed(1)}</div>
      <div class="d">${T('100 üzerinden alınmayan puan')}</div></div>
  </div>

  <div class="card"><div class="ch"><div><h3>${T('Nerede kaybediyorsunuz')}</h3>
    <div class="sub">${T('Her çubuğun uzunluğu, o platformdaki eksiğin toplam skorunuza mal olduğu puandır. Ağır bir platformda orta bir skor, hafif bir platformdaki sıfırdan pahalıdır.')}</div></div></div>
    <div class="cb">${ranked.length?`<div class="plos">${ranked.map(p=>`
      <div class="pl-row">
        <span class="nm"><i style="background:${p.c}"></i>${esc(p.n)}</span>

        <span class="dt">${T('skor')} ${p.score.toFixed(1)} · ${T('ağırlık')} %${Math.round(p.w*100)}</span>
      </div>`).join('')}</div>`
      :`<div class="empty" style="padding:30px"><div class="ic">◔</div>${T('Ölçüm tamamlandığında burada platform karşılaştırması oluşur')}</div>`}</div></div>

  <div class="card"><div class="ch"><div><h3>${T('Visibility Trend')} ${kpiHelp('trend')}</h3>
    <div class="sub">${T('Günlük dalgalanma olağandır; kampanya etkisini dört haftalık eğimde okuyun.')}</div></div>
    <span class="rt">${T('Last')} ${S.range} ${T('days')}</span></div>

        : st==='locked'
          ? `<a href="#" class="upl" onclick="go('settings');setTimeout(()=>setTab('billing'),30);return false">${T('Planı Yükselt')} →</a>`
          : `<span class="mut">—</span>`}</td>
      <td class="n"><span class="wcell">%${Math.round(p.w*100)}</span></td>
      <td class="n">${on?p.mentions:'<span class="mut">—</span>'}</td>
      <td class="n">${on?p.cites:'<span class="mut">—</span>'}</td>
      <td class="n">${on?nf(p.checks):'<span class="mut">—</span>'}</td>
      <td class="n">${on
        ? `<span class="${p.trend>=0?'ok':'bad'}">${p.trend>=0?'▲':'▼'} ${Math.abs(p.trend).toFixed(1)}</span>`
        : '<span class="mut">—</span>'}</td></tr>`}).join('')}
  </tbody></table></div>
  ${d.plats.some(p=>state(p)!=='ok'&&!p.locked)?`
    <p class="mnote">${T('Ölçülmeyen platformlar skorunuzu düşürmez; hesaba hiç katılmazlar. Ama ağırlıkları da kullanılmadığı için skorunuz mecranın tamamını değil, ölçülen bölümünü temsil eder.')}</p>`:''}
  </div>`;
};
function exportPlats(){
  const rows=[['Platform','Skor','Ağırlık','Anılma','Kaynak','Toplam kontrol']];
  S.data.plats.filter(p=>!p.locked).forEach(p=>rows.push([p.n,p.score.toFixed(2),p.w,p.mentions,p.cites,p.checks]));

function buildCenter(d){
  const out=[];
  const P=S.perception;

  (d.opps||[])
    .filter(o=>o.cover<0.4)
    .sort((a,b)=>b.opp-a.opp)
    .slice(0,6)
    .forEach(o=>{
      const hic=o.cover===0;
      const ticari=o.p.intent==='transactional'||o.p.intent==='comparison';
      out.push({
        sev: hic&&ticari ? 'high' : hic ? 'mid' : 'low',
        icon:'◎', kind:T('Fırsat'),
        title:`“${esc(o.p.text)}” ${hic?T('sorgusunda hiç geçmiyorsunuz'):T('sorgusunda zayıfsınız')}`,
        body:`${T('Fırsat skoru')} ${o.opp} · ${T('aylık hacim')} ${nf(o.p.vol)} · ${
          T('görünürlük')} ${hic?T('yok'):`%${(o.cover*100).toFixed(0)}`}. ${
          T('Önerilen aksiyon')}: ${esc(T(o.act))}.`,
        actions:[{label:`✦ ${T('İçerik üret')}`,pri:1,go:`writerFor('${o.p.id}')`},
                 {label:`${T('Fırsatları gör')} →`,go:"go('opps')"}],
      });
    });

  if(P && P.overall && P.overall.mentions>=8){
    const neg=P.overall.neg/P.overall.mentions*100;
    if(neg>=15) out.push({
      sev: neg>=30?'high':'mid', icon:'◍', kind:T('Algı'),
      title:`${T('Cevapların')} %${neg.toFixed(0)}${T('inde olumsuz anılıyorsunuz')}`,
      body:`${P.overall.neg}/${P.overall.mentions} ${T('anılmada olumsuz ton ölçüldü. Hangi ifadelerin kullanıldığını örnek geçişlerde görün.')}`,
      actions:[{label:`${T('Algıyı incele')} →`,pri:1,go:"go('perception')"}],
    });
    const kotu=(P.attributes||[]).filter(a=>a.polarity<=-0.25).slice(0,3);
    if(kotu.length) out.push({
      sev:'mid', icon:'◍', kind:T('Algı'),
      title:`${T('Olumsuz sıfatlar')}: ${kotu.map(a=>esc(a.label)).join(', ')}`,
      body:T('Yapay zeka markanızı bu ifadelerle tanımlıyor. Bunlar cevaptan cevaba taşınır; kaynaklarda düzeltilmedikçe kendiliğinden değişmez.'),
      actions:[{label:`${T('Sıfatları gör')} →`,pri:1,go:"go('perception')"},
               {label:`${T('Kaynaklar')} →`,go:"go('sources')"}],
    });
  }

  const acik=(d.sources||[]).filter(s=>!s.mine&&srcKind(s.kind).reachable&&srcKind(s.kind).rank<=2);
  acik.slice(0,3).forEach(s=>{
    const k=srcKind(s.kind);
    out.push({
      sev:'high', icon:'⚭', kind:T('Kaynak'),
      title:`${T('Kayda açık bir kaynak var')} — ${T(k.label)}`,
      body:`${T('Kaynaklar ekranında')} ${s.v} ${T('atıf alan ve dışarıya açık bir kaynak listeleniyor. Hangi kaynak olduğunu ve giriş koşulunu orada görürsünüz.')}`,
      actions:[{label:`${T('Kaynakları gör')} →`,pri:1,go:"go('sources')"},
               {label:`${T('Aksiyon planı')} →`,go:"go('plan')"}],
    });
  });

  const kapali=(d.sources||[]).filter(s=>!s.mine&&!srcKind(s.kind).reachable&&s.kind!=='unknown');
  if(kapali.length>=3){
    const toplam=kapali.reduce((a,s)=>a+s.v,0);
    out.push({
      sev:'mid', icon:'⛔', kind:T('Kaynak'),
      title:`${kapali.length} ${T('kaynak rakiplerinize atıf sağlıyor, size değil')}`,
      body:`${toplam} ${T('atıf bu kaynaklardan geliyor ve hiçbirine profil açamazsınız — içerik onların kendi pazarlaması. Dolaylı yol izlenmeli.')}`,
      actions:[{label:`${T('Aksiyon planı')} →`,pri:1,go:"go('plan')"}],
    });
  }

  const fails=(d.audit||[]).flatMap(c=>c.facs.filter(f=>f.st==='fail').map(f=>({...f,cat:c.n})));
  if(fails.length) out.push({
    sev: fails.length>=10?'high':'mid', icon:'◳', kind:T('Denetim'),
    title:`${fails.length} ${T('teknik kriter karşılanmıyor')}`,
    body:`${T('En kritikleri')}: ${fails.slice(0,3).map(f=>esc(T(f.n))).join(', ')}. ${
      T('Bu eksikler yapay zekanın sitenizi okumasını ve kaynak göstermesini doğrudan engelliyor.')}`,
    actions:[{label:`${T('Denetimi aç')} →`,pri:1,go:"go('audit')"},
             {label:`${T('Araçlar')} →`,go:"go('tools')"}],
  });

  const olcusuz=(d.plats||[]).filter(p=>!p.locked&&(p.measured===false||!p.checks));
  if(olcusuz.length>=2) out.push({
    sev:'low', icon:'◔', kind:T('Platform'),
    title:`${olcusuz.length} ${T('platform ölçülmüyor')}`,
    body:`${olcusuz.map(p=>esc(p.n)).join(', ')} ${T('için ölçüm yapılamıyor. Skorunuz mecranın tamamını değil, ölçülen bölümünü temsil ediyor.')}`,
    actions:[{label:`${T('Platformları gör')} →`,pri:1,go:"go('platforms')"}],
  });

  const rank={high:0,mid:1,low:2};
  return out.sort((a,b)=>rank[a.sev]-rank[b.sev]);
}

async function loadPerception(){
  if(S.percBusy) return;
  S.percBusy=true;
  try{
    S.perception=await api.get(`/api/perception?workspace=${S.workspaceId}&days=${S.range}`);
  }catch(e){ S.perception={error:e.message}; }
  finally{ S.percBusy=false; if(S.route==='perception') render(); }
}

function stackedTone(days){
  if(!days || !days.length) return `<div class="empty" style="padding:30px 12px">
    <div class="ic">◜</div>${T('Ölçüm biriktikçe eğri oluşur')}</div>`;
  const W=680,H=190,PL=34,PR=10,PT=10,PB=26;
  const bw=(W-PL-PR)/days.length;
  const cols=days.map((d,i)=>{
    const t=d.pos+d.neu+d.neg;
    const x=PL+i*bw+bw*0.14, w=bw*0.72;
    if(!t) return '';
    const h=H-PT-PB;
    const hp=d.pos/t*h, hn=d.neu/t*h, hg=d.neg/t*h;
    let y=PT;
    const seg=[];
    if(hp>0){ seg.push(`<rect x="${x.toFixed(1)}" y="${y.toFixed(1)}" width="${w.toFixed(1)}" height="${hp.toFixed(1)}" fill="var(--ok)" rx="1"/>`); y+=hp; }
    if(hn>0){ seg.push(`<rect x="${x.toFixed(1)}" y="${y.toFixed(1)}" width="${w.toFixed(1)}" height="${hn.toFixed(1)}" fill="var(--mute)" rx="1"/>`); y+=hn; }
    if(hg>0){ seg.push(`<rect x="${x.toFixed(1)}" y="${y.toFixed(1)}" width="${w.toFixed(1)}" height="${hg.toFixed(1)}" fill="var(--bad)" rx="1"/>`); }
    return seg.join('');
  }).join('');
  const lab=[0,50,100].map(v=>{
    const y=PT+(1-v/100)*(H-PT-PB);
    return `<line x1="${PL}" x2="${W-PR}" y1="${y.toFixed(1)}" y2="${y.toFixed(1)}"
      stroke="currentColor" stroke-opacity=".1"/>
      <text x="${PL-6}" y="${(y+3.5).toFixed(1)}" text-anchor="end" font-size="9.5"
        fill="currentColor" fill-opacity=".45">${v}%</text>`;
  }).join('');
  const first=days[0].day, last=days[days.length-1].day;
  const fmt=d=>new Date(d).toLocaleDateString('tr-TR',{day:'2-digit',month:'2-digit'});
  return `<svg viewBox="0 0 ${W} ${H}" style="width:100%;height:200px;display:block" role="img"
    aria-label="${esc(T('Ton dağılımı'))}">${lab}${cols}
    <text x="${PL}" y="${H-7}" font-size="9.5" fill="currentColor" fill-opacity=".45">${fmt(first)}</text>
    <text x="${W-PR}" y="${H-7}" text-anchor="end" font-size="9.5"
      fill="currentColor" fill-opacity=".45">${fmt(last)}</text></svg>
  <div class="tlegend">
    <span><i style="background:var(--ok)"></i>${T('Olumlu')}</span>
    <span><i style="background:var(--mute)"></i>${T('Nötr')}</span>
    <span><i style="background:var(--bad)"></i>${T('Olumsuz')}</span></div>`;
}

VIEWS.sources=()=>{
  const d=S.data;
  const sub=T('Yapay zeka bu kategoride hangi siteleri okuyor — ve siz o listenin neresindesiniz.');

  if(!d.sources.length){
    return head(T('Sources'),sub)+
      `<div class="card"><div class="empty"><div class="ic">⊕</div>
        <b style="color:var(--fg);font-size:14px">${T('No citations collected yet')}</b>
        <p style="margin-top:8px;max-width:52ch;margin-inline:auto">${T(`Sources appear once a scan finishes and the platforms cite pages in their answers. If a scan has run and this is still empty, no platform cited any source.`)}</p></div></div>`;
  }

  const mx=d.sources[0].v||1;
  const total=d.sources.reduce((a,x)=>a+x.v,0);
  const mine=d.sources.find(x=>x.mine);
  const myRank=mine?d.sources.indexOf(mine)+1:null;
  const myShare=mine&&total?mine.v/total*100:0;
  const ahead=d.sources.filter(x=>!x.mine&&(!mine||x.v>mine.v));

  const dl=x=>{
    if(x.delta===null) return `<span class="sdelta new">${T('yeni')}</span>`;
    const v=x.delta*100;
    if(Math.abs(v)<5) return `<span class="sdelta flat">—</span>`;
    return `<span class="sdelta ${v>0?'up':'dn'}">${v>0?'▲':'▼'} %${Math.abs(v).toFixed(0)}</span>`;
  };

  return head(T('Sources'),sub,
    rangeSel()+`<button class="btn b-gh b-sm" onclick="exportSources()">${T('⭳ Download CSV')}</button>`)+
  `<div class="g4">
    <div class="kpi"><div class="t">${T('Siteniz kaçıncı')}</div>
      <div class="v">${myRank?`${myRank}.`:'—'}</div>
      <div class="d">${myRank?`${d.sources.length} ${T('kaynak içinde')}`:T('listede yok')}</div></div>
    <div class="kpi"><div class="t">${T('Atıf payınız')}</div>
      <div class="v">${myShare.toFixed(1)}<span style="font-size:14px;color:var(--mute2)">%</span></div>
      <div class="d">${mine?`${mine.v}/${total} ${T('atıf')}`:T('henüz atıf yok')}</div></div>
    <div class="kpi"><div class="t">${T('Önünüzdeki site')}</div>
      <div class="v">${ahead.length}</div>
      <div class="d">${T('sizden çok atıf alıyor')}</div></div>
    <div class="kpi"><div class="t">${T('Takip edilen kaynak')}</div>
      <div class="v">${d.sources.length}</div>
      <div class="d">${T('son')} ${S.range} ${T('gün')}</div></div>
  </div>

  ${!mine?`<div class="srcwarn">
      <b>${T('Siteniz bu listede yok')}</b>
      <span>${T('Yapay zeka bu kategoride yukarıdaki sitelere dayanıyor ve sizinkine hiç başvurmuyor. Kaynak olmak anılmaktan daha kalıcıdır: bir kez listeye girmek, tek tek sorgularda görünmeye çalışmaktan uzun ömürlüdür.')}</span>
      <button onclick="go('plan')">${T('Aksiyon planı')} →</button></div>`
   :ahead.length?`<div class="srcwarn ok">
      <b>${ahead.length} ${T('site sizden önde')}</b>
      <span>${T('Bu sitelerde yer almak — listelenmek, yorumlanmak, örnek olay olarak geçmek — yapay zekanın sizi öğrendiği yolu doğrudan genişletir.')}</span>
      <button onclick="go('plan')">${T('Aksiyon planı')} →</button></div>`:''}

  <div class="card">
    <div class="ch"><div><h3>${T('Kaynak sıralaması')}</h3>
      <div class="sub">${T('Atıf sayısı, hangi platformların kullandığı ve dönem içindeki değişim')}</div></div>
      <span class="rt">${(()=>{const unk=d.sources.filter(x=>!x.mine&&x.kind==='unknown');
        return unk.length?`<button class="btn b-gh b-sm" onclick="resolveSources()" ${S.srcBusy?'disabled':''}
          title="${esc(T('Türü belirlenemeyen kaynakları arka planda çöz'))}">${
          S.srcBusy?T('Çözülüyor…'):`${T('Otomatik çöz')} (${unk.length})`}</button>`:'';})()}
        ${T('Son')} ${S.range} ${T('gün')}</span></div>
    <div class="tw"><table class="stbl"><thead><tr>
      <th class="n">#</th><th>${T('Alan adı')}</th><th>${T('Tür')}</th>
      <th style="width:22%">${T('Atıf')}</th>
      <th class="n">${T('Sayı')}</th><th class="n">${T('Değişim')}</th>
      <th>${T('Yapılacak')}</th><th class="n">${T('İlk görülme')}</th></tr></thead>
    <tbody>${d.sources.slice().sort((a,b)=>
        (a.mine?-1:0)-(b.mine?-1:0) ||
        (srcKind(a.kind).rank - srcKind(b.kind).rank) || (b.v - a.v))
      .map((x,i)=>{const k=srcKind(x.kind);return `<tr class="${x.mine?'me':''} ${k.reachable?'':'blocked'}">
      <td class="n rk">${i+1}</td>
      <td><span class="dn"><span class="fav ${x.mine?'me':''}">${ini(x.d)}</span>
        <b>${esc(x.d)}</b>${x.mine?`<span class="tagme">${T('siteniz')}</span>`:''}</span></td>
      <td><span class="kchip ${x.kind}" title="${esc(x.kindNote||'')}">${T(k.label)}</span></td>
      <td><span class="sbar"><i style="width:${x.v/mx*100}%"></i></span></td>
      <td class="n cnt">${x.v}</td>
      <td class="n">${dl(x)}</td>
      <td>${x.mine?`<span class="mut">—</span>`
        : x.kind==='unknown'
          ? `<button class="marklink" onclick="markSource('${esc(x.d)}')">${T('türünü işaretleyin')} →</button>`
        : k.reachable?`<span class="todo">${T(k.short)}</span><i class="eta">${T(k.eta)}</i>`
        : `<span class="noent">⛔ ${T(k.short)}</span>`}</td>
      <td class="n mut">${x.first?new Date(x.first).toLocaleDateString('tr-TR'):'—'}</td></tr>`}).join('')}
    </tbody></table></div>
    <p class="mnote">${T('Modeller sizi çoğunlukla kendi sitenizden değil, üçüncü taraf kaynaklardan öğrenir. Bu yüzden listenin üstündeki alan adlarında bulunmamak, kendi sitenizdeki bir eksikten daha pahalıdır.')}</p>
  </div>`;
};
let srcResolveBusy = false;
async function resolveSources(){
  if(srcResolveBusy) return;
  srcResolveBusy = true; S.srcBusy = true; render();
  try{
    const r = await api.post('/api/sources/classify',{workspaceId:S.workspaceId});

function attributePanel(){
  const A=S.attributes;
  if(!A) return `<div class="empty" style="padding:30px"><div class="ic">◈</div>
    <b style="color:var(--fg);font-size:14px">${T('Reading answers…')}</b></div>`;
  if(A.error) return `<div class="empty" style="padding:30px"><div class="ic">⚠</div>
    <p>${esc(A.error)}</p></div>`;

  const c=A.coverage||{};
  if(!c.available) return `<div class="empty" style="padding:30px"><div class="ic">◈</div>
    <b style="color:var(--fg);font-size:14px">${T('Attribute analysis is not available yet')}</b>
    <p style="margin-top:8px;max-width:48ch;margin-inline:auto">${T('This feature reads the answers already collected and reports which qualities each brand is associated with. It will appear here once enabled for your account.')}</p>
    ${S.isAdmin?`<div style="margin-top:14px;font-size:11px;color:var(--mute2)">
      ${T('Operator')} · ${T('no provider key configured for the extraction pass')}</div>`:''}</div>`;

  const rows=(A.matrix||[]).slice(0,14);
  if(!rows.length){
    const pct=c.total?Math.round(c.done/c.total*100):0;
    return `<div class="empty" style="padding:30px"><div class="ic">◈</div>
      <b style="color:var(--fg);font-size:14px">${T('Reading your answers')}</b>
      <p style="margin-top:8px;max-width:48ch;margin-inline:auto">
        ${T('An attribute has to appear at least twice before it means anything. Keep this page open while the pass runs.')}</p>
      <div style="max-width:280px;margin:14px auto 0">
        <div class="bar"><i style="width:${pct}%;background:var(--pri)"></i></div>
        <div style="font-size:11px;color:var(--mute2);margin-top:6px">
          ${c.done} / ${c.total} ${T('answers read')}</div></div></div>`;
  }

  const brands=[{id:'self',n:S.brand.name,you:true},
                ...S.rivals.map(r=>({id:r.id,n:r.n,you:false}))];

  const cell=(a,b)=>{
    const v=a.brands[b.id];
    if(!v) return `<td class="n" style="color:var(--mute2)">—</td>`;
    const col=v.polarity>0.3?'var(--ok)':v.polarity<-0.3?'var(--bad)':'var(--fg2)';
    const sign=v.polarity>0.3?'+':v.polarity<-0.3?'−':'·';
    return `<td class="n"><b class="mono" style="color:${col}">${v.n}</b>
      <span style="color:var(--mute2);font-size:11px"> ${sign}</span></td>`;
  };

  return `
  <p style="font-size:12px;color:var(--mute);margin-bottom:12px">
    ${T('Ordered by the widest gap. A quality a rival owns and you do not is a positioning gap, not a technical one.')}
    ${c.done<c.total?`<span class="chip" style="margin-left:6px">${c.done}/${c.total} ${T('answers read')}</span>`:''}</p>
  <div class="tw"><table>
    <thead><tr><th>${T('Quality')}</th>
      ${brands.map(b=>`<th class="n"${b.you?' style="color:var(--pri)"':''}>${esc(b.n)}</th>`).join('')}
      <th class="n">${T('Gap')}</th></tr></thead>
    <tbody>${rows.map(a=>`
      <tr><td>${esc(a.label)}</td>
        ${brands.map(b=>cell(a,b)).join('')}
        <td class="n">${a.gap>0
          ? `<span class="chip bad">−${a.gap}</span>`
          : a.gap<0 ? `<span class="chip ok">+${-a.gap}</span>`
          : `<span class="chip">0</span>`}</td></tr>`).join('')}
    </tbody></table></div>
  <p style="font-size:11px;color:var(--mute2);margin-top:10px">
    ${T('Numbers are how many answers attached that quality to that brand. + and − show whether it was said favourably.')}</p>`;
}

function changesPanel(){
  const c=S.changes;
  if(!c || c.error || !c.digest) return '';
  const d=c.digest;
  const urgent=d.urgent||[], wins=d.wins||[];
  if(!urgent.length && !wins.length) return '';

  const open=S.changesOpen!==false;
  const icon=k=>({score_drop:'▼',rank_loss:'▼',lost_mention:'✕',rival_overtake:'⚑',
                  rival_surge:'▲',citation_lost:'✕',score_rise:'▲',rank_gain:'▲',
                  new_mention:'✓',citation_gained:'✓'})[k]||'·';

  const line=(e,bad)=>`
    <div style="display:flex;gap:10px;align-items:flex-start;padding:9px 0;border-bottom:1px solid var(--border)">
      <span style="color:${bad?'var(--bad)':'var(--ok)'};font-size:12px;line-height:1.5;flex:none">${icon(e.kind)}</span>
      <div style="flex:1;min-width:0">
        <div style="font-size:13px">${esc(e.detail)}</div>
        ${e.promptText?`<div style="font-size:11px;color:var(--mute2);margin-top:2px">“${esc(e.promptText)}”</div>`:''}
      </div>
      ${e.promptId?`<button class="btn b-gh b-sm" style="flex:none"
         onclick="go('mentions')">${T('Inspect')}</button>`:''}
    </div>`;

  return `
  <div class="card" style="margin-bottom:14px;${urgent.length?'border-color:rgba(239,68,68,.28)':''}">
    <div class="cb">
      <div style="display:flex;align-items:center;gap:11px;flex-wrap:wrap;cursor:pointer"
           onclick="S.changesOpen=${open?'false':'true'};render()">
        <b style="font-size:14px">${urgent.length?'⚠ ':''}${T('What changed since the last scan')}</b>
        ${urgent.length?`<span class="chip bad">${urgent.length} ${T('need attention')}</span>`:''}
        ${wins.length?`<span class="chip ok">${wins.length} ${T('improvements')}</span>`:''}
        <span style="margin-left:auto;color:var(--mute2);font-size:12px">${open?'▴':'▾'}</span>
      </div>
      ${open?`
        <div style="margin-top:8px">
          ${urgent.map(e=>line(e,true)).join('')}
          ${wins.map(e=>line(e,false)).join('')}
        </div>
        ${(d.contentTargets||[]).length?`
          <div style="margin-top:14px;padding:13px 15px;background:var(--muted);border-radius:var(--r);
                      border:1px solid var(--border)">
            <b style="font-size:13px">${T('Where to spend this month')}</b>
            <p style="font-size:12px;color:var(--mute);margin:4px 0 9px">
              ${T('Highest volume, lowest coverage — content here moves the score most.')}</p>
            ${d.contentTargets.map(t=>`
              <div style="display:flex;gap:10px;align-items:center;padding:6px 0;font-size:12px">
                <span style="flex:1;min-width:0">“${esc(t.text)}”</span>
                <span class="chip">%${Math.round(t.coverage*100)} ${T('coverage')}</span>
                <button class="btn b-gh b-sm" onclick="writeFor('${esc(t.text).replace(/'/g,"\\'")}')">
                  ${T('Write content')}</button>
              </div>`).join('')}
          </div>`:''}
        <p style="font-size:11px;color:var(--mute2);margin-top:12px">
          ${T('A weekly summary of this goes to your inbox. Turn it off in Settings → Profile.')}</p>
      `:''}
    </div></div>`;
}

async function togglePrompt(id){
  const p=S.prompts.find(x=>x.id===id); if(!p) return;
  const next=!p.active; p.active=next; render();
  try{ await api.patch('/api/prompts',{id,active:next}); }
  catch(e){ p.active=!next; render(); toast(e.message); }
}
async function delPrompt(id){
  try{ await api.del(`/api/prompts?id=${encodeURIComponent(id)}`); await loadResults(); toast(T('Prompt deleted')); }
  catch(e){ toast(e.message); }
}
let regenBusy=false;
async function regen(){
  if(regenBusy) return;
  regenBusy=true;
  const btn=document.querySelector('button[onclick="regen()"]');
  const label=btn?btn.textContent:null;
  if(btn){ btn.disabled=true; btn.textContent=T('Üretiliyor…'); }
  try{
    const r=await api.post('/api/prompts/generate',{workspaceId:S.workspaceId});
    const added=await api.post('/api/prompts',{workspaceId:S.workspaceId,
      prompts:r.prompts.map(p=>({text:p.text,intent:p.intent,volume:p.volume,source:'ai'}))});
    await loadResults();
    toast(added.added
      ? `${added.added} ${T('yeni sorgu eklendi')}${r.source==='template'?` (${T('şablonlardan')})`:''}`
      : T('Yeni sorgu yok — öneriler zaten listenizde'));
  }catch(e){ toast(e.message,'error'); }
  finally{
    regenBusy=false;
    if(btn){ btn.disabled=false; if(label) btn.textContent=label; }
  }
}

    ${A.map((a,i)=>{
      const f = faz(i);

async function runAudit(){
  const btn=$('#auditBtn'); const url=$('#auditUrl')?$('#auditUrl').value.trim():'';
  if(btn){btn.disabled=true;btn.textContent=T('Crawling…');}
  try{
    const r=await api.post('/api/audit',{workspaceId:S.workspaceId,url:url||undefined});
    await loadResults();
    toast(`${T('Denetim tamamlandı')} — ${r.score.toFixed(0)}/100 · ${T('bu ay kalan hak')}: ${r.remaining}`);

function fixModal(key){
  const k=decodeURIComponent(key);
  let fix=null, detail='';
  (S.data.audit||[]).forEach(c=>c.facs.forEach(f=>{ if(f.n===k){fix=f.fix;detail=f.detail||'';} }));
  openModal(k, fix
    ? `<p style="font-size:13px;color:var(--mute);margin-bottom:12px">${esc(detail)}</p>
       <pre id="fixc">${esc(fix)}</pre>
       <div style="display:flex;gap:9px;margin-top:14px">
         <button class="btn b-pri b-sm" onclick="copy('fixc')">${T('Copy')}</button>
         <button class="btn b-gh b-sm" onclick="dl('fix.txt',document.getElementById('fixc').textContent)">${T('Download')}</button>
       </div>`
    : `<p style="font-size:13px;color:var(--mute)">${esc(detail||'No automated fix for this factor.')}</p>`);
}

function exportAudit(){
  const rows=[['Category','Factor','Status']];
  S.data.audit.forEach(c=>c.facs.forEach(f=>rows.push([c.n,f.n,f.st])));
  dl('yanki-audit.csv',csv(rows),'text/csv;charset=utf-8');
}

function toolOutput(){
  const b=S.brand;
  if(tool==='robots')return `# robots.txt — ${b.name}\n# generated by YANKI\n\nUser-agent: *\nAllow: /\nDisallow: /admin/\n\n# ---- AI crawlers ----\n`+
    ['GPTBot','OAI-SearchBot','ChatGPT-User','PerplexityBot','Perplexity-User','ClaudeBot','Claude-User','Claude-SearchBot','Google-Extended','Applebot-Extended','meta-externalagent','Amazonbot','cohere-ai']

  if(tool==='llms')return `# ${b.name}\n\n> ${b.desc||b.name+' is a brand operating in '+sectorTerm(b.sector)+'.'}\n\n## Brand facts\n- Industry: ${b.sector}\n- Location: ${b.city?b.city+', ':''}${b.country}\n`+

  if(tool==='schema')return '<script type="application/ld+json">\n'+schemaOrg()+'\n<\/script>\n\n<script type="application/ld+json">\n'+

     "@type":"Question",name:p.text.replace(/"/g,''),acceptedAnswer:{"@type":"Answer",
     text:`${b.name} is ... in ${sectorTerm(b.sector)}. (40-60 word direct answer.)`}}))},null,2)+'\n<\/script>';
  const place=b.city?`${b.city}, ${b.country}`:b.country;

}

  const type=document.querySelector('#ctype button.on')?.dataset.t||'blog';
  const b=S.brand,sec=sectorTerm(b.sector);

    .map(q=>`## ${q}\n\n${b.name} … in ${sec}. (40–60 word direct answer.) This section should include at least one numeric data point and one source link.\n`).join('\n');
  }else if(type==='cmp'){
