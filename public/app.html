    `| Price | … | … | … |\n| Local support | … | … | … |\n| Setup time | … | … | … |\n| Integrations | … | … | … |\n\n`+
    `## Which one, and when?\n\n…\n\n## Verdict\n\n${b.name} stands out in the ${b.city||b.country} market thanks to … .\n`;
  }else if(type==='how'){
    md=`# ${TITLE} — Step-by-Step Guide\n\n${TITLE} is the process to follow for … in ${sec}. The steps below take about … to complete.\n\n`+
    [1,2,3,4,5].map(i=>`## Step ${i}: …\n\n… (clear, actionable instruction)\n`).join('\n')+
    `\n## Common mistakes\n\n- …\n- …\n\n## Summary\n\n…\n`;
  }else{
    md=`# ${TITLE}\n\n${TITLE} is a frequently asked topic in ${sec} in the ${b.city||b.country} market. This article covers everything from the definition to the selection criteria, with data.\n\n`+
    `## What is ${TITLE}?\n\n… (40–60 word direct answer in the first paragraph — this is the part models quote.)\n\n`+
    `## How does it work?\n\n…\n\n## Selection criteria\n\n| Criterion | Why it matters | How to measure |\n|---|---|---|\n| … | … | … |\n\n`+
    `## The ${b.name} approach\n\n${b.desc||'…'}\n\n## FAQ\n\n**How long does ${TITLE} take?**\n…\n\n**What does it cost?**\n…\n\n`+
    `---\n*Published: ${new Date().toLocaleDateString('en-GB')} · Author: ${b.name} editorial team*\n`;
  }
  const check=[[T('Direct answer in first paragraph'),'ok'],[T('Headings in question form'),type==='faq'?'ok':'warn'],
    [T('Comparison table'),type==='cmp'||type==='blog'?'ok':'warn'],[T('Date and author info'),'ok'],
    [T('FAQPage schema suggested'),'ok'],[T('Add numeric data'),'warn']];
  $('#wOut').innerHTML=`<div style="display:flex;align-items:center;gap:10px;margin-bottom:12px">
    <b style="font-size:14px">${T('Draft ready')}</b><span class="chip pri">${{blog:T('Blog'),faq:T('FAQ'),cmp:T('Comparison'),how:T('How-To')}[type]}</span>
    <span style="margin-left:auto;display:flex;gap:8px">
      <button class="btn b-gh b-sm" onclick="copy('wmd')">${T('Copy')}</button>

   <pre id="wmd" style="max-height:340px;overflow:auto">${esc(md)}</pre>

     <div style="display:flex;gap:7px;flex-wrap:wrap;margin-top:9px">
       ${check.map(c=>`<span class="chip ${c[1]}">${c[1]==='ok'?'✓':'!'} ${c[0]}</span>`).join('')}</div></div>`;
  toast('Content draft generated');
}

              <p style="font-size:12px;color:var(--mute);margin-top:3px">${T(`Finds pages that rank on Google but never appear in AI answers.`)}</p></div>
            <span class="chip">Coming soon</span></div></div>

        <div>

          [`25 ${T('müşteri markası')}`,`150 ${T('sorgu / marka')}`,`50 ${T('rakip')}`,`200 ${T('GEO denetimi/ay')}`,T('Beyaz etiket')]]

  return head(T('Settings'),T('Configure core tracking preferences such as brand name, domain, industry and location.'))+
  `<div class="tabs">${tabs.map(t=>`<button class="${setTabV===t[0]?'on':''}" onclick="setTab('${t[0]}')">${t[1]}</button>`).join('')}</div>
   <div>${body}</div>`;
};
function suggestedVariants(){
  const name=(S.brand.name||'').trim();
  if(!name) return [];
  const out=new Set();
  const words=name.split(/\s+/).filter(Boolean);
  const GENERIC=new Set(['türkiye','turkiye','global','group','grup','holding','a.ş.','as','ltd',
    'şirketi','sirketi','company','co','inc','international','turkey']);
  if(words.length>1){
    const head=words[0];
    if(head.length>=3 && words.slice(1).every(w=>GENERIC.has(w.toLocaleLowerCase('tr')))) out.add(head);
    else if(head.length>=4) out.add(head);
    if(words.length>=3) out.add(words.map(w=>w[0]).join('').toLocaleUpperCase('tr'));
  }
  return [...out].filter(v=>v.length>=3 && !S.variants.includes(v));
}

function addVar2(){const v=$('#vv').value.trim();if(!v)return;
  if(!S.variants.includes(v))S.variants.push(v);
  render();
  toast(T('Variant added — press Save to apply'));}
async function loadEngines(probe){
  const box=$('#engBox'); if(!box) return;
  if(probe) box.innerHTML=`<div class="empty"><div class="ic">◉</div>${T('Testing every provider…')}</div>`;
  let d;
  try{ d=await api.get('/api/engines'+(probe?'?test=1':'')); }
  catch(e){ box.innerHTML=`<div class="empty">${esc(e.message)}</div>`; return; }

  const badge=e=>{
    if(!e.configured) return '<span class="chip">No key</span>';
    if(!e.planOk) return `<span class="chip warn">${T('Above your plan')}</span>`;
    if(!e.test)   return '<span class="chip ok">Key present</span>';
    return e.test.ok
      ? `<span class="chip ok">Working${e.test.latencyMs?' · '+e.test.latencyMs+'ms':''}</span>`
      : '<span class="chip bad">Failing</span>';
  };

  box.innerHTML = `
   <div style="display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:14px">
     <div><h4 style="font-size:14px">${T('AI providers')}</h4>
       <p style="font-size:12px;color:var(--mute);margin-top:3px">
         Each key is set as an environment variable on the server. A platform with no key is skipped silently —
         it never produces a zero that looks like bad visibility.</p></div>
     <button class="btn b-gh b-sm" style="margin-left:auto" onclick="loadEngines(true)">${T('Test all keys')}</button>
   </div>
   ${d.mock?`<div class="banner" style="margin-bottom:14px"><span>⚠</span>
     <span>MOCK_ENGINES is on. Answers are synthetic — set it to 0 and add real keys before launch.</span></div>`:''}
   ${!d.ready?`<div class="banner" style="margin-bottom:14px;border-color:rgba(239,68,68,.3);background:rgba(239,68,68,.07)">
     <span>🔑</span><span>${T(`No usable provider yet. Scans cannot run until at least one key is configured.`)}</span></div>`:''}
   ${d.engines.map(e=>`
     <div class="card" style="margin-bottom:10px"><div class="cb"
        style="display:flex;align-items:center;gap:14px;flex-wrap:wrap">
       <div style="flex:1;min-width:220px">
         <b style="font-size:14px">${esc(e.label)}</b>
         <p style="font-size:12px;color:var(--mute);margin-top:3px">
           ${e.envKey?`<code>${esc(e.envKey)}</code>`:''}
           ${e.model?` · model <code>${esc(e.model)}</code>`:''}
           · weight ${e.weight.toFixed(2)}
           · ${e.method==='official_api'?'official API':'licensed SERP provider'}</p>
         ${e.test&&!e.test.ok?`<p style="font-size:12px;color:var(--bad);margin-top:6px">${esc(e.test.detail)}</p>`:''}
       </div>
       ${badge(e)}
     </div></div>`).join('')}
   <p style="font-size:12px;color:var(--mute);margin-top:12px">
     Model names are configuration, not code. If a provider retires a model, set the matching
     <code>*_MODEL</code> variable rather than waiting for a release.</p>`;
  localise(box);
}

async function saveNotify(){
  const weekly=$('#nWeekly').checked, alerts=$('#nAlerts').checked;
  try{
    const r=await api.post('/api/notify',{weekly,alerts});
    S.notify={weekly:r.weekly,alerts:r.alerts,mailerConfigured:r.mailerConfigured};
    toast(T('Notification preferences saved'));
  }catch(e){ toast(e.message,'error'); }
}

async function changePassword(){
  const cur=$('#pwCur').value, next=$('#pwNew').value;
  if(!cur||!next) return toast(T('Fill in both fields'),'error');
  try{
    await api.post('/api/auth/password',{current:cur,next});
    $('#pwCur').value=''; $('#pwNew').value='';
    toast('Password updated — other devices were signed out');
  }catch(e){ toast(e.message); }
}

async function saveBrand(){
  const body={
    brandName:S.brand.name, domain:S.brand.site, sector:S.brand.sector,
    country:S.brand.country, city:S.brand.city||null,
    aliases:S.variants};
  const send=async()=>{
    await api.patch(`/api/workspaces/${S.workspaceId}`,body);
    await loadResults();
    toast(T('Brand settings saved'));
  };
  try{ await send(); }
  catch(e){
    if(e.status===409){
      if(confirm(e.message+'\n\n'+T('Continue anyway?'))){
        body.confirmRebrand=true;
        try{ await send(); }catch(e2){ toast(e2.message,'error'); }
      }else{
        await loadResults(); render();
      }
      return;
    }
    toast(e.message,'error');
  }
}

async function setPlan(p){
  if(p==='agency'){ toast(T('Agency plan is handled by our sales team')); return; }
  try{
    await api.post('/api/org/plan',{plan:p});
    await loadResults();
    toast(T('Plan updated — locked platforms are now included in the next scan'));
  }catch(e){ toast(e.message); }
}

async function rescan(){
  if(S.scanBusy || !S.workspaceId) return;
  S.scanBusy = true; render();
  try{
    const r = await api.post('/api/scan',{workspaceId:S.workspaceId, warm:false});
    if(r.jobs){
      await loadResults({silent:true});
      render();
      pollScan();          // clears S.scanBusy once real progress arrives
    }else{
      S.scanBusy = false; render();
      toast(r.reason ? `${T('Nothing to scan')}: ${r.reason}` : T('Nothing to scan'), 'error');
    }
  }catch(e){
    S.scanBusy = false; render();
    toast(e.message, 'error');
  }
}

function relTime(iso){
  const d=(Date.now()-new Date(iso))/1000;
  if(!isFinite(d)) return '';
  if(d<90)      return T('just now');
  if(d<3600)    return Math.round(d/60)+' '+T('min ago');
  if(d<86400)   return Math.round(d/3600)+' '+T('h ago');
  return Math.round(d/86400)+' '+T('d ago');
}

function toggleWsMenu(){ S.wsMenu = !S.wsMenu; render(); }
async function switchWs(id){
  if(id===S.workspaceId){ S.wsMenu=false; render(); return; }
  S.wsMenu=false; S.workspaceId=id; S.data=null; render();
  try{ await loadResults(); }
  catch(e){ S.loadError=e.message; }
  render();
}

  if(S.workspaces.length>=cap){
    toast(`${T('Your plan covers')} ${cap} ${cap>1?T('brands'):T('brand')}. ${T('Upgrade to add another.')}`,'error');
    go('settings'); setTimeout(()=>setTab('billing'),30); return;
  }
  location.href='/uygulama?new=1';
}

function trialDaysLeft(){
  const t=S.org&&S.org.trialEndsAt; if(!t) return null;
  return Math.max(0, Math.ceil((new Date(t)-Date.now())/86400000));
}

async function signOut(){

     <div style="text-align:center">${gauge(d.total,lvl[1])}

         ${S.data.plats.map(p=>{const al=!p.locked;
           const hit=al&&p.mentions>0;
           return `<span style="width:40px;height:40px;border-radius:12px;display:grid;place-items:center;font-size:14px;
             background:${al?p.c+'22':'var(--card2)'};border:1px solid ${al?p.c+'55':'var(--border)'};position:relative;opacity:${al?1:.45}">
             ${p.ab}<i style="position:absolute;right:-2px;top:-2px;width:9px;height:9px;border-radius:99px;
             background:${!al?'var(--mute2)':hit?'#15803D':'var(--mute)'}"></i></span>`}).join('')}</div>
       <div style="display:flex;gap:14px;font-size:11px;color:var(--mute);flex-wrap:wrap">
         <span>🟢 Visible</span><span>${T("⚪ Not visible")}</span><span>🔒 Locked</span></div>
       <b style="font-size:13px;display:block;margin-top:18px">${T("What you should do")}</b>
       <div style="border:1px solid var(--border);border-radius:8px;padding:12px 14px;margin-top:9px;font-size:13px">

   <p style="text-align:center;font-size:11px;color:var(--mute2);margin-top:14px">${T(`The trial scans 3 platforms. The remaining 5 unlock on paid plans.`)}</p></div>`);

async function boot(){
  let me;
  try{ me = await api.get('/api/auth/me'); }
  catch{ document.body.innerHTML =
    '<div style="display:grid;place-items:center;min-height:100vh;color:var(--mute);font-size:14px">'+
    T('Could not reach the server. Refresh to try again.')+'</div>'; return; }

  if(!me.signedIn){ location.replace('/giris'); return; }

  S.user={name: me.user.fullName || me.user.email.split('@')[0], mail: me.user.email};
  S.plan=me.org.plan; S.planLimits=me.limits; S.usage=me.usage||null; S.org=me.org; S.role=me.role;
  S.workspaces=me.workspaces||[];
  S.isAdmin=me.isAdmin===true;
  const urlLang=new URLSearchParams(location.search).get('lang');
  S.lang = (urlLang==='en'||urlLang==='tr') ? urlLang : (me.user.locale==='en'?'en':'tr');
  if(me.user.notify) S.notify={...S.notify,...me.user.notify};
  if(urlLang && urlLang!==me.user.locale){
    api.post('/api/auth/locale',{locale:S.lang}).catch(()=>{});
  }
  document.documentElement.lang=S.lang;

  localise(document.body);   // static shell: sidebar labels, titles, aria
  const ready=(me.workspaces||[]).find(w=>w.onboarded);
  if(ready){
    S.workspaceId=ready.id;
    S.brand.name=ready.brand_name; S.brand.site=ready.domain; S.brand.sector=ready.sector;
    $('#ob').classList.remove('on'); $('#app').classList.add('on');
    render();                       // shell immediately, data after
    try{ await loadResults(); }
    catch(e){ S.loadError=e.message; render(); }
    if(S.scanState && S.scanState.pending>0) pollScan();
    return;
  }

  const draft=(me.workspaces||[])[0];
  if(draft){
    S.workspaceId=draft.id;
    S.brand={name:draft.brand_name,site:draft.domain,sector:draft.sector,
      country:'Turkey',city:'',desc:''};
    S.step=2;
  }
  renderOb();
}

let pollTimer=null, ticking=false;

function pollScan(){
  clearTimeout(pollTimer);
  let rounds=0;
  const step=async()=>{
    rounds++;
    try{
      if(!ticking){
        ticking=true;
        try{ await api.post('/api/scan/tick',{workspaceId:S.workspaceId}); }
        finally{ ticking=false; }
      }
      await loadResults({silent:true});
      const pending=S.scanState?Number(S.scanState.pending||0):0;
      if(pending<=0) S.scanBusy=false;
      render();
      if(pending>0 && rounds<80) pollTimer=setTimeout(step,900);
      else if(rounds>=80) S.scanBusy=false;
    }catch(e){
      if(rounds<80) pollTimer=setTimeout(step,6000);
      else { S.scanBusy=false; render(); }
    }
  };
  pollTimer=setTimeout(step,600);
}

boot();
