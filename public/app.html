<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>YANKI — AI Visibility Platform</title>
<meta name="theme-color" content="#0A0B0F">
<link rel="icon" href="data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%22%20viewBox%3D%220%200%2064%2064%22%3E%3Cdefs%3E%3ClinearGradient%20id%3D%22g%22%20x1%3D%220%22%20y1%3D%220%22%20x2%3D%221%22%20y2%3D%221%22%3E%3Cstop%20offset%3D%220%22%20stop-color%3D%22%233B82F6%22%2F%3E%3Cstop%20offset%3D%221%22%20stop-color%3D%22%238B5CF6%22%2F%3E%3C%2FlinearGradient%3E%3C%2Fdefs%3E%3Crect%20width%3D%2264%22%20height%3D%2264%22%20rx%3D%2216%22%20fill%3D%22url%28%23g%29%22%2F%3E%3Ctext%20x%3D%2232%22%20y%3D%2245%22%20font-family%3D%22Poppins%2CArial%2Csans-serif%22%20font-size%3D%2238%22%20font-weight%3D%22700%22%20fill%3D%22%23fff%22%20text-anchor%3D%22middle%22%3EY%3C%2Ftext%3E%3C%2Fsvg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0A0B0F;--bg2:#0C0E13;--card:#111319;--card2:#151821;--card3:#1A1D27;
  --border:#20232E;--border2:#2A2E3C;--fg:#F3F5F9;--fg2:#C6CCD9;--mute:#949CAD;--mute2:#7C8598;
  --pri:#3B82F6;--pri-btn:#2563EB;--pri2:#5B8DFF;--pri-ink:#1D4ED8;--vio:#8B5CF6;
  --ok:#22C55E;--warn:#F59E0B;--bad:#EF4444;
  --r:10px;--rl:14px;--rx:18px;--r2:24px;
  --mono:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font-family:Poppins,-apple-system,"Segoe UI",Roboto,sans-serif;
  font-size:15px;line-height:1.6;-webkit-font-smoothing:antialiased}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
a{color:inherit;text-decoration:none}button{font:inherit;cursor:pointer}
h1,h2,h3,h4,h5{margin:0;font-weight:600;letter-spacing:-.03em;line-height:1.18}
p{margin:0}
input,select,textarea{font:inherit}
:focus-visible{outline:2px solid var(--pri);outline-offset:2px}
::-webkit-scrollbar{width:9px;height:9px}::-webkit-scrollbar-thumb{background:#242835;border-radius:9px}
.mono{font-family:var(--mono)}
.mut{color:var(--mute)}.ok{color:var(--ok)}.bad{color:var(--bad)}.warn{color:var(--warn)}

/* ---------- primitives ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:10px 18px;border-radius:var(--r);
  font-size:14px;font-weight:500;border:1px solid transparent;transition:.16s;white-space:nowrap}
.btn:disabled{opacity:.45;cursor:not-allowed}
.b-pri{background:var(--pri-btn);color:#fff;box-shadow:0 6px 20px -8px rgba(59,130,246,.8)}
.b-pri:hover:not(:disabled){background:var(--pri2)}
.b-gh{background:rgba(255,255,255,.04);color:var(--fg);border-color:var(--border2)}
.b-gh:hover:not(:disabled){background:rgba(255,255,255,.08)}
.b-dg{background:rgba(239,68,68,.12);color:#FCA5A5;border-color:rgba(239,68,68,.3)}
.b-sm{padding:7px 13px;font-size:13px}
.b-lg{padding:13px 24px;font-size:15px}
.b-full{width:100%}
.fld{margin-bottom:16px}
.fld label{display:block;font-size:13px;font-weight:500;margin-bottom:7px}
.fld .hint{font-size:12px;color:var(--mute);margin-top:6px}
.in{width:100%;padding:11px 13px;border:1px solid var(--border2);border-radius:var(--r);background:#0D0F15;color:var(--fg);font-size:14px}
.in::placeholder{color:var(--mute2)}
.in:focus{outline:none;border-color:var(--pri);box-shadow:0 0 0 3px rgba(59,130,246,.16)}
textarea.in{min-height:92px;resize:vertical}
.chip{display:inline-flex;align-items:center;gap:5px;padding:3px 9px;border-radius:999px;font-size:11px;font-weight:500;
  background:rgba(255,255,255,.05);color:var(--mute);border:1px solid var(--border)}
.chip.ok{background:rgba(34,197,94,.1);color:#4ADE80;border-color:rgba(34,197,94,.24)}
.chip.warn{background:rgba(245,158,11,.1);color:#FBBF24;border-color:rgba(245,158,11,.24)}
.chip.bad{background:rgba(239,68,68,.1);color:#F87171;border-color:rgba(239,68,68,.26)}
.chip.pri{background:rgba(59,130,246,.11);color:#93B4FF;border-color:rgba(59,130,246,.26)}
.chip.vio{background:rgba(139,92,246,.11);color:#C4B5FD;border-color:rgba(139,92,246,.26)}
.card{background:var(--card);border:1px solid var(--border);border-radius:var(--rl)}
.ch{display:flex;align-items:flex-start;gap:10px;padding:16px 18px 0}
.ch h3{font-size:19px}
.ch .sub{font-size:12px;color:var(--mute);margin-top:4px;max-width:70ch;line-height:1.5}
.ch .rt{margin-left:auto;font-size:11px;color:var(--mute2);white-space:nowrap;display:flex;gap:8px;align-items:center}
.cb{padding:16px 18px}
.bar{height:6px;border-radius:99px;background:rgba(255,255,255,.07);overflow:hidden}
.bar i{display:block;height:100%;border-radius:99px;background:var(--pri)}
table{width:100%;border-collapse:collapse;font-size:13.5px}
th{font-size:10.5px;font-weight:500;color:var(--mute2);letter-spacing:.06em;text-transform:uppercase;
  text-align:left;padding:10px 12px;border-bottom:1px solid var(--border);white-space:nowrap}
td{padding:11px 12px;border-bottom:1px solid var(--border);vertical-align:middle}
tbody tr:last-child td{border-bottom:0}
tbody tr:hover{background:rgba(255,255,255,.018)}
td.n,th.n{text-align:right;font-family:var(--mono);font-size:12.5px}
.tw{overflow-x:auto}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.g3{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}
.g4{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}
@media(max-width:1180px){.g4{grid-template-columns:repeat(2,1fr)}}
@media(max-width:1000px){.g2,.g3{grid-template-columns:1fr}}
@media(max-width:640px){.g4{grid-template-columns:1fr}}
.kpi{background:var(--card);border:1px solid var(--border);border-radius:var(--rl);padding:15px 17px}
.kpi .t{font-size:11px;color:var(--mute);font-weight:500;display:flex;align-items:center;gap:6px}
.kpi .t i{width:7px;height:7px;border-radius:99px;display:block}
.kpi .v{font-size:29px;font-weight:600;letter-spacing:-.04em;margin-top:4px}
.kpi .d{font-size:11.5px;color:var(--mute);margin-top:2px}
.empty{padding:44px 20px;text-align:center;color:var(--mute);font-size:13.5px}
.empty .ic{width:44px;height:44px;border-radius:13px;background:rgba(59,130,246,.09);color:#93B4FF;
  display:grid;place-items:center;font-size:19px;margin:0 auto 12px}
code{font-family:var(--mono);font-size:11.5px;background:var(--muted);border:1px solid var(--border);
  border-radius:5px;padding:1px 5px;color:#AFC8FF}
pre{background:#08090D;border:1px solid var(--border);color:#CFD6E6;padding:14px 16px;border-radius:var(--r);
  font-family:var(--mono);font-size:12px;overflow-x:auto;margin:0;line-height:1.75;white-space:pre-wrap;word-break:break-word}

/* ---------- onboarding ---------- */
#ob{min-height:100vh;display:none;flex-direction:column}
#ob.on{display:flex}
.ob-top{height:64px;border-bottom:1px solid var(--border);display:flex;align-items:center;padding:0 26px;gap:14px;
  position:sticky;top:0;background:rgba(10,11,15,.85);backdrop-filter:blur(14px);z-index:20}
.ob-top .r{margin-left:auto;display:flex;align-items:center;gap:12px;font-size:13px;color:var(--mute)}
.ob-dots{display:flex;gap:5px}
.ob-dots i{width:7px;height:7px;border-radius:99px;background:#252936;display:block}
.ob-dots i.on{background:var(--pri)}
.ob-prog{height:3px;background:#171A22}
.ob-prog i{display:block;height:100%;background:linear-gradient(90deg,var(--pri),var(--vio));transition:width .4s}
.stepper{display:flex;justify-content:center;gap:0;padding:26px 20px 6px;flex-wrap:wrap}
.st{display:flex;align-items:center}
.st .n{width:30px;height:30px;border-radius:99px;display:grid;place-items:center;font-size:12.5px;font-weight:600;
  background:#191D27;color:var(--mute);border:1px solid var(--border2)}
.st.on .n{background:var(--pri-btn);color:#fff;border-color:var(--pri-btn);box-shadow:0 0 0 5px rgba(59,130,246,.16)}
.st.dn .n{background:var(--pri-btn);color:#fff;border-color:var(--pri-btn)}
.st .lb{font-size:11.5px;color:var(--mute);position:absolute;margin-top:52px;transform:translateX(-50%);white-space:nowrap}
.st.on .lb,.st.dn .lb{color:var(--fg);font-weight:500}
.st .ln{width:clamp(24px,5vw,66px);height:1px;background:var(--border2);margin:0 4px}
.st.dn .ln{background:var(--pri-btn)}
.ob-body{flex:1;display:grid;place-items:start center;padding:56px 20px 60px}
.ob-card{width:100%;max-width:600px;text-align:center}
.ob-ic{width:62px;height:62px;border-radius:17px;background:rgba(59,130,246,.11);border:1px solid rgba(59,130,246,.24);
  display:grid;place-items:center;font-size:25px;margin:0 auto 18px}
.ob-card h2{font-size:29px;margin-bottom:8px}
.ob-card .lead{color:var(--mute);font-size:14px;max-width:52ch;margin:0 auto 30px}
.ob-form{text-align:left}
.info{border:1px solid rgba(59,130,246,.22);background:rgba(59,130,246,.05);border-radius:var(--rl);padding:16px 18px;
  font-size:13.5px;color:var(--fg2);text-align:left;margin-bottom:22px}
.info ul{margin:12px 0 0;padding-left:18px;color:var(--mute);font-size:13px}
.info li{margin-bottom:4px}
.sugg{border:1px dashed var(--border2);border-radius:var(--rl);padding:20px;text-align:center;margin-bottom:18px}
.taglist{display:flex;gap:8px;flex-wrap:wrap}
.tagx{display:inline-flex;align-items:center;gap:8px;padding:8px 12px;min-height:34px;border-radius:999px;background:var(--card2);
  border:1px solid var(--border2);font-size:13px}
.tagx button{background:none;border:0;color:var(--mute);font-size:15px;line-height:1;
  width:30px;height:30px;display:grid;place-items:center;border-radius:8px;margin:-7px -8px -7px 0}
.tagx button:hover{background:rgba(239,68,68,.14)}
.tagx button:hover{color:var(--bad)}
.tagx.pick{cursor:pointer}
.tagx.pick:hover{border-color:var(--pri);background:rgba(59,130,246,.09)}
.rivrow{margin-bottom:14px}
.rivrow .hd{display:flex;align-items:center;font-size:12.5px;color:var(--mute);margin-bottom:6px}
.rivrow .hd button{margin-left:auto;background:none;border:0;color:var(--mute);font-size:15px;
  width:30px;height:30px;display:grid;place-items:center;border-radius:8px;margin:-6px -6px -6px 0}
.rivrow .hd button:hover{background:rgba(239,68,68,.14);color:#FCA5A5}
.rivrow .in2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
@media(max-width:560px){.rivrow .in2{grid-template-columns:1fr}}
.qitem{display:flex;align-items:flex-start;gap:12px;padding:13px 15px;border:1px solid var(--border);border-radius:var(--r);
  margin-bottom:8px;background:var(--card);cursor:pointer;transition:.14s}
.qitem:hover{border-color:var(--border2)}
.qitem.on{border-color:rgba(59,130,246,.45);background:rgba(59,130,246,.06)}
.qbox{width:19px;height:19px;border-radius:5px;border:1px solid var(--border2);flex:none;display:grid;place-items:center;
  font-size:11px;margin-top:1px;color:transparent}
.qitem.on .qbox{background:var(--pri-btn);border-color:var(--pri-btn);color:#fff}
.qitem span{font-size:13.5px;text-align:left}
.done-row{display:flex;align-items:center;gap:11px;padding:13px 16px;border:1px solid var(--border);border-radius:var(--r);
  margin-bottom:10px;background:var(--card);font-size:13.5px;text-align:left}
.done-row .d{width:22px;height:22px;border-radius:99px;display:grid;place-items:center;font-size:11px;flex:none}
.ob-nav{display:flex;gap:12px;margin-top:26px}
.ob-nav .btn{flex:1}

/* ---------- app shell ---------- */
#app{display:none;min-height:100vh}
#app.on{display:grid;grid-template-columns:250px minmax(0,1fr)}
#sb{border-right:1px solid var(--border);background:#08090D;padding:14px 12px;display:flex;flex-direction:column;gap:13px;
  height:100vh;position:sticky;top:0;overflow-y:auto}
.sb-logo{display:flex;align-items:center;gap:9px;font-weight:600;font-size:17px;padding:4px 8px 13px;border-bottom:1px solid var(--border)}
.mk{width:27px;height:27px;border-radius:8px;flex:none;background:linear-gradient(140deg,#3B82F6,#8B5CF6);
  display:grid;place-items:center;color:#fff;font-size:12px;font-weight:700}
.sb-user{background:var(--card2);border:1px solid var(--border);border-radius:12px;padding:12px}
.sb-user .row{display:flex;align-items:center;gap:9px}
.sb-user .av{width:33px;height:33px;border-radius:9px;background:rgba(59,130,246,.15);color:#93B4FF;display:grid;
  place-items:center;font-size:12px;font-weight:700;border:1px solid rgba(59,130,246,.3)}
.sb-user .ics{margin-left:auto;display:flex;gap:8px}
.sb-user .ics button{background:none;border:0;color:var(--mute2);font-size:13px;padding:2px}
.sb-user .ics button:hover{color:var(--fg)}
.sb-user .lb{font-size:10px;letter-spacing:.13em;color:var(--mute2);margin-top:11px;font-weight:600}
.sb-user .nm{font-size:13px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sb-user,.sb-user .row{min-width:0}
.sb-ws{min-width:0}
.sb-ws span:nth-child(2){overflow:hidden;text-overflow:ellipsis;white-space:nowrap;flex:1}
.sb-ws{display:flex;align-items:center;gap:9px;background:var(--card2);border:1px solid var(--border);border-radius:10px;
  padding:10px 12px;font-size:13px;font-weight:500;width:100%;color:var(--fg)}
.sb-ws .sq{width:22px;height:22px;border-radius:6px;background:rgba(59,130,246,.14);display:grid;place-items:center;font-size:10px}
.sb-ws .cv{margin-left:auto;color:var(--mute2);font-size:11px}
.nav{display:grid;gap:2px}
.nav a,.nav button{display:flex;align-items:center;gap:11px;padding:9px 11px;border-radius:9px;font-size:13.5px;
  color:var(--mute);background:none;border:1px solid transparent;width:100%;text-align:left}
.nav a:hover,.nav button:hover{color:var(--fg);background:rgba(255,255,255,.03)}
.nav a.on{background:rgba(59,130,246,.13);color:#BBD1FF;border-color:rgba(59,130,246,.22)}
.nav .g{width:16px;text-align:center;opacity:.85;font-size:13px}
.nav .sub{display:none;padding-left:8px;margin:2px 0}
.nav .sub.open{display:grid;gap:1px}
.nav .sub a{font-size:12.8px;padding:7px 11px}
.nav .sub a.on{background:rgba(59,130,246,.1)}
.sb-foot{margin-top:auto;display:grid;gap:10px;padding-top:10px}
.trial{border:1px solid var(--border);border-radius:12px;padding:13px;background:linear-gradient(160deg,rgba(59,130,246,.1),var(--card2))}
.trial b{font-size:12.5px;display:block;margin-bottom:3px}
.trial p{font-size:11px;color:var(--mute);margin-bottom:10px}
.main{min-width:0;background:var(--bg2)}
.mobbar{display:none;align-items:center;gap:12px;padding:12px 16px;border-bottom:1px solid var(--border);
  position:sticky;top:0;background:rgba(10,11,15,.9);backdrop-filter:blur(12px);z-index:50}
.page{padding:clamp(14px,2vw,22px);display:grid;gap:14px;align-content:start}
.ptitle{display:flex;align-items:flex-start;gap:14px;flex-wrap:wrap}
.ptitle h1{font-size:26px}
.ptitle .s{font-size:13px;color:var(--mute);margin-top:4px;max-width:80ch}
.ptitle .r{margin-left:auto;display:flex;gap:9px;flex-wrap:wrap}
.banner{display:flex;align-items:center;gap:12px;padding:13px 16px;border:1px solid rgba(59,130,246,.24);
  background:rgba(59,130,246,.06);border-radius:var(--rl);font-size:13px;color:var(--fg2)}
.banner .r{margin-left:auto}
.tabs{display:flex;gap:22px;border-bottom:1px solid var(--border);overflow-x:auto}
.tabs button{background:none;border:0;padding:11px 0;font-size:13.5px;color:var(--mute);border-bottom:2px solid transparent;white-space:nowrap}
.tabs button.on{color:var(--fg);border-bottom-color:var(--pri);font-weight:500}
.pills{display:flex;gap:6px;flex-wrap:wrap}
.pills button{padding:5px 11px;border-radius:999px;border:1px solid var(--border);background:var(--card);
  font-size:11.5px;color:var(--mute)}
.pills button.on{background:rgba(59,130,246,.16);color:#BBD1FF;border-color:rgba(59,130,246,.32)}
.ins{border-radius:var(--rl);padding:20px;position:relative;overflow:hidden;min-height:250px;display:flex;flex-direction:column;
  background:linear-gradient(155deg,#1E3A8A,#2D4FD6 50%,#3B6BF5)}
.ins::after{content:"";position:absolute;inset:0;background:radial-gradient(80% 60% at 15% 0%,rgba(255,255,255,.16),transparent 60%)}
.ins>*{position:relative;z-index:1}
.ins .tg{align-self:flex-start;background:rgba(255,255,255,.14);border:1px solid rgba(255,255,255,.22);border-radius:8px;
  padding:5px 11px;font-size:10.5px;font-weight:600;letter-spacing:.05em}
.ins .tx{margin-top:auto;font-size:12.5px;line-height:1.65;color:rgba(255,255,255,.92)}
.ins .hl{font-size:20px;font-weight:600;letter-spacing:-.03em;margin-top:14px;line-height:1.25}
.lock{display:flex;align-items:center;gap:8px;font-size:11.5px;color:var(--mute2)}
.locked-row{opacity:.42}
.pvr{margin-bottom:11px}
.pvr .l{display:flex;align-items:center;gap:8px;font-size:13px;font-weight:500;margin-bottom:6px}
.pvr .l .d{width:16px;height:16px;border-radius:5px;display:grid;place-items:center;font-size:10px;flex:none}
.pvr .l .v{margin-left:auto;font-size:13.5px;font-weight:600}
.pvr .l .v small{color:var(--mute2);font-weight:400;font-size:11px}
.mnt{border-left:2px solid var(--pri);background:rgba(255,255,255,.025);border-radius:0 9px 9px 0;padding:11px 13px;
  display:flex;align-items:center;gap:11px;margin-bottom:8px;cursor:pointer}
.mnt:hover{background:rgba(255,255,255,.05)}
.mnt .q{font-size:13px;color:var(--fg2)}
.mnt .ago{margin-left:auto;font-size:10.5px;color:var(--mute2);white-space:nowrap}
.cdr{display:grid;grid-template-columns:18px 22px 1fr auto;gap:10px;align-items:center;margin-bottom:11px}
.cdr .i{font-size:11px;color:var(--mute2);text-align:right}
.cdr .f{width:22px;height:22px;border-radius:6px;display:grid;place-items:center;font-size:10px;font-weight:700;color:#fff}
.cdr .n{font-size:12.8px}
.cdr .v{font-size:12.5px;font-weight:600}
.acc{border:1px solid var(--border);border-radius:var(--rl);margin-bottom:9px;background:var(--card);overflow:hidden}
.acc-h{display:grid;grid-template-columns:28px 1fr auto;gap:13px;align-items:center;padding:14px 16px;cursor:pointer}
.acc-h .i{width:26px;height:26px;border-radius:8px;background:rgba(59,130,246,.1);color:#93B4FF;display:grid;place-items:center;
  font-size:11px;font-weight:700;font-family:var(--mono)}
.acc-h h5{font-size:14px;font-weight:600}
.acc-h .sb2{font-size:12px;color:var(--mute);margin-top:2px}
.acc-h .m{display:flex;gap:7px;align-items:center;flex-wrap:wrap;justify-content:flex-end}
.acc-b{display:none;padding:0 16px 16px 57px;border-top:1px solid var(--border);padding-top:14px}
@media(max-width:700px){.acc-b{padding-left:16px}}
.acc.open .acc-b{display:block}
.acc-b p{font-size:13px;color:var(--mute);margin-bottom:11px}
.acc-b ol{margin:0 0 12px;padding-left:18px;font-size:13px;color:var(--fg2)}
.acc-b ol li{margin-bottom:5px}
.road{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}
@media(max-width:900px){.road{grid-template-columns:1fr}}
.road li{list-style:none;font-size:13px;padding:8px 0;border-bottom:1px dashed var(--border);display:grid;
  grid-template-columns:15px 1fr;gap:9px;color:var(--fg2)}
.road li:last-child{border-bottom:0}
.road li span{color:var(--pri);font-weight:700}
.tool-c{border:1px solid var(--border);border-radius:var(--rx);overflow:hidden;display:grid;grid-template-columns:1fr 1fr}
@media(max-width:980px){.tool-c{grid-template-columns:1fr}}
.tool-l{padding:22px;background:var(--card)}
.tool-r{padding:22px;background:linear-gradient(150deg,rgba(59,130,246,.09),rgba(139,92,246,.05))}
.tool-r .ft{display:flex;gap:12px;margin-bottom:16px}
.tool-r .ft .ic{width:32px;height:32px;border-radius:9px;background:rgba(59,130,246,.14);display:grid;place-items:center;
  font-size:14px;flex:none}
.tool-r .ft b{font-size:13px;display:block}
.tool-r .ft p{font-size:12px;color:var(--mute)}
.seg{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:16px}
.seg button{border:1px solid var(--border2);background:var(--card2);border-radius:var(--r);padding:12px;text-align:left;color:var(--fg)}
.seg button.on{border-color:var(--pri);background:rgba(59,130,246,.1)}
.seg b{font-size:13px;display:block}
.seg p{font-size:11.5px;color:var(--mute);margin-top:2px}
.modal{position:fixed;inset:0;z-index:200;display:none;place-items:center;padding:20px;background:rgba(4,5,8,.75);backdrop-filter:blur(6px)}
.modal.on{display:grid}
.mi{background:var(--card);border:1px solid var(--border2);border-radius:var(--rx);max-width:640px;width:100%;
  max-height:88vh;overflow:auto;box-shadow:0 50px 100px -30px #000}
.mh{padding:20px 22px 0;display:flex;align-items:flex-start;gap:12px}
.mh h3{font-size:19px}
.mh button{margin-left:auto;background:none;border:0;color:var(--mute);font-size:22px;line-height:1}
.mb{padding:16px 22px 24px}
.toast{position:fixed;right:20px;bottom:20px;z-index:300;display:grid;gap:9px}
.tst{background:var(--card2);border:1px solid var(--border2);border-radius:var(--r);padding:12px 15px;font-size:13px;
  display:flex;gap:10px;align-items:center;box-shadow:0 20px 40px -20px #000;animation:sl .25s}
@keyframes sl{from{opacity:0;transform:translateY(8px)}}
mark{background:rgba(59,130,246,.22);color:#BBD1FF;padding:0 3px;border-radius:3px}
mark.riv{background:rgba(139,92,246,.2);color:#C4B5FD}

/* ================= responsive + a11y düzeltmeleri ================= */
svg{display:block;max-width:100%}
.page{grid-template-columns:minmax(0,1fr)}
.card,.pnl,.kpi,.acc,.tool-c,.g2>*,.g3>*,.g4>*,.road>*{min-width:0}
.tw{overflow-x:auto;-webkit-overflow-scrolling:touch}
.tw table{min-width:560px}
.sb-user .ics button{width:30px;height:30px;display:grid;place-items:center;border-radius:8px}
.sb-user .ics button:hover{background:rgba(255,255,255,.06)}
.sb-foot>button{padding:9px 11px!important;border-radius:9px}
.mh button{width:34px;height:34px;display:grid;place-items:center;border-radius:9px;flex:none}
.mh button:hover{background:rgba(255,255,255,.06)}
#sbScrim{position:fixed;inset:0;background:rgba(4,5,8,.6);z-index:55;display:none}
@media(max-width:1024px){
  #app.on{grid-template-columns:minmax(0,1fr)}
  #sb{position:fixed;inset:0 auto 0 0;width:262px;z-index:60;height:100dvh;
      transform:translateX(-100%);transition:transform .25s}
  #sb.open{transform:none;box-shadow:24px 0 60px -20px #000}
  #sbScrim.on{display:block}
  .mobbar{display:flex!important}
  .ptitle .r{width:100%}
  .tw table{min-width:520px}
}
@media(max-width:760px){
  .mi .res-grid{grid-template-columns:minmax(0,1fr)!important;text-align:center}
  .mi .res-foot{grid-template-columns:minmax(0,1fr)!important}
  .mi .res-foot>div{grid-template-columns:minmax(0,1fr)!important}
}
@media(max-width:560px){
  .kpis,.g2,.g3,.g4{grid-template-columns:minmax(0,1fr)!important}
  button.chip{min-height:30px}
  .task-h .m,.acc-h .m{flex-wrap:wrap}
  .ptitle h1{font-size:22px}
  .acc-h{grid-template-columns:26px minmax(0,1fr)}
}
</style>
</head>
<body>

<!-- ============ ONBOARDING ============ -->
<div id="ob" class="on">
  <div class="ob-top">
    <span class="sb-logo" style="border:0;padding:0;font-size:18px"><span class="mk">Y</span>YANKI</span>
    <div class="r"><span id="obStep">Step 1 / 6</span><span class="ob-dots" id="obDots"></span></div>
  </div>
  <div class="ob-prog"><i id="obProg" style="width:16%"></i></div>
  <div class="stepper" id="stepper"></div>
  <div class="ob-body"><div class="ob-card" id="obCard"></div></div>
</div>

<!-- ============ APP ============ -->
<div id="app">
  <aside id="sb">
    <div class="sb-logo"><span class="mk">Y</span> YANKI</div>
    <div class="sb-user">
      <div class="row"><span class="av" id="uAv">DH</span>
        <span class="ics"><button title="Theme">◐</button><button title="Language">⊕</button><button title="Sign out" onclick="signOut()">↪</button></span></div>
      <div class="lb">WELCOME BACK,</div><div class="nm" id="uName">Demo Account</div>
    </div>
    <button class="sb-ws" onclick="toast('Single workspace — add another from Settings › Brand')">
      <span class="sq">⬢</span><span id="wsName">brand</span><span class="cv">⌄</span></button>
    <nav class="nav" id="nav"></nav>
    <div class="sb-foot">
      <button class="nav" style="font-size:12.5px;color:var(--mute2);background:none;border:0;text-align:left;padding:0 11px"
        onclick="toast('Thanks for your feedback')">▭ Feedback</button>
      <div class="trial" id="trialBox"></div>
    </div>
  </aside>
  <div class="main">
    <div class="mobbar">
      <button class="btn b-gh b-sm" onclick="toggleSb()" aria-label="Menu">☰</button>
      <span class="sb-logo" style="border:0;padding:0;font-size:16px"><span class="mk">Y</span>YANKI</span>
    </div>
    <div class="page" id="page"></div>
  </div>
</div>

<div id="sbScrim" onclick="toggleSb(false)"></div>
<div class="modal" id="modal"><div class="mi"><div class="mh"><h3 id="mTitle"></h3>
  <button onclick="closeModal()">×</button></div><div class="mb" id="mBody"></div></div></div>
<div class="toast" id="toasts"></div>

<script>
/* =====================================================================
   YANKI · application prototype — all state is held in memory
   ===================================================================== */
const $=s=>document.querySelector(s), $$=s=>[...document.querySelectorAll(s)];
const reduce=matchMedia('(prefers-reduced-motion: reduce)').matches;
const ini=t=>String(t||'?').trim().charAt(0).toLocaleUpperCase('en')||'?';
const esc=t=>String(t).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const trLower=t=>t.toLocaleLowerCase('tr');
const nf=n=>Number(n).toLocaleString('tr-TR');

/* ---------- sabitler ---------- */
// Platform metadata (label, colour, weight, lock state) now arrives with every
// results payload, so there is no client-side engine list to drift out of sync.

const SECTORS={
 'Teknoloji & Bilişim':{k:'teknoloji ve IT'},
 'Oyun & Dijital Kod':{k:'oyun ve e-pin'},
 'E-ticaret & Perakende':{k:'e-ticaret'},
 'Finans & Sigorta':{k:'finans ve sigorta'},
 'Sağlık':{k:'sağlık'},
 'Turizm & Konaklama':{k:'turizm ve konaklama'},
 'Eğitim':{k:'eğitim'},
 'Otomotiv':{k:'otomotiv'},
 'Gayrimenkul & İnşaat':{k:'gayrimenkul'},
 'Lojistik & Kargo':{k:'lojistik ve kargo'},
 'Gıda & Restoran':{k:'gıda ve restoran'},
 'Hukuk & Danışmanlık':{k:'hukuk ve danışmanlık'},
 'Diğer':{k:'hizmet'}
};
const sectorTerm=k=>(SECTORS[k]||SECTORS['Diğer']).k;

// Intent keys match the database enum exactly. The multiplier is shown in the
// UI so nobody has to guess why a prompt moves the score more than another.
const INTENTS={
  transactional:{label:'Transactional', mult:1.5},
  brand_defence:{label:'Brand defence', mult:1.4},
  comparison:   {label:'Comparison',    mult:1.3},
  evaluation:   {label:'Evaluation',    mult:1.1},
  informational:{label:'Informational', mult:0.8},
};
const intentLabel=k=>(INTENTS[k]||{label:k}).label;

// Audit factors and their fixes now come from the server with each audit run,
// so the catalogue lives in one place instead of two.

/* ---------- state ----------
   Session, workspace and results all come from the API. Nothing here is
   persisted in the browser: a reload re-reads the server, which is why
   refreshing never sends anyone back through setup. */
const S = {
  step: 1, onboarded: false, route: 'dashboard', range: 30, openNav: {},
  workspaceId: null, plan: 'trial', planLimits: null, org: null, role: 'owner',
  user: { name: '', mail: '' },
  brand: { name: '', site: '', sector: 'Teknoloji & Bilişim', country: 'Türkiye', city: '', desc: '' },
  variants: [], rivals: [{ n: '', d: '' }, { n: '', d: '' }, { n: '', d: '' }],
  rawCompetitors: [], prompts: [], data: null,
  scanState: null, firstScan: null, loadError: null,
};

function toast(t){const d=document.createElement('div');d.className='tst';d.innerHTML='<span class="ok">✓</span>'+esc(t);
  $('#toasts').append(d);setTimeout(()=>d.remove(),3400)}
function openModal(t,b){$('#mTitle').textContent=t;$('#mBody').innerHTML=b;$('#modal').classList.add('on')}
function closeModal(){$('#modal').classList.remove('on')}
$('#modal').addEventListener('click',e=>{if(e.target.id==='modal')closeModal()});
addEventListener('keydown',e=>{if(e.key==='Escape')closeModal()});
function dl(name,content,type='text/plain'){const b=new Blob([content],{type});const u=URL.createObjectURL(b);
  const a=document.createElement('a');a.href=u;a.download=name;a.click();URL.revokeObjectURL(u);toast(name+' indirildi')}
function copy(id){const el=document.getElementById(id);navigator.clipboard?.writeText(el.textContent)
  .then(()=>toast('Copied to clipboard')).catch(()=>toast('Could not copy'))}
function csv(rows){return rows.map(r=>r.map(c=>`"${String(c).replace(/"/g,'""')}"`).join(';')).join('\n')}
function reset(){location.reload()}
function planRank(){return {trial:0,starter:1,pro:2,business:3}[S.plan]}
// The server decides what is visible; the client only reflects it. Locked
// engines never carry numbers in the payload, so this is presentation only.
function platAllowed(p){return !p.locked}

/* =====================================================================
   ONBOARDING
   ===================================================================== */
const STEPS=['Workspace','Identity','Variants','Competitors','Prompts','Done'];

function renderOb(){
  $('#obStep').textContent=`Step ${S.step} / 6`;
  $('#obProg').style.width=(S.step/6*100)+'%';
  $('#obDots').innerHTML=STEPS.map((_,i)=>`<i class="${i<S.step?'on':''}"></i>`).join('');
  $('#stepper').innerHTML=STEPS.map((s,i)=>{
    const n=i+1,cls=n<S.step?'dn':n===S.step?'on':'';
    return `<div class="st ${cls}"><div style="position:relative"><div class="n">${n<S.step?'✓':n}</div>
      <div class="lb" style="left:50%">${s}</div></div>${i<5?'<span class="ln"></span>':''}</div>`}).join('');
  ({1:obS1,2:obS2,3:obS3,4:obS4,5:obS5,6:obS6})[S.step]();
}
function obS1(){
  $('#obCard').innerHTML=`<div class="ob-ic">▤</div><h2>Set Up Your Hub</h2>
  <p class="lead">Let's configure your project workspace</p>
  <div class="ob-form">
    <div class="fld"><label>Project / Brand Name</label>
      <input class="in" id="i1" value="${esc(S.brand.name)}" placeholder="e.g. Acme Commerce">
      <div class="hint">This is how your project will appear in the dashboard</div></div>
    <div class="fld"><label>Your website</label>
      <input class="in" id="i2" value="${esc(S.brand.site)}" placeholder="https://www.example.com">
      <div class="hint">We'll track brand visibility for this domain</div></div>
    <button class="btn b-pri b-full b-lg" onclick="obNext1()">Continue</button>
  </div>`;
}
async function obNext1(){
  const n=$('#i1').value.trim(), site=$('#i2').value.trim();
  if(!n) return toast('Brand name is required');
  S.brand.name=n; S.brand.site=site;
  S.step=2; renderOb();
}
function obS2(){
  $('#obCard').innerHTML=`<div class="ob-ic">◎</div><h2>Define Your Identity</h2>
  <p class="lead">Help us understand your business so we can build better AI monitoring prompts</p>
  <div class="ob-form">
    <div class="fld"><label for="i3">Industry</label><select class="in" id="i3">
      ${Object.keys(SECTORS).map(k=>`<option ${S.brand.sector===k?'selected':''}>${k}</option>`).join('')}</select></div>
    <div class="fld"><label for="i4">Country</label><select class="in" id="i4">
      ${['Türkiye','Almanya','Birleşik Krallık','ABD','Hollanda','BAE'].map(k=>`<option ${S.brand.country===k?'selected':''}>${k}</option>`).join('')}</select></div>
    <div class="fld"><label>City</label><input class="in" id="i5" value="${esc(S.brand.city)}" placeholder="e.g. Istanbul">
      <div class="hint">Leave empty for country-wide targeting</div></div>
    <div class="fld"><label>Describe Your Business</label>
      <textarea class="in" id="i6" placeholder="e.g. We offer a cloud CRM for small businesses — sales tracking, e-invoicing and WhatsApp management in one panel...">${esc(S.brand.desc)}</textarea>
      <div class="hint">We use this to generate smarter prompts specific to your services</div></div>
    <div class="ob-nav"><button class="btn b-gh b-lg" onclick="S.step=1;renderOb()">← Back</button>
      <button class="btn b-pri b-lg" onclick="obNext2()">Continue</button></div>
  </div>`;
}
async function obNext2(){
  S.brand.sector=$('#i3').value; S.brand.country=$('#i4').value;
  S.brand.city=$('#i5').value.trim(); S.brand.desc=$('#i6').value.trim();
  const btn=document.querySelector('.ob-nav .b-pri');
  if(btn){btn.disabled=true;btn.textContent='Creating…';}
  try{
    // The workspace is created here, not at the end: everything after this
    // point (variants, prompt generation) needs a server-side record to hang
    // off, and a half-finished onboarding should still be resumable.
    if(S.workspaceId){
      await api.patch(`/api/workspaces/${S.workspaceId}`,{
        brandName:S.brand.name, domain:S.brand.site, sector:S.brand.sector,
        country:S.brand.country, city:S.brand.city||null, description:S.brand.desc||null});
      const r=await api.get(`/api/workspaces/${S.workspaceId}`);
      S.variants=r.workspace.aliases||[];
    }else{
      const r=await api.post('/api/workspaces',{
        brandName:S.brand.name, domain:S.brand.site, sector:S.brand.sector,
        country:S.brand.country, city:S.brand.city||null, description:S.brand.desc||null});
      S.workspaceId=r.workspace.id;
      S.brand.site=r.workspace.domain;
      S.variants=r.workspace.aliases||[];
    }
    S.step=3; renderOb();
  }catch(e){
    toast(e.message);
    if(btn){btn.disabled=false;btn.textContent='Continue';}
  }
}
function suggestVariants(){
  // Variants are derived on the server so the scan worker, exports and the UI
  // all use the identical alias set. This is just a refresh hook.
  if(!S.workspaceId) return S.variants;
  api.get(`/api/workspaces/${S.workspaceId}`)
    .then(r=>{S.variants=r.workspace.aliases||[];renderOb();})
    .catch(e=>toast(e.message));
  return S.variants;
}
function obS3(){
  const list=S.variants.length
    ? `<div class="taglist" style="justify-content:center">${S.variants.map((v,i)=>
        `<span class="tagx">${esc(v)}<button onclick="S.variants.splice(${i},1);renderOb()">×</button></span>`).join('')}</div>`
    : `<div class="sugg"><div style="font-size:22px;margin-bottom:8px">◈</div><b>No additional names found</b>
       <p style="font-size:12.5px;color:var(--mute);margin-top:6px">This is normal for new or distinctive brands. Add the nicknames,
       abbreviations or spellings your customers use below.</p>
       <button class="btn b-gh b-sm" style="margin-top:12px" onclick="S.variants=suggestVariants(S.brand.name);renderOb()">↻ Try again</button></div>`;
  $('#obCard').innerHTML=`<div class="ob-ic">◈</div><h2>Alternative Brand Names</h2>
  <p class="lead">AI systems refer to your brand with different names — let's track all of them.</p>
  <div class="info">AI tools sometimes mention your brand in a different form than its official name.
    Add your alternatives so no mention is missed.
    <ul><li>Abbreviations — e.g. "THY" for Turk Hava Yollari</li>
    <li>Spelling without special characters — e.g. "Turk Hava Yollari"</li>
    <li>Local-language or translated names</li>
    <li>Domain form — e.g. "yourbrand.com"</li></ul></div>
  <div style="font-size:13px;font-weight:500;margin-bottom:12px;text-align:left">✦ AI-suggested names</div>
  ${list}
  <div class="ob-form" style="margin-top:22px">
    <label style="display:block;font-size:13px;font-weight:500;margin-bottom:7px">+ Add variant</label>
    <div style="display:flex;gap:9px"><input class="in" id="iv" placeholder="e.g. THY, Turkish Air"
      onkeydown="if(event.key==='Enter')addVar()"><button class="btn b-pri" onclick="addVar()">+</button></div>
    <div class="ob-nav"><button class="btn b-gh b-lg" onclick="S.step=2;renderOb()">← Back</button>
      <button class="btn b-pri b-lg" onclick="S.step=4;renderOb()">${S.variants.length?'Continue':'Skip'}</button></div>
  </div>`;
}
function addVar(){const v=$('#iv').value.trim();if(!v)return;
  if(!S.variants.includes(v))S.variants.push(v);renderOb()}
function obS4(){
  $('#obCard').innerHTML=`<div class="ob-ic">⚔</div><h2>Competitor Radar</h2>
  <p class="lead">Who are your main competitors? We'll track them too</p>
  <div class="ob-form">
    ${S.rivals.map((r,i)=>`<div class="rivrow"><div class="hd">Competitor ${i+1}
      <button onclick="S.rivals.splice(${i},1);renderOb()">×</button></div>
      <div class="in2"><input class="in" placeholder="Competitor name" value="${esc(r.n)}" oninput="S.rivals[${i}].n=this.value">
      <input class="in" placeholder="competitor.com" value="${esc(r.d)}" oninput="S.rivals[${i}].d=this.value"></div></div>`).join('')}
    <button class="btn b-gh b-full b-sm" onclick="S.rivals.push({n:'',d:''});renderOb()">+ Add Another Competitor</button>
    <div class="ob-nav"><button class="btn b-gh b-lg" onclick="S.step=3;renderOb()">← Back</button>
      <button class="btn b-pri b-lg" onclick="obNext4()">Continue</button></div>
    <div style="text-align:center;margin-top:14px"><button class="btn b-gh b-sm" style="border:0;background:none;color:var(--mute)"
      onclick="S.rivals=[];obNext4()">Skip this step</button></div>
  </div>`;
}
async function obNext4(){
  S.rivals=S.rivals.filter(r=>r.n.trim());
  if(!S.prompts.length){
    const btn=document.querySelector('.ob-nav .b-pri');
    if(btn){btn.disabled=true;btn.textContent='Generating…';}
    try{
      const r=await api.post('/api/prompts/generate',{workspaceId:S.workspaceId});
      S.prompts=r.prompts.map((p,i)=>({id:'g'+i,text:p.text,intent:p.intent,vol:p.volume,
        on:i<Math.min(10,(S.planLimits&&S.planLimits.prompts)||10),src:'ai',active:true}));
      S.promptMix=r.mix;
    }catch(e){
      toast(e.message);
      if(btn){btn.disabled=false;btn.textContent='Continue';}
      return;
    }
  }
  S.step=5;renderOb();
}

async function regenOnboarding(){
  try{
    const r=await api.post('/api/prompts/generate',{workspaceId:S.workspaceId});
    const cap=(S.planLimits&&S.planLimits.prompts)||10;
    S.prompts=r.prompts.map((p,i)=>({id:'g'+i,text:p.text,intent:p.intent,vol:p.volume,
      on:i<Math.min(10,cap),src:'ai',active:true}));
    renderOb();
  }catch(e){ toast(e.message); }
}

function obS5(){
  const sel=S.prompts.filter(p=>p.on).length;
  $('#obCard').innerHTML=`<div class="ob-ic">▤</div><h2>AI Search Prompts</h2>
  <p class="lead">Review the AI-generated prompts below. Deselect, edit or remove any you don't want,
    and add your own custom prompts.</p>
  <div style="display:flex;align-items:center;gap:12px;margin-bottom:14px;font-size:12.5px;flex-wrap:wrap">
    <b style="font-size:13px">✦ AI-generated prompts</b>
    <span class="mut">${sel} of ${S.prompts.length} prompts selected</span>
    <button class="btn b-gh b-sm" style="margin-left:auto" onclick="regenOnboarding()">↻ Regenerate</button>
  </div>
  <div class="ob-form">
    ${S.prompts.map((p,i)=>`<div class="qitem ${p.on?'on':''}" onclick="S.prompts[${i}].on=!S.prompts[${i}].on;renderOb()">
      <span class="qbox">✓</span><span>${esc(p.text)}<br><span class="chip" style="margin-top:6px">${p.intent}</span>
      <span class="chip">vol ~${nf(p.vol)}</span></span></div>`).join('')}
    <label style="display:block;font-size:13px;font-weight:500;margin:18px 0 7px">+ Your custom prompts</label>
    <div style="display:flex;gap:9px"><input class="in" id="iq" placeholder="Add your own search prompt..."
      onkeydown="if(event.key==='Enter')addPrompt()"><button class="btn b-pri" onclick="addPrompt()">+</button></div>
    <div class="info" style="margin-top:18px">💡 Only the selected AI prompts and your custom prompts will be saved.
      You can change them at any time. Tip: keep informational, evaluation, comparison and transactional prompts
      together for a balanced funnel.</div>
    <div class="ob-nav"><button class="btn b-gh b-lg" onclick="S.step=4;renderOb()">← Back</button>
      <button class="btn b-pri b-lg" ${sel?'':'disabled'} onclick="obFinish()">Continue (${sel})</button></div>
  </div>`;
}
function addPrompt(){
  const v=$('#iq').value.trim(); if(!v) return;
  S.prompts.push({id:'c'+Date.now(),text:v.replace(/^"|"$/g,''),intent:'transactional',on:true,
    vol:300,src:'custom',active:true});
  renderOb();

   in the browser: if the server has no answers yet, the UI says so.

const api = {
  async req(path, opts = {}) {
    const res = await fetch(path, {
      credentials: 'same-origin',
      headers: opts.body ? { 'content-type': 'application/json' } : undefined,
      ...opts,
    });
    let data = null;
    try { data = await res.json(); } catch { /* empty body */ }
    if (!res.ok) {
      const err = new Error((data && data.error) || `Request failed (${res.status})`);
      err.status = res.status;
      throw err;
    }
    return data;
  },
  get:  (p)    => api.req(p),
  post: (p, b) => api.req(p, { method: 'POST', body: JSON.stringify(b || {}) }),
  patch:(p, b) => api.req(p, { method: 'PATCH', body: JSON.stringify(b || {}) }),
  del:  (p)    => api.req(p, { method: 'DELETE' }),
};

/**
 * Maps the API payload onto the shape the views already expect. Keeping the
 * adapter in one place means the render code never has to know whether a
 * number came from the scan table or a rollup.
 */
function adopt(r) {
  S.workspaceId = r.workspace.id;
  S.plan = r.org.plan;
  S.planLimits = r.org.planLimits;
  S.brand = {
    name: r.workspace.brandName,
    site: r.workspace.domain,
    sector: r.workspace.sector,
    country: r.workspace.country,
    city: r.workspace.city || '',
    desc: r.workspace.description || '',
  };
  S.variants = r.workspace.aliases || [];
  S.rawCompetitors = r.competitors || [];
  S.rivals = (r.competitors || []).map(c => ({ id: c.id, n: c.name, d: c.domain || '' }));
  S.prompts = (r.prompts || []).map(p => ({
    id: p.id, text: p.text, intent: p.intent, vol: p.volume,
    src: p.source, active: true, score: p.score, ci: p.ci,
    coverage: p.coverage, opportunity: p.opportunity, engines: p.engines,
  }));
  S.enginesMeta = r.engines;
  S.scanState = r.scan;
  S.auditRaw = r.audit;

  const latest = r.latest;
  const allowed = r.engines.filter(e => !e.locked);
  const byEngine = (latest && latest.by_engine) || {};

  const plats = r.engines.map(e => {
    const stats = byEngine[e.key] || {};
    const own = (r.cells || []).filter(c => c.engineKey === e.key);
    const cellCount = own.length;
    const mentions  = own.filter(c => c.m > 0).length;
    const cites     = own.filter(c => c.c > 0).length;
    return {
      id: e.key, n: e.label, ab: ENGINE_GLYPH[e.key] || '◆', c: ENGINE_COLOR[e.key] || '#3B82F6',
      w: e.weight, locked: e.locked,
      score: Number(stats.score || 0),
      ci: Number(stats.ci || 0),
      mentions, cites, checks: cellCount,
      trend: 0,
    };
  });

  // Cells drive the mentions table and the answer inspector.
  const cells = (r.cells || []).map(c => ({
    p: { id: c.promptId, text: c.text, intent: c.intent, vol: c.volume },
    pl: plats.find(x => x.id === c.engineKey) || plats[0],
    runId: c.runId,
    score: c.score, ci: c.ci, m: c.m, c: c.c, sg: c.sigma * 2 - 1,
    rank: c.meanRank,
  })).filter(c => c.pl);

  const totalMentions = (r.competitors || []).reduce((a, c) => a + Number(c.mentions || 0), 0) + Number(r.selfMentions || 0);
  const sov = [
    { n: r.workspace.brandName, v: Number(r.selfMentions || 0), you: true },
    ...(r.competitors || []).map(c => ({ n: c.name, v: Number(c.mentions || 0) })),
  ].map(x => ({ ...x, pct: totalMentions ? (x.v / totalMentions) * 100 : 0 }));

  const audit = r.audit ? groupAudit(r.audit.factors) : [];

  S.data = {
    ready: !!latest,
    cells,
    plats,
    total: latest ? Number(latest.score) : 0,
    ciAvg: latest ? Number(latest.ci) : 0,
    lowConfidence: latest ? latest.low_confidence : false,
    mentionRate: latest ? Number(latest.mention_rate) : 0,
    citationRate: latest ? Number(latest.citation_rate) : 0,
    sov,
    sources: (r.sources || []).map(s => ({ d: s.domain, v: s.citations, mine: s.mine, t: '', plats: [], first: s.first_seen, last: s.last_seen, trend: 1 })),
    series: (r.series || []).map(x => Number(x.score)),
    seriesDates: (r.series || []).map(x => x.scan_date),
    audit,
    auditScore: r.audit ? Number(r.audit.total_score) : 0,
    auditUrl: r.audit ? r.audit.url : r.workspace.domain,
    auditRanAt: r.audit ? r.audit.ran_at : null,
    bots: [],
    opps: r.prompts.map(p => ({
      p: { id: p.id, text: p.text, intent: p.intent, vol: p.volume },
      cover: (p.coverage || 0) / 100,
      srcCount: (r.sources || []).length,
      fit: p.coverage > 50 ? 'High' : p.coverage > 0 ? 'Medium' : 'Low',
      opp: p.opportunity,
      act: ACTION_BY_INTENT[p.intent] || 'Product/service page',
    })).sort((a, b) => b.opp - a.opp),
    rivals: (r.competitors || []).map(c => c.name),
    host: r.workspace.host,
    recent: r.recentMentions || [],
  };
  S.data.actions = buildActions();
}

const ENGINE_GLYPH = { chatgpt:'◉', gemini:'✦', perplexity:'✳', claude:'✷',
  ai_overviews:'◎', grok:'◌', deepseek:'◈' };
const ENGINE_COLOR = { chatgpt:'#10A37F', gemini:'#8B5CF6', perplexity:'#20B8A6', claude:'#F59E0B',
  ai_overviews:'#4285F4', grok:'#EF4444', deepseek:'#3B82F6' };
const ACTION_BY_INTENT = {
  informational:'Explainer guide', comparison:'Comparison table',
  brand_defence:'Trust page + FAQ', transactional:'Product/service page',
  evaluation:'Category landing page',
};

function groupAudit(factors) {
  const map = new Map();
  for (const f of factors || []) {
    if (!map.has(f.category)) map.set(f.category, []);
    map.get(f.category).push({ n: f.label, st: f.status, fix: f.fix, detail: f.detail });
  }
  return [...map.entries()].map(([n, facs]) => ({
    n, facs,
    score: facs.reduce((a, f) => a + (f.st === 'pass' ? 100 : f.st === 'partial' ? 55 : 0), 0) / facs.length,
  }));
}

/** Loads the workspace and repaints. Called on boot and after every mutation. */
async function loadResults(opts = {}) {
  const r = await api.get(`/api/results?workspace=${S.workspaceId}&days=${S.range}`);
  S.loadError = null;
  adopt(r);
  if (!opts.silent) render();
  return r;
}

/**
 * Action plan, derived from the audit's failing factors and the top
 * opportunities. Everything here traces back to a real finding — no generic
 * advice, because generic advice is what the customer already ignored.
 */
function buildActions() {
  const d = S.data || {}, b = S.brand;
  const A = [];
  const push = (t, sub, im, ef, q, desc, steps, code) => A.push({ t, sub, im, ef, q, desc, steps, code });

  const fails = [];
  (d.audit || []).forEach(c => c.facs.forEach(f => { if (f.st === 'fail') fails.push({ ...f, cat: c.n }); }));

  // Failing audit factors that ship a fix are the cheapest wins available.
  fails.filter(f => f.fix).slice(0, 4).forEach((f, i) => push(
    f.n,
    `${f.cat} · ${f.detail || 'Failing'}`,
    (4.6 - i * 0.5).toFixed(1),
    i === 0 ? '1 hour' : '1–3 days',
    `+${4 - i} prompts`,
    f.detail || 'This factor is failing on the audited page.',
    ['Apply the snippet below', 'Deploy the change', 'Re-run the audit to confirm it passes'],
    f.fix));

  (d.opps || []).filter(o => o.cover < 0.4).slice(0, 3).forEach((o, i) => push(
    `Publish content for "${o.p.text.replace(/"/g, '')}"`,
    `Opportunity ${o.opp} · coverage ${Math.round(o.cover * 100)}% · volume ${o.p.vol}`,
    (4.2 - i * 0.6).toFixed(1), '1–3 weeks', `+${3 - i} prompts`,
    'Your visibility on this prompt is low. The content writer can analyse the answer structure and draft a page aimed at it.',
    ['Write a 40–60 word direct answer in the first paragraph',
     'Convert headings into question form',
     'Add at least one table and one numeric data point',
     'Mark it up with FAQPage schema'],
    null));

  const topSource = (d.sources || []).find(s => !s.mine);
  if (topSource) push(
    `Close the citation gap on ${topSource.d}`,
    `${topSource.v} citations in your category, none of them yours`,
    '4.4', '6–10 weeks', '+3 prompts',
    'Models learn about you mostly from third-party sources. Being absent from the most-cited domain in your category is a structural gap that content on your own site cannot close.',
    ['Build an organic presence plan for that source',
     'Reach out to editors of industry listicles',
     'Publish explainer videos where the category is discussed',
     'Raise your review response rate above 90%'],
    null);

  if (!A.length) push(
    'Run a site audit to generate your plan',
    'No audit has been run for this workspace yet',
    '—', '2 minutes', '—',
    'The action plan is built from real audit findings and prompt coverage. Run an audit and the tasks appear here.',
    ['Open the Audit screen', 'Run the audit against your homepage', 'Return here'],
    null);

  return A;
}

function lineChart(vals,o={}){
  const W=o.w||460,H=o.h||180,P={l:30,r:8,t:10,b:20};
  // One data point is the normal state on day one. Draw a flat marker rather
  // than emitting a malformed path.
  if(!vals.length) return `<div class="empty" style="padding:28px">No history yet — the first scan writes today's point.</div>`;
  if(vals.length===1) vals=[vals[0],vals[0]];
  const N=vals.length;
  const mn=o.min??0,mx=o.max??100,uid='g'+Math.random().toString(36).slice(2,7);
  const x=i=>P.l+(i/(N-1||1))*(W-P.l-P.r),y=v=>H-P.b-((v-mn)/(mx-mn||1))*(H-P.t-P.b);
  let L='',G='';vals.forEach((v,i)=>L+=(i?'L':'M')+x(i).toFixed(1)+' '+y(v).toFixed(1));
  const A=L+`L${x(N-1).toFixed(1)} ${H-P.b}L${x(0).toFixed(1)} ${H-P.b}Z`;
  (o.ticks||[0,25,50,75,100]).forEach(v=>{G+=`<line x1="${P.l}" y1="${y(v)}" x2="${W-P.r}" y2="${y(v)}" stroke="#20232E"/>
    <text x="${P.l-5}" y="${y(v)+3.5}" text-anchor="end" font-size="10" fill="#7C8598" font-family="ui-monospace">${v}</text>`});
  const col=o.color||'#60A5FA';
  return `<svg viewBox="0 0 ${W} ${H}" width="100%" style="display:block;overflow:hidden">
   <defs><linearGradient id="${uid}" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="${col}" stop-opacity=".4"/><stop offset="1" stop-color="${col}" stop-opacity="0"/></linearGradient></defs>
   ${G}<path d="${A}" fill="url(#${uid})"/><path d="${L}" fill="none" stroke="${col}" stroke-width="2" stroke-linejoin="round"/>
   <circle cx="${x(N-1)}" cy="${y(vals[N-1])}" r="3.4" fill="${col}" stroke="#0C0E13" stroke-width="2"/>
   ${(o.xlab||[]).map((t,i,a)=>`<text x="${P.l+(i/(a.length-1))*(W-P.l-P.r)}" y="${H-4}" text-anchor="middle"
     font-size="10" fill="#7C8598" font-family="ui-monospace">${t}</text>`).join('')}</svg>`;
}
function donut(items,center,sub){
  const R=58,SW=21,cx=72,cy=72;let a=-Math.PI/2,arcs='';
  const tot=items.reduce((s,i)=>s+i.v,0);
  if(!tot)arcs=`<circle cx="${cx}" cy="${cy}" r="${R-SW/2}" fill="none" stroke="#1A1D27" stroke-width="${SW}"/>`;
  items.forEach(d=>{if(!tot)return;const a2=a+(d.v/tot)*Math.PI*2,pt=(r,t)=>[cx+r*Math.cos(t),cy+r*Math.sin(t)];
    const[x1,y1]=pt(R,a),[x2,y2]=pt(R,a2),[x3,y3]=pt(R-SW,a2),[x4,y4]=pt(R-SW,a);
    const lg=(a2-a)>Math.PI?1:0;
    arcs+=`<path d="M${x1} ${y1}A${R} ${R} 0 ${lg} 1 ${x2} ${y2}L${x3} ${y3}A${R-SW} ${R-SW} 0 ${lg} 0 ${x4} ${y4}Z" fill="${d.c}"/>`;a=a2});
  return `<svg viewBox="0 0 144 144" width="146" style="flex:none">${arcs}
    <text x="72" y="70" text-anchor="middle" font-size="21" font-weight="600" fill="#F3F5F9">${center}</text>
    <text x="72" y="86" text-anchor="middle" font-size="10" fill="#7C8598" font-family="ui-monospace">${sub}</text></svg>`;
}
function gauge(v,col){
  const R=62,cx=84,cy=84,a0=Math.PI*.78,a1=Math.PI*2.22,ang=a0+(v/100)*(a1-a0);
  const pt=(r,a)=>[(cx+r*Math.cos(a)).toFixed(1),(cy+r*Math.sin(a)).toFixed(1)];
  const arc=(f,t,r,w,c)=>{const[x1,y1]=pt(r,f),[x2,y2]=pt(r,t);
    return `<path d="M${x1} ${y1}A${r} ${r} 0 ${(t-f)>Math.PI?1:0} 1 ${x2} ${y2}" fill="none" stroke="${c}" stroke-width="${w}" stroke-linecap="round"/>`};
  return `<svg viewBox="0 0 168 142" width="190" style="max-width:100%">${arc(a0,a1,R,14,'#1A1D27')}${arc(a0,ang,R,14,col)}
    <text x="84" y="90" text-anchor="middle" font-size="34" font-weight="600" fill="#F3F5F9">${v.toFixed(0)}</text>
    <text x="84" y="108" text-anchor="middle" font-size="10" fill="#7C8598" font-family="ui-monospace">OUT OF 100</text></svg>`;
}

function insightText(){
  const d=S.data,b=S.brand;
  const worst=[...d.plats].filter(platAllowed).sort((a,x)=>a.score-x.score)[0];
  const cited=d.cells.filter(c=>c.c>0).length;
  const lvl=d.total<15?'critical':d.total<35?'low':d.total<60?'moderate':'strong';
  if(d.total<10)return{head:'Visibility Is Critical Across All AI Platforms',
    body:`${b.name} scores ${d.total.toFixed(1)}/100 across the tracked platforms, which means near-total absence. The brand is almost never surfaced in AI answers and needs baseline visibility urgently. ${d.auditRanAt ? `The ${d.audit.reduce((a,c)=>a+c.facs.filter(f=>f.st==='fail').length,0)} failing factors in your audit are the first place to look.` : 'Run a site audit to find out which technical signals are blocking you.'}`};
  return{head:`Increase Website Citations from ${cited} to ${Math.max(cited*2,12)}+`,
    body:`${b.name} has ${d.cells.filter(c=>c.m>0).length} mentions and ${lvl} visibility (${d.total.toFixed(1)}), yet your domain is cited as a source in only ${cited} prompts. Weakest platform is ${worst.n} (${worst.score.toFixed(1)}). Implementing Organization and FAQ schema plus canonical URLs can double citations in the short term.`};
}
async function answerModal(runId){
  openModal('Raw answer inspector',
    '<div class="empty"><div class="ic">◎</div>Loading the answer…</div>');
  let d;
  try{ d = await api.get(`/api/answers?run=${runId}`); }
  catch(e){ $('#mBody').innerHTML = `<div class="empty">${esc(e.message)}</div>`; return; }

  // Highlights come from the server, computed by the same matcher that scored
  // the run, so what the reader sees is exactly what was counted.
  let html='', cursor=0;
  for(const sp of d.spans||[]){
    if(sp.start<cursor) continue;
    html += esc(d.answer.slice(cursor, sp.start));
    html += `<mark class="${sp.self?'':'riv'}">${esc(d.answer.slice(sp.start, sp.end))}</mark>`;
    cursor = sp.end;
  }
  html += esc((d.answer||'').slice(cursor));

  const sent = d.sentiment===null ? '—' : (d.sentiment>=0?'+':'')+Number(d.sentiment).toFixed(2);
  $('#mBody').innerHTML = `
   <div style="font-size:12.5px;color:var(--mute);margin-bottom:6px">Prompt</div>
   <div style="font-size:14.5px;font-weight:500;margin-bottom:16px">${esc(d.prompt)}</div>
   <div style="display:flex;gap:8px;flex-wrap:wrap;margin-bottom:16px">
     <span class="chip">${esc(d.engine)}</span>
     <span class="chip ${d.mentioned?'ok':'bad'}">${d.mentioned?'Mentioned':'Not mentioned'}</span>
     ${d.rank?`<span class="chip">rank ${d.rank}</span>`:''}
     <span class="chip ${d.cited?'ok':''}">${d.cited?'Cited as source':'No citation'}</span>
     <span class="chip">sentiment ${sent}</span>
     ${d.recommendation?`<span class="chip pri">${esc(d.recommendation)}</span>`:''}
     <span class="chip">run ${d.runIndex+1}</span>
   </div>
   <div style="border:1px solid var(--border);border-radius:10px;padding:16px;background:#0D0F15;
        font-size:14px;line-height:1.75;white-space:pre-wrap">${html}</div>
   ${d.citations&&d.citations.length?`<div style="margin-top:14px;display:flex;gap:7px;flex-wrap:wrap">
     ${d.citations.map(c=>`<span class="chip">${esc(c)}</span>`).join('')}</div>`:''}
   <p style="font-size:12px;color:var(--mute);margin-top:14px">
     ${esc(d.modelVersion||'unknown model')} · collected via ${d.method==='official_api'?'the official API':'a licensed SERP provider'}
     · ${new Date(d.askedAt).toLocaleString('en-GB')}
     ${d.degraded?`<br><span class="warn">Extraction ran without the judge model (${esc(d.degraded)}), so recommendation and sentiment are defaults.</span>`:''}
   </p>`;
}

VIEWS.rivals=()=>{

  const rows=[
    {n:S.brand.name, you:true, site:d.host, mentions:self.v, sov:self.pct, rank:null, id:null},
    ...S.rivals.map(r=>{
      const s2=d.sov.find(x=>x.n===r.n);
      const raw=(S.rawCompetitors||[]).find(c=>c.id===r.id);
      return {n:r.n, you:false, site:r.d||'—', id:r.id,
        mentions:s2?s2.v:0, sov:s2?s2.pct:0,

     <th class="n">Mentions</th><th class="n">Share of voice</th><th class="n">Avg. rank</th><th></th></tr></thead>
   <tbody>${rows.map((x,i)=>`<tr>
     <td class="n">${i+1}</td>
     <td><span style="display:flex;align-items:center;gap:9px"><span style="width:21px;height:21px;border-radius:6px;
       background:${x.you?'rgba(59,130,246,.22)':'rgba(139,92,246,.2)'};color:${x.you?'#BBD1FF':'#D6C9FF'};
       border:1px solid ${x.you?'rgba(59,130,246,.4)':'rgba(139,92,246,.38)'};display:grid;place-items:center;
       font-size:10px;font-weight:700">${ini(x.n)}</span>
       <b style="${x.you?'color:#93B4FF':''}">${esc(x.n)}</b>${x.you?' <span class="chip pri">you</span>':''}</span></td>
     <td class="mut mono" style="font-size:12px">${esc(x.site)}</td>
     <td class="n" style="font-weight:600">${x.mentions}</td>
     <td class="n">${x.sov.toFixed(1)}%</td>
     <td class="n">${x.rank!==null?x.rank.toFixed(1):'—'}</td>
     <td>${x.you?'':`<button class="btn b-gh b-sm" onclick="rmRival('${x.id}')">Remove</button>`}</td></tr>`).join('')}
   </tbody></table></div></div>

   <div class="g2">
    <div class="card"><div class="ch"><div><h3>Share of voice</h3>
      <div class="sub">Mentions across the tracked brand set — same prompts, same day</div></div></div>
      <div class="cb">${sovBars(rows)}</div></div>

    <div class="card"><div class="ch"><div><h3>Attribute matching</h3>
      <div class="sub">Which qualities models associate with each brand</div></div></div>
      <div class="cb"><div class="empty"><div class="ic">◈</div>
        <b style="color:var(--fg);font-size:14px">Not enough answers yet</b>
        <p style="margin-top:8px;max-width:46ch;margin-inline:auto">Attribute extraction needs the judge model and a
          few hundred answers before it says anything meaningful. It appears once the corpus is large enough.</p>
      </div></div></div>
   </div>`;
};

function sovBars(rows){
  const max=Math.max(...rows.map(r=>r.mentions),1);
  return rows.map(r=>`
   <div style="padding:9px 0;border-bottom:1px solid var(--border)">
     <div style="display:flex;font-size:13px;margin-bottom:6px">
       <span style="flex:1;${r.you?'font-weight:600;color:#93B4FF':''}">${esc(r.n)}</span>
       <span class="mono" style="font-size:12px">${r.mentions} · ${r.sov.toFixed(1)}%</span></div>
     <span class="bar"><i style="width:${r.mentions/max*100}%;background:${r.you?'#3B82F6':'#8B5CF6'}"></i></span>
   </div>`).join('')
   +`<p style="font-size:12px;color:var(--mute);margin-top:12px">The denominator is the tracked brand set only.
     Adding a competitor changes every share, which is why comparisons stay inside one set.</p>`;
}

  catch(e){ p.active=!next; render(); toast(e.message); }
}
async function delPrompt(id){
  try{ await api.del(`/api/prompts?id=${encodeURIComponent(id)}`); await loadResults(); toast('Prompt deleted'); }

      <div class="cb">${d.audit.map((c,i)=>{
        const col=c.score>=60?'#22C55E':c.score>=40?'#F59E0B':'#EF4444';

        return `<div class="acc"><div class="acc-h" onclick="this.parentNode.classList.toggle('open')">
          <div class="i" style="background:${col}26;color:${tcol};border:1px solid ${col}55;font-weight:700">${c.score.toFixed(0)}</div>

            ${c.facs.filter(f=>f.st==='pass').length} passed, ${c.facs.filter(f=>f.st==='partial').length} partial,
            ${c.facs.filter(f=>f.st==='fail').length} failed</div></div>
          <div class="m"><span class="bar" style="width:90px"><i style="width:${c.score}%;background:${col}"></i></span></div></div>
          <div class="acc-b">${c.facs.map((f,j)=>`
            <div style="display:flex;gap:10px;align-items:flex-start;padding:9px 0;border-bottom:1px solid var(--border)">
              <span class="chip ${f.st==='pass'?'ok':f.st==='partial'?'warn':'bad'}" style="flex:none">

              <span style="font-size:13px;flex:1">${f.n}</span>
              ${f.fix?`<button class="btn b-gh b-sm" onclick="fixModal('${encodeURIComponent(f.n)}')">Fix</button>`:''}
            </div>`).join('')}</div></div>`}).join('')}</div></div>

    <div class="card"><div class="ch"><div><h3>Total score</h3></div></div>
      <div class="cb" style="text-align:center">
        ${gauge(d.auditScore,d.auditScore>=60?'#22C55E':d.auditScore>=40?'#F59E0B':'#EF4444')}

async function runAudit(){
  const btn=$('#auditBtn'); const url=$('#auditUrl')?$('#auditUrl').value.trim():'';
  if(btn){btn.disabled=true;btn.textContent='Crawling…';}
  try{
    const r=await api.post('/api/audit',{workspaceId:S.workspaceId,url:url||undefined});
    await loadResults();
    toast(`Audit complete — ${r.score.toFixed(0)}/100 · ${r.remaining} left this month`);
  }catch(e){
    toast(e.message);
    if(btn){btn.disabled=false;btn.textContent='Run Audit';}

function fixModal(key){
  const k=decodeURIComponent(key);
  let fix=null, detail='';
  (S.data.audit||[]).forEach(c=>c.facs.forEach(f=>{ if(f.n===k){fix=f.fix;detail=f.detail||'';} }));
  openModal(k, fix
    ? `<p style="font-size:13px;color:var(--mute);margin-bottom:12px">${esc(detail)}</p>
       <pre id="fixc">${esc(fix)}</pre>
       <div style="display:flex;gap:9px;margin-top:14px">
         <button class="btn b-pri b-sm" onclick="copy('fixc')">Copy</button>
         <button class="btn b-gh b-sm" onclick="dl('fix.txt',document.getElementById('fixc').textContent)">Download</button>
       </div>`
    : `<p style="font-size:13.5px;color:var(--mute)">${esc(detail||'No automated fix for this factor.')}</p>`);
}

function exportAudit(){
  const rows=[['Category','Factor','Status']];
  S.data.audit.forEach(c=>c.facs.forEach(f=>rows.push([c.n,f.n,f.st])));
  dl('yanki-audit.csv',csv(rows),'text/csv;charset=utf-8');
}

   llms:{t:'LLMs.txt Generator',d:'Create the llms.txt file that helps AI platforms understand and reference your brand',

       JSON.stringify({"@context":"https://schema.org","@type":"FAQPage",mainEntity:S.prompts.slice(0,4).map(p=>({
        "@type":"Question",name:p.text.replace(/"/g,''),acceptedAnswer:{"@type":"Answer",
        text:'40-60 word direct answer.'}})) },null,2)+'\n<\/script>',file:'schema.html'},

function runGen(){
  const map={robots:'robots.txt',llms:'llms.txt',schema:'schema.html',meta:'meta-tags.html'};

    <button class="btn b-gh b-sm" onclick="dl('${map[tool]}',document.getElementById('gc').textContent)">Download</button></div>`;
  toast(map[tool]+' generated');
}
function toolOutput(){
  const b=S.brand;
  if(tool==='robots')return `# robots.txt — ${b.name}\n# generated by YANKI\n\nUser-agent: *\nAllow: /\nDisallow: /admin/\n\n# ---- AI crawlers ----\n`+
    ['GPTBot','OAI-SearchBot','ChatGPT-User','PerplexityBot','Perplexity-User','ClaudeBot','Claude-User','Claude-SearchBot','Google-Extended','Applebot-Extended','meta-externalagent','Amazonbot','cohere-ai']
    .map(u=>`User-agent: ${u}\nAllow: /\n`).join('\n')+`\nUser-agent: Bytespider\nDisallow: /\n\nSitemap: ${b.site}/sitemap.xml`;
  if(tool==='llms')return `# ${b.name}\n\n> ${b.desc||b.name+' is a brand operating in '+sectorTerm(b.sector)+'.'}\n\n## Brand facts\n- Industry: ${b.sector}\n- Location: ${b.city?b.city+', ':''}${b.country}\n`+
    (S.variants.length?`- Alternative names: ${S.variants.join(', ')}\n`:'')+
    `\n## Key pages\n- [Home](${b.site})\n- [About](${b.site}/about)\n- [Products / Services](${b.site}/products)\n- [FAQ](${b.site}/faq)\n- [Contact](${b.site}/contact)\n\n## Featured topics\n`+
    S.prompts.slice(0,6).map(p=>'- '+p.text.replace(/"/g,'')).join('\n')+`\n\n## Contact\n- Web: ${b.site}\n`;
  if(tool==='schema')return '<script type="application/ld+json">\n'+schemaOrg()+'\n<\/script>\n\n<script type="application/ld+json">\n'+
    JSON.stringify({"@context":"https://schema.org","@type":"FAQPage",mainEntity:S.prompts.slice(0,4).map(p=>({
     "@type":"Question",name:p.text.replace(/"/g,''),acceptedAnswer:{"@type":"Answer",
     text:`${b.name} is ... in ${sectorTerm(b.sector)}. (40-60 word direct answer.)`}}))},null,2)+'\n<\/script>';
  // A meta description must stand on its own: models and SERPs both quote it
  // verbatim. Falling back to just the brand name produces a useless tag, so
  // we compose one from what we know and pad it to a usable length.
  const place=b.city?`${b.city}, ${b.country}`:b.country;
  const desc=((b.desc||'').trim().length>=60
    ? b.desc.trim()
    : `${b.name}, ${place} pazarında ${sectorTerm(b.sector)} alanında hizmet veren bir markadır.`+
      (b.desc?` ${b.desc.trim()}`:'')).replace(/\s+/g,' ').slice(0,158);
  const title=`${b.name} — ${sectorTerm(b.sector)}${b.city?' | '+b.city:''}`.slice(0,60);
  const locale=b.country==='Turkey'?'tr_TR':'en_US';
  return `<title>${title}</title>\n<meta name="description" content="${desc}">\n<link rel="canonical" href="${b.site}">\n\n<meta property="og:type" content="website">\n<meta property="og:site_name" content="${b.name}">\n<meta property="og:title" content="${title}">\n<meta property="og:description" content="${desc}">\n<meta property="og:url" content="${b.site}">\n<meta property="og:locale" content="${locale}">\n\n<meta name="twitter:card" content="summary_large_image">\n<meta name="twitter:title" content="${title}">\n<meta name="twitter:description" content="${desc}">\n\n<!-- AI crawlers -->\n<meta name="robots" content="index,follow,max-snippet:-1,max-image-preview:large">`;
}
function writerFor(pid){const p=S.prompts.find(x=>x.id===pid);S.writerTopic=p?p.text.replace(/"/g,''):'';
  tool='writer';go('tools');setTimeout(runWriter,60)}
function runWriter(){
  const topic=($('#wTopic')?.value||S.writerTopic||'').trim();
  if(!topic){toast('Topic is required');return}
  const type=document.querySelector('#ctype button.on')?.dataset.t||'blog';
  const b=S.brand,sec=sectorTerm(b.sector);
  const T=topic.charAt(0).toLocaleUpperCase('tr')+topic.slice(1);
  let md='';
  if(type==='faq'){
    md=`# ${T} — Frequently Asked Questions\n\n`+
    [`What is ${T}?`,`How do you choose ${T}?`,`What does ${b.name} offer here?`,`How does pricing work?`,`How long until results?`]
    .map(q=>`## ${q}\n\n${b.name} … in ${sec}. (40–60 word direct answer.) This section should include at least one numeric data point and one source link.\n`).join('\n');
  }else if(type==='cmp'){
    md=`# ${T}: Comparison (${new Date().getFullYear()})\n\nWhen choosing ${T}, the criteria that matter are price, local support, integration depth and setup time. The table below puts the leading options side by side.\n\n`+
    `| Criterion | ${b.name} | ${(S.rivals[0]?.n)||'Competitor A'} | ${(S.rivals[1]?.n)||'Competitor B'} |\n|---|---|---|---|\n`+
    `| Price | … | … | … |\n| Local support | … | … | … |\n| Setup time | … | … | … |\n| Integrations | … | … | … |\n\n`+
    `## Which one, and when?\n\n…\n\n## Verdict\n\n${b.name} stands out in the ${b.city||b.country} market thanks to … .\n`;
  }else if(type==='how'){
    md=`# ${T} — Step-by-Step Guide\n\n${T} is the process to follow for … in ${sec}. The steps below take about … to complete.\n\n`+
    [1,2,3,4,5].map(i=>`## Step ${i}: …\n\n… (clear, actionable instruction)\n`).join('\n')+
    `\n## Common mistakes\n\n- …\n- …\n\n## Summary\n\n…\n`;
  }else{
    md=`# ${T}\n\n${T} is a frequently asked topic in ${sec} in the ${b.city||b.country} market. This article covers everything from the definition to the selection criteria, with data.\n\n`+
    `## What is ${T}?\n\n… (40–60 word direct answer in the first paragraph — this is the part models quote.)\n\n`+
    `## How does it work?\n\n…\n\n## Selection criteria\n\n| Criterion | Why it matters | How to measure |\n|---|---|---|\n| … | … | … |\n\n`+
    `## The ${b.name} approach\n\n${b.desc||'…'}\n\n## FAQ\n\n**How long does ${T} take?**\n…\n\n**What does it cost?**\n…\n\n`+
    `---\n*Published: ${new Date().toLocaleDateString('en-GB')} · Author: ${b.name} editorial team*\n`;
  }
  const check=[['Direct answer in first paragraph','ok'],['Headings in question form',type==='faq'?'ok':'warn'],
    ['Comparison table',type==='cmp'||type==='blog'?'ok':'warn'],['Date and author info','ok'],
    ['FAQPage schema suggested','ok'],['Add numeric data','warn']];
  $('#wOut').innerHTML=`<div style="display:flex;align-items:center;gap:10px;margin-bottom:12px">
    <b style="font-size:14px">Draft ready</b><span class="chip pri">${{blog:'Blog',faq:'FAQ',cmp:'Comparison',how:'How-To'}[type]}</span>
    <span style="margin-left:auto;display:flex;gap:8px">
      <button class="btn b-gh b-sm" onclick="copy('wmd')">Copy</button>
      <button class="btn b-pri b-sm" onclick="dl('content.md',document.getElementById('wmd').textContent,'text/markdown')">⭳ .md</button></span></div>
   <pre id="wmd" style="max-height:340px;overflow:auto">${esc(md)}</pre>
   <div style="margin-top:14px"><b style="font-size:13px">GEO checklist</b>
     <div style="display:flex;gap:7px;flex-wrap:wrap;margin-top:9px">
       ${check.map(c=>`<span class="chip ${c[1]}">${c[1]==='ok'?'✓':'!'} ${c[0]}</span>`).join('')}</div></div>`;
  toast('Content draft generated');
}

function addVar2(){const v=$('#vv').value.trim();if(!v)return;if(!S.variants.includes(v))S.variants.push(v);render();toast('Variant added')}
/**
 * Provider status. `probe` runs a real one-token call against every configured
 * key, which is the only way to distinguish "key present" from "key works".
 * A retired model name is the most common failure and it is invisible until
 * you actually call the provider.
 */
async function loadEngines(probe){
  const box=$('#engBox'); if(!box) return;
  if(probe) box.innerHTML='<div class="empty"><div class="ic">◉</div>Testing every provider…</div>';
  let d;
  try{ d=await api.get('/api/engines'+(probe?'?test=1':'')); }
  catch(e){ box.innerHTML=`<div class="empty">${esc(e.message)}</div>`; return; }

  const badge=e=>{
    if(!e.configured) return '<span class="chip">No key</span>';
    if(!e.planOk) return '<span class="chip warn">Above your plan</span>';
    if(!e.test)   return '<span class="chip ok">Key present</span>';
    return e.test.ok
      ? `<span class="chip ok">Working${e.test.latencyMs?' · '+e.test.latencyMs+'ms':''}</span>`
      : '<span class="chip bad">Failing</span>';
  };

  box.innerHTML = `
   <div style="display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:14px">
     <div><h4 style="font-size:15px">AI providers</h4>
       <p style="font-size:12.5px;color:var(--mute);margin-top:3px">
         Each key is set as an environment variable on the server. A platform with no key is skipped silently —
         it never produces a zero that looks like bad visibility.</p></div>
     <button class="btn b-gh b-sm" style="margin-left:auto" onclick="loadEngines(true)">Test all keys</button>
   </div>
   ${d.mock?`<div class="banner" style="margin-bottom:14px"><span>⚠</span>
     <span>MOCK_ENGINES is on. Answers are synthetic — set it to 0 and add real keys before launch.</span></div>`:''}
   ${!d.ready?`<div class="banner" style="margin-bottom:14px;border-color:rgba(239,68,68,.3);background:rgba(239,68,68,.07)">
     <span>🔑</span><span>No usable provider yet. Scans cannot run until at least one key is configured.</span></div>`:''}
   ${d.engines.map(e=>`
     <div class="card" style="margin-bottom:10px"><div class="cb"
        style="display:flex;align-items:center;gap:14px;flex-wrap:wrap">
       <div style="flex:1;min-width:220px">
         <b style="font-size:14px">${esc(e.label)}</b>
         <p style="font-size:12.5px;color:var(--mute);margin-top:3px">
           ${e.envKey?`<code>${esc(e.envKey)}</code>`:''}
           ${e.model?` · model <code>${esc(e.model)}</code>`:''}
           · weight ${e.weight.toFixed(2)}
           · ${e.method==='official_api'?'official API':'licensed SERP provider'}</p>
         ${e.test&&!e.test.ok?`<p style="font-size:12px;color:#FCA5A5;margin-top:6px">${esc(e.test.detail)}</p>`:''}
       </div>
       ${badge(e)}
     </div></div>`).join('')}
   <p style="font-size:12px;color:var(--mute);margin-top:12px">
     Model names are configuration, not code. If a provider retires a model, set the matching
     <code>*_MODEL</code> variable rather than waiting for a release.</p>`;
}

async function changePassword(){

  if(!cur||!next) return toast('Fill in both fields');
  try{
    await api.post('/api/auth/password',{current:cur,next});
    $('#pwCur').value=''; $('#pwNew').value='';
    toast('Password updated — other devices were signed out');
  }catch(e){ toast(e.message); }
}

/* ---------- boot ----------
   Session first. A signed-in user with an onboarded workspace lands straight
   on the dashboard — refreshing the page must never send anyone back through
   setup. */
async function boot(){
  let me;
  try{ me = await api.get('/api/auth/me'); }
  catch{ document.body.innerHTML =
    '<div style="display:grid;place-items:center;min-height:100vh;color:#949CAD;font-size:14px">'+
    'Could not reach the server. Refresh to try again.</div>'; return; }

  if(!me.signedIn){ location.replace('/giris'); return; }

  // Full name if we have one; otherwise the local part of the address, since
  // a 30-character email overflows the sidebar and tells the user nothing.
  S.user={name: me.user.fullName || me.user.email.split('@')[0], mail: me.user.email};
  S.plan=me.org.plan; S.planLimits=me.limits; S.org=me.org; S.role=me.role;

  const ready=(me.workspaces||[]).find(w=>w.onboarded);
  if(ready){
    S.workspaceId=ready.id;
    S.brand.name=ready.brand_name; S.brand.site=ready.domain; S.brand.sector=ready.sector;
    $('#ob').classList.remove('on'); $('#app').classList.add('on');
    render();                       // shell immediately, data after
    try{ await loadResults(); }
    catch(e){ S.loadError=e.message; render(); }
    if(S.scanState && S.scanState.pending>0) pollScan();
    return;
  }

  // Half-finished setup: resume on the identity step rather than starting over.
  const draft=(me.workspaces||[])[0];
  if(draft){
    S.workspaceId=draft.id;
    S.brand={name:draft.brand_name,site:draft.domain,sector:draft.sector,
      country:'Turkey',city:'',desc:''};
    S.step=2;
  }
  renderOb();
}

let pollTimer=null, ticking=false;

/**
 * While a scan is outstanding: ask the server to process a batch, then refresh.
 * The two calls are separate on purpose — a provider can take thirty seconds
 * to answer, and the read must never wait on that.
 */
function pollScan(){
  clearTimeout(pollTimer);
  let rounds=0;
  const step=async()=>{
    rounds++;
    try{
      if(!ticking){
        ticking=true;
        try{ await api.post('/api/scan/tick',{workspaceId:S.workspaceId}); }
        finally{ ticking=false; }
      }
      await loadResults({silent:true});
      render();
      const pending=S.scanState?S.scanState.pending:0;
      if(pending>0 && rounds<80) pollTimer=setTimeout(step,900);
    }catch(e){
      // Transient failures are expected while providers are being called.
      if(rounds<80) pollTimer=setTimeout(step,6000);
    }
  };
  pollTimer=setTimeout(step,600);
}

boot();
