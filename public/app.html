function lineChart(vals,o={}){
  const W=o.w||460,H=o.h||180,P={l:30,r:8,t:10,b:20};
  // One data point is the normal state on day one. Draw a flat marker rather
  // than emitting a malformed path.
  if(!vals.length) return `<div class="empty" style="padding:28px">${T("No history yet — the first scan writes today's point.")}</div>`;
  if(vals.length===1) vals=[vals[0],vals[0]];
  const N=vals.length;
  const mn=o.min??0,mx=o.max??100,uid='g'+Math.random().toString(36).slice(2,7);
  const x=i=>P.l+(i/(N-1||1))*(W-P.l-P.r),y=v=>H-P.b-((v-mn)/(mx-mn||1))*(H-P.t-P.b);
  let L='',G='';vals.forEach((v,i)=>L+=(i?'L':'M')+x(i).toFixed(1)+' '+y(v).toFixed(1));
  const A=L+`L${x(N-1).toFixed(1)} ${H-P.b}L${x(0).toFixed(1)} ${H-P.b}Z`;
  (o.ticks||[0,25,50,75,100]).forEach(v=>{G+=`<line x1="${P.l}" y1="${y(v)}" x2="${W-P.r}" y2="${y(v)}" stroke="var(--border)"/>
    <text x="${P.l-5}" y="${y(v)+3.5}" text-anchor="end" font-size="10" fill="var(--mute2)" font-family="ui-monospace">${v}</text>`});
  const col=o.color||'var(--pri)';
  return `<svg viewBox="0 0 ${W} ${H}" width="100%" style="display:block;overflow:hidden">
   <defs><linearGradient id="${uid}" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="${col}" stop-opacity=".4"/><stop offset="1" stop-color="${col}" stop-opacity="0"/></linearGradient></defs>
   ${G}<path d="${A}" fill="url(#${uid})"/><path d="${L}" fill="none" stroke="${col}" stroke-width="2" stroke-linejoin="round"/>
   <circle cx="${x(N-1)}" cy="${y(vals[N-1])}" r="3.4" fill="${col}" stroke="var(--card)" stroke-width="2"/>
   ${(o.xlab||[]).map((t,i,a)=>`<text x="${P.l+(i/(a.length-1))*(W-P.l-P.r)}" y="${H-4}" text-anchor="middle"
     font-size="10" fill="var(--mute2)" font-family="ui-monospace">${t}</text>`).join('')}</svg>`;
}
function donut(items,center,sub){
  const R=58,SW=21,cx=72,cy=72;let a=-Math.PI/2,arcs='';
  const tot=items.reduce((s,i)=>s+i.v,0);
  if(!tot)arcs=`<circle cx="${cx}" cy="${cy}" r="${R-SW/2}" fill="none" stroke="var(--border)" stroke-width="${SW}"/>`;
  items.forEach(d=>{if(!tot)return;const a2=a+(d.v/tot)*Math.PI*2,pt=(r,t)=>[cx+r*Math.cos(t),cy+r*Math.sin(t)];
    const[x1,y1]=pt(R,a),[x2,y2]=pt(R,a2),[x3,y3]=pt(R-SW,a2),[x4,y4]=pt(R-SW,a);
    const lg=(a2-a)>Math.PI?1:0;
    arcs+=`<path d="M${x1} ${y1}A${R} ${R} 0 ${lg} 1 ${x2} ${y2}L${x3} ${y3}A${R-SW} ${R-SW} 0 ${lg} 0 ${x4} ${y4}Z" fill="${d.c}"/>`;a=a2});
  return `<svg viewBox="0 0 144 144" width="146" style="flex:none">${arcs}
    <text x="72" y="70" text-anchor="middle" font-size="21" font-weight="600" fill="var(--fg)">${center}</text>
    <text x="72" y="86" text-anchor="middle" font-size="10" fill="var(--mute2)" font-family="ui-monospace">${sub}</text></svg>`;
}
/**
 * Trend chart scaled to its data.
 *
 * The shared lineChart() pins the axis to 0–100, which is right for a gauge and
 * wrong for a trend: a brand moving 6 → 15 draws a flat line along the floor and
 * the reader concludes nothing happened, when the score has more than doubled.
 * This frames the range it was given and labels it, so the shape is readable
 * and the scale is not a lie.
 */
function trendChart(ser){
  if(!ser || ser.length<2) return `<div class="empty" style="padding:34px 12px">
    <div class="ic">◜</div>${T('Ölçüm biriktikçe eğri oluşur')}</div>`;
  const W=680,H=190,PL=38,PR=14,PT=14,PB=26;
  const lo=Math.min(...ser), hi=Math.max(...ser);
  const span=Math.max(1,hi-lo);
  const step=span<8?2:span<25?5:10;
  const y0=Math.max(0,Math.floor((lo-span*0.3)/step)*step);
  const y1=Math.min(100,Math.ceil((hi+span*0.3)/step)*step);
  const sx=i=>PL+i/(ser.length-1)*(W-PL-PR);
  const sy=v=>PT+(1-(v-y0)/((y1-y0)||1))*(H-PT-PB);
  const line=ser.map((v,i)=>(i?'L':'M')+sx(i).toFixed(1)+' '+sy(v).toFixed(1)).join(' ');
  const up=ser[ser.length-1]>=ser[0];
  const col=up?'var(--ok)':'var(--bad)';
  return `<svg viewBox="0 0 ${W} ${H}" style="width:100%;height:200px;display:block" role="img"
    aria-label="${esc(T('Visibility Trend'))}">
    <defs><linearGradient id="tgr" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="${col}" stop-opacity=".20"/>
      <stop offset="1" stop-color="${col}" stop-opacity="0"/></linearGradient></defs>
    ${[y0,(y0+y1)/2,y1].map(t=>`
      <line x1="${PL}" x2="${W-PR}" y1="${sy(t).toFixed(1)}" y2="${sy(t).toFixed(1)}"
        stroke="currentColor" stroke-opacity=".12"/>
      <text x="${PL-8}" y="${(sy(t)+3.5).toFixed(1)}" text-anchor="end" font-size="10"
        fill="currentColor" fill-opacity=".45">${t.toFixed(0)}</text>`).join('')}
    <path d="${line} L ${sx(ser.length-1).toFixed(1)} ${H-PB} L ${PL} ${H-PB} Z" fill="url(#tgr)"/>
    <path d="${line}" fill="none" stroke="${col}" stroke-width="2"
      stroke-linejoin="round" stroke-linecap="round"/>
    <circle cx="${sx(ser.length-1).toFixed(1)}" cy="${sy(ser[ser.length-1]).toFixed(1)}" r="3.5" fill="${col}"/>
    <text x="${PL}" y="${H-7}" font-size="10" fill="currentColor" fill-opacity=".45">-${S.range} ${T('gün')}</text>
    <text x="${W-PR}" y="${H-7}" text-anchor="end" font-size="10"
      fill="currentColor" fill-opacity=".45">${T('bugün')}</text>
  </svg>`;
}

function gauge(v,col){
  const R=62,cx=84,cy=84,a0=Math.PI*.78,a1=Math.PI*2.22,ang=a0+(v/100)*(a1-a0);
  const pt=(r,a)=>[(cx+r*Math.cos(a)).toFixed(1),(cy+r*Math.sin(a)).toFixed(1)];
  const arc=(f,t,r,w,c)=>{const[x1,y1]=pt(r,f),[x2,y2]=pt(r,t);
    return `<path d="M${x1} ${y1}A${r} ${r} 0 ${(t-f)>Math.PI?1:0} 1 ${x2} ${y2}" fill="none" stroke="${c}" stroke-width="${w}" stroke-linecap="round"/>`};
  return `<svg viewBox="0 0 168 142" width="190" style="max-width:100%">${arc(a0,a1,R,14,'var(--border)')}${arc(a0,ang,R,14,col)}
    <text x="84" y="90" text-anchor="middle" font-size="34" font-weight="600" fill="var(--fg)">${v.toFixed(0)}</text>
    <text x="84" y="108" text-anchor="middle" font-size="10" fill="var(--mute2)" font-family="ui-monospace">${T("OUT OF 100")}</text></svg>`;
}

/**
 * How much sits behind each link. Enterprise tools show volume in the
 * navigation because it tells the reader where the work is before they open
 * anything — and because a column of counts is the difference between a menu
 * and an index. Null when the number would be a guess: an unloaded workspace
 * shows nothing rather than a zero.
 */
function navCount(route){
  const d=S.data;
  if(!d) return null;
  switch(route){
    case 'mentions':  return new Set(d.cells.filter(c=>c.m>0).map(c=>c.p.id)).size || null;
    case 'platforms': return d.plats.filter(p=>!p.locked&&p.measured!==false&&p.checks>0).length || null;
    case 'sources':   return (d.sources||[]).length || null;
    case 'rivals':    return (S.rivals||[]).length || null;
    case 'prompts':   return (d.opps||[]).length || null;
    case 'opps':      return (d.opps||[]).filter(o=>o.opp>0).length || null;
    case 'plan':      return (d.audit||[]).reduce((a,c)=>a+c.facs.filter(f=>f.st==='fail').length,0) || null;
    default: return null;
  }
}

function renderNav(){
  $('#nav').innerHTML=NAV.map(it=>{
    if(it.sec) return `<div class="sec">${T(it.sec)}</div>`;
    // The collapsible "Analytics" group is gone. It hid four pages behind a
    // click, and the toggle was broken in Turkish anyway: the handler wrote
    // S.openNav['Analitik'] while the render read S.openNav['Analytics'], so
    // the group could never open. Section headings already give the grouping
    // the collapse was there to provide.
    const n=navCount(it.r);
    return `<a class="${S.route===it.r?'on':''}" href="#" onclick="go('${it.r}');return false">${ic(it.g)}
      <span>${T(it.n)}</span>${n===null?'':`<span class="ct">${n}</span>`}</a>`;
  }).join('');
  const brand=S.brand.name||'—';
  $('#wsName').textContent=brand;
  $('#wsInitial').textContent=brand.slice(0,1).toLocaleUpperCase('tr');
  const hostEl=$('#wsHost');
  if(hostEl) hostEl.textContent=(S.brand.site||'').replace(/^https?:\/\//,'').replace(/\/$/,'');
  $('#uAv').textContent=(S.user.name||'YK').slice(0,2).toLocaleUpperCase('tr');
  $('#uName').textContent=S.user.name;
  const mailEl=$('#uMail'); if(mailEl) mailEl.textContent=S.user.email||'';
  const scEl=$('#wsScore'), barEl=$('#wsScoreBar');
  const v=S.data&&S.data.ready?S.data.total:null;
  if(scEl) scEl.textContent = v===null?'—':v.toFixed(1);
  if(barEl){
    barEl.style.width = v===null?'0%':Math.max(1.5,v)+'%';
    barEl.className = v===null?'':v<35?'bad':v<60?'mid':'';
  }

  // Workspace switcher. The old control was a button that toasted "single
  // workspace" whatever the plan allowed, so an Agency customer with 25 brands
  // had no way to move between them.
  const cap=(S.planLimits&&S.planLimits.workspaces)||1;
  const wsBox=$('#wsMenu');
  if(wsBox){
    wsBox.className = S.wsMenu ? 'wsmenu open' : 'wsmenu';
    // The add row sits outside the scrolling list: with a dozen brands it would
    // otherwise be the one control you have to scroll to reach.
    wsBox.innerHTML = S.wsMenu ? `
      <div class="list">
        ${S.workspaces.map(w=>`<button class="${w.id===S.workspaceId?'on':''}" onclick="switchWs('${w.id}')">
           <span class="sq">${esc((w.brand_name||'?').slice(0,1).toLocaleUpperCase('tr'))}</span>
           <span class="t"><b>${esc(w.brand_name||'—')}</b><i>${esc((w.domain||'').replace(/^https?:\/\//,''))}</i></span>
           ${w.id===S.workspaceId?'<span class="ck">✓</span>':''}</button>`).join('')}
      </div>
      <div class="sep"></div>
      <button class="add" onclick="newBrand()">
        <span class="pl">+</span>${T('Add brand')}
        <span class="cnt">${S.workspaces.length}/${cap}</span></button>` : '';
  }

  // Scan state, visible from every screen rather than only the dashboard.
  const sp=$('#scanPill');
  if(sp){
    const sc=S.scanState, pending=sc?sc.pending:0;
    // Failures here are provider-side: a spent credit balance, a rejected key.
    // They belong to accounts the customer does not hold, so for them a scan
    // that collected what it could is simply a finished scan. The operator
    // gets the count, because for the operator it is a work item.
    const failing=(sc&&(sc.failures||[]).length)||0;
    sp.innerHTML = S.scanBusy
      ? `<span class="dot run"></span>${T('Starting…')}`
      : pending>0
        ? `<span class="dot run"></span>${T('Scanning')} · ${pending}`
        : (failing && S.isAdmin)
          ? `<span class="dot bad"></span>${T('Operator')} · ${failing} ${T('platform error(s)')}`
          : sc&&sc.finished_at
            ? `<span class="dot ok"></span>${T('Updated')} ${relTime(sc.finished_at)}`
            : `<span class="dot idle"></span>${T('No scan yet')}`;
  }
  // Header scan control. The sidebar keeps the freshness indicator; the action
  // itself belongs where the eye lands, not in a 11px button below the nav.
  const hr=$('#headRescan'), hs=$('#headScan');
  const prog=scanProgress();
  const busy=S.scanBusy||!!prog;
  if(hr){
    hr.disabled=busy;
    hr.textContent=busy ? T('Scanning…') : '↻ '+T('Rescan');
  }
  if(hs){
    hs.innerHTML = prog
      ? `<b>${prog.total?`${prog.done} / ${prog.total}`:prog.pending}</b> ${T('checks done')}`
      : S.scanState&&S.scanState.finished_at
        ? `${T('Last updated')} <b>${relTime(S.scanState.finished_at)}</b>`
        : T('No scan yet');

  // These two sit in the static shell rather than a rendered template, so they
  // need filling in on every repaint — including after a language switch.
  const fb=$('#fbLabel');   if(fb) fb.textContent=T('Feedback');
  const planName={trial:T('Trial'),starter:T('Starter'),growth:T('Growth'),pro:T('Growth'),business:T('Business'),agency:T('Agency')}[S.plan]||S.plan;
  const dleft=trialDaysLeft();
  // A countdown is more legible than a sentence about a countdown, and the bar
  // does the persuading a paragraph was doing badly.
  const pct=dleft===null?100:Math.max(4,Math.min(100,Math.round(dleft/7*100)));
  $('#trialBox').className = S.plan==='trial' ? 'trial' : '';
  $('#trialBox').innerHTML=S.plan==='trial'

function render(){
  renderNav();
  renderChrome();
  const page=$('#page');
  // Data has not arrived yet, or arriving failed. Either way the user gets a
  // legible screen instead of a blank one.
  if(!S.data){ page.innerHTML=S.loadError?errorScreen(S.loadError):loadingScreen(); return; }
  try{
    page.innerHTML = VIEWS[S.route] ? VIEWS[S.route]() : `<div class="empty">${T('Page not found')}</div>`;
    localise(document.body);
    (POST[S.route]||function(){})();

    // A view throwing must not take the whole panel down with it.
    console.error('view failed:',S.route,e);
    page.innerHTML=errorScreen(`This screen could not be drawn (${e.message}).`);

/* =====================================================================
   SCAN PROGRESS
   ===================================================================== */
/**
 * A scan is not a background nicety — until it finishes, every number on the
 * dashboard is a partial sum. Showing 5.1 while two thirds of the checks are
 * still queued is not "live data", it is a wrong answer that will be replaced
 * by a different wrong answer a minute later, and the customer has no way to
 * tell which reading to trust.
 *
 * So the dashboard waits, and says what it is waiting for.
 */
function scanProgress(){
  const sc=S.scanState;
  if(!sc) return null;
  const pending=Number(sc.pending||0);
  const total=Number(sc.queued_jobs||0) || null;
  if(pending<=0) return null;
  const done=total ? Math.max(0,total-pending) : null;
  return { pending, total, done, pct: total ? Math.round(done/total*100) : null };
}

function scanningScreen(){
  // Null until the server has answered with a queue size. Showing "0 / 0" in
  // that gap would read as a finished scan that found nothing.
  const p=scanProgress()||{pending:null,total:null,done:null,pct:null};
  const pct=p.pct===null?null:Math.min(99,Math.max(2,p.pct));
  return head(T('Collecting answers'))+
  `<div class="card"><div class="cb" style="padding:34px 26px;text-align:center">
    <div style="font-size:36px;margin-bottom:6px">◐</div>
    <div style="font-size:30px;font-weight:600;letter-spacing:-.5px">
      ${p.pending===null ? '…'
        : p.total ? `${p.done} <span style="color:var(--mute2);font-weight:400">/ ${p.total}</span>`
        : p.pending}
    </div>
    <div style="font-size:13px;color:var(--mute);margin-top:5px">
      ${p.pending===null ? T('Sorgular kuyruğa alınıyor')
        : p.total ? T('checks completed')
        : `${p.pending} ${T('checks remaining')}`}</div>

    ${pct===null?'':`<div style="height:8px;border-radius:99px;background:var(--card2);border:1px solid var(--border);
      margin:22px auto 10px;max-width:460px;overflow:hidden">
      <i style="display:block;height:100%;width:${pct}%;background:linear-gradient(90deg,#B04628,#8F3720);
        transition:width .5s ease"></i></div>`}

    <div style="font-size:12px;color:var(--mute2);margin-top:14px;max-width:430px;margin-inline:auto;line-height:1.65">
      ${T('Each prompt is asked several times per platform, because AI answers vary between runs. Averaging them is what makes the score stable.')}
    </div>
    <div class="keepopen">
      ${p.pending===null ? '' : `<b>${p.pending}</b> ${T('remaining')} · `}${T('Lütfen sayfayı kapatmayın')}
    </div>
  </div></div>`;
}

VIEWS.dashboard=()=>{
  // Nothing partial. While checks are outstanding the dashboard is a progress
  // screen, because a half-summed average is not a smaller truth — it is a
  // different number that happens to look like the real one.
  // The progress screen owns the view from the moment the button is pressed,
  // not from the moment the server confirms. Otherwise the dashboard sits
  // there showing yesterday's numbers while a scan is being queued.
  const prog=scanProgress();
  if(prog || S.scanBusy) return scanningScreen();

  const d=S.data,allowed=d.plats.filter(p=>!p.locked).length;
  const ins=insightText();
  // One row per prompt+engine. The same prompt is asked several times, and
  // listing every run makes six repeats look like six separate findings.
  const seenKey=new Set();
  const recent=(d.recent||[]).filter(m=>{
    const k=m.text+'|'+m.engine_key;
    if(seenKey.has(k))return false;
    seenKey.add(k); return true;
  }).slice(0,6);
  const sc=S.scanState;

  const emptyBanner = sc && sc.error && !d.cells.length
    ? `<div class="banner" style="margin-bottom:14px"><span>ℹ</span>
        <span>${T('The last scan collected nothing yet.')}</span>
        <span class="r"><button class="btn b-gh b-sm" onclick="rescan()">${T('Run a scan now')}</button></span></div>`
    : '';

  /* ---- Diagnostics: operator only -------------------------------------
     Provider keys, credit balances and adjudication models are our
     infrastructure. A customer pays a monthly fee and uses our keys; telling
     them "ChatGPT — HTTP 429, add credits at platform.openai.com" hands them
     an invoice for a fault they cannot even see the account for. Shown to the

          ).join(' · ')}</span></div>`
    : '';

  // The one quality note a customer should see, because their own action caused

  // an operator concern.
  const q=S.quality;
  const rebrandNote = q && q.degraded>0 && q.reason==='rebranded'

    : '';

  const sov=d.sov.slice().sort((a,b)=>b.pct-a.pct);

        ? `${d.plats.length} platformun ${allowed} tanesini takip ediyorsunuz. Diğer ${d.plats.length-allowed} platformda ne söylendiğini görmeden bilemezsiniz.`
        : `You're tracking ${allowed} of ${d.plats.length} platforms. You can't know what the other ${d.plats.length-allowed} are saying without seeing them.`)

    <span class="ranline">

function insightText(){
  const d=S.data,b=S.brand;
  // Only platforms we actually measured can be called the weakest. Naming an
  // engine that errored would send the operator optimising for a billing problem.
  const measuredPlats=d.plats.filter(p=>p.active&&p.measured!==false);
  const worst=[...measuredPlats].sort((a,x)=>a.score-x.score)[0]||{n:'—',score:0};
  const cited=d.cells.filter(c=>c.c>0).length;
  const tr = S.lang==='tr';

  if(!d.ready || S.scanState && S.scanState.pending>0) return tr ? {
    lvl:'wait', tag:'ÖLÇÜM SÜRÜYOR',
    head:'Sonuçlar hazırlanıyor',
    body:'Veriler geldikçe skor yeniden hesaplanıyor. Ölçüm tamamlanmadan çıkarılacak sonuç '+
         'yanıltıcı olur; marka ilk sorgularda görünmeyip sonrakilerde öne çıkabilir.'
  } : {
    lvl:'wait', tag:'IN PROGRESS',
    head:'Results are being assembled',
    body:'The score is recalculated as data arrives. Any conclusion drawn before the run '+
         'completes will mislead: a brand can be absent from the first queries and prominent '+
         'in the ones that follow.'
  };

  if(d.total<10) return tr ? {
    lvl:'crit', tag:'KRİTİK',
    metric:d.total.toFixed(1), metricLabel:'/ 100 görünürlük',
    head:'Yapay zeka sizi önermiyor',
    body:`Takip ettiğiniz sorgular müşterilerinizin satın almadan hemen önce sorduğu sorular. `+
         `${b.name} bu cevapların neredeyse hiçbirinde geçmiyor; kullanıcı öneriyi okuyup tıklıyor ve `+
         `tıkladığı marka her seferinde bir rakibiniz oluyor. `+
         (d.auditRanAt
           ? `Sebep büyük ölçüde teknik: sitenizde ${d.audit.reduce((a,c)=>a+c.facs.filter(f=>f.st==='fail').length,0)} kriter başarısız. Etkiye göre sıralanmış hâli Aksiyon Planı'nda.`
           : 'Nereden başlanacağını görmek için site denetimini çalıştırın.')
  } : {
    lvl:'crit', tag:'CRITICAL',
    metric:d.total.toFixed(1), metricLabel:'/ 100 visibility',
    head:'AI is not recommending you',
    body:`The queries you track are the ones customers ask right before they buy. `+
         `${b.name} appears in almost none of those answers; the user reads the recommendation, `+
         `clicks, and the brand they click is a competitor every time. `+
         (d.auditRanAt
           ? `The cause is largely technical: ${d.audit.reduce((a,c)=>a+c.facs.filter(f=>f.st==='fail').length,0)} checks failed on your site. The Action Plan ranks them by impact.`
           : 'Run the site audit to see where to start.')
  };

  /* ------------------------------------------------------------------
     Severity ladder.
     The card used to have exactly two states: red below 10, green above.
     A brand at 75 got the same green "you are not being clicked" verdict as
     one at 25, whether or not it was actually being cited — so the colour
     carried no information and the headline was sometimes simply false.
     The ladder below is driven by the data it describes.
     ------------------------------------------------------------------ */
  const promptsSeen = new Set(d.cells.map(c => c.p.id)).size;
  const named       = new Set(d.cells.filter(c => c.m > 0).map(c => c.p.id)).size;
  // Named often but rarely the cited source: the mention is there, the click
  // is going elsewhere. This is a gap worth naming, not a general weakness.
  const citeGap = named >= Math.max(2, promptsSeen * 0.4) && cited < named * 0.5;

  if (d.total < 35) return tr ? {
    lvl:'warn', tag:'ZAYIF',
    metric:d.total.toFixed(1), metricLabel:'/ 100 görünürlük',
    head:'Görünürlüğünüz rakiplerin gerisinde',
    body:`${b.name} ${promptsSeen} sorgunun ${named} tanesinde anılıyor, ancak cevapların `+
         `çoğunda ya sona kalıyor ya da hiç geçmiyor. Yapay zeka cevaplarında ilk anılan `+
         `birkaç marka tıklanmanın neredeyse tamamını alır; alt sıralarda olmak, olmamaktan `+
         `çok az farklıdır. En zayıf platform ${worst.n} (${worst.score.toFixed(1)}/100).`
  } : {
    lvl:'warn', tag:'WEAK',
    metric:d.total.toFixed(1), metricLabel:'/ 100 visibility',
    head:'Your visibility trails your competitors',
    body:`${b.name} is named on ${named} of ${promptsSeen} queries, but in most answers it `+
         `arrives last or not at all. The first brands named in an AI answer take almost all `+
         `of the click; being far down the list is barely different from being absent. `+
         `Weakest platform is ${worst.n} (${worst.score.toFixed(1)}/100).`
  };

  if (citeGap) return tr ? {
    lvl:'opp', tag:'FIRSAT',
    metric:String(cited), metricLabel:`/ ${named} sorguda kaynak`,
    head:'Anılıyorsunuz, tıklanan siz değilsiniz',
    body:`${b.name} ${named} sorguda anılıyor ama siteniz yalnızca ${cited} tanesinde kaynak `+
         `olarak gösteriliyor. Marka bilinirliği çalışıyor, trafik başka siteye gidiyor — `+
         `aradaki fark doğrudan kaybedilen ziyaret demek. Organization ve FAQ şeması ile `+
         `kanonik URL düzeni, bu boşluğu kapatan en hızlı iki müdahale.`
  } : {
    lvl:'opp', tag:'OPPORTUNITY',
    metric:String(cited), metricLabel:`/ ${named} queries cite you`,
    head:'You get named, someone else gets the click',
    body:`${b.name} is named on ${named} queries but your site is cited as the source on only `+
         `${cited}. Awareness is working; the traffic is going elsewhere, and the gap between `+
         `those two numbers is lost visits. Organization and FAQ schema plus a clean canonical `+
         `URL structure are the two fastest ways to close it.`
  };

  if (d.total >= 60) return tr ? {
    lvl:'good', tag:'GÜÇLÜ',
    metric:d.total.toFixed(1), metricLabel:'/ 100 görünürlük',
    head:'Konumunuz güçlü — korumaya oynayın',
    body:`${b.name} takip edilen sorgularda düzenli olarak öneriliyor ve ${cited} sorguda `+
         `siteniz kaynak gösteriliyor. Bu konum kalıcı değil: yapay zeka cevapları üçüncü `+
         `taraf kaynaklardan besleniyor ve rakip içeriği tazelediğinde sıralama haftalar `+
         `içinde değişebilir. En zayıf halkanız ${worst.n} (${worst.score.toFixed(1)}/100) — `+
         `düşüş genelde en zayıf platformdan başlar.`
  } : {
    lvl:'good', tag:'STRONG',
    metric:d.total.toFixed(1), metricLabel:'/ 100 visibility',
    head:'Strong position — play to defend it',
    body:`${b.name} is recommended consistently on the tracked queries, with your site cited `+
         `on ${cited} of them. The position is not permanent: AI answers are fed by third-party `+
         `sources, and a competitor refreshing their content can move the ranking within weeks. `+
         `Your weakest link is ${worst.n} (${worst.score.toFixed(1)}/100) — decline usually `+
         `starts at the weakest platform.`
  };

  return tr ? {
    lvl:'opp', tag:'GELİŞTİRİLEBİLİR',
    metric:d.total.toFixed(1), metricLabel:'/ 100 görünürlük',
    head:'Zemin sağlam, üstüne inşa edilebilir',
    body:`${b.name} ${named}/${promptsSeen} sorguda anılıyor ve ${cited} sorguda kaynak `+
         `gösteriliyor — temel kurulmuş. Buradan sonraki kazanç sıralamadan gelir: cevabın `+
         `içinde kaçıncı anıldığınız, anılıp anılmadığınız kadar belirleyici. En zayıf `+
         `platform ${worst.n} (${worst.score.toFixed(1)}/100), en hızlı kazanç orada.`
  } : {
    lvl:'opp', tag:'ROOM TO GROW',
    metric:d.total.toFixed(1), metricLabel:'/ 100 visibility',
    head:'Solid base, room to build on it',
    body:`${b.name} is named on ${named}/${promptsSeen} queries and cited on ${cited} — the `+
         `foundation is there. The next gain comes from position: where you are named inside `+
         `the answer matters as much as whether you are named at all. Weakest platform is `+
         `${worst.n} (${worst.score.toFixed(1)}/100); that is where the fastest gain sits.`
  };
}

async function answerModal(runId){
  openModal(T('Raw answer'),
    `<div class="empty"><div class="ic">◎</div>${T('Loading the answer…')}</div>`);
  let d;
  try{ d = await api.get(`/api/answers?run=${runId}`); }
  catch(e){ $('#mBody').innerHTML = `<div class="empty">${esc(e.message)}</div>`; return; }

  // Highlights come from the server, computed by the same matcher that scored
  // the run, so what the reader sees is exactly what was counted.
  let html='', cursor=0;
  for(const sp of d.spans||[]){
    if(sp.start<cursor) continue;
    html += esc(d.answer.slice(cursor, sp.start));
    html += `<mark class="${sp.self?'':'riv'}">${esc(d.answer.slice(sp.start, sp.end))}</mark>`;
    cursor = sp.end;
  }
  html += esc((d.answer||'').slice(cursor));

  const sent = d.sentiment===null ? '—' : (d.sentiment>=0?'+':'')+Number(d.sentiment).toFixed(2);
  $('#mBody').innerHTML = `
   <div style="font-size:12px;color:var(--mute);margin-bottom:6px">${T('Query')}</div>
   <div style="font-size:14px;font-weight:500;margin-bottom:16px">${esc(d.prompt)}</div>
   <div style="display:flex;gap:8px;flex-wrap:wrap;margin-bottom:16px">
     <span class="chip">${esc(d.engine)}</span>
     <span class="chip ${d.mentioned?'ok':'bad'}">${d.mentioned?T('Your brand is named'):T('Your brand is not named')}</span>
     ${d.rank?`<span class="chip">${d.rank}${T('.')} ${T('brand named')}</span>`:''}
     <span class="chip ${d.cited?'ok':''}">${d.cited?T('Your site is cited'):T('Your site is not cited')}</span>
     ${d.mentioned&&d.sentiment!==null
        ? `<span class="chip">${T('Tone')}: ${d.sentiment>0.15?T('positive'):d.sentiment<-0.15?T('negative'):T('neutral')}</span>`
        : ''}
     ${d.recommendation?`<span class="chip pri">${T('REC_'+d.recommendation)}</span>`:''}
     ${S.isAdmin?`<span class="chip">run ${d.runIndex+1} · sentiment ${sent}</span>`:''}
   </div>
   <div style="border:1px solid var(--border);border-radius:8px;padding:16px;background:var(--card2);
        font-size:14px;line-height:1.75;white-space:pre-wrap">${html}</div>
   ${d.citations&&d.citations.length?`<div style="margin-top:14px;display:flex;gap:7px;flex-wrap:wrap">
     ${d.citations.map(c=>`<span class="chip">${esc(c)}</span>`).join('')}</div>`:''}
   <p style="font-size:12px;color:var(--mute);margin-top:14px">
     ${T('Collected')} ${new Date(d.askedAt).toLocaleString('tr-TR')}
     ${S.isAdmin?`<br><span style="color:var(--mute2)">${T('Operator')} · ${esc(d.modelVersion||'unknown model')} ·
       ${d.method==='official_api'?'official API':'licensed SERP provider'}
       ${d.degraded?` · degraded=${esc(d.degraded)}`:''}</span>`:''}
   </p>`;
}

VIEWS.mentions=()=>{
  const d=S.data;
  const all=d.cells.filter(c=>platAllowed(c.pl));

  // Two filters, both in the URL of the page's state rather than a menu: the
  // question an account manager brings here is almost always "where are we
  // missing" or "how did we do on <platform>", and burying either behind a
  // dropdown adds a click to every visit.
  const f=S.mFilter||'all';
  const fp=S.mPlat||'';
  const rows=all.filter(c=>
    (f==='all' || (f==='in' ? c.m>0 : c.m===0)) &&
    (!fp || c.pl.id===fp));

  const named=all.filter(c=>c.m>0);
  const cited=all.filter(c=>c.c>0);
  const avgRank=named.filter(c=>c.rank).length
    ? named.filter(c=>c.rank).reduce((a,c)=>a+c.rank,0)/named.filter(c=>c.rank).length : null;
  const cov=all.length?named.length/all.length*100:0;

  // Sentiment as a word. A marketer reading "+0.20" has to be told what the
  // scale is before the number means anything; "Olumlu" needs no key.
  const senti=v=>v>=0.25?{l:T('Olumlu'),c:'ok'}:v<=-0.25?{l:T('Olumsuz'),c:'bad'}:{l:T('Nötr'),c:'mid'};

  return head(T('Mentions'),
    T('Takip edilen her sorgunun her platformdaki sonucu. Satıra tıklayın, cevabın tamamı açılsın.'),
    rangeSel()+`<button class="btn b-gh b-sm" onclick="exportMentions()">${T('⭳ Download CSV')}</button>`)+
  `<div class="g4">
    <div class="kpi"><div class="t">${T('Görünürlük')}</div>
      <div class="v">${cov.toFixed(1)}<span style="font-size:14px;color:var(--mute2)">%</span></div>
      <div class="d">${named.length}/${all.length} ${T('kontrolde anılıyor')}</div></div>
    <div class="kpi"><div class="t">${T('Kaynak gösterilme')}</div>
      <div class="v">${cited.length}</div>
      <div class="d">${named.length?`${(cited.length/named.length*100).toFixed(0)}% ${T('anılmaların içinde')}`:T('henüz yok')}</div></div>
    <div class="kpi"><div class="t">${T('Ortalama sıra')}</div>
      <div class="v">${avgRank?avgRank.toFixed(1):'—'}</div>
      <div class="d">${avgRank?T('anıldığınız cevaplarda'):T('henüz anılmadınız')}</div></div>
    <div class="kpi"><div class="t">${T('Toplam kontrol')}</div>
      <div class="v">${nf(all.length*5)}</div>
      <div class="d">${all.length} ${T('sorgu × platform')} · 5 ${T('koşu')}</div></div>
  </div>

  <div class="card">
    <div class="ch"><div><h3>${T('Sorgu × platform detayı')}</h3>
      <div class="sub">${T('Anılma, sıra, kaynak gösterilme ve ton ayrı ayrı ölçülür — bir cevapta geçmek ile tavsiye edilmek aynı şey değildir.')}</div></div>
      <span class="rt">${rows.length}/${all.length}</span></div>

    <div class="mfil">
      <div class="grp">
        ${[['all',T('Tümü'),all.length],['in',T('Anılıyor'),named.length],['out',T('Anılmıyor'),all.length-named.length]]
          .map(([k,l,n])=>`<button class="${f===k?'on':''}" onclick="S.mFilter='${k}';render()">${l}<b>${n}</b></button>`).join('')}
      </div>
      <div class="grp">
        <button class="${!fp?'on':''}" onclick="S.mPlat='';render()">${T('Tüm platformlar')}</button>
        ${d.plats.filter(platAllowed).map(p=>`
          <button class="${fp===p.id?'on':''}" onclick="S.mPlat='${p.id}';render()">
            ${esc(p.n)}<b>${all.filter(c=>c.pl.id===p.id&&c.m>0).length}</b></button>`).join('')}
      </div>
    </div>

    <div class="tw"><table class="mtbl"><thead><tr>
      <th>${T('Sorgu')}</th><th>${T('Platform')}</th><th>${T('Niyet')}</th>
      <th>${T('Durum')}</th><th class="n">${T('Sıra')}</th><th class="n">${T('Kaynak')}</th>
      <th>${T('Ton')}</th><th class="n">${T('Skor')}</th></tr></thead>
    <tbody>${rows.length?rows.map(c=>{
      const st=senti(c.sg);
      return `<tr class="${c.m>0?'':'ghost'}" style="${c.runId?'cursor:pointer':''}"
        ${c.runId?`onclick="answerModal(${c.runId})"`:''}>
        <td class="q"><b>${esc(c.p.text.replace(/"/g,''))}</b></td>
        <td><span class="chip" style="border-color:${c.pl.c}44">${c.pl.ab} ${esc(c.pl.n)}</span></td>
        <td><span class="chip">${intentLabel(c.p.intent)}</span></td>
        <td><span class="mst ${c.m>0?'in':'out'}"><i></i>${c.m>0
              ? `${T('Anılıyor')} <em>${(c.m*100).toFixed(0)}%</em>`
              : T('Anılmıyor')}</span></td>
        <td class="n">${c.rank?`<span class="rkb ${c.rank<=3?'top':''}">${c.rank}</span>`:'—'}</td>
        <td class="n">${c.c>0?`<span class="cyes">✓</span>`:'<span class="mut">—</span>'}</td>
        <td>${c.m>0?`<span class="sent ${st.c}">${st.l}</span>`:'<span class="mut">—</span>'}</td>
        <td class="n sc"><b>${c.score.toFixed(1)}</b><i>±${c.ci.toFixed(1)}</i></td></tr>`}).join('')
      :`<tr><td colspan="8"><div class="empty" style="padding:34px 12px"><div class="ic">◎</div>
         ${T('Bu filtreye uyan sorgu yok')}</div></td></tr>`}</tbody></table></div>
    <p class="mnote">${T('Skorun yanındaki ± değeri ölçüm payıdır: beş koşu birbirine ne kadar yakın çıktıysa o kadar küçüktür. Büyükse o sorguda yapay zeka kararsız demektir.')}</p>
  </div>`;
};
function exportMentions(){
  const rows=[['Sorgu','Platform','Niyet','Anılma %','Sıra','Kaynak','Ton','Skor','Ölçüm payı']];
  S.data.cells.forEach(c=>rows.push([c.p.text,c.pl.n,c.p.intent,
    (c.m*100).toFixed(0),c.rank||'',c.c>0?'yes':'no',c.sg.toFixed(2),c.score.toFixed(1),c.ci.toFixed(1)]));
  dl('yanki-mentions.csv',csv(rows),'text/csv;charset=utf-8');
}

VIEWS.platforms=()=>{
  const d=S.data;
  const ser=d.series.slice(-S.range);

  /* Three states, never conflated. A platform that was never asked did not
     score zero — printing 0.00 next to it is the most misleading number this
     screen could produce, and it was doing exactly that. */
  const state=p=> p.locked ? 'locked'
                : !p.configured ? 'nokey'
                : p.failing && !p.measured ? 'failing'
                : !p.measured || !p.checks ? 'nodata' : 'ok';
  const live=d.plats.filter(p=>state(p)==='ok');
  const wLive=live.reduce((a,p)=>a+p.w,0);

  /* What each platform is costing. Weight is the share of the total score a
     platform carries; multiplied by the points not earned there, it answers
     the only question this page exists for: which platform to fix first.
     A weak score on a heavy platform outranks a terrible one on a light one. */
  const loss=p=>p.w*(100-p.score);
  const ranked=live.slice().sort((a,b)=>loss(b)-loss(a));
  const worst=ranked[0]||null;
  const totalLoss=live.reduce((a,p)=>a+loss(p),0);

  const covered=d.plats.filter(p=>!p.locked).length;
  const wCovered=d.plats.filter(p=>!p.locked).reduce((a,p)=>a+p.w,0);

  const badge=st=>({
    ok:      `<span class="pst ok"><i></i>${T('Ölçülüyor')}</span>`,
    nodata:  `<span class="pst idle"><i></i>${T('Veri yok')}</span>`,
    nokey:   `<span class="pst idle"><i></i>${S.isAdmin?T('No key'):T('Not measured')}</span>`,
    failing: `<span class="pst warn"><i></i>${S.isAdmin?T('Failing'):T('Not measured')}</span>`,
    locked:  `<span class="pst lock"><i></i>${T('Planınızın üstünde')}</span>`,
  }[st]);

  return head(T('Platforms'),
    T('Her platform toplam skorunuza farklı ağırlıkta katılır. Bu sayfa hangisinin ne kadar taşıdığını ve nerede kaybettiğinizi gösterir.'),
    rangeSel()+`<button class="btn b-gh b-sm" onclick="exportPlats()">${T('⭳ Download CSV')}</button>`)+
  `${S.plan==='trial'?upsell(T('The trial scans limited platforms. The rest unlock on paid plans.')):''}

  <div class="g4">
    <div class="kpi"><div class="t">${T('Ölçülen platform')}</div>
      <div class="v">${live.length}<span style="font-size:14px;color:var(--mute2)">/${d.plats.length}</span></div>
      <div class="d">${T('skorun')} %${Math.round(wLive*100)} ${T('bölümü ölçülüyor')}</div></div>
    <div class="kpi"><div class="t">${T('Planınızda açık')}</div>
      <div class="v">${covered}<span style="font-size:14px;color:var(--mute2)">/${d.plats.length}</span></div>
      <div class="d">${T('skorun')} %${Math.round(wCovered*100)} ${T('bölümüne erişiminiz var')}</div></div>
    <div class="kpi"><div class="t">${T('En çok kaybettiren')}</div>
      <div class="v" style="font-size:20px">${worst?esc(worst.n):'—'}</div>
      <div class="d">${worst?`${loss(worst).toFixed(1)} ${T('puan kayıp')}`:T('ölçüm bekleniyor')}</div></div>
    <div class="kpi"><div class="t">${T('Toplam kayıp')}</div>
      <div class="v">${totalLoss.toFixed(1)}</div>
      <div class="d">${T('100 üzerinden alınmayan puan')}</div></div>
  </div>

  <div class="card"><div class="ch"><div><h3>${T('Nerede kaybediyorsunuz')}</h3>
    <div class="sub">${T('Her çubuğun uzunluğu, o platformdaki eksiğin toplam skorunuza mal olduğu puandır. Ağır bir platformda orta bir skor, hafif bir platformdaki sıfırdan pahalıdır.')}</div></div></div>
    <div class="cb">${ranked.length?`<div class="plos">${ranked.map(p=>`
      <div class="pl-row">
        <span class="nm"><i style="background:${p.c}"></i>${esc(p.n)}</span>
        <span class="lb"><span class="ltrack"><i style="width:${totalLoss?loss(p)/totalLoss*100:0}%;background:${p.c}"></i></span></span>
        <span class="lv">−${loss(p).toFixed(1)}</span>
        <span class="dt">${T('skor')} ${p.score.toFixed(1)} · ${T('ağırlık')} %${Math.round(p.w*100)}</span>
      </div>`).join('')}</div>`
      :`<div class="empty" style="padding:30px"><div class="ic">◔</div>${T('Ölçüm tamamlandığında burada platform karşılaştırması oluşur')}</div>`}</div></div>

  <div class="card"><div class="ch"><div><h3>${T('Visibility Trend')} ${kpiHelp('trend')}</h3>
    <div class="sub">${T('Günlük dalgalanma olağandır; kampanya etkisini dört haftalık eğimde okuyun.')}</div></div>
    <span class="rt">${T('Last')} ${S.range} ${T('days')}</span></div>
    <div class="cb">${trendChart(ser)}</div></div>

  <div class="card"><div class="ch"><div><h3>${T('Platform Details')}</h3>
    <div class="sub">${T('Ağırlık, o platformun toplam skorunuzdaki payıdır — gerçek kullanım oranlarına göre belirlenir, sizin ayarınız değildir.')}</div></div>
    <span class="rt">${T('Last')} ${S.range} ${T('days')}</span></div>
  <div class="tw"><table class="ptbl"><thead><tr>
    <th>${T('Platform')}</th><th>${T('Durum')}</th><th>${T('Skor')}</th>
    <th class="n">${T('Ağırlık')}</th><th class="n">${T('Anılma')}</th><th class="n">${T('Kaynak')}</th>
    <th class="n">${T('Kontrol')}</th><th class="n">${T('Değişim')}</th></tr></thead>
  <tbody>${d.plats.map(p=>{
    const st=state(p), on=st==='ok';
    return `<tr class="${on?'':'ghost'}">
      <td><span class="pn"><i style="background:${on?p.c:'var(--border2)'}"></i><b>${esc(p.n)}</b></span></td>
      <td>${badge(st)}</td>
      <td style="min-width:170px">${on
        ? `<div class="psc"><span class="v">${p.score.toFixed(1)}</span>
             <span class="bar"><i style="width:${Math.max(1.5,p.score)}%;background:${p.c}"></i></span></div>`
        : st==='locked'
          ? `<a href="#" class="upl" onclick="go('settings');setTimeout(()=>setTab('billing'),30);return false">${T('Planı Yükselt')} →</a>`
          : `<span class="mut">—</span>`}</td>
      <td class="n"><span class="wcell">%${Math.round(p.w*100)}</span></td>
      <td class="n">${on?p.mentions:'<span class="mut">—</span>'}</td>
      <td class="n">${on?p.cites:'<span class="mut">—</span>'}</td>
      <td class="n">${on?nf(p.checks):'<span class="mut">—</span>'}</td>
      <td class="n">${on
        ? `<span class="${p.trend>=0?'ok':'bad'}">${p.trend>=0?'▲':'▼'} ${Math.abs(p.trend).toFixed(1)}</span>`
        : '<span class="mut">—</span>'}</td></tr>`}).join('')}
  </tbody></table></div>
  ${d.plats.some(p=>state(p)!=='ok'&&!p.locked)?`
    <p class="mnote">${T('Ölçülmeyen platformlar skorunuzu düşürmez; hesaba hiç katılmazlar. Ama ağırlıkları da kullanılmadığı için skorunuz mecranın tamamını değil, ölçülen bölümünü temsil eder.')}</p>`:''}
  </div>`;
};
function exportPlats(){
  const rows=[['Platform','Skor','Ağırlık','Anılma','Kaynak','Toplam kontrol']];
  S.data.plats.filter(p=>!p.locked).forEach(p=>rows.push([p.n,p.score.toFixed(2),p.w,p.mentions,p.cites,p.checks]));
  dl('yanki-platforms.csv',csv(rows),'text/csv;charset=utf-8');
}

/* ---------- KAYNAKLAR ---------- */
/**
 * Algı ekranı.
 *
 * Görünürlük "kaç kez geçtiniz" sorusunu ölçer; bu ekran "geçtiğiniz yerde ne
 * dendi" sorusunu ölçer. İkisi bağımsızdır: her cevapta geçip her cevapta
 * olumsuz anılmak mümkündür ve o durumda yüksek görünürlük zarardır.
 *
 * Veri /api/perception'dan gelir ve yeni ölçüm gerektirmez — ton, sıfatlar ve
 * marka geçişleri her taramada zaten toplanıyordu, eksik olan ekrandı.
 */
/**
 * Aksiyon Merkezi.
 *
 * Aksiyon Planı bir yol haritasıdır: 90 günü fazlara böler, etki ve efora göre
 * sıralar. Bu ekran farklı bir soruya cevap verir — "bugün ne yapmam gerekiyor".
 *
 * Hiçbiri yeni bir ölçüm değil. Fırsatlar, site denetimi, kaynak sınıflandırması,
 * algı ve rekabet açığı zaten ayrı ekranlarda ölçülüyor; burada tek bir öncelikli
 * listede toplanıyor. Bir sinyalin iki yerde farklı önceliğe sahip olması
 * kullanıcıyı hangisine güveneceği konusunda ikilemde bırakır, o yüzden öncelik
 * hesabı tek yerde: aşağıdaki buildCenter().
 *
 * Ad notu: buildActions() zaten Aksiyon Planı'nın görev üreticisi. Aynı adı
 * kullanmak onu sessizce eziyor ve Plan ekranı çiziliyormuş gibi görünüp boş
 * veriyle patlıyordu — bu yüzden buildCenter().
 */
/* Rota adı 'center'. 'actions' kullanılamaz: S.data.actions zaten Aksiyon
 * Planı'nın görev listesini taşıyor ve aynı adı iki anlamda kullanmak, hangi
 * ekranın hangi veriyi okuduğunu belirsizleştirir. */
VIEWS.center=()=>{

  const items=buildCenter(d);

  const mid=items.filter(x=>x.sev==='mid');

  `<div class="flow">
    <span class="fs on">1 · ${T('Ölç')}</span><i>→</i>
    <span class="fs on">2 · ${T('Düzelt')}</span><i>→</i>
    <span class="fs">3 · ${T('Uygula')}</span>
    <span class="fx">${T('Her kart, ilgili düzeltme adımına götürür.')}</span></div>

  <div class="g4" style="grid-template-columns:repeat(3,1fr)">
    <div class="kpi"><div class="t">${T('Bekleyen aksiyon')}</div>
      <div class="v">${items.length}</div><div class="d">${T('önceliğe göre sıralı')}</div></div>
    <div class="kpi"><div class="t">${T('Yüksek öncelik')}</div>
      <div class="v ${hi.length?'bad':''}">${hi.length}</div><div class="d">${T('önce bunlarla başlayın')}</div></div>
    <div class="kpi"><div class="t">${T('Orta öncelik')}</div>
      <div class="v">${mid.length}</div><div class="d">${T('sırayla ele alın')}</div></div>
  </div>

  ${items.length?`
  <div class="actfil">
    ${[['all',T('Tümü'),items.length],['high',T('Yüksek'),hi.length],['mid',T('Orta'),mid.length]]
      .map(([k,l,n])=>`<button class="${(S.actFilter||'all')===k?'on':''}"
        onclick="S.actFilter='${k}';render()">${l}<b>${n}</b></button>`).join('')}
  </div>

  <div class="acts">${shown.map(x=>`
    <div class="act ${x.sev}">
      <div class="ah">
        <span class="ic">${x.icon}</span>
        <b>${x.title}</b>
        <span class="sv ${x.sev}">${x.sev==='high'?T('Yüksek öncelik'):x.sev==='mid'?T('Orta öncelik'):T('Düşük öncelik')}</span>
      </div>
      <span class="kind">${x.kind}</span>
      <p>${x.body}</p>
      <div class="aa">${x.actions.map(a=>
        `<button class="${a.pri?'btn b-pri b-sm':'lnk'}" onclick="${a.go}">${a.label}</button>`).join('')}</div>
    </div>`).join('')}</div>`
  :`<div class="card"><div class="empty" style="padding:44px 16px"><div class="ic">✓</div>
     <b style="color:var(--fg);font-size:14px">${T('Bekleyen aksiyon yok')}</b>
     <p style="margin-top:8px;max-width:50ch;margin-inline:auto">${T('Ölçüm tamamlandıkça buraya sinyaller düşer: rakibin öne geçtiği bir sorgu, denetimde kalan bir kriter, girilebilir yeni bir kaynak veya algıda bir bozulma.')}</p></div></div>`}`;
};

/**
 * Sinyalleri tek listeye toplar.
 *
 * Öncelik kuralı, ekranlar arasında tutarlı olsun diye tek yerde: kaybın
 * büyüklüğü × düzeltmenin ulaşılabilirliği. Bugün açılabilecek bir dizin
 * kaydı, altı ay sürecek bir Wikipedia maddesinden önce gelir — ikisi aynı
 * sayıda atıf getirse bile.
 */
function buildCenter(d){
  const out=[];
  const P=S.perception;

  /* 1 — Görünmediğiniz sorgular. Ürünün ölçtüğü asıl kayıp bu.
   *
   * Kaynak d.opps: kapsama oranı ve fırsat skoru zaten Fırsatlar ekranında
   * hesaplanıyor. Öncelik, hacim değil kayıp: satın alma niyetli ve hiç
   * görünmediğiniz bir sorgu, yüksek hacimli ama zaten önde olduğunuz bir
   * sorgudan önce gelir. */
  (d.opps||[])
    .filter(o=>o.cover<0.4)
    .sort((a,b)=>b.opp-a.opp)
    .slice(0,6)
    .forEach(o=>{
      const hic=o.cover===0;
      const ticari=o.p.intent==='transactional'||o.p.intent==='comparison';
      out.push({
        sev: hic&&ticari ? 'high' : hic ? 'mid' : 'low',
        icon:'◎', kind:T('Fırsat'),
        title:`“${esc(o.p.text)}” ${hic?T('sorgusunda hiç geçmiyorsunuz'):T('sorgusunda zayıfsınız')}`,
        body:`${T('Fırsat skoru')} ${o.opp} · ${T('aylık hacim')} ${nf(o.p.vol)} · ${
          T('görünürlük')} ${hic?T('yok'):`%${(o.cover*100).toFixed(0)}`}. ${
          T('Önerilen aksiyon')}: ${esc(T(o.act))}.`,
        actions:[{label:`✦ ${T('İçerik üret')}`,pri:1,go:`writerFor('${o.p.id}')`},
                 {label:`${T('Fırsatları gör')} →`,go:"go('opps')"}],
      });
    });

  /* 2 — Algıda bozulma. Görünürlükten bağımsız ve ondan pahalı olabilir:
   *     cevapta geçmek ama olumsuz geçmek, hiç geçmemekten kötüdür. */
  if(P && P.overall && P.overall.mentions>=8){
    const neg=P.overall.neg/P.overall.mentions*100;
    if(neg>=15) out.push({
      sev: neg>=30?'high':'mid', icon:'◍', kind:T('Algı'),
      title:`${T('Cevapların')} %${neg.toFixed(0)}${T('inde olumsuz anılıyorsunuz')}`,
      body:`${P.overall.neg}/${P.overall.mentions} ${T('anılmada olumsuz ton ölçüldü. Hangi ifadelerin kullanıldığını örnek geçişlerde görün.')}`,
      actions:[{label:`${T('Algıyı incele')} →`,pri:1,go:"go('perception')"}],
    });
    const kotu=(P.attributes||[]).filter(a=>a.polarity<=-0.25).slice(0,3);
    if(kotu.length) out.push({
      sev:'mid', icon:'◍', kind:T('Algı'),
      title:`${T('Olumsuz sıfatlar')}: ${kotu.map(a=>esc(a.label)).join(', ')}`,
      body:T('Yapay zeka markanızı bu ifadelerle tanımlıyor. Bunlar cevaptan cevaba taşınır; kaynaklarda düzeltilmedikçe kendiliğinden değişmez.'),
      actions:[{label:`${T('Sıfatları gör')} →`,pri:1,go:"go('perception')"},
               {label:`${T('Kaynaklar')} →`,go:"go('sources')"}],
    });
  }

  /* 3 — Girilebilir kaynaklar. En hızlı kazanç: bugün başlanabilir. */
  const acik=(d.sources||[]).filter(s=>!s.mine&&srcKind(s.kind).reachable&&srcKind(s.kind).rank<=2);
  acik.slice(0,3).forEach(s=>{
    const k=srcKind(s.kind);
    out.push({
      sev:'high', icon:'⚭', kind:T('Kaynak'),
      title:`${esc(s.d)} ${T('üzerinde yer alın')} — ${T(k.short)}`,
      body:`${s.v} ${T('atıf alıyor ve kayda açık')} (${T(k.label)}). ${T('Beklenecek onay zinciri yok')} — ${T(k.eta)}.`,
      actions:[{label:`${T('Kaynakları gör')} →`,pri:1,go:"go('sources')"},
               {label:`${T('Aksiyon planı')} →`,go:"go('plan')"}],
    });
  });

  /* 4 — Girilemeyen kaynaklar tek kartta. Dokuz rakip için dokuz kart, listeyi
   *     yapılabilir işlerden uzaklaştırır. */
  const kapali=(d.sources||[]).filter(s=>!s.mine&&!srcKind(s.kind).reachable&&s.kind!=='unknown');
  if(kapali.length>=3){
    const toplam=kapali.reduce((a,s)=>a+s.v,0);
    out.push({
      sev:'mid', icon:'⛔', kind:T('Kaynak'),
      title:`${kapali.length} ${T('kaynak rakiplerinize atıf sağlıyor, size değil')}`,
      body:`${toplam} ${T('atıf bu kaynaklardan geliyor ve hiçbirine profil açamazsınız — içerik onların kendi pazarlaması. Dolaylı yol izlenmeli.')}`,
      actions:[{label:`${T('Aksiyon planı')} →`,pri:1,go:"go('plan')"}],
    });
  }

  /* 5 — Site denetiminde kalan kriterler. */
  const fails=(d.audit||[]).flatMap(c=>c.facs.filter(f=>f.st==='fail').map(f=>({...f,cat:c.n})));
  if(fails.length) out.push({
    sev: fails.length>=10?'high':'mid', icon:'◳', kind:T('Denetim'),
    title:`${fails.length} ${T('teknik kriter karşılanmıyor')}`,
    body:`${T('En kritikleri')}: ${fails.slice(0,3).map(f=>esc(T(f.n))).join(', ')}. ${
      T('Bu eksikler yapay zekanın sitenizi okumasını ve kaynak göstermesini doğrudan engelliyor.')}`,
    actions:[{label:`${T('Denetimi aç')} →`,pri:1,go:"go('audit')"},
             {label:`${T('Araçlar')} →`,go:"go('tools')"}],
  });

  /* 6 — Hiç ölçülmeyen platformlar. */
  const olcusuz=(d.plats||[]).filter(p=>!p.locked&&(p.measured===false||!p.checks));
  if(olcusuz.length>=2) out.push({
    sev:'low', icon:'◔', kind:T('Platform'),
    title:`${olcusuz.length} ${T('platform ölçülmüyor')}`,
    body:`${olcusuz.map(p=>esc(p.n)).join(', ')} ${T('için ölçüm yapılamıyor. Skorunuz mecranın tamamını değil, ölçülen bölümünü temsil ediyor.')}`,
    actions:[{label:`${T('Platformları gör')} →`,pri:1,go:"go('platforms')"}],
  });

  /* 7 — Türü belirlenmemiş kaynaklar. Kullanıcı işaretlerse hem kendi planı
   *     hem ortak sınıflandırma zenginleşir. */
  const bilinmeyen=(d.sources||[]).filter(s=>!s.mine&&s.kind==='unknown');
  if(bilinmeyen.length>=3) out.push({
    sev:'low', icon:'?', kind:T('Kaynak'),
    title:`${bilinmeyen.length} ${T('kaynağın türü belirlenemedi')}`,
    body:T('Bu kaynaklara nasıl girileceğini bilmeden tavsiye vermiyoruz. İşaretlemeniz hem planınızı hem ortak sınıflandırmayı iyileştirir.'),
    actions:[{label:`${T('Kaynakları gör')} →`,pri:1,go:"go('sources')"}],
  });

  const rank={high:0,mid:1,low:2};
  return out.sort((a,b)=>rank[a.sev]-rank[b.sev]);
}

/** Algı verisi ayrı çağrı: panel ilk boyada bunu beklemesin. */
async function loadPerception(){
  if(S.percBusy) return;
  S.percBusy=true;
  try{
    S.perception=await api.get(`/api/perception?workspace=${S.workspaceId}&days=${S.range}`);
  }catch(e){ S.perception={error:e.message}; }
  finally{ S.percBusy=false; if(S.route==='perception') render(); }
}

/**
 * %100'e yığılmış günlük ton grafiği.
 *
 * Mutlak sayı değil oran gösteriyor: tarama sayısı günden güne değişiyor ve
 * mutlak yükseklik, ton değişimi ile ölçüm hacmi değişimini birbirine karıştırır.
 */
function stackedTone(days){
  if(!days || !days.length) return `<div class="empty" style="padding:30px 12px">
    <div class="ic">◜</div>${T('Ölçüm biriktikçe eğri oluşur')}</div>`;
  const W=680,H=190,PL=34,PR=10,PT=10,PB=26;
  const bw=(W-PL-PR)/days.length;
  const cols=days.map((d,i)=>{
    const t=d.pos+d.neu+d.neg;
    const x=PL+i*bw+bw*0.14, w=bw*0.72;
    if(!t) return '';
    const h=H-PT-PB;
    const hp=d.pos/t*h, hn=d.neu/t*h, hg=d.neg/t*h;
    let y=PT;
    const seg=[];
    if(hp>0){ seg.push(`<rect x="${x.toFixed(1)}" y="${y.toFixed(1)}" width="${w.toFixed(1)}" height="${hp.toFixed(1)}" fill="var(--ok)" rx="1"/>`); y+=hp; }
    if(hn>0){ seg.push(`<rect x="${x.toFixed(1)}" y="${y.toFixed(1)}" width="${w.toFixed(1)}" height="${hn.toFixed(1)}" fill="var(--mute)" rx="1"/>`); y+=hn; }
    if(hg>0){ seg.push(`<rect x="${x.toFixed(1)}" y="${y.toFixed(1)}" width="${w.toFixed(1)}" height="${hg.toFixed(1)}" fill="var(--bad)" rx="1"/>`); }
    return seg.join('');
  }).join('');
  const lab=[0,50,100].map(v=>{
    const y=PT+(1-v/100)*(H-PT-PB);
    return `<line x1="${PL}" x2="${W-PR}" y1="${y.toFixed(1)}" y2="${y.toFixed(1)}"
      stroke="currentColor" stroke-opacity=".1"/>
      <text x="${PL-6}" y="${(y+3.5).toFixed(1)}" text-anchor="end" font-size="9.5"
        fill="currentColor" fill-opacity=".45">${v}%</text>`;
  }).join('');
  const first=days[0].day, last=days[days.length-1].day;
  const fmt=d=>new Date(d).toLocaleDateString('tr-TR',{day:'2-digit',month:'2-digit'});
  return `<svg viewBox="0 0 ${W} ${H}" style="width:100%;height:200px;display:block" role="img"
    aria-label="${esc(T('Ton dağılımı'))}">${lab}${cols}
    <text x="${PL}" y="${H-7}" font-size="9.5" fill="currentColor" fill-opacity=".45">${fmt(first)}</text>
    <text x="${W-PR}" y="${H-7}" text-anchor="end" font-size="9.5"
      fill="currentColor" fill-opacity=".45">${fmt(last)}</text></svg>
  <div class="tlegend">
    <span><i style="background:var(--ok)"></i>${T('Olumlu')}</span>
    <span><i style="background:var(--mute)"></i>${T('Nötr')}</span>
    <span><i style="background:var(--bad)"></i>${T('Olumsuz')}</span></div>`;
}

VIEWS.sources=()=>{
  const d=S.data;
  const sub=T('Yapay zeka bu kategoride hangi sitelere dayanıyor. Bu liste, kaynak gösterilmek için nereye girmeniz gerektiğini söyler.');

  // Before the first scan produces citations this list is empty, which is a
  // normal state, not an error.
  if(!d.sources.length){
    return head(T('Sources'),sub)+
      `<div class="card"><div class="empty"><div class="ic">⊕</div>
        <b style="color:var(--fg);font-size:14px">${T('No citations collected yet')}</b>
        <p style="margin-top:8px;max-width:52ch;margin-inline:auto">${T(`Sources appear once a scan finishes and the platforms cite pages in their answers. If a scan has run and this is still empty, no platform cited any source.`)}</p></div></div>`;
  }

  const mx=d.sources[0].v||1;
  const total=d.sources.reduce((a,x)=>a+x.v,0);
  const mine=d.sources.find(x=>x.mine);
  const myRank=mine?d.sources.indexOf(mine)+1:null;
  const myShare=mine&&total?mine.v/total*100:0;
  // Domains ahead of you that you are not on. This is the working list: the
  // shortest route to being cited is to appear where the models already look.
  const ahead=d.sources.filter(x=>!x.mine&&(!mine||x.v>mine.v));

  const dl=x=>{
    if(x.delta===null) return `<span class="sdelta new">${T('yeni')}</span>`;
    const v=x.delta*100;
    if(Math.abs(v)<5) return `<span class="sdelta flat">—</span>`;
    return `<span class="sdelta ${v>0?'up':'dn'}">${v>0?'▲':'▼'} %${Math.abs(v).toFixed(0)}</span>`;
  };

  return head(T('Sources'),sub,
    rangeSel()+`<button class="btn b-gh b-sm" onclick="exportSources()">${T('⭳ Download CSV')}</button>`)+
  `<div class="g4">
    <div class="kpi"><div class="t">${T('Siteniz kaçıncı')}</div>
      <div class="v">${myRank?`${myRank}.`:'—'}</div>
      <div class="d">${myRank?`${d.sources.length} ${T('kaynak içinde')}`:T('listede yok')}</div></div>
    <div class="kpi"><div class="t">${T('Atıf payınız')}</div>
      <div class="v">${myShare.toFixed(1)}<span style="font-size:14px;color:var(--mute2)">%</span></div>
      <div class="d">${mine?`${mine.v}/${total} ${T('atıf')}`:T('henüz atıf yok')}</div></div>
    <div class="kpi"><div class="t">${T('Önünüzdeki site')}</div>
      <div class="v">${ahead.length}</div>
      <div class="d">${T('sizden çok atıf alıyor')}</div></div>
    <div class="kpi"><div class="t">${T('Takip edilen kaynak')}</div>
      <div class="v">${d.sources.length}</div>
      <div class="d">${T('son')} ${S.range} ${T('gün')}</div></div>
  </div>

  ${!mine?`<div class="srcwarn">
      <b>${T('Siteniz bu listede yok')}</b>
      <span>${T('Yapay zeka bu kategoride yukarıdaki sitelere dayanıyor ve sizinkine hiç başvurmuyor. Kaynak olmak anılmaktan daha kalıcıdır: bir kez listeye girmek, tek tek sorgularda görünmeye çalışmaktan uzun ömürlüdür.')}</span>
      <button onclick="go('plan')">${T('Aksiyon planı')} →</button></div>`
   :ahead.length?`<div class="srcwarn ok">
      <b>${ahead.length} ${T('site sizden önde')}</b>
      <span>${T('Bu sitelerde yer almak — listelenmek, yorumlanmak, örnek olay olarak geçmek — yapay zekanın sizi öğrendiği yolu doğrudan genişletir.')}</span>
      <button onclick="go('plan')">${T('Aksiyon planı')} →</button></div>`:''}

  ${(()=>{const unk=d.sources.filter(x=>!x.mine&&x.kind==='unknown');
     if(!unk.length) return '';
     return `<div class="srcwarn ok" style="border-left-color:#8F3720">
       <b>${unk.length} ${T('kaynağın türü belirlenemedi')}</b>
       <span>${T('Bu kaynaklara nasıl girileceğini bilmeden tavsiye vermiyoruz. Sistem arka planda çözmeye çalışır; siz de elle işaretleyebilirsiniz — işaretiniz bu kaynağı gören diğer markalara da yardımcı olur.')}</span>
       <button onclick="resolveSources()" ${S.srcBusy?'disabled':''}>${S.srcBusy?T('Çözülüyor…'):T('Otomatik çöz')}</button></div>`;
   })()}

  <div class="card">
    <div class="ch"><div><h3>${T('Kaynak sıralaması')}</h3>
      <div class="sub">${T('Atıf sayısı, hangi platformların kullandığı ve dönem içindeki değişim')}</div></div>
      <span class="rt">${T('Son')} ${S.range} ${T('gün')}</span></div>
    <div class="tw"><table class="stbl"><thead><tr>
      <th class="n">#</th><th>${T('Alan adı')}</th><th>${T('Tür')}</th>
      <th style="width:22%">${T('Atıf')}</th>
      <th class="n">${T('Sayı')}</th><th class="n">${T('Değişim')}</th>
      <th>${T('Yapılacak')}</th><th class="n">${T('İlk görülme')}</th></tr></thead>
    <tbody>${d.sources.slice().sort((a,b)=>
        (a.mine?-1:0)-(b.mine?-1:0) ||
        (srcKind(a.kind).rank - srcKind(b.kind).rank) || (b.v - a.v))
      .map((x,i)=>{const k=srcKind(x.kind);return `<tr class="${x.mine?'me':''} ${k.reachable?'':'blocked'}">
      <td class="n rk">${i+1}</td>
      <td><span class="dn"><span class="fav ${x.mine?'me':''}">${ini(x.d)}</span>
        <b>${esc(x.d)}</b>${x.mine?`<span class="tagme">${T('siteniz')}</span>`:''}</span></td>
      <td><span class="kchip ${x.kind}" title="${esc(x.kindNote||'')}">${T(k.label)}</span></td>
      <td><span class="sbar"><i style="width:${x.v/mx*100}%"></i></span></td>
      <td class="n cnt">${x.v}</td>
      <td class="n">${dl(x)}</td>
      <td>${x.mine?`<span class="mut">—</span>`
        : x.kind==='unknown'
          ? `<button class="marklink" onclick="markSource('${esc(x.d)}')">${T('türünü işaretleyin')} →</button>`
        : k.reachable?`<span class="todo">${T(k.short)}</span><i class="eta">${T(k.eta)}</i>`
        : `<span class="noent">⛔ ${T(k.short)}</span>`}</td>
      <td class="n mut">${x.first?new Date(x.first).toLocaleDateString('tr-TR'):'—'}</td></tr>`}).join('')}
    </tbody></table></div>
    <p class="mnote">${T('Modeller sizi çoğunlukla kendi sitenizden değil, üçüncü taraf kaynaklardan öğrenir. Bu yüzden listenin üstündeki alan adlarında bulunmamak, kendi sitenizdeki bir eksikten daha pahalıdır.')}</p>
  </div>`;
};
/**
 * Bilinmeyen kaynakları arka planda çözer.
 *
 * Panel isteği hiçbir zaman model beklemez (/api/results allowLlm:false ile
 * çağırır), bu yüzden çözüm ayrı ve isteğe bağlı bir adım. Kullanıcı isterse
 * bekler, istemezse elle işaretler.
 */
let srcResolveBusy = false;
async function resolveSources(){
  if(srcResolveBusy) return;
  srcResolveBusy = true; S.srcBusy = true; render();
  try{
    const r = await api.post('/api/sources/classify',{workspaceId:S.workspaceId});
    await loadResults({silent:true});
    toast(r.classified
      ? `${r.classified} ${T('kaynağın türü belirlendi')}${r.stillUnknown?` · ${r.stillUnknown} ${T('hâlâ bilinmiyor')}`:''}`
      : T('Yeni bir kaynak türü belirlenemedi — elle işaretleyebilirsiniz'));
  }catch(e){ toast(e.message,'error'); }
  finally{ srcResolveBusy = false; S.srcBusy = false; render(); }
}

/**
 * Elle işaretleme.
 *
 * Seçenekler, kullanıcının "oraya nasıl girilir" sorusuna verebileceği
 * cevaplar olarak yazıldı — taksonominin iç adlarıyla değil. Kimse bir siteye
 * bakıp "bu bir self_publish mi" diye düşünmez; "buraya izinsiz yazabilir
 * miyim" diye düşünür.
 */
function markSource(domain){
  const secenekler = [
    ['directory',   T('Firmalar profil açabiliyor'),        T('dizin, listeleme, partner ağı')],
    ['marketplace', T('Ürün veya hizmet satılıyor'),         T('pazar yeri, ilan sitesi')],
    ['review',      T('Puan ve yorum merkezde'),             T('yorum platformu, şikâyet sitesi')],
    ['publication', T('Editöryel yayın, yazarlı içerik'),    T('haber, dergi, sektör yayını')],
    ['community',   T('Kullanıcılar tartışıyor'),            T('forum, sözlük, soru-cevap')],
    ['self_publish',T('Herkes izinsiz yayınlayabiliyor'),    T('Medium, LinkedIn, YouTube gibi')],
    ['authority',   T('Resmî kayıt veya ansiklopedi'),       T('Wikipedia, oda, sicil')],
    ['vendor',      T('Tek bir şirketin kendi sitesi'),      T('rakip, satıcı, danışman — girilemez')],
  ];
  openModal(`${T('Bu ne tür bir kaynak?')} — ${domain}`,
    `<p style="font-size:12px;color:var(--mute);margin-bottom:14px">
       ${T('Kaynağı açıp bakın: markanız oraya nasıl girer? İşaretiniz bu kaynağı gören diğer markalara da yardımcı olur.')}
       <a href="https://${esc(domain)}" target="_blank" rel="noopener noreferrer"
          style="color:var(--pri);margin-left:6px">${T('Kaynağı aç')} ↗</a></p>
     <div class="markopts">${secenekler.map(([k,baslik,alt])=>
       `<button onclick="saveSourceKind('${esc(domain)}','${k}')">
          <b>${baslik}</b><i>${alt}</i></button>`).join('')}</div>`);
}

async function saveSourceKind(domain, kind){
  try{
    await api.patch('/api/sources/classify',{domain,kind});
    closeModal();
    await loadResults({silent:true});
    render();
    toast(`${domain} — ${T(srcKind(kind).label)} ${T('olarak işaretlendi')}`);
  }catch(e){ toast(e.message,'error'); }
}

function exportSources(){
  const rows=[['Alan adı','Atıf','Sizin siteniz']];
  S.data.sources.forEach(s=>rows.push([s.d,s.v,s.mine?'yes':'no']));

}

/**
 * Attribute matrix.
 *
 * The single most actionable screen in the product: the score says you are
 * losing, this says why. If the model calls a rival "güvenilir" and calls you
 * "ucuz", no amount of schema markup fixes that — it is a positioning problem,
 * and it is invisible in every other view.
 *
 * Sorted by gap, not volume. An attribute both brands own equally teaches
 * nothing; one a rival owns outright is the work.
 */
function attributePanel(){
  const A=S.attributes;
  if(!A) return `<div class="empty" style="padding:30px"><div class="ic">◈</div>
    <b style="color:var(--fg);font-size:14px">${T('Reading answers…')}</b></div>`;
  if(A.error) return `<div class="empty" style="padding:30px"><div class="ic">⚠</div>
    <p>${esc(A.error)}</p></div>`;

  const c=A.coverage||{};
  if(!c.available) return `<div class="empty" style="padding:30px"><div class="ic">◈</div>
    <b style="color:var(--fg);font-size:14px">${T('Attribute analysis is not available yet')}</b>
    <p style="margin-top:8px;max-width:48ch;margin-inline:auto">${T('This feature reads the answers already collected and reports which qualities each brand is associated with. It will appear here once enabled for your account.')}</p>
    ${S.isAdmin?`<div style="margin-top:14px;font-size:11px;color:var(--mute2)">
      ${T('Operator')} · ${T('no provider key configured for the extraction pass')}</div>`:''}</div>`;

  const rows=(A.matrix||[]).slice(0,14);
  if(!rows.length){
    const pct=c.total?Math.round(c.done/c.total*100):0;
    return `<div class="empty" style="padding:30px"><div class="ic">◈</div>
      <b style="color:var(--fg);font-size:14px">${T('Reading your answers')}</b>
      <p style="margin-top:8px;max-width:48ch;margin-inline:auto">
        ${T('An attribute has to appear at least twice before it means anything. Keep this page open while the pass runs.')}</p>
      <div style="max-width:280px;margin:14px auto 0">
        <div class="bar"><i style="width:${pct}%;background:var(--pri)"></i></div>
        <div style="font-size:11px;color:var(--mute2);margin-top:6px">
          ${c.done} / ${c.total} ${T('answers read')}</div></div></div>`;
  }

  const brands=[{id:'self',n:S.brand.name,you:true},
                ...S.rivals.map(r=>({id:r.id,n:r.n,you:false}))];

  const cell=(a,b)=>{
    const v=a.brands[b.id];
    if(!v) return `<td class="n" style="color:var(--mute2)">—</td>`;
    const col=v.polarity>0.3?'var(--ok)':v.polarity<-0.3?'var(--bad)':'var(--fg2)';
    const sign=v.polarity>0.3?'+':v.polarity<-0.3?'−':'·';
    return `<td class="n"><b class="mono" style="color:${col}">${v.n}</b>
      <span style="color:var(--mute2);font-size:11px"> ${sign}</span></td>`;
  };

  return `
  <p style="font-size:12px;color:var(--mute);margin-bottom:12px">
    ${T('Ordered by the widest gap. A quality a rival owns and you do not is a positioning gap, not a technical one.')}
    ${c.done<c.total?`<span class="chip" style="margin-left:6px">${c.done}/${c.total} ${T('answers read')}</span>`:''}</p>
  <div class="tw"><table>
    <thead><tr><th>${T('Quality')}</th>
      ${brands.map(b=>`<th class="n"${b.you?' style="color:var(--pri)"':''}>${esc(b.n)}</th>`).join('')}
      <th class="n">${T('Gap')}</th></tr></thead>
    <tbody>${rows.map(a=>`
      <tr><td>${esc(a.label)}</td>
        ${brands.map(b=>cell(a,b)).join('')}
        <td class="n">${a.gap>0
          ? `<span class="chip bad">−${a.gap}</span>`
          : a.gap<0 ? `<span class="chip ok">+${-a.gap}</span>`
          : `<span class="chip">0</span>`}</td></tr>`).join('')}
    </tbody></table></div>
  <p style="font-size:11px;color:var(--mute2);margin-top:10px">
    ${T('Numbers are how many answers attached that quality to that brand. + and − show whether it was said favourably.')}</p>`;
}

/**
 * What moved since the last scan.
 *
 * This is the panel that makes the product worth paying for month after month.
 * A customer who fixes the audit once and never hears from us again cancels;
 * one who sees "you fell from second to fifth and Klasgame passed you" cannot
 * afford to. It sits at the top of the dashboard for exactly that reason.
 */
function changesPanel(){
  const c=S.changes;
  if(!c || c.error || !c.digest) return '';
  const d=c.digest;
  const urgent=d.urgent||[], wins=d.wins||[];
  if(!urgent.length && !wins.length) return '';

  const open=S.changesOpen!==false;
  const icon=k=>({score_drop:'▼',rank_loss:'▼',lost_mention:'✕',rival_overtake:'⚑',
                  rival_surge:'▲',citation_lost:'✕',score_rise:'▲',rank_gain:'▲',
                  new_mention:'✓',citation_gained:'✓'})[k]||'·';

  const line=(e,bad)=>`
    <div style="display:flex;gap:10px;align-items:flex-start;padding:9px 0;border-bottom:1px solid var(--border)">
      <span style="color:${bad?'var(--bad)':'var(--ok)'};font-size:12px;line-height:1.5;flex:none">${icon(e.kind)}</span>
      <div style="flex:1;min-width:0">
        <div style="font-size:13px">${esc(e.detail)}</div>
        ${e.promptText?`<div style="font-size:11px;color:var(--mute2);margin-top:2px">“${esc(e.promptText)}”</div>`:''}
      </div>
      ${e.promptId?`<button class="btn b-gh b-sm" style="flex:none"
         onclick="go('mentions')">${T('Inspect')}</button>`:''}
    </div>`;

  return `
  <div class="card" style="margin-bottom:14px;${urgent.length?'border-color:rgba(239,68,68,.28)':''}">
    <div class="cb">
      <div style="display:flex;align-items:center;gap:11px;flex-wrap:wrap;cursor:pointer"
           onclick="S.changesOpen=${open?'false':'true'};render()">
        <b style="font-size:14px">${urgent.length?'⚠ ':''}${T('What changed since the last scan')}</b>
        ${urgent.length?`<span class="chip bad">${urgent.length} ${T('need attention')}</span>`:''}
        ${wins.length?`<span class="chip ok">${wins.length} ${T('improvements')}</span>`:''}
        <span style="margin-left:auto;color:var(--mute2);font-size:12px">${open?'▴':'▾'}</span>
      </div>
      ${open?`
        <div style="margin-top:8px">
          ${urgent.map(e=>line(e,true)).join('')}
          ${wins.map(e=>line(e,false)).join('')}
        </div>
        ${(d.contentTargets||[]).length?`
          <div style="margin-top:14px;padding:13px 15px;background:var(--muted);border-radius:var(--r);
                      border:1px solid var(--border)">
            <b style="font-size:13px">${T('Where to spend this month')}</b>
            <p style="font-size:12px;color:var(--mute);margin:4px 0 9px">
              ${T('Highest volume, lowest coverage — content here moves the score most.')}</p>
            ${d.contentTargets.map(t=>`
              <div style="display:flex;gap:10px;align-items:center;padding:6px 0;font-size:12px">
                <span style="flex:1;min-width:0">“${esc(t.text)}”</span>
                <span class="chip">%${Math.round(t.coverage*100)} ${T('coverage')}</span>
                <button class="btn b-gh b-sm" onclick="writeFor('${esc(t.text).replace(/'/g,"\\'")}')">
                  ${T('Write content')}</button>
              </div>`).join('')}
          </div>`:''}
        <p style="font-size:11px;color:var(--mute2);margin-top:12px">
          ${T('A weekly summary of this goes to your inbox. Turn it off in Settings → Profile.')}</p>
      `:''}
    </div></div>`;
}

  try{ await api.patch('/api/prompts',{id,active:next}); }
  catch(e){ p.active=!next; render(); toast(e.message); }
}
async function delPrompt(id){
  try{ await api.del(`/api/prompts?id=${encodeURIComponent(id)}`); await loadResults(); toast(T('Prompt deleted')); }
  catch(e){ toast(e.message); }

/**
 * Each press is one model completion. The server caps this at 15/hour per
 * organisation, but the button also has to stop taking presses while a request
 * is in flight — otherwise an impatient double-click spends twice and the
 * second reply overwrites the first for no benefit.
 */
let regenBusy=false;
async function regen(){
  if(regenBusy) return;
  regenBusy=true;
  const btn=document.querySelector('button[onclick="regen()"]');
  const label=btn?btn.textContent:null;
  if(btn){ btn.disabled=true; btn.textContent=T('Üretiliyor…'); }
  try{
    const r=await api.post('/api/prompts/generate',{workspaceId:S.workspaceId});
    const added=await api.post('/api/prompts',{workspaceId:S.workspaceId,
      prompts:r.prompts.map(p=>({text:p.text,intent:p.intent,volume:p.volume,source:'ai'}))});
    await loadResults();
    toast(added.added
      ? `${added.added} ${T('yeni sorgu eklendi')}${r.source==='template'?` (${T('şablonlardan')})`:''}`
      : T('Yeni sorgu yok — öneriler zaten listenizde'));
  }catch(e){ toast(e.message,'error'); }
  finally{
    regenBusy=false;
    if(btn){ btn.disabled=false; if(label) btn.textContent=label; }
  }
}

/**
 * Platform-by-platform advice.
 *
 * A single ranked list quietly assumes every engine works the same way. They
 * do not: Perplexity cites what it just fetched, AI Overviews is fed by the
 * Google index, ChatGPT leans on what the open web says about you. The same
 * score can need three different fixes, so the advice is split by engine.
 */
function planPlatforms(){
  const ins=S.insights;
  if(!ins) return `<div class="empty" style="padding:44px"><div class="ic">◎</div>
    <b style="color:var(--fg);font-size:14px">${T('Reading your platform data…')}</b></div>`;
  if(ins.error) return `<div class="empty" style="padding:44px"><div class="ic">⚠</div>
    <b style="color:var(--fg);font-size:14px">${T('Could not load your data')}</b>
    <p style="margin-top:8px">${esc(ins.error)}</p></div>`;

  const live=ins.filter(p=>p.measured);
  const idle=ins.filter(p=>!p.measured);
  if(!live.length) return `<div class="empty" style="padding:44px"><div class="ic">◌</div>
    <b style="color:var(--fg);font-size:14px">${T('No platform has been measured yet')}</b>
    <p style="margin-top:8px;max-width:46ch;margin-inline:auto">${T('Run a scan first. Everything on this screen is generated from your own results, never from a template — so there is nothing to show until answers exist.')}</p>
    <div style="margin-top:16px"><button class="btn b-pri b-sm" onclick="rescan()">↻ ${T('Rescan')}</button></div>
    ${S.isAdmin?`<div style="margin-top:12px;font-size:11px;color:var(--mute2)">${T('Operator')} ·
      <a href="#" onclick="go('settings');setTimeout(()=>setTab('integrations'),30);return false"
      style="color:var(--pri)">${T('Check keys')}</a></div>`:''}</div>`;

  // Worst first: that is the order a marketer should work in.
  const ordered=[...live].sort((a,b)=>b.impact-a.impact);
  const tone=dg=>dg==='healthy'?'ok':dg==='absent'||dg==='losing_to_rival'?'bad':'warn';

  return `
  <p style="font-size:12px;color:var(--mute);margin-bottom:14px">
    ${T('Each platform picks its sources differently, so the same score can need different work. Ordered by how much score is unclaimed.')}</p>

  ${ordered.map(p=>`
  <div class="card" style="margin-bottom:14px"><div class="cb">
    <div style="display:flex;align-items:flex-start;gap:12px;flex-wrap:wrap">
      <span class="d" style="width:26px;height:26px;border-radius:8px;display:grid;place-items:center;
        background:${(d=>d)(ENGINE_COLOR[p.engineKey]||'#B04628')}22;
        border:1px solid ${(ENGINE_COLOR[p.engineKey]||'#B04628')}55;font-size:12px;flex:none">
        ${ENGINE_GLYPH[p.engineKey]||'◆'}</span>
      <div style="flex:1;min-width:220px">
        <b style="font-size:14px">${esc(p.engineLabel)}</b>
        <span class="chip ${tone(p.diagnosis)}" style="margin-left:8px">${esc(p.headline)}</span>
        <p style="font-size:13px;color:var(--mute);margin-top:7px;max-width:74ch;line-height:1.6">${esc(p.why)}</p>
      </div>
      <div style="text-align:right;flex:none">
        <div class="mono" style="font-size:18px;font-weight:600">${p.score.toFixed(1)}</div>
        <div style="font-size:11px;color:var(--mute2)">${T('unclaimed')}: ${p.impact.toFixed(1)} ${T('pts')}</div>
      </div>
    </div>

    <div class="g4" style="margin:14px 0 4px">
      <div><div class="mut" style="font-size:11px">${T('Mention rate')}</div>
        <b class="mono">${(p.mentionRate*100).toFixed(0)}%</b></div>
      <div><div class="mut" style="font-size:11px">${T('Citation rate')}</div>
        <b class="mono">${(p.citationRate*100).toFixed(0)}%</b></div>
      <div><div class="mut" style="font-size:11px">${T('Average rank')}</div>
        <b class="mono">${p.meanRank?p.meanRank.toFixed(1):'—'}</b></div>
      <div><div class="mut" style="font-size:11px">${T('Total checks')}</div>
        <b class="mono">${p.checks}</b></div>
    </div>

    ${p.actions.map(a=>`
      <div style="margin-top:14px;padding:13px 15px;background:var(--muted);border-radius:var(--r);
                  border:1px solid var(--border)">
        <b style="font-size:13px">${esc(a.title)}</b>
        <p style="font-size:12px;color:var(--mute);margin-top:4px">${esc(a.detail)}</p>
        <ol style="margin:9px 0 0 18px;padding:0;font-size:12px;color:var(--fg2);line-height:1.85">
          ${a.steps.map(x=>`<li>${esc(x)}</li>`).join('')}</ol>
      </div>`).join('')}

    ${p.topSources.length?`
      <div style="margin-top:13px">
        <div class="mut" style="font-size:11px;margin-bottom:6px">
          ${T('Sources this platform cited most')}</div>
        <div style="display:flex;gap:7px;flex-wrap:wrap">
          ${p.topSources.slice(0,6).map(x=>
            `<span class="chip ${x.ours?'ok':''}">${esc(x.domain)} · ${x.count}${x.ours?' · '+T('yours'):''}</span>`).join('')}
        </div></div>`:''}
  </div></div>`).join('')}

  ${idle.length&&S.isAdmin?`<div class="banner" style="margin-top:16px"><span>🔑</span>
    <span><b>${T('Operator')}</b> · ${idle.length} ${T('platforms are not being measured, so no advice can be given for them')}:
      ${idle.map(p=>esc(p.engineLabel)).join(', ')}</span></div>`:''}`;
}

/**
 * Task detail. The row has had `onclick="taskModal(i)"` since the first build
 * but the function was never written, so every task in the action plan threw a
 * ReferenceError on click — the plan looked interactive and was not. The data
 * it needs (desc, steps, code) has always been on the item.
 */
function taskModal(i){
  const a=(S.data&&S.data.actions||[])[i];
  if(!a) return;
  const steps=(a.steps||[]).map((x,n)=>
    `<div style="display:flex;gap:10px;margin-bottom:8px">
       <span style="width:20px;height:20px;border-radius:6px;background:rgba(176,70,40,.15);
         color:var(--pri);display:grid;place-items:center;font-size:11px;flex:none">${n+1}</span>
       <span style="font-size:13px">${esc(x)}</span></div>`).join('');
  openModal(a.t, `
    <p style="font-size:13px;color:var(--mute);margin-bottom:16px">${esc(a.desc||a.sub||'')}</p>
    <div style="display:flex;gap:8px;flex-wrap:wrap;margin-bottom:16px">
      <span class="chip ok">${T('Impact')} ${esc(a.im)}</span>
      <span class="chip">${esc(a.ef||'')}</span>

VIEWS.audit=()=>{
  const d=S.data;
  const facs=d.audit.flatMap(c=>c.facs);
  const pass=facs.filter(f=>f.st==='pass').length;
  const part=facs.filter(f=>f.st==='partial').length;
  const fail=facs.filter(f=>f.st==='fail').length;
  const col=v=>v>=80?'var(--ok)':v>=60?'var(--warn)':'var(--bad)';
  const cat=d.audit.slice().sort((a,b)=>a.score-b.score);
  const worst=cat[0];

  return head(T('GEO Site Audit'),
    T('Sitenizin yapay zeka tarafından okunmaya ve kaynak gösterilmeye teknik hazırlığı. 58 kriter, 6 başlıkta.'),
    `<input class="in" id="auditUrl" aria-label="${T('Denetlenecek adres')}" style="width:260px" value="${esc(S.brand.site)}">
     <button class="btn b-pri b-sm" id="auditBtn" onclick="runAudit()">${T('Run Audit')}</button>`)+
  `${!d.auditRanAt?`<div class="card"><div class="empty" style="padding:40px 16px">
      <div class="ic">◳</div>
      <b style="color:var(--fg);font-size:14px">${T('Bu site henüz denetlenmedi')}</b>
      <p style="margin-top:8px;max-width:52ch;margin-inline:auto">${T('Denetim, sitenizi bir yapay zeka botunun gördüğü gibi okur ve kaynak gösterilmenizi engelleyen teknik eksikleri çıkarır. Görünürlük skoru çıktıyı ölçer; bu skor girdiyi.')}</p>
      <button class="btn b-pri b-sm" style="margin-top:16px" onclick="runAudit()">${T('Run Audit')}</button></div></div>`
  :`
  <div class="g4">
    <div class="kpi"><div class="t">${T('Site hazırlık skoru')} ${kpiHelp('audit')}</div>
      <div class="v" style="color:${col(d.auditScore)}">${d.auditScore.toFixed(0)}<span style="font-size:14px;color:var(--mute2)">/100</span></div>
      <div class="d">${d.auditScore>=80?T('sağlıklı'):d.auditScore>=60?T('iyileştirilebilir'):T('ciddi teknik eksik')}</div></div>
    <div class="kpi"><div class="t">${T('Karşılanan kriter')}</div>
      <div class="v">${pass}<span style="font-size:14px;color:var(--mute2)">/${facs.length}</span></div>
      <div class="d">${part} ${T('kısmi')} · ${fail} ${T('başarısız')}</div></div>
    <div class="kpi"><div class="t">${T('En zayıf başlık')}</div>
      <div class="v" style="font-size:20px">${worst?esc(T(worst.n)):'—'}</div>
      <div class="d">${worst?`${worst.score.toFixed(0)}/100`:'—'}</div></div>
    <div class="kpi"><div class="t">${T('Son denetim')}</div>
      <div class="v" style="font-size:20px">${new Date(d.auditRanAt).toLocaleDateString('tr-TR')}</div>
      <div class="d">${relTime(d.auditRanAt)}</div></div>
  </div>

  ${fail?`<div class="srcwarn">
    <b>${fail} ${T('kriter karşılanmıyor')}</b>
    <span>${T('Bu eksikler yapay zekanın sitenizi okumasını ve kaynak göstermesini doğrudan engelliyor. Her biri Aksiyon Planı’nda etkiye göre sıralanmış bir iş kalemi olarak duruyor.')}</span>
    <button onclick="go('plan')">${T('Aksiyon planı')} →</button></div>`:''}

  <div class="card">
    <div class="ch"><div><h3>${T('Category scores')}</h3>
      <div class="sub">${T('En zayıf başlık üstte. Başlığa tıklayın, hangi kriterin kaldığını görün.')}</div></div>

    <div class="cb">${cat.map((c,i)=>{
      const cf=c.facs.filter(f=>f.st==='fail').length;
      const cp=c.facs.filter(f=>f.st==='partial').length;
      const ck=c.facs.filter(f=>f.st==='pass').length;
      return `<div class="acc"><div class="acc-h" onclick="this.parentNode.classList.toggle('open')">
        <div class="i" style="color:color-mix(in srgb, ${col(c.score)} 78%, var(--fg));background:color-mix(in srgb, ${col(c.score)} 11%, transparent);box-shadow:inset 0 0 0 1.5px color-mix(in srgb, ${col(c.score)} 32%, transparent)">${c.score.toFixed(0)}</div>
        <div style="min-width:0;flex:1">
          <h5>${esc(T(c.n))}</h5>
          <div class="sb2">${ck} ${T('karşılandı')} · ${cp} ${T('kısmi')} · ${cf} ${T('başarısız')}</div></div>

          </div>`).join('')}</div></div>`}).join('')}</div>
