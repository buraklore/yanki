<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>YANKI — AI Visibility Platform</title>
<meta name="theme-color" content="#0A0B0F">
<link rel="icon" href="data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%22%20viewBox%3D%220%200%2064%2064%22%3E%3Cdefs%3E%3ClinearGradient%20id%3D%22g%22%20x1%3D%220%22%20y1%3D%220%22%20x2%3D%221%22%20y2%3D%221%22%3E%3Cstop%20offset%3D%220%22%20stop-color%3D%22%233B82F6%22%2F%3E%3Cstop%20offset%3D%221%22%20stop-color%3D%22%238B5CF6%22%2F%3E%3C%2FlinearGradient%3E%3C%2Fdefs%3E%3Crect%20width%3D%2264%22%20height%3D%2264%22%20rx%3D%2216%22%20fill%3D%22url%28%23g%29%22%2F%3E%3Ctext%20x%3D%2232%22%20y%3D%2245%22%20font-family%3D%22Poppins%2CArial%2Csans-serif%22%20font-size%3D%2238%22%20font-weight%3D%22700%22%20fill%3D%22%23fff%22%20text-anchor%3D%22middle%22%3EY%3C%2Ftext%3E%3C%2Fsvg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0A0B0F;--bg2:#0C0E13;--card:#111319;--card2:#151821;--card3:#1A1D27;
  --border:#20232E;--border2:#2A2E3C;--fg:#F3F5F9;--fg2:#C6CCD9;--mute:#949CAD;--mute2:#7C8598;
  --pri:#3B82F6;--pri-btn:#2563EB;--pri2:#5B8DFF;--pri-ink:#1D4ED8;--vio:#8B5CF6;
  --ok:#22C55E;--warn:#F59E0B;--bad:#EF4444;
  --r:10px;--rl:14px;--rx:18px;--r2:24px;
  --mono:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font-family:Poppins,-apple-system,"Segoe UI",Roboto,sans-serif;
  font-size:15px;line-height:1.6;-webkit-font-smoothing:antialiased}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
a{color:inherit;text-decoration:none}button{font:inherit;cursor:pointer}
h1,h2,h3,h4,h5{margin:0;font-weight:600;letter-spacing:-.03em;line-height:1.18}
p{margin:0}
input,select,textarea{font:inherit}
:focus-visible{outline:2px solid var(--pri);outline-offset:2px}
::-webkit-scrollbar{width:9px;height:9px}::-webkit-scrollbar-thumb{background:#242835;border-radius:9px}
.mono{font-family:var(--mono)}
.mut{color:var(--mute)}.ok{color:var(--ok)}.bad{color:var(--bad)}.warn{color:var(--warn)}

/* ---------- primitives ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:10px 18px;border-radius:var(--r);
  font-size:14px;font-weight:500;border:1px solid transparent;transition:.16s;white-space:nowrap}
.btn:disabled{opacity:.45;cursor:not-allowed}
.b-pri{background:var(--pri-btn);color:#fff;box-shadow:0 6px 20px -8px rgba(59,130,246,.8)}
.b-pri:hover:not(:disabled){background:var(--pri2)}
.b-gh{background:rgba(255,255,255,.04);color:var(--fg);border-color:var(--border2)}
.b-gh:hover:not(:disabled){background:rgba(255,255,255,.08)}
.b-dg{background:rgba(239,68,68,.12);color:#FCA5A5;border-color:rgba(239,68,68,.3)}
.b-sm{padding:7px 13px;font-size:13px}
.b-lg{padding:13px 24px;font-size:15px}
.b-full{width:100%}
.fld{margin-bottom:16px}
.fld label{display:block;font-size:13px;font-weight:500;margin-bottom:7px}
.fld .hint{font-size:12px;color:var(--mute);margin-top:6px}
.in{width:100%;padding:11px 13px;border:1px solid var(--border2);border-radius:var(--r);background:#0D0F15;color:var(--fg);font-size:14px}
.in::placeholder{color:var(--mute2)}
.in:focus{outline:none;border-color:var(--pri);box-shadow:0 0 0 3px rgba(59,130,246,.16)}
textarea.in{min-height:92px;resize:vertical}
.chip{display:inline-flex;align-items:center;gap:5px;padding:3px 9px;border-radius:999px;font-size:11px;font-weight:500;
  background:rgba(255,255,255,.05);color:var(--mute);border:1px solid var(--border)}
.chip.ok{background:rgba(34,197,94,.1);color:#4ADE80;border-color:rgba(34,197,94,.24)}
.chip.warn{background:rgba(245,158,11,.1);color:#FBBF24;border-color:rgba(245,158,11,.24)}
.chip.bad{background:rgba(239,68,68,.1);color:#F87171;border-color:rgba(239,68,68,.26)}
.chip.pri{background:rgba(59,130,246,.11);color:#93B4FF;border-color:rgba(59,130,246,.26)}
.chip.vio{background:rgba(139,92,246,.11);color:#C4B5FD;border-color:rgba(139,92,246,.26)}
.card{background:var(--card);border:1px solid var(--border);border-radius:var(--rl)}
.ch{display:flex;align-items:flex-start;gap:10px;padding:16px 18px 0}
.ch h3{font-size:19px}
.ch .sub{font-size:12px;color:var(--mute);margin-top:4px;max-width:70ch;line-height:1.5}
.ch .rt{margin-left:auto;font-size:11px;color:var(--mute2);white-space:nowrap;display:flex;gap:8px;align-items:center}
.cb{padding:16px 18px}
.bar{height:6px;border-radius:99px;background:rgba(255,255,255,.07);overflow:hidden}
.bar i{display:block;height:100%;border-radius:99px;background:var(--pri)}
table{width:100%;border-collapse:collapse;font-size:13.5px}
th{font-size:10.5px;font-weight:500;color:var(--mute2);letter-spacing:.06em;text-transform:uppercase;
  text-align:left;padding:10px 12px;border-bottom:1px solid var(--border);white-space:nowrap}
td{padding:11px 12px;border-bottom:1px solid var(--border);vertical-align:middle}
tbody tr:last-child td{border-bottom:0}
tbody tr:hover{background:rgba(255,255,255,.018)}
td.n,th.n{text-align:right;font-family:var(--mono);font-size:12.5px}
.tw{overflow-x:auto}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.g3{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}
.g4{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}
@media(max-width:1180px){.g4{grid-template-columns:repeat(2,1fr)}}
@media(max-width:1000px){.g2,.g3{grid-template-columns:1fr}}
@media(max-width:640px){.g4{grid-template-columns:1fr}}
.kpi{background:var(--card);border:1px solid var(--border);border-radius:var(--rl);padding:15px 17px}
.kpi .t{font-size:11px;color:var(--mute);font-weight:500;display:flex;align-items:center;gap:6px}
.kpi .t i{width:7px;height:7px;border-radius:99px;display:block}
.kpi .v{font-size:29px;font-weight:600;letter-spacing:-.04em;margin-top:4px}
.kpi .d{font-size:11.5px;color:var(--mute);margin-top:2px}
.empty{padding:44px 20px;text-align:center;color:var(--mute);font-size:13.5px}
.empty .ic{width:44px;height:44px;border-radius:13px;background:rgba(59,130,246,.09);color:#93B4FF;
  display:grid;place-items:center;font-size:19px;margin:0 auto 12px}
code{font-family:var(--mono);font-size:11.5px;background:var(--muted);border:1px solid var(--border);
  border-radius:5px;padding:1px 5px;color:#AFC8FF}
pre{background:#08090D;border:1px solid var(--border);color:#CFD6E6;padding:14px 16px;border-radius:var(--r);
  font-family:var(--mono);font-size:12px;overflow-x:auto;margin:0;line-height:1.75;white-space:pre-wrap;word-break:break-word}

/* ---------- onboarding ---------- */
#ob{min-height:100vh;display:none;flex-direction:column}
#ob.on{display:flex}
.ob-top{height:64px;border-bottom:1px solid var(--border);display:flex;align-items:center;padding:0 26px;gap:14px;
  position:sticky;top:0;background:rgba(10,11,15,.85);backdrop-filter:blur(14px);z-index:20}
.ob-top .r{margin-left:auto;display:flex;align-items:center;gap:12px;font-size:13px;color:var(--mute)}
.ob-dots{display:flex;gap:5px}
.ob-dots i{width:7px;height:7px;border-radius:99px;background:#252936;display:block}
.ob-dots i.on{background:var(--pri)}
.ob-prog{height:3px;background:#171A22}
.ob-prog i{display:block;height:100%;background:linear-gradient(90deg,var(--pri),var(--vio));transition:width .4s}
.stepper{display:flex;justify-content:center;gap:0;padding:26px 20px 6px;flex-wrap:wrap}
.st{display:flex;align-items:center}
.st .n{width:30px;height:30px;border-radius:99px;display:grid;place-items:center;font-size:12.5px;font-weight:600;
  background:#191D27;color:var(--mute);border:1px solid var(--border2)}
.st.on .n{background:var(--pri-btn);color:#fff;border-color:var(--pri-btn);box-shadow:0 0 0 5px rgba(59,130,246,.16)}
.st.dn .n{background:var(--pri-btn);color:#fff;border-color:var(--pri-btn)}
.st .lb{font-size:11.5px;color:var(--mute);position:absolute;margin-top:52px;transform:translateX(-50%);white-space:nowrap}
.st.on .lb,.st.dn .lb{color:var(--fg);font-weight:500}
.st .ln{width:clamp(24px,5vw,66px);height:1px;background:var(--border2);margin:0 4px}
.st.dn .ln{background:var(--pri-btn)}
.ob-body{flex:1;display:grid;place-items:start center;padding:56px 20px 60px}
.ob-card{width:100%;max-width:600px;text-align:center}
.ob-ic{width:62px;height:62px;border-radius:17px;background:rgba(59,130,246,.11);border:1px solid rgba(59,130,246,.24);
  display:grid;place-items:center;font-size:25px;margin:0 auto 18px}
.ob-card h2{font-size:29px;margin-bottom:8px}
.ob-card .lead{color:var(--mute);font-size:14px;max-width:52ch;margin:0 auto 30px}
.ob-form{text-align:left}
.info{border:1px solid rgba(59,130,246,.22);background:rgba(59,130,246,.05);border-radius:var(--rl);padding:16px 18px;
  font-size:13.5px;color:var(--fg2);text-align:left;margin-bottom:22px}
.info ul{margin:12px 0 0;padding-left:18px;color:var(--mute);font-size:13px}
.info li{margin-bottom:4px}
.sugg{border:1px dashed var(--border2);border-radius:var(--rl);padding:20px;text-align:center;margin-bottom:18px}
.taglist{display:flex;gap:8px;flex-wrap:wrap}
.tagx{display:inline-flex;align-items:center;gap:8px;padding:8px 12px;min-height:34px;border-radius:999px;background:var(--card2);
  border:1px solid var(--border2);font-size:13px}
.tagx button{background:none;border:0;color:var(--mute);font-size:15px;line-height:1;
  width:30px;height:30px;display:grid;place-items:center;border-radius:8px;margin:-7px -8px -7px 0}
.tagx button:hover{background:rgba(239,68,68,.14)}
.tagx button:hover{color:var(--bad)}
.tagx.pick{cursor:pointer}
.tagx.pick:hover{border-color:var(--pri);background:rgba(59,130,246,.09)}
.rivrow{margin-bottom:14px}
.rivrow .hd{display:flex;align-items:center;font-size:12.5px;color:var(--mute);margin-bottom:6px}
.rivrow .hd button{margin-left:auto;background:none;border:0;color:var(--mute);font-size:15px;
  width:30px;height:30px;display:grid;place-items:center;border-radius:8px;margin:-6px -6px -6px 0}
.rivrow .hd button:hover{background:rgba(239,68,68,.14);color:#FCA5A5}
.rivrow .in2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
@media(max-width:560px){.rivrow .in2{grid-template-columns:1fr}}
.qitem{display:flex;align-items:flex-start;gap:12px;padding:13px 15px;border:1px solid var(--border);border-radius:var(--r);
  margin-bottom:8px;background:var(--card);cursor:pointer;transition:.14s}
.qitem:hover{border-color:var(--border2)}
.qitem.on{border-color:rgba(59,130,246,.45);background:rgba(59,130,246,.06)}
.qbox{width:19px;height:19px;border-radius:5px;border:1px solid var(--border2);flex:none;display:grid;place-items:center;
  font-size:11px;margin-top:1px;color:transparent}
.qitem.on .qbox{background:var(--pri-btn);border-color:var(--pri-btn);color:#fff}
.qitem span{font-size:13.5px;text-align:left}
.done-row{display:flex;align-items:center;gap:11px;padding:13px 16px;border:1px solid var(--border);border-radius:var(--r);
  margin-bottom:10px;background:var(--card);font-size:13.5px;text-align:left}
.done-row .d{width:22px;height:22px;border-radius:99px;display:grid;place-items:center;font-size:11px;flex:none}
.ob-nav{display:flex;gap:12px;margin-top:26px}
.ob-nav .btn{flex:1}

/* ---------- app shell ---------- */
#app{display:none;min-height:100vh}
#app.on{display:grid;grid-template-columns:278px minmax(0,1fr)}
#sb{border-right:1px solid var(--border);background:#08090D;padding:14px 12px;display:flex;flex-direction:column;gap:13px;
  height:100vh;position:sticky;top:0;overflow-y:auto}
.sb-logo{display:flex;align-items:center;gap:9px;font-weight:600;font-size:17px;padding:4px 8px 13px;border-bottom:1px solid var(--border)}
.mk{width:27px;height:27px;border-radius:8px;flex:none;background:linear-gradient(140deg,#3B82F6,#8B5CF6);
  display:grid;place-items:center;color:#fff;font-size:12px;font-weight:700}
/* =====================================================================
   SIDEBAR
   =====================================================================
   Written against one question: does this look like it belongs to a company
   that has been doing this for a decade, or to a side project.
   The answer is mostly restraint. Enterprise tools earn their weight with
   structure and discipline — a spine the eye can follow, hairlines instead
   of cards, tabular figures, tight uppercase eyebrows — not with rounded
   gradient tiles, which are the single clearest tell of a young product.
   So: no gradients, radii down from 12px to 5px, one accent, and a rule
   running the height of the navigation that every item hangs off.
   ===================================================================== */
#sb{padding:0;gap:0;background:#07080B;border-right:1px solid #191C24}

/* --- Zone 1: identity ------------------------------------------------- */
.sb-id{padding:15px 14px 14px;border-bottom:1px solid #191C24;background:#0A0C10}
.sb-logo{display:flex;align-items:center;gap:9px;padding:0 2px 14px;border:0}
.mk{width:27px;height:27px;border-radius:6px;flex:none;background:#2D6BE8;
  display:grid;place-items:center;color:#fff;font-size:13px;font-weight:700;letter-spacing:-.02em}
.sb-logo .wm{font-size:15.5px;font-weight:700;letter-spacing:.08em;color:var(--fg)}

/* Client selector. Square corners and a monogram plate rather than a rounded
   avatar: this is a record being selected, not a person being greeted. */
.sb-ws{display:flex;align-items:center;gap:10px;width:100%;min-width:0;text-align:left;
  background:#10131A;border:1px solid #212530;border-radius:6px;padding:8px 9px;color:var(--fg)}
.sb-ws:hover{border-color:#2E3441;background:#141822}
.sb-ws .sq{width:32px;height:32px;border-radius:5px;flex:none;display:grid;place-items:center;
  font-size:13.5px;font-weight:700;color:#9CC0FF;background:#16233A;border:1px solid #24375C}
.sb-ws .wt{min-width:0;display:grid;flex:1;gap:2px}
.sb-ws .wt b{font-size:14.5px;font-weight:600;letter-spacing:-.01em;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sb-ws .wt i{font-style:normal;font-size:11.5px;color:#6B7385;letter-spacing:.01em;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sb-ws .cv{flex:none;width:14px;height:14px;color:#5A6274}
.sb-ws .cv svg{width:100%;height:100%;display:block}

/* The reading, as a meter. A number with a track behind it states a position
   on a scale; the same number in a sentence states nothing. */
.sb-meter{margin-top:12px}
.sb-meter .mrow{display:flex;align-items:baseline;gap:8px;margin-bottom:6px}
.sb-meter .ml{font-size:10.5px;font-weight:700;letter-spacing:.13em;color:#5A6274}
.sb-meter .mu{font-family:var(--mono);font-size:10.5px;color:#4E5665;margin-left:2px}
.sb-meter .mv{margin-left:auto;font-family:var(--mono);font-variant-numeric:tabular-nums;
  font-size:16px;font-weight:600;letter-spacing:-.02em;color:var(--fg)}
.sb-meter .mtrack{height:3px;border-radius:2px;background:#161A22;overflow:hidden}
.sb-meter .mtrack i{display:block;height:100%;width:0;background:#2D6BE8;transition:width .45s ease}
.sb-meter .mtrack i.mid{background:#D89A2B}
.sb-meter .mtrack i.bad{background:#D4504F}
.sb-meter .pill{display:flex;align-items:center;gap:6px;margin-top:9px;
  font-size:11.5px;color:#6B7385;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sb-meter .dot{width:5px;height:5px;border-radius:50%;flex:none;background:#5A6274}
.sb-meter .dot.ok{background:#3FA46A}
.sb-meter .dot.bad{background:#D4504F}
.sb-meter .dot.run{background:#2D6BE8;animation:pulse 1.4s ease-in-out infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.3}}

/* --- Workspace menu --------------------------------------------------- */
.sb-wswrap{position:relative}
.wsmenu{display:none}

/* --- Zone 2: navigation ----------------------------------------------
   Every item hangs off a single rule running the height of the column. The
   active marker sits on that rule rather than floating beside it, which is
   what turns a list of links into a structure. */
.nav{display:grid;gap:0;padding:12px 14px 8px;position:relative}
.nav::before{content:"";position:absolute;left:9px;top:18px;bottom:14px;width:1px;background:#1C2029}
.nav .sec{font-size:10.5px;font-weight:700;letter-spacing:.13em;color:#4E5665;
  padding:16px 0 7px 22px;position:relative}
.nav .sec:first-child{padding-top:2px}
.nav a{position:relative;display:flex;align-items:center;gap:11px;padding:9px 9px 9px 22px;
  border-radius:6px;font-size:14px;color:#8590A3;width:100%;line-height:1.35;letter-spacing:-.005em}
.nav a:hover{color:var(--fg);background:#10131A}
.nav a.on{background:#111827;color:#EAF0FA;font-weight:500}
/* The marker sits on the spine, covering it — the rule and the active
   state are the same line, which is what makes the column read as one
   structure instead of two decorations. */
.nav a.on::before{content:"";position:absolute;left:8px;top:6px;bottom:6px;width:3px;
  border-radius:2px;background:#2D6BE8}
.nav .g{width:19px;height:19px;flex:none;opacity:.6;stroke-width:1.7}
.nav a:hover .g{opacity:.85}
.nav a.on .g{opacity:1;color:#6E9BF0}
.nav a span{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
/* Volume, in tabular figures. A tool that shows how much is inside each
   section looks like a tool with something inside it. */
.nav .ct{flex:none;font-family:var(--mono);font-variant-numeric:tabular-nums;
  font-size:11px;color:#4E5665}
.nav a.on .ct,.nav a:hover .ct{color:#8590A3}

/* --- Foot: status bar -------------------------------------------------- */
.sb-foot{margin-top:auto;display:grid;gap:0;border-top:1px solid #191C24;background:#0A0C10}
.plan-row{display:flex;align-items:center;gap:9px;padding:12px 14px;font-size:13px;
  color:var(--fg);border-bottom:1px solid #191C24}
.plan-row:hover{background:#10131A}
.plan-row .pd{width:5px;height:5px;border-radius:50%;background:#3FA46A;flex:none}
.plan-row b{font-weight:600;letter-spacing:.02em}
.plan-row .mn{margin-left:auto;font-size:11.5px;color:#5A6274}
.trial{padding:12px 14px;border-bottom:1px solid #191C24;background:#0C0F15}
.trial .tr-top{display:flex;align-items:baseline;gap:8px;margin-bottom:7px}
.trial .tr-top b{font-size:13px;font-weight:600}
.trial .tr-d{margin-left:auto;font-family:var(--mono);font-size:11.5px;color:#6B7385}
.trial .tr-bar{height:3px;border-radius:2px;background:#161A22;overflow:hidden}
.trial .tr-bar i{display:block;height:100%;background:#2D6BE8;transition:width .4s ease}
.trial .btn{border-radius:5px;font-size:12px;padding:8px 12px;background:#2D6BE8;border-color:#2D6BE8}
.trial .btn{margin-top:10px}
.sb-acct{display:flex;align-items:center;gap:9px;min-width:0;padding:9px 14px}
.sb-acct .av{width:32px;height:32px;border-radius:6px;flex:none;display:grid;place-items:center;
  font-size:11.5px;font-weight:700;color:#9CC0FF;background:#16233A;border:1px solid #24375C}
.sb-acct .who{min-width:0;display:grid;flex:1;gap:1px}
.sb-acct .who b{font-size:13px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sb-acct .who i{font-style:normal;font-size:10.5px;color:#5A6274;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sb-acct .ics{display:flex;gap:3px;flex:none}
/* The two controls at the foot are the ones a user reaches for least often
   and needs most reliably. At 26px with a 14px glyph they were a smaller tap
   target than anything else in the column. */
.sb-acct .ics button{width:34px;height:34px;display:grid;place-items:center;border-radius:8px;
  background:none;border:0;color:#7B8494;padding:0}
.sb-acct .ics button:hover{color:var(--fg);background:#181D27}
.sb-acct .ics svg{width:18px;height:18px;display:block}
.sb-fb{display:none}
/* Workspace switcher — anchored to the button so it reads as belonging to it
   rather than floating over the nav. */
.apphead{display:flex;align-items:center;gap:14px;padding:14px 26px 0;justify-content:flex-end}
.apphead .hs{font-size:12.5px;color:var(--mute)}
.apphead .hs b{color:var(--fg);font-weight:600}
.apphead .btn{padding:9px 16px;font-size:13px}
.apphead .btn:disabled{opacity:.55}
@media(max-width:720px){.apphead{padding:10px 16px 0}}
.qm{width:15px;height:15px;border-radius:50%;border:1px solid var(--border);background:var(--card2);
  color:var(--mute2);font-size:10px;line-height:1;display:inline-grid;place-items:center;margin-left:5px;
  vertical-align:middle;padding:0}
.qm:hover{color:var(--fg);border-color:var(--mute2)}
.sb-wswrap{position:relative}
.wsmenu{display:none}
.wsmenu.open{display:block;position:absolute;left:0;right:0;top:calc(100% + 6px);z-index:60;
  background:var(--card);border:1px solid var(--border2);border-radius:11px;padding:5px;
  box-shadow:0 16px 40px rgba(0,0,0,.5)}
/* Only the list scrolls; the add row stays pinned under it. */
.wsmenu .list{max-height:264px;overflow-y:auto}
.wsmenu .add{display:flex;align-items:center;gap:9px;color:#93B4FF;font-weight:500}
.wsmenu .add .pl{width:22px;height:22px;border-radius:6px;border:1px dashed var(--border2);
  display:grid;place-items:center;font-size:13px;color:#93B4FF;flex:none}
.wsmenu .add:hover .pl{border-style:solid}
.wsmenu button{display:flex;align-items:center;gap:9px;width:100%;text-align:left;background:none;
  border:0;border-radius:8px;padding:8px 9px;color:var(--fg);font-size:12.5px}
.wsmenu button:hover{background:rgba(255,255,255,.04)}
.wsmenu button.on{background:rgba(59,130,246,.12)}
.wsmenu .sq{width:22px;height:22px;border-radius:6px;background:rgba(59,130,246,.16);
  display:grid;place-items:center;font-size:11px;font-weight:700;flex:none}
.wsmenu .t{min-width:0;display:grid}
.wsmenu .t b{font-size:12.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.wsmenu .t i{font-style:normal;font-size:10.5px;color:var(--mute2);overflow:hidden;
  text-overflow:ellipsis;white-space:nowrap}
.wsmenu .ck{margin-left:auto;color:#7FB2FF;font-size:11px}
.wsmenu .sep{height:1px;background:var(--border);margin:5px 2px}
.wsmenu .add{color:var(--mute)}
.wsmenu .cnt{margin-left:auto;font-size:10.5px;color:var(--mute2)}

/* Scan strip. Freshness is the first question a returning user has, so it sits
   above the nav rather than buried on the dashboard. */
.sb-scan{display:flex;align-items:center;gap:8px;margin:10px 0 4px}
.sb-scan .pill{display:flex;align-items:center;gap:6px;font-size:11px;color:var(--mute);
  min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;flex:1}
.sb-scan .dot{width:7px;height:7px;border-radius:50%;flex:none;background:var(--mute2)}
.sb-scan .dot.ok{background:#4ADE80}
.sb-scan .dot.bad{background:#F87171}
.sb-scan .dot.run{background:#60A5FA;animation:pulse 1.4s ease-in-out infinite}
.sb-scan .dot.idle{background:var(--mute2)}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.35}}
.sb-scan button{flex:none;font-size:11.5px;padding:5px 9px}
.sb-scan button:disabled{opacity:.5}
.sb-foot{margin-top:auto;display:grid;gap:10px;padding-top:10px}
/* Provenance line: what was measured and when. */
.ranline{display:flex;align-items:center;gap:16px;flex-wrap:wrap}
.ranline .rn{display:flex;align-items:center;gap:6px;font-size:11.5px;color:var(--mute2);white-space:nowrap}
.ranline .rn .d{width:6px;height:6px;border-radius:50%;background:var(--border2);flex:none}
.ranline .rn .d.ok{background:#4ADE80}
.ranline .rn b{font-family:var(--mono);font-variant-numeric:tabular-nums;
  font-size:11.5px;font-weight:500;color:var(--fg2)}
.ranline .rn em{font-style:normal;color:var(--mute2)}
@media(max-width:720px){.ranline{gap:10px}.ranline .rn em{display:none}}

.trial{border:1px solid var(--border);border-radius:12px;padding:12px;
  background:linear-gradient(160deg,rgba(59,130,246,.1),var(--card2))}
.trial .tr-top{display:flex;align-items:baseline;gap:8px;margin-bottom:9px}
.trial .tr-top b{font-size:12.5px;font-weight:600}
.trial .tr-d{margin-left:auto;font-size:11.5px;color:var(--mute2)}
.trial .tr-bar{height:4px;border-radius:99px;background:rgba(255,255,255,.07);overflow:hidden}
.trial .tr-bar i{display:block;height:100%;border-radius:99px;
  background:linear-gradient(90deg,#3B82F6,#8B5CF6);transition:width .4s ease}
.main{min-width:0;background:var(--bg2)}
.mobbar{display:none;align-items:center;gap:12px;padding:12px 16px;border-bottom:1px solid var(--border);
  position:sticky;top:0;background:rgba(10,11,15,.9);backdrop-filter:blur(12px);z-index:50}
.page{padding:clamp(14px,2vw,22px);display:grid;gap:14px;align-content:start}
.ptitle{display:flex;align-items:flex-start;gap:14px;flex-wrap:wrap}
.ptitle h1{font-size:26px}
.ptitle .s{font-size:13px;color:var(--mute);margin-top:4px;max-width:80ch}
.ptitle .r{margin-left:auto;display:flex;gap:9px;flex-wrap:wrap}
.banner{display:flex;align-items:center;gap:12px;padding:13px 16px;border:1px solid rgba(59,130,246,.24);
  background:rgba(59,130,246,.06);border-radius:var(--rl);font-size:13px;color:var(--fg2)}
.banner .r{margin-left:auto}
.tabs{display:flex;gap:22px;border-bottom:1px solid var(--border);overflow-x:auto}
.tabs button{background:none;border:0;padding:11px 0;font-size:13.5px;color:var(--mute);border-bottom:2px solid transparent;white-space:nowrap}
.tabs button.on{color:var(--fg);border-bottom-color:var(--pri);font-weight:500}
.pills{display:flex;gap:6px;flex-wrap:wrap}
.pills button{padding:5px 11px;border-radius:999px;border:1px solid var(--border);background:var(--card);
  font-size:11.5px;color:var(--mute)}
.pills button.on{background:rgba(59,130,246,.16);color:#BBD1FF;border-color:rgba(59,130,246,.32)}
/* The insight card is the one place on the dashboard that argues rather than
   reports, so it is allowed to look different from every other card. Severity
   drives the colour: a critical finding in the same calm blue as an
   opportunity teaches the reader that colour means nothing here. */
.ins{border-radius:var(--rl);padding:22px;position:relative;overflow:hidden;min-height:250px;
  display:flex;flex-direction:column;
  background:linear-gradient(155deg,#1E3A8A,#2D4FD6 50%,#3B6BF5)}
.ins.crit{background:linear-gradient(155deg,#7A1330,#B01E3C 48%,#D93A56)}
.ins.warn{background:linear-gradient(155deg,#7A4A0B,#B0740F 48%,#D99A1A)}
.ins.opp{background:linear-gradient(155deg,#0E4B3A,#12795C 48%,#1AA37A)}
.ins.good{background:linear-gradient(155deg,#123C6B,#1D5FA8 48%,#2C86D9)}
.ins.wait{background:linear-gradient(155deg,#1F2433,#2C3346 50%,#3A4459)}
.ins::after{content:"";position:absolute;inset:0;pointer-events:none;
  background:radial-gradient(75% 55% at 12% 0%,rgba(255,255,255,.18),transparent 62%)}
.ins>*{position:relative;z-index:1}

.ins-top{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.ins .tg{background:rgba(255,255,255,.16);border:1px solid rgba(255,255,255,.26);border-radius:7px;
  padding:5px 10px;font-size:10px;font-weight:700;letter-spacing:.11em}
/* The number the sentence is about, pulled out so it registers before the
   prose does — a reader who only glances still leaves with the figure. */
.ins-m{margin-left:auto;display:flex;align-items:baseline;gap:6px;
  font-size:11.5px;color:rgba(255,255,255,.75)}
.ins-m b{font-size:30px;font-weight:700;letter-spacing:-.04em;color:#fff;line-height:1}

.ins .hl{font-size:26px;font-weight:650;letter-spacing:-.035em;margin-top:18px;line-height:1.16;
  text-wrap:balance}
.ins .tx{margin-top:11px;font-size:13px;line-height:1.7;color:rgba(255,255,255,.9)}
.ins-cta{margin-top:auto;align-self:flex-start;display:inline-flex;align-items:center;gap:9px;
  background:#fff;color:#15306E;border:0;border-radius:11px;padding:13px 22px;
  font-size:13.5px;font-weight:650;letter-spacing:-.01em;cursor:pointer;
  box-shadow:0 6px 22px rgba(0,0,0,.3);transition:transform .14s ease,box-shadow .14s ease}
.ins.crit .ins-cta{color:#7A1330}
.ins.warn .ins-cta{color:#5C3707}
.ins.opp  .ins-cta{color:#0E4B3A}
.ins.good .ins-cta{color:#123C6B}
.ins-cta:hover{transform:translateY(-1px);box-shadow:0 10px 28px rgba(0,0,0,.38)}
.ins-cta span{transition:transform .14s ease}
.ins-cta:hover span{transform:translateX(3px)}
.lock{display:flex;align-items:center;gap:8px;font-size:11.5px;color:var(--mute2)}
.locked-row{opacity:.42}
.pvr{margin-bottom:11px}
.pvr .l{display:flex;align-items:center;gap:8px;font-size:13px;font-weight:500;margin-bottom:6px}
.pvr .l .d{width:16px;height:16px;border-radius:5px;display:grid;place-items:center;font-size:10px;flex:none}
.pvr .l .v{margin-left:auto;font-size:13.5px;font-weight:600}
.pvr .l .v small{color:var(--mute2);font-weight:400;font-size:11px}
.mnt{border-left:2px solid var(--pri);background:rgba(255,255,255,.025);border-radius:0 9px 9px 0;padding:11px 13px;
  display:flex;align-items:center;gap:11px;margin-bottom:8px;cursor:pointer}
.mnt:hover{background:rgba(255,255,255,.05)}
.mnt .q{font-size:13px;color:var(--fg2)}
.mnt .ago{margin-left:auto;font-size:10.5px;color:var(--mute2);white-space:nowrap}
.cdr{display:grid;grid-template-columns:18px 22px 1fr auto;gap:10px;align-items:center;margin-bottom:11px}
.cdr .i{font-size:11px;color:var(--mute2);text-align:right}
.cdr .f{width:22px;height:22px;border-radius:6px;display:grid;place-items:center;font-size:10px;font-weight:700;color:#fff}
.cdr .n{font-size:12.8px}
.cdr .v{font-size:12.5px;font-weight:600}
.acc{border:1px solid var(--border);border-radius:var(--rl);margin-bottom:9px;background:var(--card);overflow:hidden}
.acc-h{display:grid;grid-template-columns:28px 1fr auto;gap:13px;align-items:center;padding:14px 16px;cursor:pointer}
.acc-h .i{width:26px;height:26px;border-radius:8px;background:rgba(59,130,246,.1);color:#93B4FF;display:grid;place-items:center;
  font-size:11px;font-weight:700;font-family:var(--mono)}
.acc-h h5{font-size:14px;font-weight:600}
.acc-h .sb2{font-size:12px;color:var(--mute);margin-top:2px}
.acc-h .m{display:flex;gap:7px;align-items:center;flex-wrap:wrap;justify-content:flex-end}
.acc-b{display:none;padding:0 16px 16px 57px;border-top:1px solid var(--border);padding-top:14px}
@media(max-width:700px){.acc-b{padding-left:16px}}
.acc.open .acc-b{display:block}
.acc-b p{font-size:13px;color:var(--mute);margin-bottom:11px}
.acc-b ol{margin:0 0 12px;padding-left:18px;font-size:13px;color:var(--fg2)}
.acc-b ol li{margin-bottom:5px}
.road{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}
@media(max-width:900px){.road{grid-template-columns:1fr}}
.road li{list-style:none;font-size:13px;padding:8px 0;border-bottom:1px dashed var(--border);display:grid;
  grid-template-columns:15px 1fr;gap:9px;color:var(--fg2)}
.road li:last-child{border-bottom:0}
.road li span{color:var(--pri);font-weight:700}
.tool-c{border:1px solid var(--border);border-radius:var(--rx);overflow:hidden;display:grid;grid-template-columns:1fr 1fr}
@media(max-width:980px){.tool-c{grid-template-columns:1fr}}
.tool-l{padding:22px;background:var(--card)}
.tool-r{padding:22px;background:linear-gradient(150deg,rgba(59,130,246,.09),rgba(139,92,246,.05))}
.tool-r .ft{display:flex;gap:12px;margin-bottom:16px}
.tool-r .ft .ic{width:32px;height:32px;border-radius:9px;background:rgba(59,130,246,.14);display:grid;place-items:center;
  font-size:14px;flex:none}
.tool-r .ft b{font-size:13px;display:block}
.tool-r .ft p{font-size:12px;color:var(--mute)}
.seg{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:16px}
.seg button{border:1px solid var(--border2);background:var(--card2);border-radius:var(--r);padding:12px;text-align:left;color:var(--fg)}
.seg button.on{border-color:var(--pri);background:rgba(59,130,246,.1)}
.seg b{font-size:13px;display:block}
.seg p{font-size:11.5px;color:var(--mute);margin-top:2px}
.modal{position:fixed;inset:0;z-index:200;display:none;place-items:center;padding:20px;background:rgba(4,5,8,.75);backdrop-filter:blur(6px)}
.modal.on{display:grid}
.mi{background:var(--card);border:1px solid var(--border2);border-radius:var(--rx);max-width:640px;width:100%;
  max-height:88vh;overflow:auto;box-shadow:0 50px 100px -30px #000}
.mh{padding:20px 22px 0;display:flex;align-items:flex-start;gap:12px}
.mh h3{font-size:19px}
.mh button{margin-left:auto;background:none;border:0;color:var(--mute);font-size:22px;line-height:1}
.mb{padding:16px 22px 24px}
.toast{position:fixed;right:20px;bottom:20px;z-index:300;display:grid;gap:10px;max-width:min(420px,calc(100vw - 40px))}
.tst{position:relative;overflow:hidden;background:var(--card2);border:1px solid var(--border2);
  border-left:3px solid var(--pri);border-radius:var(--rl);padding:14px 40px 14px 16px;font-size:13.5px;
  line-height:1.5;display:flex;gap:11px;align-items:flex-start;
  box-shadow:0 24px 50px -18px #000,0 0 0 1px rgba(255,255,255,.04);animation:sl .28s cubic-bezier(.2,.9,.3,1)}
.tst.err{border-left-color:var(--bad)}
.tst.err .ic{color:#FCA5A5}
.tst .ic{flex:none;font-size:14px;line-height:1.4}
.tst .x{position:absolute;top:8px;right:8px;width:24px;height:24px;border:0;background:none;color:var(--mute2);
  font-size:15px;line-height:1;border-radius:6px;cursor:pointer;display:grid;place-items:center}
.tst .x:hover{background:rgba(255,255,255,.07);color:var(--fg)}
.tst .life{position:absolute;left:0;bottom:0;height:2px;background:var(--pri);opacity:.55;
  animation:tlife 5s linear forwards}
.tst.err .life{background:var(--bad)}
@keyframes tlife{from{width:100%}to{width:0}}
@keyframes sl{from{opacity:0;transform:translateY(10px) scale(.98)}}
mark{background:rgba(59,130,246,.22);color:#BBD1FF;padding:0 3px;border-radius:3px}
mark.riv{background:rgba(139,92,246,.2);color:#C4B5FD}

/* ================= responsive + a11y düzeltmeleri ================= */
svg{display:block;max-width:100%}
.page{grid-template-columns:minmax(0,1fr)}
.card,.pnl,.kpi,.acc,.tool-c,.g2>*,.g3>*,.g4>*,.road>*{min-width:0}
.tw{overflow-x:auto;-webkit-overflow-scrolling:touch}
.tw table{min-width:560px}
.sb-foot>button{padding:9px 11px!important;border-radius:9px}
.mh button{width:34px;height:34px;display:grid;place-items:center;border-radius:9px;flex:none}
.mh button:hover{background:rgba(255,255,255,.06)}
#sbScrim{position:fixed;inset:0;background:rgba(4,5,8,.6);z-index:55;display:none}
@media(max-width:1024px){
  #app.on{grid-template-columns:minmax(0,1fr)}
  #sb{position:fixed;inset:0 auto 0 0;width:262px;z-index:60;height:100dvh;
      transform:translateX(-100%);transition:transform .25s}
  #sb.open{transform:none;box-shadow:24px 0 60px -20px #000}
  #sbScrim.on{display:block}
  .mobbar{display:flex!important}
  .ptitle .r{width:100%}
  .tw table{min-width:520px}
}
@media(max-width:760px){
  .mi .res-grid{grid-template-columns:minmax(0,1fr)!important;text-align:center}
  .mi .res-foot{grid-template-columns:minmax(0,1fr)!important}
  .mi .res-foot>div{grid-template-columns:minmax(0,1fr)!important}
}
@media(max-width:560px){
  .kpis,.g2,.g3,.g4{grid-template-columns:minmax(0,1fr)!important}
  button.chip{min-height:30px}
  .task-h .m,.acc-h .m{flex-wrap:wrap}
  .ptitle h1{font-size:22px}
  .acc-h{grid-template-columns:26px minmax(0,1fr)}
}
</style>
</head>
<body>


<div id="ob" class="on">
  <div class="ob-top">
    <span class="sb-logo" style="border:0;padding:0;font-size:18px"><span class="mk">Y</span>YANKI</span>
    <div class="r"><span id="obStep">Step 1 / 6</span><span class="ob-dots" id="obDots"></span></div>
  </div>
  <div class="ob-prog"><i id="obProg" style="width:16%"></i></div>
  <div class="stepper" id="stepper"></div>
  <div class="ob-body"><div class="ob-card" id="obCard"></div></div>
</div>


<div id="app">
  <aside id="sb">
    <!-- Two zones, separated by a hard rule. The top zone is identity: the
         product, and the client whose numbers are on screen. The bottom zone
         is navigation. A single flat column reads as a list of links; the
         division is what makes it read as a structured application. -->
    <div class="sb-id">
      <div class="sb-logo"><span class="mk">Y</span><span class="wm">YANKI</span></div>

      <!-- The menu is absolutely positioned against this wrapper. Without it,
           the nearest positioned ancestor is the sidebar itself, so the panel
           opened at 100% of a full-height column — six pixels below the fold,
           which reads as "there is no menu". -->
      <div class="sb-wswrap">
        <button class="sb-ws" onclick="toggleWsMenu()" aria-haspopup="true">
          <span class="sq" id="wsInitial">A</span>
          <span class="wt"><b id="wsName">brand</b><i id="wsHost"></i></span>
          <span class="cv" aria-hidden="true">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
              stroke-linecap="round" stroke-linejoin="round"><path d="M7 9l5 5 5-5"/></svg></span></button>
        <div class="wsmenu" id="wsMenu"></div>
      </div>

      <!-- The client's score and the freshness of the reading, set as a meter
           rather than a sentence. This is the line an account manager checks
           before opening anything. -->
      <div class="sb-meter">
        <div class="mrow"><span class="ml">GÖRÜNÜRLÜK</span>
          <span class="mv" id="wsScore">—</span><span class="mu">/100</span></div>
        <div class="mtrack"><i id="wsScoreBar"></i></div>
        <div class="pill" id="scanPill"></div>
      </div>
    </div>

    <nav class="nav" id="nav"></nav>

    <div class="sb-foot">
      <div id="trialBox"></div>
      <!-- Status bar, not a card: plan and operator on one dense line, the way
           a workstation tool puts session state at the bottom edge. -->
      <div class="sb-acct">
        <span class="av" id="uAv">AC</span>
        <span class="who"><b id="uName">Demo</b><i id="uMail"></i></span>
        <span class="ics">
          <button title="Language" data-i18n-title onclick="langMenu()" aria-label="Language">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"
              stroke-linecap="round"><circle cx="12" cy="12" r="9"/><path d="M3 12h18"/>
              <path d="M12 3a15 15 0 0 1 0 18 15 15 0 0 1 0-18"/></svg></button>
          <button title="Sign out" data-i18n-title onclick="signOut()" aria-label="Sign out">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"
              stroke-linecap="round" stroke-linejoin="round"><path d="M15 17l5-5-5-5"/>
              <path d="M20 12H9"/><path d="M12 20H6a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2h6"/></svg></button>
        </span>
      </div>
    </div>
  </aside>
  <div class="main">
    <div class="mobbar">
      <button class="btn b-gh b-sm" onclick="toggleSb()" aria-label="Menu">☰</button>
      <span class="sb-logo" style="border:0;padding:0;font-size:16px"><span class="mk">Y</span>YANKI</span>
    </div>
    <div class="apphead">
      <div class="hs" id="headScan"></div>
      <button class="btn b-pri" id="headRescan" onclick="rescan()">↻ Yeniden tara</button>
    </div>
    <div class="page" id="page"></div>
  </div>
</div>

<div id="sbScrim" onclick="toggleSb(false)"></div>
<div class="modal" id="modal"><div class="mi"><div class="mh"><h3 id="mTitle"></h3>
  <button onclick="closeModal()">×</button></div><div class="mb" id="mBody"></div></div></div>
<div class="toast" id="toasts"></div>

<script>
/* =====================================================================
   YANKI · application prototype — all state is held in memory
   ===================================================================== */
const $=s=>document.querySelector(s), $$=s=>[...document.querySelectorAll(s)];
const reduce=matchMedia('(prefers-reduced-motion: reduce)').matches;
const ini=t=>String(t||'?').trim().charAt(0).toLocaleUpperCase('en')||'?';
const esc=t=>String(t).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const trLower=t=>t.toLocaleLowerCase('tr');

/**
 * 59 sector in a flat <select> is a scroll-and-hope control. Grouping them
 * turns picking into scanning: the operator finds the family first, then the
 * row. The groups come from the same table the server uses, so the two lists
 * cannot drift.
 */
function sectorOptions(selected){
  const groups={};
  for(const [label,v] of Object.entries(SECTORS)){ (groups[v.g]??=[]).push(label); }
  return Object.entries(groups).map(([g,ls])=>
    `<optgroup label="${esc(T(g))}">${ls.map(l=>
      `<option ${selected===l?'selected':''}>${esc(l)}</option>`).join('')}</optgroup>`).join('');
}

/* =====================================================================
   i18n — Turkish is the default because the customers are.

   These are not literal translations. Turkish digital-marketing practice
   has settled on specific words and using anything else makes the product
   read as machine-translated to the people who would buy it:

     citation      → atıf        (not "alıntı", which reads as a book quote)
     share of voice→ ses payı    (established, used by agencies and Semrush TR)
     impression    → gösterim    (Google's own Turkish Search Console wording)
     entity        → varlık
     crawler       → tarayıcı / bot
     audit         → denetim
     dashboard     → kontrol paneli
     insight       → içgörü
     prompt        → sorgu       ("komut" exists but users search with sorgu)

   Product names stay in English on purpose: ChatGPT, Google AI Overviews,
   llms.txt, schema, Search Console. Translating a proper noun helps nobody.
   ===================================================================== */

/**
 * Post-render translation pass.
 *
 * Wrapping several hundred strings in T() by hand is slow and, worse, easy to
 * get subtly wrong — one missed template literal and the raw ${T('…')} ends up
 * on screen. Instead we walk the rendered DOM once and swap any text node or
 * attribute whose exact content is a dictionary key. Adding a translation then
 * means adding a dictionary entry, nothing else.
 *
 * Only exact, whole-string matches are replaced, so brand names, numbers and
 * anything we have not deliberately translated pass through untouched.
 */
/** Original English text of every node the pass has rewritten. */
const ORIGINALS = new WeakMap();

/** Puts the English back, so the switch works without reloading the page. */
function delocalise(root){
  const walker=document.createTreeWalker(root||document.body,NodeFilter.SHOW_TEXT);
  let n; while(n=walker.nextNode()){
    if(ORIGINALS.has(n)) n.textContent=ORIGINALS.get(n);
  }
  (root||document).querySelectorAll('[data-origtitle],[data-origplaceholder],[data-origarialabel]').forEach(el=>{
    for(const attr of ['title','placeholder','aria-label']){
      const slot='orig'+attr.replace(/-(\w)/g,(_,c)=>c.toUpperCase());
      const saved=el.dataset[slot];
      if(saved){ el.setAttribute(attr,saved); delete el.dataset[slot]; }
    }
  });
}

function localise(root){
  if(S.lang!=='tr') return;

  // Text in HTML is wrapped across lines, so an exact match against the
  // dictionary key almost never fires. Compare on collapsed whitespace and
  // the key can be written as one readable line.
  if(!localise._index){
    localise._index = new Map();
    for(const k in I18N) localise._index.set(k.replace(/\s+/g,' ').trim(), I18N[k]);
  }
  const idx = localise._index;

  // Strings that carry a number cannot be dictionary keys. A handful of
  // patterns covers them without turning this into a template engine.
  const patterns = [
    [/^All \((\d+)\)$/,            m=>`Tümü (${m[1]})`],
    [/^Active \((\d+)\)$/,         m=>`Aktif (${m[1]})`],
    [/^Paused \((\d+)\)$/,         m=>`Pasif (${m[1]})`],
    [/^(\d+(?:\.\d+)?)% coverage$/,m=>`%${m[1]} kapsama`],
    [/^(\d+) content pieces\/mo$/, m=>`ayda ${m[1]} içerik`],
    [/^(\d+) AI prompts$/,         m=>`${m[1]} AI sorgusu`],
    [/^(\d+) competitors$/,        m=>`${m[1]} rakip`],
    [/^(\d+) GEO audits\/mo$/,     m=>`ayda ${m[1]} GEO denetimi`],
    [/^· weight (\d[\d.]*)$/,      m=>`· ağırlık ${m[1]}`],
    [/^First scan queued — (\d+) checks across (\d+) platforms?$/,
                                   m=>`İlk tarama kuyruğa alındı — ${m[2]} platformda ${m[1]} kontrol`],
    [/^Showing 1–(\d+) of (\d+)$/, m=>`${m[2]} sorgudan ${m[1]} tanesi gösteriliyor`],
  ];

  // A few nodes glue several labels together with separators, so neither an
  // exact key nor a whole-string pattern can match. Swap the fragments.
  const fragments = [
    [/· weight /g, '· ağırlık '],
    [/· official API/g, '· resmî API'],
    [/· licensed SERP provider/g, '· lisanslı SERP sağlayıcısı'],
    [/· model /g, '· model '],
  ];

  const swap = (text) => {
    const key = text.replace(/\s+/g,' ').trim();
    if(!key) return null;
    const hit = idx.get(key);
    if(hit) return hit;
    for(const [re,fn] of patterns){ const m = key.match(re); if(m) return fn(m); }
    let frag = text, changed = false;
    for(const [re,to] of fragments){ if(re.test(frag)){ frag = frag.replace(re,to); changed = true; } }
    return changed ? frag : null;
  };

  const walker=document.createTreeWalker(root||document.body,NodeFilter.SHOW_TEXT,{
    acceptNode(n){
      // Never rewrite generated files, code samples or anything the user typed.
      const p=n.parentElement;
      if(!p) return NodeFilter.FILTER_REJECT;
      if(p.closest('pre,code,textarea,input,#gc,#wmd,#fixc')) return NodeFilter.FILTER_REJECT;
      return n.textContent.trim() ? NodeFilter.FILTER_ACCEPT : NodeFilter.FILTER_REJECT;
    }
  });
  const jobs=[]; let n;
  while(n=walker.nextNode()) jobs.push(n);
  for(const node of jobs){
    const hit = swap(node.textContent);
    if(hit !== null){
      // Remember the original so switching back to English does not need a
      // page reload — the pass rewrites in place and cannot otherwise undo it.
      if(!ORIGINALS.has(node)) ORIGINALS.set(node, node.textContent);
      node.textContent = hit;
    }
  }

  (root||document).querySelectorAll('[placeholder],[title],[aria-label]').forEach(el=>{
    for(const attr of ['placeholder','title','aria-label']){
      const v=el.getAttribute(attr);
      if(!v) continue;
      const hit=swap(v);
      if(hit!==null){
        // dataset keys cannot contain hyphens, so aria-label needs a safe name.
        const slot='orig'+attr.replace(/-(\w)/g,(_,c)=>c.toUpperCase());
        if(!el.dataset[slot]) el.dataset[slot]=v;
        el.setAttribute(attr,hit);
      }
    }
  });
}

/** Translate a UI string. Unknown keys pass through, so nothing ever blanks. */
function T(s){
  // `||` treated an intentionally empty translation as "missing" and fell back
  // to the English key, which is how "named" and "ranked" surfaced inside
  // Turkish sentences. Some phrases genuinely have no Turkish counterpart —
  // English needs "ranked 3rd among 4 brands", Turkish just needs "3. / 4
  // marka içinde" — so an empty string has to mean "render nothing".
  if(S.lang!=='tr') return s;
  const v=I18N[s];
  return v===undefined ? s : v;
}

async function setLang(l){
  if(S.lang===l) return;
  S.lang=l;
  document.documentElement.lang=l;
  if(l==='en') delocalise(document.body);
  render(); renderOb();
  if(l==='tr') localise(document.body);
  try{ await api.post('/api/auth/locale',{locale:l}); }
  catch{ /* the UI already switched; persistence can fail quietly */ }
}

/**
 * Five seconds, a progress bar so the countdown is visible, and a close
 * button. Anything shorter is missed by someone reading the screen rather
 * than watching the corner — and an error the user never saw is an error
 * they will report as "nothing happened".
 */
function toast(t, kind){
  const err = kind==='error' || /fail|error|could not|cannot|invalid|too many|not correct|required/i.test(t);
  const d=document.createElement('div');
  d.className='tst'+(err?' err':'');
  d.innerHTML=`<span class="ic">${err?'⚠':'✓'}</span><span>${esc(t)}</span>
    <button class="x" aria-label="Dismiss">×</button><span class="life"></span>`;
  const close=()=>{ d.style.opacity='0'; d.style.transform='translateY(6px)';
                    d.style.transition='.2s'; setTimeout(()=>d.remove(),220); };
  d.querySelector('.x').onclick=close;
  const timer=setTimeout(close,5000);
  // Hovering pauses the countdown, so a long message can actually be read.
  d.onmouseenter=()=>{clearTimeout(timer); const l=d.querySelector('.life');
    if(l) l.style.animationPlayState='paused';};

/** Accepts one prompt or a pasted list, one per line. */
function addPrompt(){
  const raw=$('#iq').value||'';
  const lines=raw.split('\n')
    .map(l=>l.trim().replace(/^[-•*\d.)\s]+/,'').replace(/^["']|["']$/g,''))
    .filter(l=>l.length>=6);
  if(!lines.length) return toast(T('Write at least one prompt (6 characters or more)'),'error');
  const existing=new Set(S.prompts.map(p=>p.text.toLocaleLowerCase('tr')));
  let added=0;
  for(const text of lines){
    const key=text.toLocaleLowerCase('tr');
    if(existing.has(key)) continue;
    existing.add(key);
    S.prompts.push({id:'c'+Date.now()+'_'+added,text,intent:guessIntent(text),on:true,
      vol:400,src:'custom',active:true});
    added++;
  }
  $('#iq').value='';
  renderOb();
  toast(added?`${added} prompt${added===1?'':'s'} added`:'Those prompts are already in the list');
}

/**
 * Rough intent guess from the wording. Intent weights the score, so getting it
 * roughly right matters; the operator can correct it from Edit.
 */
function guessIntent(t){
  const s=t.toLocaleLowerCase('tr');
  const brand=(S.brand.name||'').toLocaleLowerCase('tr');
  if(brand && s.includes(brand) && /güvenilir|yorum|şikayet|dolandır|scam|review|trust/.test(s)) return 'brand_defence';
  if(/fiyat|ücret|satın al|sipariş|nereden al|ucuz|indirim|kampanya|price|buy|cheap/.test(s)) return 'transactional';
  if(/karşılaştır|farkı|hangisi daha|compare|versus|\bvs\b/.test(s)) return 'comparison';
  if(/nedir|nasıl|ne işe yarar|rehber|what is|how to/.test(s)) return 'informational';
  return 'evaluation';
}

   DATA GENERATION — deterministic from user input
   ===================================================================== */
/* =====================================================================
   DATA LAYER — everything below reads from the API. Nothing is invented
   in the browser: if the server has no answers yet, the UI says so.
   ===================================================================== */

const api = {
  async req(path, opts = {}) {
    const res = await fetch(path, {
      credentials: 'same-origin',
      headers: opts.body ? { 'content-type': 'application/json' } : undefined,
      ...opts,
    });
    let data = null;
    try { data = await res.json(); } catch { /* empty body */ }
    if (!res.ok) {
      const err = new Error((data && data.error) || `Request failed (${res.status})`);
      err.status = res.status;
      throw err;
    }
    return data;
  },
  get:  (p)    => api.req(p),
  post: (p, b) => api.req(p, { method: 'POST', body: JSON.stringify(b || {}) }),
  patch:(p, b) => api.req(p, { method: 'PATCH', body: JSON.stringify(b || {}) }),
  del:  (p)    => api.req(p, { method: 'DELETE' }),
};

/**
 * Maps the API payload onto the shape the views already expect. Keeping the
 * adapter in one place means the render code never has to know whether a
 * number came from the scan table or a rollup.
 */
function adopt(r) {
  S.workspaceId = r.workspace.id;
  S.plan = r.org.plan;
  S.planLimits = r.org.planLimits;
  S.brand = {
    name: r.workspace.brandName,
    site: r.workspace.domain,
    sector: r.workspace.sector,
    country: r.workspace.country,
    city: r.workspace.city || '',
    desc: r.workspace.description || '',
  };
  S.variants = r.workspace.aliases || [];
  S.rawCompetitors = r.competitors || [];
  S.rivals = (r.competitors || []).map(c => ({ id: c.id, n: c.name, d: c.domain || '' }));
  S.prompts = (r.prompts || []).map(p => ({
    id: p.id, text: p.text, intent: p.intent, vol: p.volume,
    src: p.source, active: true, score: p.score, ci: p.ci,
    coverage: p.coverage, opportunity: p.opportunity, engines: p.engines,
  }));
  S.enginesMeta = r.engines;
  S.scanState = r.scan;
  S.auditRaw = r.audit;
  S.quality = r.quality || null;

  const latest = r.latest;
  const allowed = r.engines.filter(e => !e.locked);
  const byEngine = (latest && latest.by_engine) || {};

  const plats = r.engines.map(e => {
    const stats = byEngine[e.key] || {};
    const own = (r.cells || []).filter(c => c.engineKey === e.key);
    const cellCount = own.length;
    const mentions  = own.filter(c => c.m > 0).length;
    const cites     = own.filter(c => c.c > 0).length;
    return {
      id: e.key, n: e.label, ab: ENGINE_GLYPH[e.key] || '◆', c: ENGINE_COLOR[e.key] || '#3B82F6',
      w: e.weight, locked: e.locked, configured: e.configured, active: e.active,
      measured: e.measured, failing: e.failing,
      score: Number(stats.score || 0),
      ci: Number(stats.ci || 0),
      mentions, cites, checks: cellCount,
      trend: 0,
    };
  });

  // Cells drive the mentions table and the answer inspector.
  const cells = (r.cells || []).map(c => ({
    p: { id: c.promptId, text: c.text, intent: c.intent, vol: c.volume },
    pl: plats.find(x => x.id === c.engineKey) || plats[0],
    runId: c.runId,
    score: c.score, ci: c.ci, m: c.m, c: c.c, sg: c.sigma * 2 - 1,
    rank: c.meanRank,
  })).filter(c => c.pl);

  const totalMentions = (r.competitors || []).reduce((a, c) => a + Number(c.mentions || 0), 0) + Number(r.selfMentions || 0);
  const sov = [
    { n: r.workspace.brandName, v: Number(r.selfMentions || 0), you: true },
    ...(r.competitors || []).map(c => ({ n: c.name, v: Number(c.mentions || 0) })),
  ].map(x => ({ ...x, pct: totalMentions ? (x.v / totalMentions) * 100 : 0 }));

  const audit = r.audit ? groupAudit(r.audit.factors) : [];

  S.data = {
    ready: !!latest,
    cells,
    plats,
    total: latest ? Number(latest.score) : 0,
    ciAvg: latest ? Number(latest.ci) : 0,
    lowConfidence: latest ? latest.low_confidence : false,
    mentionRate: latest ? Number(latest.mention_rate) : 0,
    citationRate: latest ? Number(latest.citation_rate) : 0,
    sov,
    sources: (r.sources || []).map(s => ({ d: s.domain, v: s.citations, mine: s.mine, t: '', plats: [], first: s.first_seen, last: s.last_seen, trend: 1 })),
    series: (r.series || []).map(x => Number(x.score)),
    seriesDates: (r.series || []).map(x => x.scan_date),
    audit,
    auditScore: r.audit ? Number(r.audit.total_score) : 0,
    auditUrl: r.audit ? r.audit.url : r.workspace.domain,
    auditRanAt: r.audit ? r.audit.ran_at : null,
    bots: [],
    opps: r.prompts.map(p => ({
      p: { id: p.id, text: p.text, intent: p.intent, vol: p.volume },
      cover: (p.coverage || 0) / 100,
      srcCount: (r.sources || []).length,
      fit: p.coverage > 50 ? 'High' : p.coverage > 0 ? 'Medium' : 'Low',
      opp: p.opportunity,
      act: ACTION_BY_INTENT[p.intent] || 'Product/service page',
    })).sort((a, b) => b.opp - a.opp),
    rivals: (r.competitors || []).map(c => c.name),
    host: r.workspace.host,
    recent: r.recentMentions || [],
  };
  S.data.actions = buildActions();
}

  ai_overviews:'#4285F4', grok:'#EF4444', deepseek:'#3B82F6' };

function groupAudit(factors) {
  const map = new Map();
  for (const f of factors || []) {
    if (!map.has(f.category)) map.set(f.category, []);
    map.get(f.category).push({ n: f.label, st: f.status, fix: f.fix, detail: f.detail });
  }
  return [...map.entries()].map(([n, facs]) => ({
    n, facs,
    score: facs.reduce((a, f) => a + (f.st === 'pass' ? 100 : f.st === 'partial' ? 55 : 0), 0) / facs.length,
  }));
}

/**
 * Action plan, derived from the audit's failing factors and the top
 * opportunities. Everything here traces back to a real finding — no generic
 * advice, because generic advice is what the customer already ignored.
 */
function buildActions() {
  const d = S.data || {}, b = S.brand;
  const A = [];
  const push = (t, sub, im, ef, q, desc, steps, code) => A.push({ t, sub, im, ef, q, desc, steps, code });

  const fails = [];
  (d.audit || []).forEach(c => c.facs.forEach(f => { if (f.st === 'fail') fails.push({ ...f, cat: c.n }); }));

  // Failing audit factors that ship a fix are the cheapest wins available.
  fails.filter(f => f.fix).slice(0, 4).forEach((f, i) => push(
    f.n,
    `${f.cat} · ${f.detail || T('Failing')}`,
    (4.6 - i * 0.5).toFixed(1),
    i === 0 ? `1 ${T('hour')}` : `1–3 ${T('days')}`,
    `+${4 - i} ${T('prompts')}`,
    f.detail || T('This factor is failing on the audited page.'),
    [T('Apply the snippet below'), T('Deploy the change'), T('Re-run the audit to confirm it passes')],
    f.fix));

  (d.opps || []).filter(o => o.cover < 0.4).slice(0, 3).forEach((o, i) => push(
    `${T('Publish content for')} "${o.p.text.replace(/"/g, '')}"`,
    `${T('Opportunity')} ${o.opp} · ${T('coverage')} ${Math.round(o.cover * 100)}% · ${T('volume')} ${o.p.vol}`,
    (4.2 - i * 0.6).toFixed(1), `1–3 ${T('weeks')}`, `+${3 - i} ${T('prompts')}`,
    T('Your visibility on this prompt is low. The content writer can analyse the answer structure and draft a page aimed at it.'),
    [T('Write a 40–60 word direct answer in the first paragraph'),
     T('Convert headings into question form'),
     T('Add at least one table and one numeric data point'),
     T('Mark it up with FAQPage schema')],
    null));

  const topSource = (d.sources || []).find(s => !s.mine);
  if (topSource) push(
    `${T('Close the citation gap on')} ${topSource.d}`,
    `${topSource.v} ${T('citations in your category, none of them yours')}`,
    '4.4', `6–10 ${T('weeks')}`, `+3 ${T('prompts')}`,
    T('Models learn about you mostly from third-party sources. Being absent from the most-cited domain in your category is a structural gap that content on your own site cannot close.'),
    [T('Build an organic presence plan for that source'),
     T('Reach out to editors of industry listicles'),
     T('Publish explainer videos where the category is discussed'),
     T('Raise your review response rate above 90%')],
    null);

  if (!A.length) push(
    T('Run a site audit to generate your plan'),
    T('No audit has been run for this workspace yet'),
    '—', `2 ${T('minutes')}`, '—',
    T('The action plan is built from real audit findings and prompt coverage. Run an audit and the tasks appear here.'),
    [T('Open the Audit screen'), T('Run the audit against your homepage'), T('Return here')],
    null);

  return A;
}

function lineChart(vals,o={}){
  const W=o.w||460,H=o.h||180,P={l:30,r:8,t:10,b:20};
  // One data point is the normal state on day one. Draw a flat marker rather
  // than emitting a malformed path.
  if(!vals.length) return `<div class="empty" style="padding:28px">${T("No history yet — the first scan writes today's point.")}</div>`;
  if(vals.length===1) vals=[vals[0],vals[0]];
  const N=vals.length;
  const mn=o.min??0,mx=o.max??100,uid='g'+Math.random().toString(36).slice(2,7);
  const x=i=>P.l+(i/(N-1||1))*(W-P.l-P.r),y=v=>H-P.b-((v-mn)/(mx-mn||1))*(H-P.t-P.b);
  let L='',G='';vals.forEach((v,i)=>L+=(i?'L':'M')+x(i).toFixed(1)+' '+y(v).toFixed(1));
  const A=L+`L${x(N-1).toFixed(1)} ${H-P.b}L${x(0).toFixed(1)} ${H-P.b}Z`;
  (o.ticks||[0,25,50,75,100]).forEach(v=>{G+=`<line x1="${P.l}" y1="${y(v)}" x2="${W-P.r}" y2="${y(v)}" stroke="#20232E"/>
    <text x="${P.l-5}" y="${y(v)+3.5}" text-anchor="end" font-size="10" fill="#7C8598" font-family="ui-monospace">${v}</text>`});
  const col=o.color||'#60A5FA';
  return `<svg viewBox="0 0 ${W} ${H}" width="100%" style="display:block;overflow:hidden">
   <defs><linearGradient id="${uid}" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="${col}" stop-opacity=".4"/><stop offset="1" stop-color="${col}" stop-opacity="0"/></linearGradient></defs>
   ${G}<path d="${A}" fill="url(#${uid})"/><path d="${L}" fill="none" stroke="${col}" stroke-width="2" stroke-linejoin="round"/>
   <circle cx="${x(N-1)}" cy="${y(vals[N-1])}" r="3.4" fill="${col}" stroke="#0C0E13" stroke-width="2"/>
   ${(o.xlab||[]).map((t,i,a)=>`<text x="${P.l+(i/(a.length-1))*(W-P.l-P.r)}" y="${H-4}" text-anchor="middle"
     font-size="10" fill="#7C8598" font-family="ui-monospace">${t}</text>`).join('')}</svg>`;
}
function donut(items,center,sub){
  const R=58,SW=21,cx=72,cy=72;let a=-Math.PI/2,arcs='';
  const tot=items.reduce((s,i)=>s+i.v,0);
  if(!tot)arcs=`<circle cx="${cx}" cy="${cy}" r="${R-SW/2}" fill="none" stroke="#1A1D27" stroke-width="${SW}"/>`;
  items.forEach(d=>{if(!tot)return;const a2=a+(d.v/tot)*Math.PI*2,pt=(r,t)=>[cx+r*Math.cos(t),cy+r*Math.sin(t)];
    const[x1,y1]=pt(R,a),[x2,y2]=pt(R,a2),[x3,y3]=pt(R-SW,a2),[x4,y4]=pt(R-SW,a);
    const lg=(a2-a)>Math.PI?1:0;
    arcs+=`<path d="M${x1} ${y1}A${R} ${R} 0 ${lg} 1 ${x2} ${y2}L${x3} ${y3}A${R-SW} ${R-SW} 0 ${lg} 0 ${x4} ${y4}Z" fill="${d.c}"/>`;a=a2});
  return `<svg viewBox="0 0 144 144" width="146" style="flex:none">${arcs}
    <text x="72" y="70" text-anchor="middle" font-size="21" font-weight="600" fill="#F3F5F9">${center}</text>
    <text x="72" y="86" text-anchor="middle" font-size="10" fill="#7C8598" font-family="ui-monospace">${sub}</text></svg>`;
}
function gauge(v,col){
  const R=62,cx=84,cy=84,a0=Math.PI*.78,a1=Math.PI*2.22,ang=a0+(v/100)*(a1-a0);
  const pt=(r,a)=>[(cx+r*Math.cos(a)).toFixed(1),(cy+r*Math.sin(a)).toFixed(1)];
  const arc=(f,t,r,w,c)=>{const[x1,y1]=pt(r,f),[x2,y2]=pt(r,t);
    return `<path d="M${x1} ${y1}A${r} ${r} 0 ${(t-f)>Math.PI?1:0} 1 ${x2} ${y2}" fill="none" stroke="${c}" stroke-width="${w}" stroke-linecap="round"/>`};
  return `<svg viewBox="0 0 168 142" width="190" style="max-width:100%">${arc(a0,a1,R,14,'#1A1D27')}${arc(a0,ang,R,14,col)}
    <text x="84" y="90" text-anchor="middle" font-size="34" font-weight="600" fill="#F3F5F9">${v.toFixed(0)}</text>
    <text x="84" y="108" text-anchor="middle" font-size="10" fill="#7C8598" font-family="ui-monospace">${T("OUT OF 100")}</text></svg>`;
}

/**
 * How much sits behind each link. Enterprise tools show volume in the
 * navigation because it tells the reader where the work is before they open
 * anything — and because a column of counts is the difference between a menu
 * and an index. Null when the number would be a guess: an unloaded workspace
 * shows nothing rather than a zero.
 */
function navCount(route){
  const d=S.data;
  if(!d) return null;
  switch(route){
    case 'mentions':  return new Set(d.cells.filter(c=>c.m>0).map(c=>c.p.id)).size || null;
    case 'platforms': return d.plats.filter(p=>!p.locked&&p.measured!==false&&p.checks>0).length || null;
    case 'sources':   return (d.sources||[]).length || null;
    case 'rivals':    return (S.rivals||[]).length || null;
    case 'prompts':   return (d.opps||[]).length || null;
    case 'opps':      return (d.opps||[]).filter(o=>o.opp>0).length || null;
    case 'plan':      return (d.audit||[]).reduce((a,c)=>a+c.facs.filter(f=>f.st==='fail').length,0) || null;
    default: return null;
  }
}

      <button class="add" onclick="newBrand()">
        <span class="pl">+</span>${T('Add brand')}
        <span class="cnt">${S.workspaces.length}/${cap}</span></button>` : '';
  }

  // Scan state, visible from every screen rather than only the dashboard.
  const sp=$('#scanPill');
  if(sp){
    const sc=S.scanState, pending=sc?sc.pending:0;
    // Failures here are provider-side: a spent credit balance, a rejected key.
    // They belong to accounts the customer does not hold, so for them a scan
    // that collected what it could is simply a finished scan. The operator
    // gets the count, because for the operator it is a work item.
    const failing=(sc&&(sc.failures||[]).length)||0;
    sp.innerHTML = S.scanBusy
      ? `<span class="dot run"></span>${T('Starting…')}`
      : pending>0
        ? `<span class="dot run"></span>${T('Scanning')} · ${pending}`
        : (failing && S.isAdmin)
          ? `<span class="dot bad"></span>${T('Operator')} · ${failing} ${T('platform error(s)')}`
          : sc&&sc.finished_at
            ? `<span class="dot ok"></span>${T('Updated')} ${relTime(sc.finished_at)}`
            : `<span class="dot idle"></span>${T('No scan yet')}`;
  }
  // Header scan control. The sidebar keeps the freshness indicator; the action
  // itself belongs where the eye lands, not in a 11px button below the nav.
  const hr=$('#headRescan'), hs=$('#headScan');
  const prog=scanProgress();
  const busy=S.scanBusy||!!prog;
  if(hr){
    hr.disabled=busy;
    hr.textContent=busy ? T('Scanning…') : '↻ '+T('Rescan');
  }
  if(hs){
    hs.innerHTML = prog
      ? `<b>${prog.total?`${prog.done} / ${prog.total}`:prog.pending}</b> ${T('checks done')}`
      : S.scanState&&S.scanState.finished_at
        ? `${T('Last updated')} <b>${relTime(S.scanState.finished_at)}</b>`
        : T('No scan yet');
  }
  // These two sit in the static shell rather than a rendered template, so they
  // need filling in on every repaint — including after a language switch.
  const fb=$('#fbLabel');   if(fb) fb.textContent=T('Feedback');
  const planName={trial:T('Trial'),starter:T('Starter'),growth:T('Growth'),pro:T('Growth'),business:T('Business'),agency:T('Agency')}[S.plan]||S.plan;
  const dleft=trialDaysLeft();
  // A countdown is more legible than a sentence about a countdown, and the bar
  // does the persuading a paragraph was doing badly.
  const pct=dleft===null?100:Math.max(4,Math.min(100,Math.round(dleft/7*100)));
  $('#trialBox').className = S.plan==='trial' ? 'trial' : '';
  $('#trialBox').innerHTML=S.plan==='trial'
    ? `<div class="tr-top"><b>${T('Trial')}</b>
         <span class="tr-d">${dleft===null?'':`${dleft} ${T('days left')}`}</span></div>
       <div class="tr-bar"><i style="width:${pct}%"></i></div>
       <button class="btn b-pri b-sm b-full" style="margin-top:11px"
         onclick="go('settings');setTimeout(()=>setTab('billing'),30)">${T('Upgrade Plan')}</button>`
    // A paid plan has no countdown to show, so it does not need the card — a
    // single line that names the plan and links to it is the whole message.
    : `<a class="plan-row" href="#"
         onclick="go('settings');setTimeout(()=>setTab('billing'),30);return false">
         <span class="pd"></span><b>${planName}</b><span class="mn">${T('Manage plan')}</span></a>`;
}

/* =====================================================================
   SCAN PROGRESS
   ===================================================================== */
/**
 * A scan is not a background nicety — until it finishes, every number on the
 * dashboard is a partial sum. Showing 5.1 while two thirds of the checks are
 * still queued is not "live data", it is a wrong answer that will be replaced
 * by a different wrong answer a minute later, and the customer has no way to
 * tell which reading to trust.
 *
 * So the dashboard waits, and says what it is waiting for.
 */
function scanProgress(){
  const sc=S.scanState;
  if(!sc) return null;
  const pending=Number(sc.pending||0);
  const total=Number(sc.queued_jobs||0) || null;
  if(pending<=0) return null;
  const done=total ? Math.max(0,total-pending) : null;
  return { pending, total, done, pct: total ? Math.round(done/total*100) : null };
}

function scanningScreen(){
  // Null until the server has answered with a queue size. Showing "0 / 0" in
  // that gap would read as a finished scan that found nothing.
  const p=scanProgress()||{pending:null,total:null,done:null,pct:null};
  const pct=p.pct===null?null:Math.min(99,Math.max(2,p.pct));
  return head(T('Collecting answers'),
    T('We are asking each AI platform your prompts. The dashboard opens as soon as every check is in.'))+
  `<div class="card"><div class="cb" style="padding:34px 26px;text-align:center">
    <div style="font-size:34px;margin-bottom:6px">◐</div>
    <div style="font-size:30px;font-weight:600;letter-spacing:-.5px">
      ${p.pending===null ? '…'
        : p.total ? `${p.done} <span style="color:var(--mute2);font-weight:400">/ ${p.total}</span>`
        : p.pending}
    </div>
    <div style="font-size:13.5px;color:var(--mute);margin-top:5px">
      ${p.pending===null ? T('Sorgular kuyruğa alınıyor')
        : p.total ? T('checks completed')
        : `${p.pending} ${T('checks remaining')}`}</div>

    ${pct===null?'':`<div style="height:8px;border-radius:99px;background:var(--card2);border:1px solid var(--border);
      margin:22px auto 10px;max-width:460px;overflow:hidden">
      <i style="display:block;height:100%;width:${pct}%;background:linear-gradient(90deg,#3B82F6,#8B5CF6);
        transition:width .5s ease"></i></div>`}

    <div style="font-size:12.5px;color:var(--mute2);margin-top:14px;max-width:430px;margin-inline:auto;line-height:1.65">
      ${T('Each prompt is asked several times per platform, because AI answers vary between runs. Averaging them is what makes the score stable.')}
    </div>
    <div style="font-size:12.5px;color:var(--mute);margin-top:16px">
      ${p.pending===null ? T('you can close this page; the scan continues')
        : `${p.pending} ${T('remaining')} · ${T('you can close this page; the scan continues')}`}
    </div>
  </div></div>`;
}

VIEWS.dashboard=()=>{
  // Nothing partial. While checks are outstanding the dashboard is a progress
  // screen, because a half-summed average is not a smaller truth — it is a
  // different number that happens to look like the real one.
  // The progress screen owns the view from the moment the button is pressed,
  // not from the moment the server confirms. Otherwise the dashboard sits
  // there showing yesterday's numbers while a scan is being queued.
  const prog=scanProgress();
  if(prog || S.scanBusy) return scanningScreen();

  const d=S.data,allowed=d.plats.filter(p=>!p.locked).length;
  const ins=insightText();
  // One row per prompt+engine. The same prompt is asked several times, and
  // listing every run makes six repeats look like six separate findings.
  const seenKey=new Set();
  const recent=(d.recent||[]).filter(m=>{
    const k=m.text+'|'+m.engine_key;

     infrastructure. A customer pays a monthly fee and uses our keys; telling

    <!-- When each thing last ran. Both come from the database — scans.finished_at
