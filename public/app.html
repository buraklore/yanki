function insightText(){
  const d=S.data,b=S.brand;
  // Only platforms we actually measured can be called the weakest. Naming an
  // engine that errored would send the operator optimising for a billing problem.
  const measuredPlats=d.plats.filter(p=>p.active&&p.measured!==false);
  const worst=[...measuredPlats].sort((a,x)=>a.score-x.score)[0]||{n:'—',score:0};
  const cited=d.cells.filter(c=>c.c>0).length;
  const tr = S.lang==='tr';

  if(!d.ready || S.scanState && S.scanState.pending>0) return tr ? {
    lvl:'wait', tag:'ÖLÇÜM SÜRÜYOR',
    head:'Sonuçlar hazırlanıyor',
    body:'Veriler geldikçe skor yeniden hesaplanıyor. Ölçüm tamamlanmadan çıkarılacak sonuç '+
         'yanıltıcı olur; marka ilk sorgularda görünmeyip sonrakilerde öne çıkabilir.'
  } : {
    lvl:'wait', tag:'IN PROGRESS',
    head:'Results are being assembled',
    body:'The score is recalculated as data arrives. Any conclusion drawn before the run '+
         'completes will mislead: a brand can be absent from the first queries and prominent '+
         'in the ones that follow.'
  };

  if(d.total<10) return tr ? {
    lvl:'crit', tag:'KRİTİK',
    metric:d.total.toFixed(1), metricLabel:'/ 100 görünürlük',
    head:'Yapay zeka sizi önermiyor',
    body:`Takip ettiğiniz sorgular müşterilerinizin satın almadan hemen önce sorduğu sorular. `+
         `${b.name} bu cevapların neredeyse hiçbirinde geçmiyor; kullanıcı öneriyi okuyup tıklıyor ve `+
         `tıkladığı marka her seferinde bir rakibiniz oluyor. `+
         (d.auditRanAt
           ? `Sebep büyük ölçüde teknik: sitenizde ${d.audit.reduce((a,c)=>a+c.facs.filter(f=>f.st==='fail').length,0)} kriter başarısız. Etkiye göre sıralanmış hâli Aksiyon Planı'nda.`
           : 'Nereden başlanacağını görmek için site denetimini çalıştırın.')
  } : {
    lvl:'crit', tag:'CRITICAL',
    metric:d.total.toFixed(1), metricLabel:'/ 100 visibility',
    head:'AI is not recommending you',
    body:`The queries you track are the ones customers ask right before they buy. `+
         `${b.name} appears in almost none of those answers; the user reads the recommendation, `+
         `clicks, and the brand they click is a competitor every time. `+
         (d.auditRanAt
           ? `The cause is largely technical: ${d.audit.reduce((a,c)=>a+c.facs.filter(f=>f.st==='fail').length,0)} checks failed on your site. The Action Plan ranks them by impact.`
           : 'Run the site audit to see where to start.')
  };

  /* ------------------------------------------------------------------
     Severity ladder.
     The card used to have exactly two states: red below 10, green above.
     A brand at 75 got the same green "you are not being clicked" verdict as
     one at 25, whether or not it was actually being cited — so the colour
     carried no information and the headline was sometimes simply false.
     The ladder below is driven by the data it describes.
     ------------------------------------------------------------------ */
  const promptsSeen = new Set(d.cells.map(c => c.p.id)).size;
  const named       = new Set(d.cells.filter(c => c.m > 0).map(c => c.p.id)).size;
  // Named often but rarely the cited source: the mention is there, the click
  // is going elsewhere. This is a gap worth naming, not a general weakness.
  const citeGap = named >= Math.max(2, promptsSeen * 0.4) && cited < named * 0.5;

  if (d.total < 35) return tr ? {
    lvl:'warn', tag:'ZAYIF',
    metric:d.total.toFixed(1), metricLabel:'/ 100 görünürlük',
    head:'Görünürlüğünüz rakiplerin gerisinde',
    body:`${b.name} ${promptsSeen} sorgunun ${named} tanesinde anılıyor, ancak cevapların `+
         `çoğunda ya sona kalıyor ya da hiç geçmiyor. Yapay zeka cevaplarında ilk anılan `+
         `birkaç marka tıklanmanın neredeyse tamamını alır; alt sıralarda olmak, olmamaktan `+
         `çok az farklıdır. En zayıf platform ${worst.n} (${worst.score.toFixed(1)}/100).`
  } : {
    lvl:'warn', tag:'WEAK',
    metric:d.total.toFixed(1), metricLabel:'/ 100 visibility',
    head:'Your visibility trails your competitors',
    body:`${b.name} is named on ${named} of ${promptsSeen} queries, but in most answers it `+
         `arrives last or not at all. The first brands named in an AI answer take almost all `+
         `of the click; being far down the list is barely different from being absent. `+
         `Weakest platform is ${worst.n} (${worst.score.toFixed(1)}/100).`
  };

  if (citeGap) return tr ? {
    lvl:'opp', tag:'FIRSAT',
    metric:String(cited), metricLabel:`/ ${named} sorguda kaynak`,
    head:'Anılıyorsunuz, tıklanan siz değilsiniz',
    body:`${b.name} ${named} sorguda anılıyor ama siteniz yalnızca ${cited} tanesinde kaynak `+
         `olarak gösteriliyor. Marka bilinirliği çalışıyor, trafik başka siteye gidiyor — `+
         `aradaki fark doğrudan kaybedilen ziyaret demek. Organization ve FAQ şeması ile `+
         `kanonik URL düzeni, bu boşluğu kapatan en hızlı iki müdahale.`
  } : {
    lvl:'opp', tag:'OPPORTUNITY',
    metric:String(cited), metricLabel:`/ ${named} queries cite you`,
    head:'You get named, someone else gets the click',
    body:`${b.name} is named on ${named} queries but your site is cited as the source on only `+
         `${cited}. Awareness is working; the traffic is going elsewhere, and the gap between `+
         `those two numbers is lost visits. Organization and FAQ schema plus a clean canonical `+
         `URL structure are the two fastest ways to close it.`
  };

  if (d.total >= 60) return tr ? {
    lvl:'good', tag:'GÜÇLÜ',
    metric:d.total.toFixed(1), metricLabel:'/ 100 görünürlük',
    head:'Konumunuz güçlü — korumaya oynayın',
    body:`${b.name} takip edilen sorgularda düzenli olarak öneriliyor ve ${cited} sorguda `+
         `siteniz kaynak gösteriliyor. Bu konum kalıcı değil: yapay zeka cevapları üçüncü `+
         `taraf kaynaklardan besleniyor ve rakip içeriği tazelediğinde sıralama haftalar `+
         `içinde değişebilir. En zayıf halkanız ${worst.n} (${worst.score.toFixed(1)}/100) — `+
         `düşüş genelde en zayıf platformdan başlar.`
  } : {
    lvl:'good', tag:'STRONG',
    metric:d.total.toFixed(1), metricLabel:'/ 100 visibility',
    head:'Strong position — play to defend it',
    body:`${b.name} is recommended consistently on the tracked queries, with your site cited `+
         `on ${cited} of them. The position is not permanent: AI answers are fed by third-party `+
         `sources, and a competitor refreshing their content can move the ranking within weeks. `+
         `Your weakest link is ${worst.n} (${worst.score.toFixed(1)}/100) — decline usually `+
         `starts at the weakest platform.`
  };

  return tr ? {
    lvl:'opp', tag:'GELİŞTİRİLEBİLİR',
    metric:d.total.toFixed(1), metricLabel:'/ 100 görünürlük',
    head:'Zemin sağlam, üstüne inşa edilebilir',
    body:`${b.name} ${named}/${promptsSeen} sorguda anılıyor ve ${cited} sorguda kaynak `+
         `gösteriliyor — temel kurulmuş. Buradan sonraki kazanç sıralamadan gelir: cevabın `+
         `içinde kaçıncı anıldığınız, anılıp anılmadığınız kadar belirleyici. En zayıf `+
         `platform ${worst.n} (${worst.score.toFixed(1)}/100), en hızlı kazanç orada.`
  } : {
    lvl:'opp', tag:'ROOM TO GROW',
    metric:d.total.toFixed(1), metricLabel:'/ 100 visibility',
    head:'Solid base, room to build on it',
    body:`${b.name} is named on ${named}/${promptsSeen} queries and cited on ${cited} — the `+
         `foundation is there. The next gain comes from position: where you are named inside `+
         `the answer matters as much as whether you are named at all. Weakest platform is `+
         `${worst.n} (${worst.score.toFixed(1)}/100); that is where the fastest gain sits.`
  };
}

async function answerModal(runId){
  openModal(T('Raw answer'),
    `<div class="empty"><div class="ic">◎</div>${T('Loading the answer…')}</div>`);
  let d;
  try{ d = await api.get(`/api/answers?run=${runId}`); }
  catch(e){ $('#mBody').innerHTML = `<div class="empty">${esc(e.message)}</div>`; return; }

  // Highlights come from the server, computed by the same matcher that scored
  // the run, so what the reader sees is exactly what was counted.
  let html='', cursor=0;
  for(const sp of d.spans||[]){
    if(sp.start<cursor) continue;
    html += esc(d.answer.slice(cursor, sp.start));
    html += `<mark class="${sp.self?'':'riv'}">${esc(d.answer.slice(sp.start, sp.end))}</mark>`;
    cursor = sp.end;
  }
  html += esc((d.answer||'').slice(cursor));

  const sent = d.sentiment===null ? '—' : (d.sentiment>=0?'+':'')+Number(d.sentiment).toFixed(2);
  $('#mBody').innerHTML = `
   <div style="font-size:12.5px;color:var(--mute);margin-bottom:6px">${T('Query')}</div>
   <div style="font-size:14.5px;font-weight:500;margin-bottom:16px">${esc(d.prompt)}</div>
   <div style="display:flex;gap:8px;flex-wrap:wrap;margin-bottom:16px">
     <span class="chip">${esc(d.engine)}</span>
     <span class="chip ${d.mentioned?'ok':'bad'}">${d.mentioned?T('Your brand is named'):T('Your brand is not named')}</span>
     ${d.rank?`<span class="chip">${d.rank}${T('.')} ${T('brand named')}</span>`:''}
     <span class="chip ${d.cited?'ok':''}">${d.cited?T('Your site is cited'):T('Your site is not cited')}</span>
     ${d.mentioned&&d.sentiment!==null
        ? `<span class="chip">${T('Tone')}: ${d.sentiment>0.15?T('positive'):d.sentiment<-0.15?T('negative'):T('neutral')}</span>`
        : ''}
     ${d.recommendation?`<span class="chip pri">${T('REC_'+d.recommendation)}</span>`:''}
     ${S.isAdmin?`<span class="chip">run ${d.runIndex+1} · sentiment ${sent}</span>`:''}
   </div>
   <div style="border:1px solid var(--border);border-radius:10px;padding:16px;background:#0D0F15;
        font-size:14px;line-height:1.75;white-space:pre-wrap">${html}</div>
   ${d.citations&&d.citations.length?`<div style="margin-top:14px;display:flex;gap:7px;flex-wrap:wrap">
     ${d.citations.map(c=>`<span class="chip">${esc(c)}</span>`).join('')}</div>`:''}
   <p style="font-size:12px;color:var(--mute);margin-top:14px">
     ${T('Collected')} ${new Date(d.askedAt).toLocaleString('tr-TR')}
     ${S.isAdmin?`<br><span style="color:var(--mute2)">${T('Operator')} · ${esc(d.modelVersion||'unknown model')} ·
       ${d.method==='official_api'?'official API':'licensed SERP provider'}
       ${d.degraded?` · degraded=${esc(d.degraded)}`:''}</span>`:''}
   </p>`;
}

/**
 * Attribute matrix.
 *
 * The single most actionable screen in the product: the score says you are
 * losing, this says why. If the model calls a rival "güvenilir" and calls you
 * "ucuz", no amount of schema markup fixes that — it is a positioning problem,
 * and it is invisible in every other view.
 *
 * Sorted by gap, not volume. An attribute both brands own equally teaches
 * nothing; one a rival owns outright is the work.
 */
function attributePanel(){
  const A=S.attributes;
  if(!A) return `<div class="empty" style="padding:30px"><div class="ic">◈</div>
    <b style="color:var(--fg);font-size:14px">${T('Reading answers…')}</b></div>`;
  if(A.error) return `<div class="empty" style="padding:30px"><div class="ic">⚠</div>
    <p>${esc(A.error)}</p></div>`;

  const c=A.coverage||{};
  if(!c.available) return `<div class="empty" style="padding:30px"><div class="ic">◈</div>
    <b style="color:var(--fg);font-size:14px">${T('Attribute analysis is not available yet')}</b>
    <p style="margin-top:8px;max-width:48ch;margin-inline:auto">${T('This feature reads the answers already collected and reports which qualities each brand is associated with. It will appear here once enabled for your account.')}</p>
    ${S.isAdmin?`<div style="margin-top:14px;font-size:11.5px;color:var(--mute2)">
      ${T('Operator')} · ${T('no provider key configured for the extraction pass')}</div>`:''}</div>`;

  const rows=(A.matrix||[]).slice(0,14);
  if(!rows.length){
    const pct=c.total?Math.round(c.done/c.total*100):0;
    return `<div class="empty" style="padding:30px"><div class="ic">◈</div>
      <b style="color:var(--fg);font-size:14px">${T('Reading your answers')}</b>
      <p style="margin-top:8px;max-width:48ch;margin-inline:auto">
        ${T('An attribute has to appear at least twice before it means anything. Keep this page open while the pass runs.')}</p>
      <div style="max-width:280px;margin:14px auto 0">
        <div class="bar"><i style="width:${pct}%;background:var(--pri)"></i></div>
        <div style="font-size:11.5px;color:var(--mute2);margin-top:6px">
          ${c.done} / ${c.total} ${T('answers read')}</div></div></div>`;
  }

  const brands=[{id:'self',n:S.brand.name,you:true},
                ...S.rivals.map(r=>({id:r.id,n:r.n,you:false}))];

  const cell=(a,b)=>{
    const v=a.brands[b.id];
    if(!v) return `<td class="n" style="color:var(--mute2)">—</td>`;
    const col=v.polarity>0.3?'var(--ok)':v.polarity<-0.3?'var(--bad)':'var(--fg2)';
    const sign=v.polarity>0.3?'+':v.polarity<-0.3?'−':'·';
    return `<td class="n"><b class="mono" style="color:${col}">${v.n}</b>
      <span style="color:var(--mute2);font-size:11px"> ${sign}</span></td>`;
  };

  return `
  <p style="font-size:12.5px;color:var(--mute);margin-bottom:12px">
    ${T('Ordered by the widest gap. A quality a rival owns and you do not is a positioning gap, not a technical one.')}
    ${c.done<c.total?`<span class="chip" style="margin-left:6px">${c.done}/${c.total} ${T('answers read')}</span>`:''}</p>
  <div class="tw"><table>
    <thead><tr><th>${T('Quality')}</th>
      ${brands.map(b=>`<th class="n"${b.you?' style="color:#93B4FF"':''}>${esc(b.n)}</th>`).join('')}
      <th class="n">${T('Gap')}</th></tr></thead>
    <tbody>${rows.map(a=>`
      <tr><td>${esc(a.label)}</td>
        ${brands.map(b=>cell(a,b)).join('')}
        <td class="n">${a.gap>0
          ? `<span class="chip bad">−${a.gap}</span>`
          : a.gap<0 ? `<span class="chip ok">+${-a.gap}</span>`
          : `<span class="chip">0</span>`}</td></tr>`).join('')}
    </tbody></table></div>
  <p style="font-size:11.5px;color:var(--mute2);margin-top:10px">
    ${T('Numbers are how many answers attached that quality to that brand. + and − show whether it was said favourably.')}</p>`;
}

/**
 * What moved since the last scan.
 *
 * This is the panel that makes the product worth paying for month after month.
 * A customer who fixes the audit once and never hears from us again cancels;
 * one who sees "you fell from second to fifth and Klasgame passed you" cannot
 * afford to. It sits at the top of the dashboard for exactly that reason.
 */
function changesPanel(){
  const c=S.changes;
  if(!c || c.error || !c.digest) return '';
  const d=c.digest;
  const urgent=d.urgent||[], wins=d.wins||[];
  if(!urgent.length && !wins.length) return '';

  const open=S.changesOpen!==false;
  const icon=k=>({score_drop:'▼',rank_loss:'▼',lost_mention:'✕',rival_overtake:'⚑',
                  rival_surge:'▲',citation_lost:'✕',score_rise:'▲',rank_gain:'▲',
                  new_mention:'✓',citation_gained:'✓'})[k]||'·';

  const line=(e,bad)=>`
    <div style="display:flex;gap:10px;align-items:flex-start;padding:9px 0;border-bottom:1px solid var(--border)">
      <span style="color:${bad?'var(--bad)':'var(--ok)'};font-size:12px;line-height:1.5;flex:none">${icon(e.kind)}</span>
      <div style="flex:1;min-width:0">
        <div style="font-size:13px">${esc(e.detail)}</div>
        ${e.promptText?`<div style="font-size:11.5px;color:var(--mute2);margin-top:2px">“${esc(e.promptText)}”</div>`:''}
      </div>
      ${e.promptId?`<button class="btn b-gh b-sm" style="flex:none"
         onclick="go('mentions')">${T('Inspect')}</button>`:''}
    </div>`;

  return `
  <div class="card" style="margin-bottom:14px;${urgent.length?'border-color:rgba(239,68,68,.28)':''}">
    <div class="cb">
      <div style="display:flex;align-items:center;gap:11px;flex-wrap:wrap;cursor:pointer"
           onclick="S.changesOpen=${open?'false':'true'};render()">
        <b style="font-size:14.5px">${urgent.length?'⚠ ':''}${T('What changed since the last scan')}</b>
        ${urgent.length?`<span class="chip bad">${urgent.length} ${T('need attention')}</span>`:''}
        ${wins.length?`<span class="chip ok">${wins.length} ${T('improvements')}</span>`:''}
        <span style="margin-left:auto;color:var(--mute2);font-size:12px">${open?'▴':'▾'}</span>
      </div>
      ${open?`
        <div style="margin-top:8px">
          ${urgent.map(e=>line(e,true)).join('')}
          ${wins.map(e=>line(e,false)).join('')}
        </div>
        ${(d.contentTargets||[]).length?`
          <div style="margin-top:14px;padding:13px 15px;background:var(--muted);border-radius:var(--r);
                      border:1px solid var(--border)">
            <b style="font-size:13px">${T('Where to spend this month')}</b>

/** Jumps to the writer with the prompt pre-filled. */
function writeFor(text){
  S.writerTopic=text;
  go('tools');
  setTimeout(()=>{ toolOpen('writer');
    const el=$('#wTopic'); if(el){ el.value=text; el.focus(); } },60);

function sovBars(rows){
  const max=Math.max(...rows.map(r=>r.mentions),1);
  return rows.map(r=>`
   <div style="padding:9px 0;border-bottom:1px solid var(--border)">
     <div style="display:flex;font-size:13px;margin-bottom:6px">
       <span style="flex:1;${r.you?'font-weight:600;color:#93B4FF':''}">${esc(r.n)}</span>
       <span class="mono" style="font-size:12px">${r.mentions} · ${r.sov.toFixed(1)}%</span></div>
     <span class="bar"><i style="width:${r.mentions/max*100}%;background:${r.you?'#3B82F6':'#8B5CF6'}"></i></span>
   </div>`).join('')
   +`<p style="font-size:12px;color:var(--mute);margin-top:12px">${T('The denominator is the tracked brand set only. Adding a competitor changes every share, which is why comparisons stay inside one set.')}</p>`;

let promptTab='all';
VIEWS.prompts=()=>{
  const list=S.prompts.filter(p=>promptTab==='all'||(promptTab==='on'?p.active:!p.active));
  return head(T('AI Prompts'),T('The search prompts you track across AI platforms. See which prompts mention your brand and add new ones.'),
    `<button class="btn b-gh b-sm" onclick="regen()">${T('✦ Regenerate with AI')}</button>
     <button class="btn b-pri b-sm" onclick="newPromptModal()">${T('+ New Prompt')}</button>`)+
  `<div class="card"><div class="cb">
    <div style="display:flex;gap:14px;align-items:center;flex-wrap:wrap;margin-bottom:14px">
      <div class="pills">
        <button class="${promptTab==='all'?'on':''}" onclick="promptTab='all';render()">All (${S.prompts.length})</button>
        <button class="${promptTab==='on'?'on':''}" onclick="promptTab='on';render()">Active (${S.prompts.filter(p=>p.active).length})</button>
        <button class="${promptTab==='off'?'on':''}" onclick="promptTab='off';render()">Paused (${S.prompts.filter(p=>!p.active).length})</button></div>
      <input class="in" placeholder="${T('Search prompts...')}" style="max-width:280px;margin-left:auto" oninput="filterRows(this.value,'pTbl')"></div>
    <div class="tw"><table id="pTbl"><thead><tr><th>${T('Prompt')}</th><th>${T('Intent')}</th><th class="n">${T('Volume')}</th>
      <th class="n">${T('Coverage')}</th><th>${T('Source')}</th><th>${T('Status')}</th><th></th></tr></thead>
    <tbody>${list.map(p=>{
      const cs=S.data.cells.filter(c=>c.p.id===p.id&&platAllowed(c.pl));
      const cov=cs.length?cs.filter(c=>c.m>0).length/cs.length*100:0;
      return `<tr><td style="max-width:320px">${esc(p.text)}</td>
      <td><span class="chip">${intentLabel(p.intent)}</span></td><td class="n">${nf(p.vol)}</td>
      <td class="n" style="color:${cov>50?'#4ADE80':cov>0?'#FBBF24':'#F87171'}">${cov.toFixed(0)}%</td>
      <td><span class="chip ${p.src==='ai'?'vio':''}">${p.src==='ai'?T('AI-generated'):T('Custom')}</span></td>

        <button class="btn b-gh b-sm" onclick="writerFor('${p.id}')">${T('Generate content')} ✦</button>
        <button class="btn b-gh b-sm" onclick="delPrompt('${p.id}')">✕</button></td></tr>`}).join('')}
    </tbody></table></div>
    <div style="display:flex;align-items:center;margin-top:14px;font-size:12.5px;color:var(--mute)">
      Showing 1–${list.length} of ${S.prompts.length}
      <span style="margin-left:auto" class="chip pri">${T('Plan limit')}: ${(S.planLimits&&S.planLimits.prompts)||10} ${T('prompts')}</span></div>
  </div></div>`;
};
async function togglePrompt(id){
  const p=S.prompts.find(x=>x.id===id); if(!p) return;
  const next=!p.active; p.active=next; render();
  try{ await api.patch('/api/prompts',{id,active:next}); }
  catch(e){ p.active=!next; render(); toast(e.message); }
}
async function delPrompt(id){
  try{ await api.del(`/api/prompts?id=${encodeURIComponent(id)}`); await loadResults(); toast(T('Prompt deleted')); }
  catch(e){ toast(e.message); }
}
async function regen(){
  try{
    const r=await api.post('/api/prompts/generate',{workspaceId:S.workspaceId});
    const added=await api.post('/api/prompts',{workspaceId:S.workspaceId,
      prompts:r.prompts.map(p=>({text:p.text,intent:p.intent,volume:p.volume,source:'ai'}))});
    await loadResults();
    toast(added.added
      ? `${added.added} new prompt${added.added===1?'':'s'} added${r.source==='template'?' (from templates)':''}`
      : 'No new prompts — the suggestions were already in your list');
  }catch(e){ toast(e.message,'error'); }
}

  return head(T('Action Plan'),T('A task list built from audit findings, citation gaps and the opportunity engine, sorted by impact and effort.'),
    `<button class="btn b-gh b-sm" onclick="exportPlan()">⭳ ${T('Download plan')}</button>`)+
  `<div class="g3">
    <div class="kpi"><div class="t">${T('Projected score if completed')}</div>
      <div class="v ok">${Math.min(100,d.total+gain).toFixed(1)}</div>
      <div class="d">${T('now')} ${d.total.toFixed(1)} · +${gain.toFixed(1)} ${T('pts')}</div></div>
    <div class="kpi"><div class="t">${T('Tasks')}</div><div class="v">${A.length}</div>
      <div class="d">${T('split into 3 phases')}</div></div>
    <div class="kpi"><div class="t">${T('Estimated timeline')}</div><div class="v">90 ${T('days')}</div>
      <div class="d">${T('first wins in 1–2 weeks')}</div></div>
  </div>

  <div class="pills" style="margin:18px 0 14px">

    <button class="${tab==='road'?'on':''}" onclick="S.planTab='road';render()">${T('90-day roadmap')}</button>
  </div>

  ${tab==='platform'?planPlatforms():tab==='tasks'?planTasks(A):planRoad(A,gain)}`;

/**
 * Platform-by-platform advice.
 *
 * A single ranked list quietly assumes every engine works the same way. They
 * do not: Perplexity cites what it just fetched, AI Overviews is fed by the
 * Google index, ChatGPT leans on what the open web says about you. The same
 * score can need three different fixes, so the advice is split by engine.
 */
function planPlatforms(){
  const ins=S.insights;
  if(!ins) return `<div class="empty" style="padding:44px"><div class="ic">◎</div>
    <b style="color:var(--fg);font-size:15px">${T('Reading your platform data…')}</b></div>`;
  if(ins.error) return `<div class="empty" style="padding:44px"><div class="ic">⚠</div>
    <b style="color:var(--fg);font-size:15px">${T('Could not load your data')}</b>
    <p style="margin-top:8px">${esc(ins.error)}</p></div>`;

  const live=ins.filter(p=>p.measured);
  const idle=ins.filter(p=>!p.measured);
  if(!live.length) return `<div class="empty" style="padding:44px"><div class="ic">◌</div>
    <b style="color:var(--fg);font-size:15px">${T('No platform has been measured yet')}</b>
    <p style="margin-top:8px;max-width:46ch;margin-inline:auto">${T('Run a scan first. Everything on this screen is generated from your own results, never from a template — so there is nothing to show until answers exist.')}</p>
    <div style="margin-top:16px"><button class="btn b-pri b-sm" onclick="rescan()">↻ ${T('Rescan')}</button></div>
    ${S.isAdmin?`<div style="margin-top:12px;font-size:11.5px;color:var(--mute2)">${T('Operator')} ·
      <a href="#" onclick="go('settings');setTimeout(()=>setTab('integrations'),30);return false"
      style="color:#93B4FF">${T('Check keys')}</a></div>`:''}</div>`;

  // Worst first: that is the order a marketer should work in.
  const ordered=[...live].sort((a,b)=>b.impact-a.impact);
  const tone=dg=>dg==='healthy'?'ok':dg==='absent'||dg==='losing_to_rival'?'bad':'warn';

  return `
  <p style="font-size:12.5px;color:var(--mute);margin-bottom:14px">
    ${T('Each platform picks its sources differently, so the same score can need different work. Ordered by how much score is unclaimed.')}</p>

  ${ordered.map(p=>`
  <div class="card" style="margin-bottom:14px"><div class="cb">
    <div style="display:flex;align-items:flex-start;gap:12px;flex-wrap:wrap">
      <span class="d" style="width:26px;height:26px;border-radius:8px;display:grid;place-items:center;
        background:${(d=>d)(ENGINE_COLOR[p.engineKey]||'#3B82F6')}22;
        border:1px solid ${(ENGINE_COLOR[p.engineKey]||'#3B82F6')}55;font-size:12px;flex:none">
        ${ENGINE_GLYPH[p.engineKey]||'◆'}</span>
      <div style="flex:1;min-width:220px">
        <b style="font-size:15px">${esc(p.engineLabel)}</b>
        <span class="chip ${tone(p.diagnosis)}" style="margin-left:8px">${esc(p.headline)}</span>
        <p style="font-size:13px;color:var(--mute);margin-top:7px;max-width:74ch;line-height:1.6">${esc(p.why)}</p>
      </div>
      <div style="text-align:right;flex:none">
        <div class="mono" style="font-size:19px;font-weight:600">${p.score.toFixed(1)}</div>
        <div style="font-size:11px;color:var(--mute2)">${T('unclaimed')}: ${p.impact.toFixed(1)} ${T('pts')}</div>
      </div>
    </div>

    <div class="g4" style="margin:14px 0 4px">
      <div><div class="mut" style="font-size:11px">${T('Mention rate')}</div>
        <b class="mono">${(p.mentionRate*100).toFixed(0)}%</b></div>
      <div><div class="mut" style="font-size:11px">${T('Citation rate')}</div>
        <b class="mono">${(p.citationRate*100).toFixed(0)}%</b></div>
      <div><div class="mut" style="font-size:11px">${T('Average rank')}</div>
        <b class="mono">${p.meanRank?p.meanRank.toFixed(1):'—'}</b></div>
      <div><div class="mut" style="font-size:11px">${T('Total checks')}</div>
        <b class="mono">${p.checks}</b></div>
    </div>

    ${p.actions.map(a=>`
      <div style="margin-top:14px;padding:13px 15px;background:var(--muted);border-radius:var(--r);
                  border:1px solid var(--border)">
        <b style="font-size:13.5px">${esc(a.title)}</b>
        <p style="font-size:12.5px;color:var(--mute);margin-top:4px">${esc(a.detail)}</p>
        <ol style="margin:9px 0 0 18px;padding:0;font-size:12.5px;color:var(--fg2);line-height:1.85">
          ${a.steps.map(x=>`<li>${esc(x)}</li>`).join('')}</ol>
      </div>`).join('')}

    ${p.topSources.length?`
      <div style="margin-top:13px">
        <div class="mut" style="font-size:11px;margin-bottom:6px">
          ${T('Sources this platform cited most')}</div>
        <div style="display:flex;gap:7px;flex-wrap:wrap">
          ${p.topSources.slice(0,6).map(x=>
            `<span class="chip ${x.ours?'ok':''}">${esc(x.domain)} · ${x.count}${x.ours?' · '+T('yours'):''}</span>`).join('')}
        </div></div>`:''}
  </div></div>`).join('')}

  ${idle.length&&S.isAdmin?`<div class="banner" style="margin-top:16px"><span>🔑</span>
    <span><b>${T('Operator')}</b> · ${idle.length} ${T('platforms are not being measured, so no advice can be given for them')}:
      ${idle.map(p=>esc(p.engineLabel)).join(', ')}</span></div>`:''}`;
}

/**
 * Task detail. The row has had `onclick="taskModal(i)"` since the first build
 * but the function was never written, so every task in the action plan threw a
 * ReferenceError on click — the plan looked interactive and was not. The data
 * it needs (desc, steps, code) has always been on the item.
 */
function taskModal(i){
  const a=(S.data&&S.data.actions||[])[i];
  if(!a) return;
  const steps=(a.steps||[]).map((x,n)=>
    `<div style="display:flex;gap:10px;margin-bottom:8px">
       <span style="width:20px;height:20px;border-radius:6px;background:rgba(59,130,246,.15);
         color:#93B4FF;display:grid;place-items:center;font-size:11px;flex:none">${n+1}</span>
       <span style="font-size:13px">${esc(x)}</span></div>`).join('');
  openModal(a.t, `
    <p style="font-size:13px;color:var(--mute);margin-bottom:16px">${esc(a.desc||a.sub||'')}</p>
    <div style="display:flex;gap:8px;flex-wrap:wrap;margin-bottom:16px">
      <span class="chip ok">${T('Impact')} ${esc(a.im)}</span>
      <span class="chip">${esc(a.ef||'')}</span>
      <span class="chip">${esc(a.q||'')}</span></div>
    ${steps?`<h4 style="font-size:13px;margin-bottom:10px">${T('Steps')}</h4>${steps}`:''}
    ${a.code?`<h4 style="font-size:13px;margin:16px 0 8px">${T('Ready-to-paste fix')}</h4>
      <pre style="background:var(--card2);border:1px solid var(--border);border-radius:9px;padding:12px;
        font-size:11.5px;overflow:auto;max-height:240px;white-space:pre-wrap">${esc(a.code)}</pre>
      <button class="btn b-gh b-sm" style="margin-top:9px"
        onclick="navigator.clipboard.writeText(${JSON.stringify(a.code)}).then(()=>toast(T('Copied')))">⧉ ${T('Copy')}</button>`:''}`);
}

function planTasks(A){
  return `<div class="card"><div class="cb">
    ${A.map((a,i)=>`
      <div class="task" onclick="taskModal(${i})">
        <div class="tn">${i+1}</div>
        <div style="flex:1;min-width:0"><b style="font-size:14px">${esc(a.t)}</b>
          <p style="font-size:12.5px;color:var(--mute);margin-top:3px">${esc(a.sub)}</p></div>
        <div style="text-align:right;flex:none">
          <span class="chip ok">${T('Impact')} ${a.im}</span>
          <div style="font-size:11.5px;color:var(--mute2);margin-top:5px">${esc(a.ef)} · ${esc(a.q)}</div>
        </div></div>`).join('')}
  </div></div>`;
}

function planRoad(A,gain){
  return `<div class="card"><div class="cb">
    <div class="ch"><div><h3>${T('90-day roadmap')}</h3>
      <div class="sub">${T('Expected cumulative gain at the end of each phase')}</div></div></div>
    ${[[`0–30 ${T('days')}`,T('Open the door'),A.slice(0,2),(gain*.33)],
       [`30–60 ${T('days')}`,T('Fill the gaps'),A.slice(2,5),(gain*.38)],
       [`60–90 ${T('days')}`,T('Grow authority'),A.slice(5),(gain*.29)]]
      .map(([win,name,items,g])=>`
      <div style="margin-bottom:18px">
        <div style="display:flex;align-items:center;gap:10px;margin-bottom:8px">
          <b style="font-size:14px">${name}</b><span class="chip">${win}</span>
          <span class="chip ok" style="margin-left:auto">${T('Expected gain')} +${g.toFixed(1)}</span></div>
        ${items.length?items.map(a=>`
          <div style="padding:9px 13px;background:var(--muted);border-radius:9px;margin-bottom:7px;font-size:13px">

          :`<div style="padding:9px 13px;color:var(--mute2);font-size:12.5px">${T('Nothing queued for this phase')}</div>`}
      </div>`).join('')}
  </div></div>`;
};
function exportPlan(){
  const t=S.data.actions.map((a,i)=>`${i+1}. ${a.t}\n   ${a.sub}\n   Impact ${a.im} · Effort ${a.ef} · ${a.q}\n   ${a.desc}\n`+
    a.steps.map(s=>'   - '+s).join('\n')+(a.code?'\n\n'+a.code:'')).join('\n\n');
  dl('yanki-action-plan.txt','YANKI ACTION PLAN — '+S.brand.name+'\n\n'+t);
}

/* ---------- AUDIT ---------- */
VIEWS.audit=()=>{
  const d=S.data;
  const pass=d.audit.reduce((a,c)=>a+c.facs.filter(f=>f.st==='pass').length,0);
  const part=d.audit.reduce((a,c)=>a+c.facs.filter(f=>f.st==='partial').length,0);

    `<input class="in" id="auditUrl" aria-label="URL to audit" style="width:260px" value="${esc(S.brand.site)}">

  `<div class="g2" style="grid-template-columns:1.5fr 1fr">
    <div class="card"><div class="ch"><div><h3>${T('Category scores')}</h3><div class="sub">${T('Click a category to expand its factors')}</div></div></div>
      <div class="cb">${d.audit.map((c,i)=>{
        const col=c.score>=60?'#22C55E':c.score>=40?'#F59E0B':'#EF4444';

          <div><h5>${c.n}</h5><div class="sb2">${c.facs.length} factors ·
            ${c.facs.filter(f=>f.st==='pass').length} passed, ${c.facs.filter(f=>f.st==='partial').length} partial,
            ${c.facs.filter(f=>f.st==='fail').length} failed</div></div>
          <div class="m"><span class="bar" style="width:90px"><i style="width:${c.score}%;background:${col}"></i></span></div></div>
          <div class="acc-b">${c.facs.map((f,j)=>`
            <div style="display:flex;gap:10px;align-items:flex-start;padding:9px 0;border-bottom:1px solid var(--border)">
              <span class="chip ${f.st==='pass'?'ok':f.st==='partial'?'warn':'bad'}" style="flex:none">
                ${f.st==='pass'?T('Pass'):f.st==='partial'?T('Partial'):T('Fail')}</span>
              <span style="font-size:13px;flex:1">${f.n}</span>
              ${f.fix?`<button class="btn b-gh b-sm" onclick="fixModal('${encodeURIComponent(f.n)}')">${T('Fix')}</button>`:''}
            </div>`).join('')}</div></div>`}).join('')}</div></div>

async function runAudit(){
  const btn=$('#auditBtn'); const url=$('#auditUrl')?$('#auditUrl').value.trim():'';
  if(btn){btn.disabled=true;btn.textContent=T('Crawling…');}
  try{
    const r=await api.post('/api/audit',{workspaceId:S.workspaceId,url:url||undefined});
    await loadResults();
    toast(`Audit complete — ${r.score.toFixed(0)}/100 · ${r.remaining} left this month`);
  }catch(e){
    toast(e.message);
    if(btn){btn.disabled=false;btn.textContent=T('Run Audit');}

function fixModal(key){
  const k=decodeURIComponent(key);
  let fix=null, detail='';
  (S.data.audit||[]).forEach(c=>c.facs.forEach(f=>{ if(f.n===k){fix=f.fix;detail=f.detail||'';} }));
  openModal(k, fix
    ? `<p style="font-size:13px;color:var(--mute);margin-bottom:12px">${esc(detail)}</p>
       <pre id="fixc">${esc(fix)}</pre>
       <div style="display:flex;gap:9px;margin-top:14px">
         <button class="btn b-pri b-sm" onclick="copy('fixc')">${T('Copy')}</button>
         <button class="btn b-gh b-sm" onclick="dl('fix.txt',document.getElementById('fixc').textContent)">${T('Download')}</button>
       </div>`
    : `<p style="font-size:13.5px;color:var(--mute)">${esc(detail||'No automated fix for this factor.')}</p>`);
}

function exportAudit(){
  const rows=[['Category','Factor','Status']];
  S.data.audit.forEach(c=>c.facs.forEach(f=>rows.push([c.n,f.n,f.st])));
  dl('yanki-audit.csv',csv(rows),'text/csv;charset=utf-8');
}

function toolOutput(){
  const b=S.brand;
  if(tool==='robots')return `# robots.txt — ${b.name}\n# generated by YANKI\n\nUser-agent: *\nAllow: /\nDisallow: /admin/\n\n# ---- AI crawlers ----\n`+
    ['GPTBot','OAI-SearchBot','ChatGPT-User','PerplexityBot','Perplexity-User','ClaudeBot','Claude-User','Claude-SearchBot','Google-Extended','Applebot-Extended','meta-externalagent','Amazonbot','cohere-ai']
    .map(u=>`User-agent: ${u}\nAllow: /\n`).join('\n')+`\nUser-agent: Bytespider\nDisallow: /\n\nSitemap: ${b.site}/sitemap.xml`;
  if(tool==='llms')return `# ${b.name}\n\n> ${b.desc||b.name+' is a brand operating in '+sectorTerm(b.sector)+'.'}\n\n## Brand facts\n- Industry: ${b.sector}\n- Location: ${b.city?b.city+', ':''}${b.country}\n`+
    (S.variants.length?`- Alternative names: ${S.variants.join(', ')}\n`:'')+
    `\n## Key pages\n- [Home](${b.site})\n- [About](${b.site}/about)\n- [Products / Services](${b.site}/products)\n- [FAQ](${b.site}/faq)\n- [Contact](${b.site}/contact)\n\n## Featured topics\n`+
    S.prompts.slice(0,6).map(p=>'- '+p.text.replace(/"/g,'')).join('\n')+`\n\n## Contact\n- Web: ${b.site}\n`;
  if(tool==='schema')return '<script type="application/ld+json">\n'+schemaOrg()+'\n<\/script>\n\n<script type="application/ld+json">\n'+
    JSON.stringify({"@context":"https://schema.org","@type":"FAQPage",mainEntity:S.prompts.slice(0,4).map(p=>({
     "@type":"Question",name:p.text.replace(/"/g,''),acceptedAnswer:{"@type":"Answer",
     text:`${b.name} is ... in ${sectorTerm(b.sector)}. (40-60 word direct answer.)`}}))},null,2)+'\n<\/script>';
  // A meta description must stand on its own: models and SERPs both quote it
  // verbatim. Falling back to just the brand name produces a useless tag, so
  // we compose one from what we know and pad it to a usable length.
  const place=b.city?`${b.city}, ${b.country}`:b.country;
  const desc=((b.desc||'').trim().length>=60
    ? b.desc.trim()
    : `${b.name}, ${place} pazarında ${sectorTerm(b.sector)} alanında hizmet veren bir markadır.`+
      (b.desc?` ${b.desc.trim()}`:'')).replace(/\s+/g,' ').slice(0,158);
  const title=`${b.name} — ${sectorTerm(b.sector)}${b.city?' | '+b.city:''}`.slice(0,60);
  const locale=b.country==='Turkey'?'tr_TR':'en_US';
  return `<title>${title}</title>\n<meta name="description" content="${desc}">\n<link rel="canonical" href="${b.site}">\n\n<meta property="og:type" content="website">\n<meta property="og:site_name" content="${b.name}">\n<meta property="og:title" content="${title}">\n<meta property="og:description" content="${desc}">\n<meta property="og:url" content="${b.site}">\n<meta property="og:locale" content="${locale}">\n\n<meta name="twitter:card" content="summary_large_image">\n<meta name="twitter:title" content="${title}">\n<meta name="twitter:description" content="${desc}">\n\n\n<meta name="robots" content="index,follow,max-snippet:-1,max-image-preview:large">`;
}

function runWriter(){

  if(!topic){toast(T('Topic is required'),'error');return}
  const type=document.querySelector('#ctype button.on')?.dataset.t||'blog';
  const b=S.brand,sec=sectorTerm(b.sector);
  const TITLE=topic.charAt(0).toLocaleUpperCase('tr')+topic.slice(1);
  let md='';
  if(type==='faq'){
    md=`# ${TITLE} — Frequently Asked Questions\n\n`+
    [`What is ${TITLE}?`,`How do you choose ${TITLE}?`,`What does ${b.name} offer here?`,`How does pricing work?`,`How long until results?`]
    .map(q=>`## ${q}\n\n${b.name} … in ${sec}. (40–60 word direct answer.) This section should include at least one numeric data point and one source link.\n`).join('\n');
  }else if(type==='cmp'){
    md=`# ${TITLE}: Comparison (${new Date().getFullYear()})\n\nWhen choosing ${TITLE}, the criteria that matter are price, local support, integration depth and setup time. The table below puts the leading options side by side.\n\n`+
    `| Criterion | ${b.name} | ${(S.rivals[0]?.n)||'Competitor A'} | ${(S.rivals[1]?.n)||'Competitor B'} |\n|---|---|---|---|\n`+
    `| Price | … | … | … |\n| Local support | … | … | … |\n| Setup time | … | … | … |\n| Integrations | … | … | … |\n\n`+
    `## Which one, and when?\n\n…\n\n## Verdict\n\n${b.name} stands out in the ${b.city||b.country} market thanks to … .\n`;
  }else if(type==='how'){
    md=`# ${TITLE} — Step-by-Step Guide\n\n${TITLE} is the process to follow for … in ${sec}. The steps below take about … to complete.\n\n`+
    [1,2,3,4,5].map(i=>`## Step ${i}: …\n\n… (clear, actionable instruction)\n`).join('\n')+
    `\n## Common mistakes\n\n- …\n- …\n\n## Summary\n\n…\n`;
  }else{
    md=`# ${TITLE}\n\n${TITLE} is a frequently asked topic in ${sec} in the ${b.city||b.country} market. This article covers everything from the definition to the selection criteria, with data.\n\n`+
    `## What is ${TITLE}?\n\n… (40–60 word direct answer in the first paragraph — this is the part models quote.)\n\n`+
    `## How does it work?\n\n…\n\n## Selection criteria\n\n| Criterion | Why it matters | How to measure |\n|---|---|---|\n| … | … | … |\n\n`+
    `## The ${b.name} approach\n\n${b.desc||'…'}\n\n## FAQ\n\n**How long does ${TITLE} take?**\n…\n\n**What does it cost?**\n…\n\n`+
    `---\n*Published: ${new Date().toLocaleDateString('en-GB')} · Author: ${b.name} editorial team*\n`;
  }
  const check=[[T('Direct answer in first paragraph'),'ok'],[T('Headings in question form'),type==='faq'?'ok':'warn'],
    [T('Comparison table'),type==='cmp'||type==='blog'?'ok':'warn'],[T('Date and author info'),'ok'],
    [T('FAQPage schema suggested'),'ok'],[T('Add numeric data'),'warn']];
  $('#wOut').innerHTML=`<div style="display:flex;align-items:center;gap:10px;margin-bottom:12px">
    <b style="font-size:14px">${T('Draft ready')}</b><span class="chip pri">${{blog:T('Blog'),faq:T('FAQ'),cmp:T('Comparison'),how:T('How-To')}[type]}</span>
    <span style="margin-left:auto;display:flex;gap:8px">
      <button class="btn b-gh b-sm" onclick="copy('wmd')">${T('Copy')}</button>
      <button class="btn b-pri b-sm" onclick="dl('content.md',document.getElementById('wmd').textContent,'text/markdown')">⭳ .md</button></span></div>
   <pre id="wmd" style="max-height:340px;overflow:auto">${esc(md)}</pre>
   <div style="margin-top:14px"><b style="font-size:13px">${T('GEO checklist')}</b>
     <div style="display:flex;gap:7px;flex-wrap:wrap;margin-top:9px">
       ${check.map(c=>`<span class="chip ${c[1]}">${c[1]==='ok'?'✓':'!'} ${c[0]}</span>`).join('')}</div></div>`;
  toast('Content draft generated');
}

/**
 * Suggests the forms the automatic alias builder deliberately will not add on
 * its own. "RAMS Türkiye" generates no bare "RAMS", because a short head word
 * is exactly what produces false positives on a common noun — but for a brand
 * whose models say "RAMS" in four answers out of five, the omission reads as
 * zero visibility. So: propose, never assume. The operator decides.
 */
function suggestedVariants(){
  const name=(S.brand.name||'').trim();
  if(!name) return [];
  const out=new Set();
  const words=name.split(/\s+/).filter(Boolean);
  const GENERIC=new Set(['türkiye','turkiye','global','group','grup','holding','a.ş.','as','ltd',
    'şirketi','sirketi','company','co','inc','international','turkey']);
  if(words.length>1){
    // Head word, when the rest is a generic qualifier.
    const head=words[0];
    if(head.length>=3 && words.slice(1).every(w=>GENERIC.has(w.toLocaleLowerCase('tr')))) out.add(head);
    else if(head.length>=4) out.add(head);
    // Acronym for three or more words: "Rams Gayrimenkul Yatırım" -> "RGY"
    if(words.length>=3) out.add(words.map(w=>w[0]).join('').toLocaleUpperCase('tr'));
  }
  return [...out].filter(v=>v.length>=3 && !S.variants.includes(v));
}

  }

/**
 * This function was referenced by the empty-state banner but never existed,
 * so the one visible way to trigger a scan threw a ReferenceError. The
 * scheduled job runs once a day; without a manual trigger a customer who has
 * just fixed something waits until tomorrow to find out whether it worked.
 */
async function rescan(){
  if(S.scanBusy || !S.workspaceId) return;
  // Switch the screen first. The request below can take a while, and a button
  // that only produces a toast reads as a button that did nothing.
  S.scanBusy = true; render();
  try{
    // warm:false. With warming on, this call drains a batch server-side and
    // does not answer for up to forty seconds — the whole point of the
    // progress screen is lost if the first number arrives after it. The queue
    // is drained by pollScan() instead, which is what makes the counter move.
    const r = await api.post('/api/scan',{workspaceId:S.workspaceId, warm:false});
    if(r.jobs){
      await loadResults({silent:true});
      render();
      pollScan();          // clears S.scanBusy once real progress arrives
    }else{
      // enqueueScan reports why it queued nothing. Passing that through beats
      // a generic "done" that leaves the operator staring at an empty chart.
      S.scanBusy = false; render();
      toast(r.reason ? `${T('Nothing to scan')}: ${r.reason}` : T('Nothing to scan'), 'error');
    }
  }catch(e){
    S.scanBusy = false; render();
    toast(e.message, 'error');
  }
}

/** "3 dk önce" — an absolute timestamp in a sidebar is noise; freshness is the
 *  only thing the reader actually wants from it. */
function relTime(iso){
  const d=(Date.now()-new Date(iso))/1000;
  if(!isFinite(d)) return '';
  if(d<90)      return T('just now');
  if(d<3600)    return Math.round(d/60)+' '+T('min ago');
  if(d<86400)   return Math.round(d/3600)+' '+T('h ago');
  return Math.round(d/86400)+' '+T('d ago');
}

/* ---------- boot ----------
   Session first. A signed-in user with an onboarded workspace lands straight
   on the dashboard — refreshing the page must never send anyone back through
   setup. */
async function boot(){
  let me;
  try{ me = await api.get('/api/auth/me'); }
  catch{ document.body.innerHTML =
    '<div style="display:grid;place-items:center;min-height:100vh;color:#949CAD;font-size:14px">'+
    T('Could not reach the server. Refresh to try again.')+'</div>'; return; }

  if(!me.signedIn){ location.replace('/giris'); return; }

  // Full name if we have one; otherwise the local part of the address, since
  // a 30-character email overflows the sidebar and tells the user nothing.
  S.user={name: me.user.fullName || me.user.email.split('@')[0], mail: me.user.email};
  S.plan=me.org.plan; S.planLimits=me.limits; S.org=me.org; S.role=me.role;
  S.workspaces=me.workspaces||[];
  S.isAdmin=me.isAdmin===true;
  // A visitor who switched the marketing site to English arrives with ?lang=en
  // and expects the product in English too; that choice wins for this visit and
  // is written back to the account.
  const urlLang=new URLSearchParams(location.search).get('lang');
  S.lang = (urlLang==='en'||urlLang==='tr') ? urlLang : (me.user.locale==='en'?'en':'tr');
  if(me.user.notify) S.notify={...S.notify,...me.user.notify};
  if(urlLang && urlLang!==me.user.locale){
    api.post('/api/auth/locale',{locale:S.lang}).catch(()=>{});
  }
  document.documentElement.lang=S.lang;

  localise(document.body);   // static shell: sidebar labels, titles, aria
  const ready=(me.workspaces||[]).find(w=>w.onboarded);
  if(ready){
    S.workspaceId=ready.id;
    S.brand.name=ready.brand_name; S.brand.site=ready.domain; S.brand.sector=ready.sector;
    $('#ob').classList.remove('on'); $('#app').classList.add('on');
    render();                       // shell immediately, data after
    try{ await loadResults(); }
    catch(e){ S.loadError=e.message; render(); }
    if(S.scanState && S.scanState.pending>0) pollScan();
    return;
  }

  // Half-finished setup: resume on the identity step rather than starting over.
  const draft=(me.workspaces||[])[0];
  if(draft){
    S.workspaceId=draft.id;
    S.brand={name:draft.brand_name,site:draft.domain,sector:draft.sector,
      country:'Turkey',city:'',desc:''};
    S.step=2;
  }
  renderOb();
}

let pollTimer=null, ticking=false;

/**
 * While a scan is outstanding: ask the server to process a batch, then refresh.
 * The two calls are separate on purpose — a provider can take thirty seconds
 * to answer, and the read must never wait on that.
 */
function pollScan(){
  clearTimeout(pollTimer);
  let rounds=0;
  const step=async()=>{
    rounds++;
    try{
      if(!ticking){
        ticking=true;
        try{ await api.post('/api/scan/tick',{workspaceId:S.workspaceId}); }
        finally{ ticking=false; }
      }
      await loadResults({silent:true});
      const pending=S.scanState?Number(S.scanState.pending||0):0;
      // Hand the screen back to the dashboard the moment the queue empties.
      // Without this the busy flag set by rescan() never clears and the
      // progress screen stays up after the scan has finished.
      if(pending<=0) S.scanBusy=false;
      render();
      if(pending>0 && rounds<80) pollTimer=setTimeout(step,900);
      else if(rounds>=80) S.scanBusy=false;
    }catch(e){
      // Transient failures are expected while providers are being called.
      if(rounds<80) pollTimer=setTimeout(step,6000);
      else { S.scanBusy=false; render(); }
    }
  };
  pollTimer=setTimeout(step,600);
}

boot();
</script>
