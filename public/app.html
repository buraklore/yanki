<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>YANKI — AI Visibility Platform</title>
<meta name="theme-color" content="#F7F4ED">
<link rel="icon" href="data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%22%20viewBox%3D%220%200%2064%2064%22%3E%3Cdefs%3E%3ClinearGradient%20id%3D%22g%22%20x1%3D%220%22%20y1%3D%220%22%20x2%3D%221%22%20y2%3D%221%22%3E%3Cstop%20offset%3D%220%22%20stop-color%3D%22%23B04628%22%2F%3E%3Cstop%20offset%3D%221%22%20stop-color%3D%22%238F3720%22%2F%3E%3C%2FlinearGradient%3E%3C%2Fdefs%3E%3Crect%20width%3D%2264%22%20height%3D%2264%22%20rx%3D%2216%22%20fill%3D%22url%28%23g%29%22%2F%3E%3Ctext%20x%3D%2232%22%20y%3D%2245%22%20font-family%3D%22Inter%2CArial%2Csans-serif%22%20font-size%3D%2238%22%20font-weight%3D%22700%22%20fill%3D%22%23fff%22%20text-anchor%3D%22middle%22%3EY%3C%2Ftext%3E%3C%2Fsvg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;450;500;600;700&display=swap" rel="stylesheet">
<style>
/* =====================================================================
   PALET
   =====================================================================
   İki referans üründen piksel örneklemesiyle çıkarıldı, tahminle değil.

     Pleqo    zemin #0E0D12 · vurgu #4A317A mor / #10B982 yesil (ölçülen)
              soğuk, yüksek kontrast, bilgi yoğun — yapı doğru
     Rankzup  zemin #F5F1E8 · vurgu #B04628 pas
              sıcak, düşük kontrast, editöryel — karakter doğru

   Alınan karar: Pleqo'nun yoğunluğu, Rankzup'ın sıcaklığı.

   Zemin kasten nötr siyah DEĞİL. var(--bg) maviye kaçıyordu; #12100E kırmızıya
   kaçıyor. Yan yana konmadan fark edilmiyor ama pas rengi vurgu sıcak zeminde
   oturuyor, soğuk zeminde çakışıyor.

   --pri-btn ayrı bir değişken çünkü #C25A32 üzerine beyaz metin 4.37:1 veriyor
   ve eşik 4.5. Düğmelerde #B04628 kullanılıyor: beyazla 5.60:1.
   ===================================================================== */
:root{
  --bg:#12100E;--bg2:#171410;--card:#1B1815;--card2:#221E1A;--card3:#2A251F;
  --border:#2A251F;--border2:#3A342C;--fg:#EDE8E0;--fg2:#BDB4A8;--mute:#A69C8F;--mute2:#948B7E;
  --pri:var(--pri);--pri-btn:#B04628;--pri2:var(--pri2);--pri-ink:#8F3720;--vio:#B08A5A;
  --ok:var(--ok);--warn:var(--warn);--bad:var(--bad);
  /* Rankzup'ın tasarım dili: belirgin yuvarlak köşe, neredeyse görünmez gölge,
     çok soluk kenar çizgisi. Pleqo keskin köşe + belirgin gölge kullanıyor;
     bu tarafı Rankzup'tan alıyoruz çünkü uzun oturumda daha az yoruyor. */
  --r:8px;--rl:10px;--rx:12px;--r2:16px;
  --sh:0 1px 2px rgba(0,0,0,.06);
  --shm:0 2px 10px -4px rgba(0,0,0,.10);
  --mono:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
}
/* Açık tema. Rankzup'ın zemini neredeyse birebir; metin kontrastı 4.5:1
   üzerine çekildi — orijinali göz yormuyor ama soluk metinde eşiğin altında
   kalıyor. */
/* Aşağıdaki koyu rozet tonları YALNIZCA açık temada geçerli; koyu temada
   ışıklı tonlara geri dönüyorlar. */
body:not(.lt) .kchip.directory,body:not(.lt) .kchip.self_publish{color:#7EE2A8}
body:not(.lt) .kchip.publication,body:not(.lt) .kchip.authority{color:#C4B5FD}
body:not(.lt) .stbl .tagme{background:rgba(176,70,40,.24);color:#EDA47A}
body:not(.lt) .mst.in{color:#4ADE80}
body:not(.lt) .mst.in{color:#4ADE80}
body:not(.lt) .sent.ok{background:rgba(74,222,128,.12);color:#7EE2A8}
body:not(.lt) .sent.bad{background:rgba(248,113,113,.12);color:#FCA5A5}
body:not(.lt) .sent.mid{background:rgba(148,163,184,.12);color:#B4BECD}
body:not(.lt) .act .sv.mid{background:rgba(245,158,11,.13);color:#FCD34D}
body:not(.lt) .act .sv.high{background:rgba(239,68,68,.13);color:#FCA5A5}
body:not(.lt) .mfil button.on,body:not(.lt) .actfil button.on{color:#EDA47A}
body:not(.lt) .src.mine .dm i,body:not(.lt) .prc .nm i,body:not(.lt) .tagme{color:#EDA47A}
body:not(.lt) mark.riv{background:rgba(143,55,32,.24);color:#C4B5FD}
body.lt{
  --bg:#F7F4ED;--bg2:#F4F0E7;--card:#FFFDF8;--card2:#F7F4EC;--card3:#EFEADF;
  --border:#E4DDCE;--border2:#D4CBB8;--fg:#1A1713;--fg2:#4A423A;--mute:#6A6255;--mute2:#70695C;
  --pri:#9C3D22;--pri-btn:#B04628;--pri2:#8F3720;--pri-ink:#7A2E19;--vio:#8A6A3E;
  --ok:#15803D;--warn:#B45309;--bad:#B91C1C;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font-family:Inter,-apple-system,"Segoe UI",Roboto,sans-serif;
  font-size:14px;line-height:1.6;-webkit-font-smoothing:antialiased}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
a{color:inherit;text-decoration:none}button{font:inherit;cursor:pointer}
h1,h2,h3,h4,h5{margin:0;font-weight:600;letter-spacing:-.03em;line-height:1.18}
p{margin:0}
input,select,textarea{font:inherit}
:focus-visible{outline:2px solid var(--pri);outline-offset:2px}
::-webkit-scrollbar{width:9px;height:9px}::-webkit-scrollbar-thumb{background:var(--border2);border-radius:8px}
.mono{font-family:var(--mono)}
.mut{color:var(--mute)}.ok{color:var(--ok)}.bad{color:var(--bad)}.warn{color:var(--warn)}

/* ---------- primitives ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:10px 16px;border-radius:var(--r);
  font-size:14px;font-weight:500;border:1px solid transparent;transition:.16s;white-space:nowrap}
.btn:disabled{opacity:.45;cursor:not-allowed}
.b-pri{background:var(--pri-btn);color:#fff;box-shadow:0 6px 20px -8px rgba(176,70,40,.8)}
.b-pri:hover:not(:disabled){background:var(--pri2)}
.b-gh{background:rgba(26,23,19,.04);color:var(--fg);border-color:var(--border2)}
.b-gh:hover:not(:disabled){background:rgba(26,23,19,.07)}
.b-dg{background:rgba(239,68,68,.12);color:var(--bad);border-color:rgba(239,68,68,.3)}
.b-sm{padding:6px 12px;font-size:13px}
.b-lg{padding:12px 24px;font-size:14px}
.b-full{width:100%}
.fld{margin-bottom:16px}
.fld label{display:block;font-size:13px;font-weight:500;margin-bottom:6px}
.fld .hint{font-size:12px;color:var(--mute);margin-top:6px}
.in{width:100%;padding:10px 12px;border:1px solid var(--border2);border-radius:var(--r);background:var(--card);color:var(--fg);font-size:14px}
.in::placeholder{color:var(--mute2)}
.in:focus{outline:none;border-color:var(--pri);box-shadow:0 0 0 3px rgba(176,70,40,.16)}
textarea.in{min-height:92px;resize:vertical}
.chip{display:inline-flex;align-items:center;gap:4px;padding:2px 8px;border-radius:999px;font-size:11px;font-weight:500;
  background:rgba(255,255,255,.05);color:var(--mute);border:1px solid var(--border)}
.chip.ok{background:rgba(34,197,94,.1);color:var(--ok);border-color:rgba(34,197,94,.24)}
.chip.warn{background:rgba(245,158,11,.1);color:var(--warn);border-color:rgba(245,158,11,.24)}
.chip.bad{background:rgba(239,68,68,.1);color:var(--bad);border-color:rgba(239,68,68,.26)}
.chip.pri{background:rgba(176,70,40,.11);color:var(--pri);border-color:rgba(176,70,40,.26)}
.chip.vio{background:rgba(143,55,32,.11);color:var(--vio);border-color:rgba(143,55,32,.26)}
.card{background:var(--card);border:1px solid var(--border);border-radius:var(--rx)}
.ch{display:flex;align-items:flex-start;gap:12px;padding:20px 24px 0}
.ch h3{font-size:18px}
.ch .sub{font-size:12px;color:var(--mute);margin-top:4px;max-width:70ch;line-height:1.5}
.ch .rt{margin-left:auto;font-size:11px;color:var(--mute2);white-space:nowrap;display:flex;gap:8px;align-items:center}
.cb{padding:20px 24px 20px}
.bar{height:7px;border-radius:99px;background:var(--card3);overflow:hidden}
.bar i{display:block;height:100%;border-radius:99px;background:var(--pri)}
table{width:100%;border-collapse:collapse;font-size:13px}
th{font-size:10px;font-weight:500;color:var(--mute2);letter-spacing:.06em;text-transform:uppercase;
  text-align:left;padding:10px 12px;border-bottom:1px solid var(--border);white-space:nowrap}
td{padding:10px 12px;border-bottom:1px solid var(--border);vertical-align:middle}
tbody tr:last-child td{border-bottom:0}
tbody tr:hover{background:rgba(255,255,255,.018)}
td.n,th.n{text-align:right;font-family:var(--mono);font-size:12px}
.tw{overflow-x:auto}
/* Cards size to their own content. Stretching them to a common height leaves
   the shorter one with a block of dead space under its last row, which reads
   as missing data rather than as a shorter list. */
.g2{display:grid;grid-template-columns:1fr 1fr;gap:16px;align-items:start}
.g3{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}
.g4{display:grid;grid-template-columns:repeat(4,1fr);gap:16px}
@media(max-width:1180px){.g4{grid-template-columns:repeat(2,1fr)}}
@media(max-width:1000px){.g2,.g3{grid-template-columns:1fr}}
@media(max-width:640px){.g4{grid-template-columns:1fr}}
/* Sayılar Rankzup'ta BÜYÜK ve İNCE; etiket küçük, harf aralığı geniş.
   Pleqo tersini yapıyor: küçük ve kalın sayı, sıkışık etiket. Rankzup'ın
   oranı sayıyı ekranın odağı yapıyor — bu bir ölçüm aracı, sayı öne çıkmalı. */
.kpi{background:var(--card);border:1px solid var(--border);border-radius:var(--rx);padding:20px 20px}
.kpi .t{font-size:10px;color:var(--mute);font-weight:500;display:flex;align-items:center;gap:6px;
  text-transform:uppercase;letter-spacing:.09em}
.kpi .t i{width:7px;height:7px;border-radius:99px;display:block}
.kpi .v{font-size:36px;font-weight:400;letter-spacing:-.045em;margin-top:8px;line-height:1.05}
.kpi .d{font-size:12px;color:var(--mute);margin-top:6px;line-height:1.55}
.empty{padding:48px 20px;text-align:center;color:var(--mute);font-size:13px}
.empty .ic{width:48px;height:48px;border-radius:16px;background:var(--card2);color:var(--pri);
  display:grid;place-items:center;font-size:20px;margin:0 auto 14px;border:1px solid var(--border)}
code{font-family:var(--mono);font-size:11px;background:var(--muted);border:1px solid var(--border);
  border-radius:4px;padding:1px 4px;color:var(--pri)}
pre{background:var(--bg);border:1px solid var(--border);color:var(--fg2);padding:14px 16px;border-radius:var(--r);
  font-family:var(--mono);font-size:12px;overflow-x:auto;margin:0;line-height:1.75;white-space:pre-wrap;word-break:break-word}

/* ---------- onboarding ---------- */
#ob{min-height:100vh;display:none;flex-direction:column}
#ob.on{display:flex}
.ob-top{height:64px;border-bottom:1px solid var(--border);display:flex;align-items:center;padding:0 24px;gap:14px;
  position:sticky;top:0;background:rgba(247,244,237,.85);backdrop-filter:blur(14px);z-index:20}
.ob-top .r{margin-left:auto;display:flex;align-items:center;gap:12px;font-size:13px;color:var(--mute)}
.ob-dots{display:flex;gap:4px}
.ob-dots i{width:7px;height:7px;border-radius:99px;background:var(--card3);display:block}
.ob-dots i.on{background:var(--pri)}
.ob-prog{height:3px;background:var(--card2)}
.ob-prog i{display:block;height:100%;background:linear-gradient(90deg,var(--pri),var(--vio));transition:width .4s}
.stepper{display:flex;justify-content:center;gap:0;padding:24px 20px 6px;flex-wrap:wrap}
.st{display:flex;align-items:center}
.st .n{width:30px;height:30px;border-radius:99px;display:grid;place-items:center;font-size:12px;font-weight:600;
  background:var(--card2);color:var(--mute);border:1px solid var(--border2)}
.st.on .n{background:var(--pri-btn);color:#fff;border-color:var(--pri-btn);box-shadow:0 0 0 5px rgba(176,70,40,.16)}
.st.dn .n{background:var(--pri-btn);color:#fff;border-color:var(--pri-btn)}
.st .lb{font-size:11px;color:var(--mute);position:absolute;margin-top:48px;transform:translateX(-50%);white-space:nowrap}
.st.on .lb,.st.dn .lb{color:var(--fg);font-weight:500}
.st .ln{width:clamp(24px,5vw,66px);height:1px;background:var(--border2);margin:0 4px}
.st.dn .ln{background:var(--pri-btn)}
.ob-body{flex:1;display:grid;place-items:start center;padding:56px 20px 56px}
.ob-card{width:100%;max-width:600px;text-align:center}
.ob-ic{width:62px;height:62px;border-radius:16px;background:rgba(176,70,40,.11);border:1px solid rgba(176,70,40,.24);
  display:grid;place-items:center;font-size:24px;margin:0 auto 16px}
.ob-card h2{font-size:30px;margin-bottom:8px}
.ob-card .lead{color:var(--mute);font-size:14px;max-width:52ch;margin:0 auto 32px}
.ob-form{text-align:left}
.info{border:1px solid rgba(176,70,40,.22);background:rgba(176,70,40,.05);border-radius:var(--rl);padding:16px 16px;
  font-size:13px;color:var(--fg2);text-align:left;margin-bottom:20px}
.info ul{margin:12px 0 0;padding-left:16px;color:var(--mute);font-size:13px}
.info li{margin-bottom:4px}
.sugg{border:1px dashed var(--border2);border-radius:var(--rl);padding:20px;text-align:center;margin-bottom:16px}
.taglist{display:flex;gap:8px;flex-wrap:wrap}
.tagx{display:inline-flex;align-items:center;gap:8px;padding:8px 12px;min-height:34px;border-radius:999px;background:var(--card2);
  border:1px solid var(--border2);font-size:13px}
.tagx button{background:none;border:0;color:var(--mute);font-size:14px;line-height:1;
  width:30px;height:30px;display:grid;place-items:center;border-radius:8px;margin:-7px -8px -7px 0}
.tagx button:hover{background:rgba(239,68,68,.14)}
.tagx button:hover{color:var(--bad)}
.tagx.pick{cursor:pointer}
.tagx.pick:hover{border-color:var(--pri);background:rgba(176,70,40,.09)}
.rivrow{margin-bottom:14px}
.rivrow .hd{display:flex;align-items:center;font-size:12px;color:var(--mute);margin-bottom:6px}
.rivrow .hd button{margin-left:auto;background:none;border:0;color:var(--mute);font-size:14px;
  width:30px;height:30px;display:grid;place-items:center;border-radius:8px;margin:-6px -6px -6px 0}
.rivrow .hd button:hover{background:rgba(239,68,68,.14);color:var(--bad)}
.rivrow .in2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
@media(max-width:560px){.rivrow .in2{grid-template-columns:1fr}}
.qitem{display:flex;align-items:flex-start;gap:12px;padding:12px 14px;border:1px solid var(--border);border-radius:var(--r);
  margin-bottom:8px;background:var(--card);cursor:pointer;transition:.14s}
.qitem:hover{border-color:var(--border2)}
.qitem.on{border-color:rgba(176,70,40,.45);background:rgba(176,70,40,.06)}
.qbox{width:19px;height:19px;border-radius:4px;border:1px solid var(--border2);flex:none;display:grid;place-items:center;
  font-size:11px;margin-top:1px;color:transparent}
.qitem.on .qbox{background:var(--pri-btn);border-color:var(--pri-btn);color:#fff}
.qitem span{font-size:13px;text-align:left}
.done-row{display:flex;align-items:center;gap:10px;padding:12px 16px;border:1px solid var(--border);border-radius:var(--r);
  margin-bottom:10px;background:var(--card);font-size:13px;text-align:left}
.done-row .d{width:22px;height:22px;border-radius:99px;display:grid;place-items:center;font-size:11px;flex:none}
.ob-nav{display:flex;gap:12px;margin-top:24px}
.ob-nav .btn{flex:1}

/* ---------- app shell ---------- */
#app{display:none;min-height:100vh}
#app.on{display:grid;grid-template-columns:300px minmax(0,1fr)}
#sb{border-right:1px solid var(--border);background:var(--bg);padding:14px 12px;display:flex;flex-direction:column;gap:12px;
  height:100vh;position:sticky;top:0;overflow-y:auto}
.sb-logo{display:flex;align-items:center;gap:8px;font-weight:600;font-size:16px;padding:4px 8px 12px;border-bottom:1px solid var(--border)}
.mk{width:27px;height:27px;border-radius:8px;flex:none;background:var(--pri-btn);
  display:grid;place-items:center;color:#fff;font-size:12px;font-weight:700}
/* =====================================================================
   SIDEBAR
   =====================================================================
   Written against one question: does this look like it belongs to a company
   that has been doing this for a decade, or to a side project.
   The answer is mostly restraint. Enterprise tools earn their weight with
   structure and discipline — a spine the eye can follow, hairlines instead
   of cards, tabular figures, tight uppercase eyebrows — not with rounded
   gradient tiles, which are the single clearest tell of a young product.
   So: no gradients, radii down from 12px to 5px, one accent, and a rule
   running the height of the navigation that every item hangs off.
   ===================================================================== */
#sb{padding:0;gap:0;background:var(--bg2);border-right:1px solid var(--card3)}

/* --- Zone 1: identity ------------------------------------------------- */
.sb-id{padding:16px 16px 16px;border-bottom:1px solid var(--card3);background:var(--bg2)}
.sb-logo{display:flex;align-items:center;gap:8px;padding:0 2px 14px;border:0}
.mk{width:30px;height:30px;border-radius:6px;flex:none;background:var(--pri-btn);
  display:grid;place-items:center;color:#fff;font-size:14px;font-weight:700;letter-spacing:-.02em}
.sb-logo .wm{font-size:16px;font-weight:700;letter-spacing:.08em;color:var(--fg)}

/* Client selector. Square corners and a monogram plate rather than a rounded
   avatar: this is a record being selected, not a person being greeted. */
.sb-ws{display:flex;align-items:center;gap:10px;width:100%;min-width:0;text-align:left;
  background:var(--card);border:1px solid var(--border);border-radius:8px;padding:10px 10px;color:var(--fg)}
.sb-ws:hover{border-color:var(--border2);background:var(--card2)}
.sb-ws .sq{width:36px;height:36px;border-radius:6px;flex:none;display:grid;place-items:center;
  font-size:14px;font-weight:700;color:var(--pri);background:var(--card3);border:1px solid var(--border2)}
.sb-ws .wt{min-width:0;display:grid;flex:1;gap:2px}
.sb-ws .wt b{font-size:16px;font-weight:600;letter-spacing:-.01em;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sb-ws .wt i{font-style:normal;font-size:12px;color:var(--mute);letter-spacing:.01em;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sb-ws .cv{flex:none;width:14px;height:14px;color:var(--mute2)}
.sb-ws .cv svg{width:100%;height:100%;display:block}

/* The reading, as a meter. A number with a track behind it states a position
   on a scale; the same number in a sentence states nothing. */
.sb-meter{margin-top:12px}
.sb-meter .mrow{display:flex;align-items:baseline;gap:8px;margin-bottom:6px}
.sb-meter .ml{font-size:11px;font-weight:700;letter-spacing:.13em;color:var(--mute2)}
.sb-meter .mu{font-family:var(--mono);font-size:10px;color:var(--mute2);margin-left:2px}
.sb-meter .mv{margin-left:auto;font-family:var(--mono);font-variant-numeric:tabular-nums;
  font-size:18px;font-weight:600;letter-spacing:-.025em;color:var(--fg)}
.sb-meter .mtrack{height:3px;border-radius:4px;background:var(--card2);overflow:hidden}
.sb-meter .mtrack i{display:block;height:100%;width:0;background:var(--pri-btn);transition:width .45s ease}
.sb-meter .mtrack i.mid{background:var(--warn)}
.sb-meter .mtrack i.bad{background:var(--bad)}
.sb-meter .pill{display:flex;align-items:center;gap:6px;margin-top:10px;
  font-size:12px;color:var(--mute);min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sb-meter .dot{width:5px;height:5px;border-radius:50%;flex:none;background:var(--mute2)}
.sb-meter .dot.ok{background:var(--ok)}
.sb-meter .dot.bad{background:var(--bad)}
.sb-meter .dot.run{background:var(--pri-btn);animation:pulse 1.4s ease-in-out infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.3}}

/* --- Workspace menu --------------------------------------------------- */
.sb-wswrap{position:relative}
.wsmenu{display:none}

/* --- Zone 2: navigation ----------------------------------------------
   Every item hangs off a single rule running the height of the column. The
   active marker sits on that rule rather than floating beside it, which is
   what turns a list of links into a structure. */
.nav{display:grid;gap:1px;padding:14px 16px 10px;position:relative}
.nav::before{content:"";position:absolute;left:9px;top:18px;bottom:14px;width:1px;background:var(--border)}
.nav .sec{font-size:11px;font-weight:700;letter-spacing:.13em;color:var(--mute2);
  padding:16px 0 8px 24px;position:relative}
.nav .sec:first-child{padding-top:2px}
.nav a{position:relative;display:flex;align-items:center;gap:12px;padding:10px 10px 10px 24px;
  border-radius:6px;font-size:14px;color:var(--mute);width:100%;line-height:1.35;letter-spacing:-.005em}
.nav a:hover{color:var(--fg);background:var(--card)}
.nav a.on{background:var(--card3);color:var(--fg);font-weight:500}
/* The marker sits on the spine, covering it — the rule and the active
   state are the same line, which is what makes the column read as one
   structure instead of two decorations. */
.nav a.on::before{content:"";position:absolute;left:8px;top:6px;bottom:6px;width:3px;
  border-radius:4px;background:var(--pri-btn)}
.nav .g{width:20px;height:20px;flex:none;opacity:.62;stroke-width:1.7}
.nav a:hover .g{opacity:.85}
.nav a.on .g{opacity:1;color:var(--pri)}
.nav a span{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
/* Volume, in tabular figures. A tool that shows how much is inside each
   section looks like a tool with something inside it. */
.nav .ct{flex:none;font-family:var(--mono);font-variant-numeric:tabular-nums;
  font-size:12px;color:var(--mute2)}
.nav a.on .ct,.nav a:hover .ct{color:var(--mute)}

/* --- Foot: status bar -------------------------------------------------- */
.sb-foot{margin-top:auto;display:grid;gap:0;border-top:1px solid var(--card3);background:var(--bg2)}
.plan-row{display:flex;align-items:center;gap:8px;padding:12px 16px;font-size:13px;background:var(--bg2);
  color:var(--fg);border-bottom:1px solid var(--card3)}
.plan-row:hover{background:var(--card)}
.plan-row .pd{width:5px;height:5px;border-radius:50%;background:var(--ok);flex:none}
.plan-row b{font-weight:600;letter-spacing:.02em}
.plan-row .mn{margin-left:auto;font-size:11px;color:var(--mute2)}
.trial{padding:12px 14px;border-bottom:1px solid var(--card3);background:var(--card)}
.trial .tr-top{display:flex;align-items:baseline;gap:8px;margin-bottom:6px}
.trial .tr-top b{font-size:13px;font-weight:600}
.trial .tr-d{margin-left:auto;font-family:var(--mono);font-size:11px;color:var(--mute)}
.trial .tr-bar{height:3px;border-radius:4px;background:var(--card2);overflow:hidden}
.trial .tr-bar i{display:block;height:100%;background:var(--pri-btn);transition:width .4s ease}
.trial .btn{border-radius:4px;font-size:12px;padding:8px 12px;background:var(--pri-btn);border-color:var(--pri-btn)}
.trial .btn{margin-top:10px}
.sb-acct{display:flex;align-items:center;gap:10px;min-width:0;padding:10px 16px;background:var(--bg2)}
.sb-acct .av{width:34px;height:34px;border-radius:6px;flex:none;display:grid;place-items:center;
  font-size:11px;font-weight:700;color:var(--pri);background:var(--card3);border:1px solid var(--border2)}
.sb-acct .who{min-width:0;display:grid;flex:1;gap:1px}
.sb-acct .who b{font-size:13px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sb-acct .who i{font-style:normal;font-size:10px;color:var(--mute2);
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sb-acct .ics{display:flex;gap:2px;flex:none}
/* The two controls at the foot are the ones a user reaches for least often
   and needs most reliably. At 26px with a 14px glyph they were a smaller tap
   target than anything else in the column. */
.sb-acct .ics button{width:34px;height:34px;display:grid;place-items:center;border-radius:8px;
  background:none;border:0;color:var(--mute);padding:0}
.sb-acct .ics button:hover{color:var(--fg);background:var(--card3)}
.sb-acct .ics svg{width:18px;height:18px;display:block}
.sb-fb{display:none}
/* Workspace switcher — anchored to the button so it reads as belonging to it
   rather than floating over the nav. */
.apphead{display:flex;align-items:center;gap:14px;padding:14px 24px 0;justify-content:flex-end}
.apphead .hs{font-size:12px;color:var(--mute)}
.apphead .hs b{color:var(--fg);font-weight:600}
.apphead .btn{padding:8px 16px;font-size:13px}
.apphead .btn:disabled{opacity:.55}
@media(max-width:720px){.apphead{padding:10px 16px 0}}
.qm{width:15px;height:15px;border-radius:50%;border:1px solid var(--border);background:var(--card2);
  color:var(--mute2);font-size:10px;line-height:1;display:inline-grid;place-items:center;margin-left:4px;
  vertical-align:middle;padding:0}
.qm:hover{color:var(--fg);border-color:var(--mute2)}
.sb-wswrap{position:relative}
.wsmenu{display:none}
.wsmenu.open{display:block;position:absolute;left:0;right:0;top:calc(100% + 6px);z-index:60;
  background:var(--card);border:1px solid var(--border2);border-radius:12px;padding:4px;
  box-shadow:0 16px 40px rgba(0,0,0,.5)}
/* Only the list scrolls; the add row stays pinned under it. */
.wsmenu .list{max-height:264px;overflow-y:auto}
.wsmenu .add{display:flex;align-items:center;gap:8px;color:var(--pri);font-weight:500}
.wsmenu .add .pl{width:22px;height:22px;border-radius:6px;border:1px dashed var(--border2);
  display:grid;place-items:center;font-size:13px;color:var(--pri);flex:none}
.wsmenu .add:hover .pl{border-style:solid}
.wsmenu button{display:flex;align-items:center;gap:8px;width:100%;text-align:left;background:none;
  border:0;border-radius:8px;padding:8px 8px;color:var(--fg);font-size:12px}
.wsmenu button:hover{background:rgba(26,23,19,.04)}
.wsmenu button.on{background:rgba(176,70,40,.12)}
.wsmenu .sq{width:22px;height:22px;border-radius:6px;background:rgba(176,70,40,.16);
  display:grid;place-items:center;font-size:11px;font-weight:700;flex:none}
.wsmenu .t{min-width:0;display:grid}
.wsmenu .t b{font-size:12px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.wsmenu .t i{font-style:normal;font-size:10px;color:var(--mute2);overflow:hidden;
  text-overflow:ellipsis;white-space:nowrap}
.wsmenu .ck{margin-left:auto;color:var(--pri);font-size:11px}
.wsmenu .sep{height:1px;background:var(--border);margin:4px 2px}
.wsmenu .add{color:var(--mute)}
.wsmenu .cnt{margin-left:auto;font-size:10px;color:var(--mute2)}

/* Scan strip. Freshness is the first question a returning user has, so it sits
   above the nav rather than buried on the dashboard. */
.sb-scan{display:flex;align-items:center;gap:8px;margin:10px 0 4px}
.sb-scan .pill{display:flex;align-items:center;gap:6px;font-size:11px;color:var(--mute);
  min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;flex:1}
.sb-scan .dot{width:7px;height:7px;border-radius:50%;flex:none;background:var(--mute2)}
.sb-scan .dot.ok{background:var(--ok)}
.sb-scan .dot.bad{background:var(--bad)}
.sb-scan .dot.run{background:var(--pri);animation:pulse 1.4s ease-in-out infinite}
.sb-scan .dot.idle{background:var(--mute2)}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.35}}
.sb-scan button{flex:none;font-size:11px;padding:4px 8px}
.sb-scan button:disabled{opacity:.5}
.sb-foot{margin-top:auto;display:grid;gap:10px;padding-top:10px}
/* Provenance line: what was measured and when. */
/* The queue is drained by this page. Saying otherwise was not a phrasing
   choice, it was wrong: /api/cron/drain exists but is not scheduled, so
   nothing else picks the work up while the tab is closed. */
.keepopen{display:inline-flex;align-items:center;gap:6px;margin-top:16px;
  font-size:12px;color:var(--warn);background:rgba(245,158,11,.1);
  border:1px solid rgba(245,158,11,.25);border-radius:8px;padding:8px 14px}
.keepopen b{font-family:var(--mono);font-variant-numeric:tabular-nums;color:var(--warn)}

/* --- Aksiyon Merkezi --- */
/* Ölç → Düzelt → Uygula şeridi. Kullanıcıya hangi aşamada olduğunu söyler:
   ölçüm bitti, sıra düzeltmede. */
.flow{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:14px;
  background:var(--card);border:1px solid var(--border);border-radius:8px;padding:10px 16px}
.flow .fs{font-size:12px;padding:4px 12px;border-radius:16px;
  border:1px solid var(--border2);color:var(--mute2);white-space:nowrap}
.flow .fs.on{background:rgba(176,70,40,.14);border-color:rgba(176,70,40,.34);color:var(--pri)}
.flow i{color:var(--mute2);font-style:normal}
.flow .fx{margin-left:auto;font-size:12px;color:var(--mute2)}

.actfil{display:flex;gap:6px;flex-wrap:wrap;margin:0 0 12px}
.actfil button{display:inline-flex;align-items:center;gap:6px;font-size:12px;color:var(--mute);
  background:var(--card2);border:1px solid var(--border);border-radius:8px;padding:6px 12px}
.actfil button:hover{color:var(--fg);border-color:var(--border2)}
.actfil button.on{background:rgba(176,70,40,.1);border-color:rgba(176,70,40,.28);color:#7A2E19}
.actfil button b{font-family:var(--mono);font-size:11px;color:var(--mute2)}
.actfil button.on b{color:var(--pri)}

/* Kartlar. Sol kenar rengi önceliği taşır — otuz kartı okumadan taramanın
   tek yolu. Rozet de var ama renk daha hızlı okunuyor. */
.acts{display:grid;gap:10px}
.act{background:var(--card);border:1px solid var(--border);border-left:3px solid var(--border2);
  border-radius:0 12px 12px 0;padding:14px 16px}
.act.high{border-left-color:var(--bad)}
.act.mid{border-left-color:var(--warn)}
.act.low{border-left-color:var(--border2)}
.act .ah{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:8px}
.act .ah .ic{width:24px;height:24px;border-radius:6px;flex:none;display:grid;place-items:center;
  font-size:12px;background:var(--card2);color:var(--mute)}
.act.high .ah .ic{background:rgba(239,68,68,.14);color:var(--bad)}
.act.mid .ah .ic{background:rgba(245,158,11,.14);color:var(--warn)}
.act .ah b{font-size:14px;font-weight:600;color:var(--fg);letter-spacing:-.015em;flex:1;min-width:220px}
.act .sv{font-size:10px;padding:2px 8px;border-radius:6px;white-space:nowrap;
  background:var(--card2);color:var(--mute2);border:1px solid var(--border)}
.act .sv.high{background:rgba(185,28,28,.11);color:#9B1414;border-color:transparent}
.act .sv.mid{background:rgba(180,83,9,.12);color:#8A3F07;border-color:transparent}
.act .kind{display:inline-block;font-size:10px;padding:2px 8px;border-radius:4px;
  background:var(--card2);color:var(--mute);border:1px solid var(--border);margin-bottom:8px}
.act p{font-size:13px;line-height:1.7;color:var(--mute)}
.act .aa{display:flex;align-items:center;gap:14px;flex-wrap:wrap;margin-top:12px}
.act .lnk{background:none;border:0;padding:0;font-size:12px;color:var(--pri)}
.act .lnk:hover{text-decoration:underline}

/* --- Algı ekranı --- */
/* Sıfat bulutu. Boyut değil renk kodluyor: sıklık zaten sayı olarak yazılı,
   ve büyüyen yazı tipi okumayı zorlaştırıp sıralamayı belirsizleştiriyor. */
.adjs{display:flex;flex-wrap:wrap;gap:6px;padding:2px}
.adj{display:inline-flex;align-items:center;gap:6px;font-size:12px;padding:6px 10px;
  border-radius:8px;border:1px solid var(--border);background:var(--card2);color:var(--fg2)}
.adj i{font-style:normal;font-family:var(--mono);font-size:10px;color:var(--mute2)}
.adj.ok{background:rgba(74,222,128,.11);border-color:transparent;color:var(--ok)}
.adj.ok i{color:var(--ok)}
.adj.bad{background:rgba(248,113,113,.11);border-color:transparent;color:var(--bad)}
.adj.bad i{color:var(--bad)}

/* Rakip algı kıyası */
.prcv{display:grid;gap:2px}
.prc{display:grid;grid-template-columns:minmax(0,1fr) 1.3fr 46px 82px;align-items:center;gap:10px;
  padding:8px 8px;border-radius:8px}
.prc:hover{background:var(--card2)}
.prc.me{background:rgba(176,70,40,.09);box-shadow:inset 0 0 0 1px var(--border2)}
.prc .nm{font-size:12px;color:var(--fg2);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.prc.me .nm{color:var(--pri);font-weight:500}
.prc .nm i{font-style:normal;font-size:10px;background:rgba(176,70,40,.2);color:#7A2E19;
  padding:2px 6px;border-radius:4px;margin-left:6px}
.prc .bar{display:block;height:7px;border-radius:4px;background:var(--card2);
  border:1px solid var(--border);overflow:hidden}
.prc .bar i{display:block;height:100%;border-radius:4px;background:var(--ok);min-width:2px}
.prc.me .bar i{background:var(--pri)}
.prc .vv{text-align:right;font-family:var(--mono);font-size:12px;color:var(--fg)}
.prc .mn{text-align:right;font-size:10px;color:var(--mute2);white-space:nowrap}

/* Ton grafiği açıklaması */
.tlegend{display:flex;gap:16px;justify-content:center;margin-top:12px;font-size:11px;color:var(--mute)}
.tlegend span{display:inline-flex;align-items:center;gap:6px}
.tlegend i{width:9px;height:9px;border-radius:4px;display:inline-block}

/* Örnek geçişler. Sol kenar rengi tonu taşır — on iki kartı okumadan
   taramanın tek yolu bu. */
.psamp{display:grid;gap:8px}
.ps{border:1px solid var(--border);border-left:3px solid var(--border2);border-radius:0 9px 9px 0;
  padding:12px 14px;cursor:pointer;background:var(--card2)}
.ps:hover{border-color:var(--border2);background:var(--card3,var(--card2))}
.ps.ok{border-left-color:var(--ok)}
.ps.bad{border-left-color:var(--bad)}
.ps.mid{border-left-color:var(--border2)}
.ps .ph{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:8px}
.ps .ph .q{font-size:11px;color:var(--mute2);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ps p{font-size:13px;line-height:1.65;color:var(--fg2)}

.kpi .v.ok{color:var(--ok)}
.kpi .v.bad{color:var(--bad)}

/* --- Opportunities --- */
/* Absent is a different kind of row from "covered a bit", so it gets a word
   rather than a 0% the eye slides past. */
.ocov{font-family:var(--mono);font-size:12px}
.ocov.none{color:var(--bad)}
.ocov.part{color:var(--warn)}
.ocov.good{color:var(--ok)}
/* The opportunity number carries its own bar, so the column ranks itself. */
.oscore{position:relative;display:inline-block;min-width:34px;text-align:right;
  font-family:var(--mono);font-weight:600;color:var(--fg);padding-bottom:4px}
.oscore::after{content:"";position:absolute;left:0;right:0;bottom:0;height:3px;border-radius:4px;
  background:linear-gradient(90deg,var(--pri) var(--w),transparent var(--w))}
.otbl td b{font-weight:500;color:var(--fg)}
.otbl tbody tr:hover td{background:rgba(255,255,255,.025)}

/* --- Audit page --- */
/* Status as a glyph in a fixed slot: forty-eight rows scan faster by shape
   than by reading "Pass / Partial / Fail" on each one. */
.frow{display:flex;gap:10px;align-items:flex-start;padding:10px 0;border-bottom:1px solid var(--border)}
.frow:last-child{border-bottom:0}
.fst{width:20px;height:20px;border-radius:6px;flex:none;display:grid;place-items:center;
  font-size:11px;font-weight:700}
.fst.pass{background:rgba(74,222,128,.14);color:var(--ok)}
.fst.partial{background:rgba(251,191,36,.14);color:var(--warn)}
.fst.fail{background:rgba(248,113,113,.14);color:var(--bad)}
.fn{flex:1;min-width:0;font-size:13px;color:var(--fg2);display:grid;gap:2px}
.fn i{font-style:normal;font-size:11px;color:var(--mute2)}
.acc-h h5{font-size:13px;font-weight:600;margin:0;color:var(--fg)}
.acc-h .sb2{font-size:11px;color:var(--mute2);margin-top:2px}

/* --- Sources page --- */
/* Your own row is the one the reader came to find, so it is marked on the
   frame rather than tinted like every other highlight in the app. */
.stbl tr.me td{background:rgba(176,70,40,.08)}
.stbl tr.me td:first-child{box-shadow:inset 3px 0 0 var(--pri)}
.stbl tbody tr:hover td{background:rgba(255,255,255,.03)}
.stbl tr.me:hover td{background:rgba(176,70,40,.12)}
.stbl .rk{color:var(--mute2);font-family:var(--mono)}
.stbl .dn{display:flex;align-items:center;gap:8px;min-width:0}
.stbl .dn b{font-weight:500;color:var(--fg);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.stbl tr.me .dn b{color:var(--pri)}
.stbl .fav{width:22px;height:22px;border-radius:6px;flex:none;display:grid;place-items:center;
  font-size:10px;font-weight:700;color:var(--fg);background:rgba(255,255,255,.07);border:1px solid var(--border2)}
.stbl .fav.me{background:rgba(176,70,40,.2);border-color:rgba(176,70,40,.42);color:var(--pri)}
.stbl .tagme{font-size:10px;padding:2px 6px;border-radius:4px;flex:none;
  background:rgba(176,70,40,.2);color:var(--pri)}
.stbl .sbar{display:block;height:8px;border-radius:4px;background:var(--card2);
  border:1px solid var(--border);overflow:hidden}
.stbl .sbar i{display:block;height:100%;border-radius:99px;background:var(--pri);min-width:2px}
.stbl tr.me .sbar i{background:var(--pri-btn)}
.stbl .cnt{font-family:var(--mono);font-variant-numeric:tabular-nums;font-weight:600;color:var(--fg)}
.stbl .more{font-size:10px;color:var(--mute2);margin-left:4px}
.stbl .mut{color:var(--mute2)}
/* Direction of travel, from the second half of the window against the first.
   The old arrow was hardcoded to point up on every row. */
.sdelta{font-family:var(--mono);font-size:11px;white-space:nowrap}
.sdelta.up{color:var(--ok)}
.sdelta.dn{color:var(--bad)}
.sdelta.flat,.sdelta.new{color:var(--mute2)}

.srcwarn{display:flex;align-items:center;gap:14px;flex-wrap:wrap;margin-bottom:14px;
  background:var(--card);border:1px solid var(--border);border-left:3px solid var(--warn);
  border-radius:12px;padding:14px 16px}
.srcwarn.ok{border-left-color:var(--pri)}
.srcwarn b{font-size:14px;font-weight:600;color:var(--fg);letter-spacing:-.015em}
.srcwarn span{flex:1;min-width:240px;font-size:12px;line-height:1.65;color:var(--mute)}
.srcwarn button{flex:none;border:1px solid var(--border2);background:var(--card2);color:var(--fg2);
  border-radius:8px;padding:8px 14px;font-size:12px;font-weight:500}
.srcwarn button:hover{border-color:var(--pri);color:var(--pri)}

/* İşaretleme kısayolu: unknown satırının tek eylemi. */
.marklink{background:none;border:0;padding:0;font-size:12px;color:var(--vio);text-align:left}
.marklink:hover{color:var(--pri);text-decoration:underline}

/* Türü seçtiren modal. Seçenekler taksonominin iç adlarıyla değil,
   kullanıcının siteye bakınca kendine soracağı soruyla yazıldı. */
.markopts{display:grid;gap:6px}
.markopts button{display:grid;gap:2px;text-align:left;padding:10px 12px;border-radius:8px;
  border:1px solid var(--border);background:var(--card2);color:var(--fg);width:100%}
.markopts button:hover{border-color:var(--pri);background:rgba(176,70,40,.07)}
.markopts b{font-size:13px;font-weight:500}
.markopts i{font-style:normal;font-size:11px;color:var(--mute2)}

/* Ölçüm uyarısı. Rankzup bunu panelin en üstünde tutuyor ve haklı: müşteri
   skoru bir garanti sanıp ona göre bütçe ayırırsa, sonuçtan ürünü sorumlu
   tutar. Uyarı sayfa dibinde değil, sayının yanında olmalı. */
/* Dönem seçici — bağlı pill grubu.
   Açılır liste üç seçenek için bir tıklama fazla ve seçili olanı gizliyor;
   Rankzup pill kullanıyor ve doğru olan bu. */
.segp{display:inline-flex;background:var(--card2);border:1px solid var(--border);
  border-radius:99px;padding:2px;gap:2px}
.segp button{border:0;background:none;color:var(--mute);font-size:12px;
  padding:6px 14px;border-radius:99px;white-space:nowrap}
.segp button:hover{color:var(--fg)}
.segp button.on{background:var(--pri-btn);color:#fff;font-weight:500}
body.lt .segp button.on{color:#fff}

/* Kırıntı yolu + sayfa başlığı. Rankzup her sayfanın üstünde "Projeler /
   Marka" gösteriyor; çok markalı bir hesapta hangi markaya baktığını
   kaybetmemek için bu gerçekten gerekli. */
.crumb{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--mute2);margin-bottom:6px}
.crumb a{color:var(--mute)}
.crumb a:hover{color:var(--pri)}
.crumb i{font-style:normal;opacity:.5}

.aidisc{display:flex;align-items:flex-start;gap:10px;margin-bottom:14px;
  background:rgba(245,158,11,.07);border:1px solid rgba(245,158,11,.22);
  border-radius:8px;padding:10px 14px;font-size:12px;line-height:1.6;color:var(--mute)}
.aidisc .ic{color:var(--warn);flex:none;font-size:13px;line-height:1.5}
@media print{.aidisc{border-color:#ccc;background:none}}

.appfoot{margin-top:32px;padding:20px 2px 8px;border-top:1px solid var(--border);
  display:grid;gap:8px;font-size:11px;color:var(--mute2)}
.appfoot p{line-height:1.65;max-width:80ch}
.appfoot nav{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.appfoot nav a{color:var(--mute)}
.appfoot nav a:hover{color:var(--pri);text-decoration:underline}
.appfoot nav i{color:var(--border2);font-style:normal}

/* Kurulum analizi — adımlar tek tek görünür.
   Boş bir yükleniyor çemberi otuz saniyeyi bir dakika gibi hissettirir; ne
   yapıldığını göstermek beklemeyi kısaltmaz ama katlanılır kılar. */
.anabox{display:grid;gap:10px;padding:20px 4px 8px}
.anastep{display:flex;align-items:center;gap:10px;font-size:13px;color:var(--mute2)}
.anastep .d{width:20px;height:20px;border-radius:50%;flex:none;display:grid;place-items:center;
  font-size:11px;border:1.5px solid var(--border2);color:transparent}
.anastep.done{color:var(--fg2)}
.anastep.done .d{background:rgba(74,222,128,.16);border-color:transparent;color:var(--ok)}
.anastep.now{color:var(--fg)}
.anastep.now .d{border-color:var(--pri);border-right-color:transparent;
  animation:anaspin .8s linear infinite}
@keyframes anaspin{to{transform:rotate(360deg)}}

/* Rakip kaynağı: ölçümle mi bulundu, model mi tahmin etti. */
.rvsrc{font-size:10px;padding:2px 6px;border-radius:4px;margin-left:8px;white-space:nowrap}
.rvsrc.ai_answer{background:rgba(74,222,128,.13);color:var(--ok)}
.rvsrc.model{background:rgba(245,158,11,.13);color:var(--warn)}

/* Kaynak türü rozeti. Renk tek bir şeyi kodlar: girilebilir mi. */
.kchip{display:inline-block;font-size:11px;padding:2px 8px;border-radius:6px;white-space:nowrap;
  border:1px solid var(--border);background:var(--card2);color:var(--mute)}
.kchip.directory,.kchip.self_publish{background:rgba(21,128,61,.13);border-color:transparent;color:#116B33}
.kchip.review,.kchip.marketplace{background:rgba(176,70,40,.12);border-color:transparent;color:var(--pri)}
.kchip.publication,.kchip.authority{background:rgba(138,106,62,.13);border-color:transparent;color:#6F5430}
.kchip.community{background:rgba(245,158,11,.12);border-color:transparent;color:var(--warn)}
.kchip.vendor{background:rgba(185,28,28,.12);border-color:transparent;color:var(--bad)}
.stbl tr.blocked td{opacity:.72}
.stbl .todo{font-size:12px;color:var(--fg2)}
.stbl .eta{display:block;font-style:normal;font-size:10px;color:var(--mute2);margin-top:2px}
.stbl .noent{font-size:12px;color:var(--mute2);white-space:nowrap}

/* --- Platform page --- */
/* Loss bars. The length is what the gap costs the total score, so a heavy
   platform at 25 outranks a light one at 0 — which is the ordering an agency
   needs and the opposite of what a plain score list suggests. */
.plos{display:grid;gap:2px}
.pl-row{display:grid;grid-template-columns:170px 1fr 62px;grid-template-areas:"nm lb lv" "dt dt dt";
  align-items:center;gap:4px 12px;padding:10px 10px;border-radius:8px}
.pl-row:hover{background:rgba(255,255,255,.025)}
.pl-row .nm{grid-area:nm;display:flex;align-items:center;gap:8px;font-size:13px;color:var(--fg);min-width:0}
.pl-row .nm i{width:8px;height:8px;border-radius:4px;flex:none}
.pl-row .lb{grid-area:lb}
.pl-row .ltrack{display:block;height:9px;border-radius:4px;background:var(--card2);
  border:1px solid var(--border);overflow:hidden}
.pl-row .ltrack i{display:block;height:100%;border-radius:4px;min-width:2px}
.pl-row .lv{grid-area:lv;text-align:right;font-family:var(--mono);font-variant-numeric:tabular-nums;
  font-size:13px;font-weight:600;color:var(--bad)}
.pl-row .dt{grid-area:dt;font-size:11px;color:var(--mute2);padding-left:16px}

.pst{display:inline-flex;align-items:center;gap:6px;font-size:11px;white-space:nowrap;
  padding:4px 8px;border-radius:6px;border:1px solid var(--border);background:var(--card2);color:var(--mute)}
.pst i{width:6px;height:6px;border-radius:50%;flex:none;background:var(--border2)}
.pst.ok{color:var(--ok);background:rgba(74,222,128,.1);border-color:transparent}
.pst.ok i{background:var(--ok)}
.pst.warn{color:var(--warn);background:rgba(245,158,11,.1);border-color:transparent}
.pst.warn i{background:var(--warn)}
.pst.lock{color:var(--pri);background:rgba(176,70,40,.1);border-color:transparent}
.pst.lock i{background:var(--pri)}

.ptbl tr.ghost td{opacity:.6}
.ptbl tbody tr:hover td{background:rgba(255,255,255,.025)}
.ptbl .pn{display:flex;align-items:center;gap:8px;min-width:0}
.ptbl .pn i{width:9px;height:9px;border-radius:4px;flex:none}
.ptbl .pn b{font-weight:500;color:var(--fg)}
.ptbl .psc{display:flex;align-items:center;gap:10px}
.ptbl .psc .v{font-family:var(--mono);font-variant-numeric:tabular-nums;font-size:13px;
  font-weight:600;color:var(--fg);width:38px}
.ptbl .psc .bar{flex:1;display:block;height:7px;border-radius:4px;background:var(--card2);
  border:1px solid var(--border);overflow:hidden}
.ptbl .psc .bar i{display:block;height:100%;border-radius:4px}
/* Weight as a percentage. "0.34" is a coefficient; "%34" is a share, and a
   share is the thing the reader is actually being told. */
.ptbl .wcell{font-family:var(--mono);font-variant-numeric:tabular-nums;color:var(--fg2)}
.ptbl .mut{color:var(--mute2)}
.ptbl .upl{color:var(--pri);font-size:12px;font-weight:500}
.ptbl .ok{color:var(--ok)}
.ptbl .bad{color:var(--bad)}

/* Filters as chips, not a dropdown: the two questions asked on this page are
   "where are we missing" and "how did platform X do", and a menu adds a click
   to both every single visit. */
.mfil{display:flex;flex-direction:column;gap:8px;padding:14px 16px 4px}
.mfil .grp{display:flex;gap:6px;flex-wrap:wrap}
.mfil button{display:inline-flex;align-items:center;gap:6px;font-size:12px;color:var(--mute);
  background:var(--card2);border:1px solid var(--border);border-radius:8px;padding:6px 12px}
.mfil button:hover{color:var(--fg);border-color:var(--border2)}
.mfil button.on{background:rgba(176,70,40,.14);border-color:rgba(176,70,40,.35);color:var(--pri)}
.mfil button b{font-family:var(--mono);font-variant-numeric:tabular-nums;font-size:11px;
  color:var(--mute2);font-weight:600}
.mfil button.on b{color:var(--pri)}

.mtbl td{vertical-align:middle}
.mtbl .q b{font-weight:500;color:var(--fg)}
.mtbl tr.ghost td{opacity:.62}
.mtbl tr.ghost .q b{font-weight:400}
.mtbl tbody tr:hover td{background:rgba(255,255,255,.025)}
/* Present vs absent has to survive a squint down forty rows, so it gets a dot
   and a colour rather than a percentage the eye has to parse. */
.mst{display:inline-flex;align-items:center;gap:6px;font-size:12px;white-space:nowrap}
.mst i{width:7px;height:7px;border-radius:50%;flex:none}
.mst.in{color:#0E5828}
.mst.in i{background:var(--ok)}
.mst.out{color:var(--mute2)}
.mst.out i{background:var(--border2)}
.mst em{font-style:normal;font-family:var(--mono);font-size:11px;color:var(--mute)}
.rkb{display:inline-grid;place-items:center;min-width:24px;height:24px;padding:0 6px;border-radius:6px;
  font-family:var(--mono);font-size:12px;background:var(--card2);border:1px solid var(--border);color:var(--fg2)}
.rkb.top{background:rgba(74,222,128,.14);border-color:transparent;color:var(--ok)}
.cyes{color:var(--ok);font-size:14px}
.mtbl .mut{color:var(--mute2)}
.sent{display:inline-block;font-size:11px;padding:2px 8px;border-radius:6px;white-space:nowrap;
  border:1px solid var(--border);background:var(--card2);color:var(--mute)}
.sent.ok{background:rgba(21,128,61,.12);border-color:transparent;color:#0E5828}
.sent.mid{background:rgba(110,102,89,.12);border-color:transparent;color:#544C41}
.sent.bad{background:rgba(185,28,28,.11);border-color:transparent;color:#9B1414}
/* Score and its margin of error in one cell. Two columns made the reader
   compare a number with an unlabelled statistic sitting beside it. */
.mtbl .sc{white-space:nowrap}
.mtbl .sc b{font-family:var(--mono);font-variant-numeric:tabular-nums;font-size:13px;
  font-weight:600;color:var(--fg)}
.mtbl .sc i{font-style:normal;font-family:var(--mono);font-size:10px;color:var(--mute2);margin-left:6px}
.mnote{font-size:11px;color:var(--mute2);line-height:1.65;padding:14px 16px 16px;
  border-top:1px solid var(--border);margin-top:4px}

.ranline{display:flex;align-items:center;gap:16px;flex-wrap:wrap}
.ranline .rn{display:flex;align-items:center;gap:6px;font-size:11px;color:var(--mute2);white-space:nowrap}
.ranline .rn .d{width:6px;height:6px;border-radius:50%;background:var(--border2);flex:none}
.ranline .rn .d.ok{background:var(--ok)}
.ranline .rn b{font-family:var(--mono);font-variant-numeric:tabular-nums;
  font-size:11px;font-weight:500;color:var(--fg2)}
.ranline .rn em{font-style:normal;color:var(--mute2)}
@media(max-width:720px){.ranline{gap:10px}.ranline .rn em{display:none}}

.trial{border:1px solid var(--border);border-radius:12px;padding:12px;
  background:linear-gradient(160deg,rgba(176,70,40,.1),var(--card2))}
.trial .tr-top{display:flex;align-items:baseline;gap:8px;margin-bottom:8px}
.trial .tr-top b{font-size:12px;font-weight:600}
.trial .tr-d{margin-left:auto;font-size:11px;color:var(--mute2)}
.trial .tr-bar{height:4px;border-radius:99px;background:rgba(255,255,255,.07);overflow:hidden}
.trial .tr-bar i{display:block;height:100%;border-radius:99px;
  background:linear-gradient(90deg,var(--pri),var(--vio));transition:width .4s ease}
.main{min-width:0;background:var(--bg2)}
.mobbar{display:none;align-items:center;gap:12px;padding:12px 16px;border-bottom:1px solid var(--border);
  position:sticky;top:0;background:rgba(247,244,237,.9);backdrop-filter:blur(12px);z-index:50}
.page{padding:clamp(18px,2.6vw,34px);display:grid;gap:20px;align-content:start}
/* Sağdaki eylem alanı, başlık uzun olduğunda alt satıra düşüp sayfanın
   ortasında havada kalıyordu. Başlık bloğu artık esniyor ve eylemler
   sarıldığında da sağ kenara yaslanıyor. */
.ptitle{display:flex;align-items:flex-end;gap:16px 20px;flex-wrap:wrap;margin-bottom:4px}
.ptitle > div:first-child{flex:1 1 340px;min-width:0}
/* Başlık Rankzup'ta büyük ve normal ağırlıkta; Pleqo küçük ve kalın kullanıyor.
   Rankzup'ın oranı daha rahat okunuyor ve alt açıklamayı boğmuyor. */
.ptitle h1{font-size:30px;font-weight:600;letter-spacing:-.035em;line-height:1.15}
.ptitle .s{font-size:13px;color:var(--mute);margin-top:8px;max-width:78ch;line-height:1.65}
.ptitle .r{margin-left:auto;display:flex;gap:8px;flex-wrap:wrap;align-items:center;
  justify-content:flex-end;flex:0 0 auto}
.banner{display:flex;align-items:center;gap:12px;padding:12px 16px;border:1px solid rgba(176,70,40,.24);
  background:rgba(176,70,40,.06);border-radius:var(--rl);font-size:13px;color:var(--fg2)}
.banner .r{margin-left:auto}
.tabs{display:flex;gap:20px;border-bottom:1px solid var(--border);overflow-x:auto}
.tabs button{background:none;border:0;padding:10px 0;font-size:13px;color:var(--mute);border-bottom:2px solid transparent;white-space:nowrap}
.tabs button.on{color:var(--fg);border-bottom-color:var(--pri);font-weight:500}
.pills{display:flex;gap:6px;flex-wrap:wrap}
.pills button{padding:4px 10px;border-radius:999px;border:1px solid var(--border);background:var(--card);
  font-size:11px;color:var(--mute)}
.pills button.on{background:rgba(176,70,40,.16);color:var(--pri);border-color:rgba(176,70,40,.32)}
/* The insight card is the one place on the dashboard that argues rather than
   reports, so it is allowed to look different from every other card. Severity
   drives the colour: a critical finding in the same calm blue as an
   opportunity teaches the reader that colour means nothing here. */
.ins{border-radius:var(--rl);padding:20px;position:relative;overflow:hidden;min-height:250px;
  display:flex;flex-direction:column;
  background:linear-gradient(155deg,#5A2E1C,#8F3720 48%,#C25A32)}
.ins.crit{background:linear-gradient(155deg,#6B1220,#9E1B2E 48%,#C93044)}
.ins.warn{background:linear-gradient(155deg,#6E4A12,#9C6A17 48%,#C28A26)}
.ins.opp{background:linear-gradient(155deg,#14432F,#1B6B47 48%,#278F5F)}
.ins.good{background:linear-gradient(155deg,#2B3A2A,#3E5A3C 48%,#547A4F)}
.ins.wait{background:linear-gradient(155deg,#2A251F,#3A342C 50%,#4A4238)}
.ins::after{content:"";position:absolute;inset:0;pointer-events:none;
  background:radial-gradient(75% 55% at 12% 0%,rgba(255,255,255,.18),transparent 62%)}
.ins>*{position:relative;z-index:1}

.ins-top{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.ins .tg{background:rgba(255,255,255,.16);border:1px solid rgba(255,255,255,.26);border-radius:6px;
  padding:4px 10px;font-size:10px;font-weight:700;letter-spacing:.11em}
/* The number the sentence is about, pulled out so it registers before the
   prose does — a reader who only glances still leaves with the figure. */
.ins-m{margin-left:auto;display:flex;align-items:baseline;gap:6px;
  font-size:11px;color:rgba(255,255,255,.75)}
.ins-m b{font-size:30px;font-weight:700;letter-spacing:-.04em;color:#fff;line-height:1}

/* Kart zemini her iki temada da koyu bir gradyan; metin bu yüzden temadan
   bağımsız olarak beyaz. Renk belirtilmediğinde var(--fg) miras alınıyordu ve
   açık temada koyu metin koyu gradyanın üstüne düşüp okunmuyordu. */
.ins .hl{font-size:24px;font-weight:600;letter-spacing:-.035em;margin-top:16px;line-height:1.16;
  text-wrap:balance;color:#FFFFFF}
.ins,.ins .tg,.ins .ins-m{color:#FFFFFF}
.ins .tx{margin-top:10px;font-size:13px;line-height:1.7;color:rgba(255,255,255,.9)}
.ins-cta{margin-top:auto;align-self:flex-start;display:inline-flex;align-items:center;gap:8px;
  background:#fff;color:var(--pri-ink);border:0;border-radius:12px;padding:12px 20px;
  font-size:13px;font-weight:600;letter-spacing:-.01em;cursor:pointer;
  box-shadow:0 6px 22px rgba(0,0,0,.3);transition:transform .14s ease,box-shadow .14s ease}
.ins.crit .ins-cta{color:#6B1220}
.ins.warn .ins-cta{color:#5C3707}
.ins.opp  .ins-cta{color:#0E4B3A}
.ins.good .ins-cta{color:var(--pri-ink)}
.ins-cta:hover{transform:translateY(-1px);box-shadow:0 10px 28px rgba(0,0,0,.38)}
.ins-cta span{transition:transform .14s ease}
.ins-cta:hover span{transform:translateX(3px)}
.lock{display:flex;align-items:center;gap:8px;font-size:11px;color:var(--mute2)}
.locked-row{opacity:.42}
.pvr{margin-bottom:10px}
.pvr .l{display:flex;align-items:center;gap:8px;font-size:13px;font-weight:500;margin-bottom:6px}
.pvr .l .d{width:16px;height:16px;border-radius:4px;display:grid;place-items:center;font-size:10px;flex:none}
.pvr .l .v{margin-left:auto;font-size:13px;font-weight:600}
.pvr .l .v small{color:var(--mute2);font-weight:400;font-size:11px}
.mnt{border-left:2px solid var(--pri);background:rgba(255,255,255,.025);border-radius:0 9px 9px 0;padding:10px 12px;
  display:flex;align-items:center;gap:10px;margin-bottom:8px;cursor:pointer}
.mnt:hover{background:rgba(255,255,255,.05)}
.mnt .q{font-size:13px;color:var(--fg2)}
.mnt .ago{margin-left:auto;font-size:10px;color:var(--mute2);white-space:nowrap}
.cdr{display:grid;grid-template-columns:18px 22px 1fr auto;gap:10px;align-items:center;margin-bottom:10px}
.cdr .i{font-size:11px;color:var(--mute2);text-align:right}
.cdr .f{width:22px;height:22px;border-radius:6px;display:grid;place-items:center;font-size:10px;font-weight:700;color:#fff}
.cdr .n{font-size:13px}
.cdr .v{font-size:12px;font-weight:600}
.acc{border:1px solid var(--border);border-radius:var(--rl);margin-bottom:8px;background:var(--card);overflow:hidden}
/* Kategori satırı. Eskiden skor rozeti 26px'ti ve çubuk en sağa yaslanıyordu;
   arada okunacak hiçbir şey olmayan geniş bir boşluk kalıyordu. Skor asıl
   bilgi olduğu için büyütüldü, çubuk metnin hemen yanına çekildi. */
.acc-h{display:grid;grid-template-columns:46px minmax(0,1fr) 150px;gap:16px;align-items:center;
  padding:14px 16px;cursor:pointer;border-radius:12px}
.acc-h:hover{background:var(--card2)}
.acc-h .i{width:44px;height:44px;border-radius:12px;display:grid;place-items:center;
  font-size:16px;font-weight:600;font-family:var(--mono);letter-spacing:-.03em}
.acc-h h5{font-size:14px;font-weight:600}
.acc-h .sb2{font-size:12px;color:var(--mute);margin-top:2px}
.acc-h .m{display:flex;gap:6px;align-items:center;justify-content:flex-end}
.acc-h .m .bar{width:100%!important}
@media(max-width:640px){
  .acc-h{grid-template-columns:40px minmax(0,1fr);gap:12px}
  .acc-h .m{grid-column:1/-1;justify-content:stretch}
}
.acc-b{display:none;padding:0 16px 16px 56px;border-top:1px solid var(--border);padding-top:14px}
@media(max-width:700px){.acc-b{padding-left:16px}}
.acc.open .acc-b{display:block}
.acc-b p{font-size:13px;color:var(--mute);margin-bottom:10px}
.acc-b ol{margin:0 0 12px;padding-left:16px;font-size:13px;color:var(--fg2)}
.acc-b ol li{margin-bottom:4px}
.road{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}
@media(max-width:900px){.road{grid-template-columns:1fr}}
.road li{list-style:none;font-size:13px;padding:8px 0;border-bottom:1px dashed var(--border);display:grid;
  grid-template-columns:15px 1fr;gap:8px;color:var(--fg2)}
.road li:last-child{border-bottom:0}
.road li span{color:var(--pri);font-weight:700}
.tool-c{border:1px solid var(--border);border-radius:var(--rx);overflow:hidden;display:grid;grid-template-columns:1fr 1fr}
@media(max-width:980px){.tool-c{grid-template-columns:1fr}}
.tool-l{padding:20px;background:var(--card)}
.tool-r{padding:20px;background:linear-gradient(150deg,rgba(176,70,40,.09),rgba(143,55,32,.05))}
.tool-r .ft{display:flex;gap:12px;margin-bottom:16px}
.tool-r .ft .ic{width:32px;height:32px;border-radius:8px;background:rgba(176,70,40,.14);display:grid;place-items:center;
  font-size:14px;flex:none}
.tool-r .ft b{font-size:13px;display:block}
.tool-r .ft p{font-size:12px;color:var(--mute)}
.seg{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:16px}
.seg button{border:1px solid var(--border2);background:var(--card2);border-radius:var(--r);padding:12px;text-align:left;color:var(--fg)}
.seg button.on{border-color:var(--pri);background:rgba(176,70,40,.1)}
.seg b{font-size:13px;display:block}
.seg p{font-size:11px;color:var(--mute);margin-top:2px}
.modal{position:fixed;inset:0;z-index:200;display:none;place-items:center;padding:20px;background:rgba(4,5,8,.75);backdrop-filter:blur(6px)}
.modal.on{display:grid}
.mi{background:var(--card);border:1px solid var(--border2);border-radius:var(--rx);max-width:640px;width:100%;
  max-height:88vh;overflow:auto;box-shadow:0 50px 100px -30px #000}
.mh{padding:20px 20px 0;display:flex;align-items:flex-start;gap:12px}
.mh h3{font-size:18px}
.mh button{margin-left:auto;background:none;border:0;color:var(--mute);font-size:20px;line-height:1}
.mb{padding:16px 20px 24px}
.toast{position:fixed;right:20px;bottom:20px;z-index:300;display:grid;gap:10px;max-width:min(420px,calc(100vw - 40px))}
.tst{position:relative;overflow:hidden;background:var(--card2);border:1px solid var(--border2);
  border-left:3px solid var(--pri);border-radius:var(--rl);padding:14px 40px 14px 16px;font-size:13px;
  line-height:1.5;display:flex;gap:10px;align-items:flex-start;

/**
 * Post-render translation pass.
 *
 * Wrapping several hundred strings in T() by hand is slow and, worse, easy to
 * get subtly wrong — one missed template literal and the raw ${T('…')} ends up
 * on screen. Instead we walk the rendered DOM once and swap any text node or
 * attribute whose exact content is a dictionary key. Adding a translation then
 * means adding a dictionary entry, nothing else.
 *
 * Only exact, whole-string matches are replaced, so brand names, numbers and
 * anything we have not deliberately translated pass through untouched.
 */
/** Original English text of every node the pass has rewritten. */
const ORIGINALS = new WeakMap();

/** Puts the English back, so the switch works without reloading the page. */
function delocalise(root){
  const walker=document.createTreeWalker(root||document.body,NodeFilter.SHOW_TEXT);
  let n; while(n=walker.nextNode()){
    if(ORIGINALS.has(n)) n.textContent=ORIGINALS.get(n);
  }
  (root||document).querySelectorAll('[data-origtitle],[data-origplaceholder],[data-origarialabel]').forEach(el=>{
    for(const attr of ['title','placeholder','aria-label']){
      const slot='orig'+attr.replace(/-(\w)/g,(_,c)=>c.toUpperCase());
      const saved=el.dataset[slot];
      if(saved){ el.setAttribute(attr,saved); delete el.dataset[slot]; }
    }
  });
}

function localise(root){
  if(S.lang!=='tr') return;

  // Text in HTML is wrapped across lines, so an exact match against the
  // dictionary key almost never fires. Compare on collapsed whitespace and
  // the key can be written as one readable line.
  if(!localise._index){
    localise._index = new Map();
    for(const k in I18N) localise._index.set(k.replace(/\s+/g,' ').trim(), I18N[k]);
  }
  const idx = localise._index;

  // Strings that carry a number cannot be dictionary keys. A handful of
  // patterns covers them without turning this into a template engine.
  const patterns = [
    [/^All \((\d+)\)$/,            m=>`Tümü (${m[1]})`],
    [/^Active \((\d+)\)$/,         m=>`Aktif (${m[1]})`],
    [/^Paused \((\d+)\)$/,         m=>`Pasif (${m[1]})`],
    [/^(\d+(?:\.\d+)?)% coverage$/,m=>`%${m[1]} kapsama`],
    [/^(\d+) content pieces\/mo$/, m=>`ayda ${m[1]} içerik`],
    [/^(\d+) AI prompts$/,         m=>`${m[1]} AI sorgusu`],
    [/^(\d+) competitors$/,        m=>`${m[1]} rakip`],
    [/^(\d+) GEO audits\/mo$/,     m=>`ayda ${m[1]} GEO denetimi`],
    [/^· weight (\d[\d.]*)$/,      m=>`· ağırlık ${m[1]}`],
    [/^First scan queued — (\d+) checks across (\d+) platforms?$/,
                                   m=>`İlk tarama kuyruğa alındı — ${m[2]} platformda ${m[1]} kontrol`],
    [/^Showing 1–(\d+) of (\d+)$/, m=>`${m[2]} sorgudan ${m[1]} tanesi gösteriliyor`],
  ];

  // A few nodes glue several labels together with separators, so neither an
  // exact key nor a whole-string pattern can match. Swap the fragments.
  const fragments = [
    [/· weight /g, '· ağırlık '],
    [/· official API/g, '· resmî API'],
    [/· licensed SERP provider/g, '· lisanslı SERP sağlayıcısı'],
    [/· model /g, '· model '],
  ];

  const swap = (text) => {
    const key = text.replace(/\s+/g,' ').trim();
    if(!key) return null;
    const hit = idx.get(key);
    if(hit) return hit;
    for(const [re,fn] of patterns){ const m = key.match(re); if(m) return fn(m); }
    let frag = text, changed = false;
    for(const [re,to] of fragments){ if(re.test(frag)){ frag = frag.replace(re,to); changed = true; } }
    return changed ? frag : null;
  };

  const walker=document.createTreeWalker(root||document.body,NodeFilter.SHOW_TEXT,{
    acceptNode(n){
      // Never rewrite generated files, code samples or anything the user typed.
      const p=n.parentElement;
      if(!p) return NodeFilter.FILTER_REJECT;
      if(p.closest('pre,code,textarea,input,#gc,#wmd,#fixc')) return NodeFilter.FILTER_REJECT;
      return n.textContent.trim() ? NodeFilter.FILTER_ACCEPT : NodeFilter.FILTER_REJECT;
    }
  });
  const jobs=[]; let n;
  while(n=walker.nextNode()) jobs.push(n);
  for(const node of jobs){
    const hit = swap(node.textContent);
    if(hit !== null){
      // Remember the original so switching back to English does not need a
      // page reload — the pass rewrites in place and cannot otherwise undo it.
      if(!ORIGINALS.has(node)) ORIGINALS.set(node, node.textContent);
      node.textContent = hit;
    }
  }

  (root||document).querySelectorAll('[placeholder],[title],[aria-label]').forEach(el=>{
    for(const attr of ['placeholder','title','aria-label']){
      const v=el.getAttribute(attr);
      if(!v) continue;
      const hit=swap(v);
      if(hit!==null){
        // dataset keys cannot contain hyphens, so aria-label needs a safe name.
        const slot='orig'+attr.replace(/-(\w)/g,(_,c)=>c.toUpperCase());
        if(!el.dataset[slot]) el.dataset[slot]=v;
        el.setAttribute(attr,hit);
      }
    }
  });
}

/** Translate a UI string. Unknown keys pass through, so nothing ever blanks. */
function T(s){
  // `||` treated an intentionally empty translation as "missing" and fell back
  // to the English key, which is how "named" and "ranked" surfaced inside
  // Turkish sentences. Some phrases genuinely have no Turkish counterpart —
  // English needs "ranked 3rd among 4 brands", Turkish just needs "3. / 4
  // marka içinde" — so an empty string has to mean "render nothing".
  if(S.lang!=='tr') return s;
  const v=I18N[s];
  return v===undefined ? s : v;
}

/**
 * Açık / koyu tema.
 *
 * `body.lt` kuralları dosyada zaten vardı ama hiçbir şey o sınıfı eklemiyordu —
 * yani açık tema kod olarak mevcut, ürün olarak yoktu. Tercih localStorage'da
 * tutulur; ilk açılışta işletim sistemi tercihi okunur.
 */
function applyTheme(t){
  document.body.classList.toggle('lt', t==='light');
  try{ localStorage.setItem('yanki-theme', t); }catch(e){}
}
function toggleTheme(){
  applyTheme(document.body.classList.contains('lt') ? 'dark' : 'light');
}
(function initTheme(){
  let t=null;
  try{ t=localStorage.getItem('yanki-theme'); }catch(e){}
  // Varsayılan açık. Ürün gün içinde, masa başında ve çoğu zaman müşteriye
  // ekran paylaşarak kullanılıyor; açık tema bu bağlamda daha okunur.
  if(!t) t = 'light';
  // body henüz hazır olmayabilir.
  if(document.body) applyTheme(t);
  else document.addEventListener('DOMContentLoaded', ()=>applyTheme(t));
})();

/**
 * Five seconds, a progress bar so the countdown is visible, and a close
 * button. Anything shorter is missed by someone reading the screen rather
 * than watching the corner — and an error the user never saw is an error
 * they will report as "nothing happened".
 */
function toast(t, kind){
  const err = kind==='error' || /fail|error|could not|cannot|invalid|too many|not correct|required/i.test(t);
  const d=document.createElement('div');
  d.className='tst'+(err?' err':'');
  d.innerHTML=`<span class="ic">${err?'⚠':'✓'}</span><span>${esc(t)}</span>
    <button class="x" aria-label="Dismiss">×</button><span class="life"></span>`;
  const close=()=>{ d.style.opacity='0'; d.style.transform='translateY(6px)';
                    d.style.transition='.2s'; setTimeout(()=>d.remove(),220); };
  d.querySelector('.x').onclick=close;
  const timer=setTimeout(close,5000);
  // Hovering pauses the countdown, so a long message can actually be read.
  d.onmouseenter=()=>{clearTimeout(timer); const l=d.querySelector('.life');
    if(l) l.style.animationPlayState='paused';};
  d.onmouseleave=()=>{ setTimeout(close,1800); const l=d.querySelector('.life');
    if(l) l.style.animationPlayState='running';};
  $('#toasts').append(d);
  localise(d);
}

/** Accepts one prompt or a pasted list, one per line. */
function addPrompt(){
  const raw=$('#iq').value||'';
  const lines=raw.split('\n')
    .map(l=>l.trim().replace(/^[-•*\d.)\s]+/,'').replace(/^["']|["']$/g,''))
    .filter(l=>l.length>=6);
  if(!lines.length) return toast(T('Write at least one prompt (6 characters or more)'),'error');
  const existing=new Set(S.prompts.map(p=>p.text.toLocaleLowerCase('tr')));
  let added=0;
  for(const text of lines){
    const key=text.toLocaleLowerCase('tr');
    if(existing.has(key)) continue;
    existing.add(key);
    S.prompts.push({id:'c'+Date.now()+'_'+added,text,intent:guessIntent(text),on:true,
      vol:400,src:'custom',active:true});
    added++;
  }
  $('#iq').value='';
  renderOb();
  toast(added?`${added} prompt${added===1?'':'s'} added`:'Those prompts are already in the list');
}

/**
 * Rough intent guess from the wording. Intent weights the score, so getting it
 * roughly right matters; the operator can correct it from Edit.
 */
function guessIntent(t){
  const s=t.toLocaleLowerCase('tr');
  const brand=(S.brand.name||'').toLocaleLowerCase('tr');
  if(brand && s.includes(brand) && /güvenilir|yorum|şikayet|dolandır|scam|review|trust/.test(s)) return 'brand_defence';
  if(/fiyat|ücret|satın al|sipariş|nereden al|ucuz|indirim|kampanya|price|buy|cheap/.test(s)) return 'transactional';
  if(/karşılaştır|farkı|hangisi daha|compare|versus|\bvs\b/.test(s)) return 'comparison';
  if(/nedir|nasıl|ne işe yarar|rehber|what is|how to/.test(s)) return 'informational';
  return 'evaluation';
}

/* =====================================================================
   DATA GENERATION — deterministic from user input
   ===================================================================== */
/* =====================================================================
   DATA LAYER — everything below reads from the API. Nothing is invented
   in the browser: if the server has no answers yet, the UI says so.
   ===================================================================== */

const api = {
  async req(path, opts = {}) {
    const res = await fetch(path, {
      credentials: 'same-origin',
      headers: opts.body ? { 'content-type': 'application/json' } : undefined,
      ...opts,
    });
    let data = null;
    try { data = await res.json(); } catch { /* empty body */ }
    if (!res.ok) {
      const err = new Error((data && data.error) || `Request failed (${res.status})`);
      err.status = res.status;
      throw err;
    }
    return data;
  },
  get:  (p)    => api.req(p),
  post: (p, b) => api.req(p, { method: 'POST', body: JSON.stringify(b || {}) }),
  patch:(p, b) => api.req(p, { method: 'PATCH', body: JSON.stringify(b || {}) }),
  del:  (p)    => api.req(p, { method: 'DELETE' }),
};

/**
 * Maps the API payload onto the shape the views already expect. Keeping the
 * adapter in one place means the render code never has to know whether a
 * number came from the scan table or a rollup.
 */
function adopt(r) {
  S.workspaceId = r.workspace.id;
  S.plan = r.org.plan;
  S.planLimits = r.org.planLimits;
  S.brand = {
    name: r.workspace.brandName,
    site: r.workspace.domain,
    sector: r.workspace.sector,
    country: r.workspace.country,
    city: r.workspace.city || '',
    desc: r.workspace.description || '',
  };
  S.variants = r.workspace.aliases || [];
  S.rawCompetitors = r.competitors || [];
  S.rivals = (r.competitors || []).map(c => ({ id: c.id, n: c.name, d: c.domain || '' }));
  S.prompts = (r.prompts || []).map(p => ({
    id: p.id, text: p.text, intent: p.intent, vol: p.volume,
    src: p.source, active: true, score: p.score, ci: p.ci,
    coverage: p.coverage, opportunity: p.opportunity, engines: p.engines,
  }));
  S.enginesMeta = r.engines;
  S.scanState = r.scan;
  S.auditRaw = r.audit;
  S.quality = r.quality || null;

  const latest = r.latest;
  const allowed = r.engines.filter(e => !e.locked);
  const byEngine = (latest && latest.by_engine) || {};

  const plats = r.engines.map(e => {
    const stats = byEngine[e.key] || {};
    const own = (r.cells || []).filter(c => c.engineKey === e.key);
    const cellCount = own.length;
    const mentions  = own.filter(c => c.m > 0).length;
    const cites     = own.filter(c => c.c > 0).length;
    return {
      id: e.key, n: e.label, ab: ENGINE_GLYPH[e.key] || '◆', c: ENGINE_COLOR[e.key] || '#B04628',
      w: e.weight, locked: e.locked, configured: e.configured, active: e.active,
      measured: e.measured, failing: e.failing,
      score: Number(stats.score || 0),
      ci: Number(stats.ci || 0),
      mentions, cites, checks: cellCount,
      trend: 0,
    };
  });

  // Cells drive the mentions table and the answer inspector.
  const cells = (r.cells || []).map(c => ({
    p: { id: c.promptId, text: c.text, intent: c.intent, vol: c.volume },
    pl: plats.find(x => x.id === c.engineKey) || plats[0],
    runId: c.runId,
    score: c.score, ci: c.ci, m: c.m, c: c.c, sg: c.sigma * 2 - 1,
    rank: c.meanRank,
  })).filter(c => c.pl);

  const totalMentions = (r.competitors || []).reduce((a, c) => a + Number(c.mentions || 0), 0) + Number(r.selfMentions || 0);
  const sov = [
    { n: r.workspace.brandName, v: Number(r.selfMentions || 0), you: true },
    ...(r.competitors || []).map(c => ({ n: c.name, v: Number(c.mentions || 0) })),
  ].map(x => ({ ...x, pct: totalMentions ? (x.v / totalMentions) * 100 : 0 }));

  const audit = r.audit ? groupAudit(r.audit.factors) : [];

  S.data = {
    ready: !!latest,
    cells,
    plats,
    total: latest ? Number(latest.score) : 0,
    ciAvg: latest ? Number(latest.ci) : 0,
    lowConfidence: latest ? latest.low_confidence : false,
    mentionRate: latest ? Number(latest.mention_rate) : 0,
    citationRate: latest ? Number(latest.citation_rate) : 0,
    sov,
    sources: (r.sources || []).map(s => ({
      d: s.domain, v: s.citations, mine: s.mine,
      // Kaynağa nasıl girildiği — tavsiyeyi bu belirler. Sunucu sınıflandırır.
      kind: s.kind || 'unknown', kindNote: s.kindNote || null,
      first: s.first_seen, last: s.last_seen,
      delta: s.delta === undefined ? 0 : s.delta,
      // Engine keys resolved to the platform objects the UI already styles.
      plats: (s.engines || []).map(k => plats.find(p => p.id === k)).filter(Boolean),
    })),
    series: (r.series || []).map(x => Number(x.score)),
    seriesDates: (r.series || []).map(x => x.scan_date),
    audit,
    auditScore: r.audit ? Number(r.audit.total_score) : 0,
    auditUrl: r.audit ? r.audit.url : r.workspace.domain,
    auditRanAt: r.audit ? r.audit.ran_at : null,
    bots: [],
    opps: r.prompts.map(p => ({
      p: { id: p.id, text: p.text, intent: p.intent, vol: p.volume },
      cover: (p.coverage || 0) / 100,
      srcCount: (r.sources || []).length,
      fit: p.coverage > 50 ? 'High' : p.coverage > 0 ? 'Medium' : 'Low',
      opp: p.opportunity,
      act: ACTION_BY_INTENT[p.intent] || 'Product/service page',
    })).sort((a, b) => b.opp - a.opp),
    rivals: (r.competitors || []).map(c => c.name),
    host: r.workspace.host,
    recent: r.recentMentions || [],
  };
  S.data.actions = buildActions();
}

const ACTION_BY_INTENT = {
  informational:'Explainer guide', comparison:'Comparison table',
  brand_defence:'Trust page + FAQ', transactional:'Product/service page',
  evaluation:'Category landing page',
};

function groupAudit(factors) {
  const map = new Map();
  for (const f of factors || []) {
    if (!map.has(f.category)) map.set(f.category, []);
    map.get(f.category).push({ n: f.label, st: f.status, fix: f.fix, detail: f.detail });
  }
  return [...map.entries()].map(([n, facs]) => ({
    n, facs,
    score: facs.reduce((a, f) => a + (f.st === 'pass' ? 100 : f.st === 'partial' ? 55 : 0), 0) / facs.length,
  }));
}

    const c = r.coverage || {};

/**
 * Action plan, derived from the audit's failing factors and the top
 * opportunities. Everything here traces back to a real finding — no generic
 * advice, because generic advice is what the customer already ignored.
 */
function buildActions() {
  const d = S.data || {}, b = S.brand;
  const A = [];
  const push = (t, sub, im, ef, q, desc, steps, code) => A.push({ t, sub, im, ef, q, desc, steps, code });

  const fails = [];
  (d.audit || []).forEach(c => c.facs.forEach(f => { if (f.st === 'fail') fails.push({ ...f, cat: c.n }); }));

  // Failing audit factors that ship a fix are the cheapest wins available.
  // Factor and category names come from the server in English; the action plan
  // has to translate them the same way the audit screen does, or a Turkish
  // panel prints "Accessibility and rendering" in the middle of a task list.
  fails.filter(f => f.fix).slice(0, 4).forEach((f, i) => push(
    T(f.n),
    `${T(f.cat)} · ${f.detail || T('Failing')}`,
    (4.6 - i * 0.5).toFixed(1),
    i === 0 ? `1 ${T('hour')}` : `1–3 ${T('days')}`,
    `+${4 - i} ${T('prompts')}`,
    f.detail || T('This factor is failing on the audited page.'),
    [T('Apply the snippet below'), T('Deploy the change'), T('Re-run the audit to confirm it passes')],
    f.fix));

  (d.opps || []).filter(o => o.cover < 0.4).slice(0, 3).forEach((o, i) => push(
    `${T('Publish content for')} "${o.p.text.replace(/"/g, '')}"`,
    `${T('Opportunity')} ${o.opp} · ${T('coverage')} ${Math.round(o.cover * 100)}% · ${T('volume')} ${o.p.vol}`,
    (4.2 - i * 0.6).toFixed(1), `1–3 ${T('weeks')}`, `+${3 - i} ${T('prompts')}`,
    T('Your visibility on this prompt is low. The content writer can analyse the answer structure and draft a page aimed at it.'),
    [T('Write a 40–60 word direct answer in the first paragraph'),
     T('Convert headings into question form'),
     T('Add at least one table and one numeric data point'),
     T('Mark it up with FAQPage schema')],
    null));

  /* Kaynak açığı.
   *
   * Eskiden burada tek bir görev vardı ve en çok atıf alan kaynağı seçip her
   * kaynağa aynı dört adımı veriyordu: "editörlerine ulaşın", "kurumsal hesap
   * açın". Gerçek veride ölçüldü: kaynakların %40'ı girilemez sınıfta — rakip
   * ajans siteleri ve satıcı blogları. O kaynaklar için bu adımların hiçbiri
   * yapılabilir değil.
   *
   * Şimdi kaynak türüne göre ayrılıyor: girilebilir olanlar tek tek iş kalemi
   * oluyor, girilemez olanlar tek bir bulguda toplanıp dolaylı yola
   * yönlendiriliyor. */
  const outside = (d.sources || []).filter(s => !s.mine);
  const reachable = outside
    .filter(s => srcKind(s.kind).reachable)
    .sort((a, b) => (srcKind(a.kind).rank - srcKind(b.kind).rank) || (b.v - a.v));
  const blocked = outside.filter(s => !srcKind(s.kind).reachable && s.kind !== 'unknown');

  // En hızlı kazanılabilir üç kaynak, her biri ayrı iş kalemi.
  reachable.slice(0, 3).forEach((src, i) => {
    const k = srcKind(src.kind);
    push(
      `${esc(src.d)} ${T('üzerinde yer alın')} — ${k.short}`,
      `${src.v} ${T('atıf')} · ${k.label} · ${k.eta}`,
      (4.4 - i * 0.3).toFixed(1), k.eta, `+${3 - i} ${T('sorgu')}`,
      `${T('Modeller sizi çoğunlukla üçüncü taraf kaynaklardan öğrenir.')} ${
        src.kindNote ? esc(src.kindNote) + '. ' : ''}${
        T('Bu kaynak kayda açık — girmek için beklemeniz gereken bir onay zinciri yok.')}`,
      k.steps, null);
  });

  // Girilemeyenler tek bulguda. Dokuz rakip için dokuz satır anlamsız olurdu.
  if (blocked.length) {
    const toplam = blocked.reduce((a, s) => a + s.v, 0);
    const rakip = blocked.filter(s => s.kindNote && /rakip/i.test(s.kindNote));
    push(
      T('Rakip ve satıcı içerikleri sizden çok alıntılanıyor'),
      `${blocked.length} ${T('kaynak')} · ${toplam} ${T('atıf')} · ${T('bu kaynaklara girilemez')}`,
      '4.2', `2–4 ${T('ay')}`, `+2 ${T('sorgu')}`,
      `${blocked.slice(0, 3).map(s => s.d).join(', ')}${blocked.length > 3 ? ` ${T('ve')} ${blocked.length - 3} ${T('kaynak daha')}` : ''} ` +
      `${T('toplam')} ${toplam} ${T('atıf alıyor.')} ${
        rakip.length ? `${rakip.length} ${T('tanesi doğrudan rakibinizin sitesi.')} ` : ''}` +
      T('Bu kaynaklara profil açamaz, editörüne yazamazsınız — içerik onların kendi pazarlaması. Ama aynı yarışa girebilirsiniz.'),
      [T('En çok atıf alan üç sayfayı inceleyin: hangi soruya, hangi yapıda cevap veriyorlar'),
       T('Aynı sorulara kendi sitenizde daha iyi cevap veren kaynaklar yayınlayın'),
       T('Site denetimindeki başarısız kriterleri kapatın — rakip siteler taranıyor, sizinki taranamıyor olabilir'),
       T('Ürettiğiniz içeriğin girilebilir dizin ve yayınlarda alıntılanmasını sağlayın')],
      null);
  }

  if (!A.length) push(
    T('Run a site audit to generate your plan'),
    T('No audit has been run for this workspace yet'),
    '—', `2 ${T('minutes')}`, '—',
    T('The action plan is built from real audit findings and prompt coverage. Run an audit and the tasks appear here.'),
    [T('Open the Audit screen'), T('Run the audit against your homepage'), T('Return here')],
    null);

  return A;
}
